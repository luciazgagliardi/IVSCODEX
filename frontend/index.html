/* La dirección de la que se saca el pasaje cuando el resultado no trae sumario. */
/* Qué se abre en el Lector: el documento del fallo; en SAIJ y la Corte, su ficha
   (el servidor saca de ahí el texto o el PDF del fallo, ver backend/lib/textoSaij.js). */
function urlLector(slug,r){
  if(r.linkFallo) return r.linkFallo;
  // también los fallos de SAIJ que las bases provinciales suman de respaldo
  if(/^https?:\/\/(www\.)?saij\.gob\.ar\//.test(r.linkFicha||"")) return r.linkFicha;
  return null;
}
function urlFragmento(slug,r){
  return r.linkFallo||(slug==="dialnet"?r.linkFicha:null)||null;
}
function fichaIndice(f,r){
  var q=estado.q;
  var im=estado.indices[f.slug];
  var metaEnc=[r.tribunal,r.secretaria,r.magistrados,r.expediente?"Expte. "+r.expediente:""]
    .filter(Boolean).map(esc).join(" · ");
  var fechaEnc=r.fecha?esc(r.fecha):"";
  // Cuando la búsqueda fue por artículo, se distingue quién CITA el número de
  // quién apareció por el tema del artículo (su rúbrica). No es un detalle:
  // citar como "aplica el art. 1710" un fallo que sólo habla de prevención
  // del daño sería poner en boca del tribunal algo que no dijo.
  var marcaVariante=r.variante
    ? '<span class="tag" style="border-color:var(--gold-55);color:var(--gold)">encontrado como «'+esc(r.variante)+'»</span>'
    : '';
  var marcaTema=(r.citaElNumero===false)
    ? '<span class="tag" style="border-color:var(--lacre2);color:var(--lacre2)">por el tema, no cita el número</span>'
    : '';
  // El pasaje puede venir con el resultado (Mendoza manda el sumario) o
  // haberse sacado del documento después (CABA — ver traerFragmentos).
  // De dónde sale el pasaje si el resultado no lo trae: del documento (PDF)
  // o, en Dialnet, del resumen de la ficha.
  var uf=urlFragmento(f.slug,r);
  var pasaje=pasajeDe(f,r);
  var esperando=!pasaje&&uf&&im.fragCargando&&!im.fragmentos.hasOwnProperty(uf);
  // Si se intentó y no se pudo, se dice por qué en vez de dejar la ficha sin nada.
  // sin avisos de falla: si no hay pasaje, quedan los datos y el botón del Lector
  var sinPasaje="";
  // CABA no publica sumario, pero cada fallo trae los temas con que el propio
  // tribunal lo clasifica (tesauro). Se muestran siempre: son lo que queda
  // cuando el PDF no se puede leer desde el servidor, y orientan igual cuando sí.
  var temas="";
  if(f.slug==="caba"&&r.voces&&r.voces.length){
    // Primero los temas que contienen lo que se buscó: son los que dicen por
    // qué apareció este fallo.
    var claves=palabrasResaltables(q).map(function(w){
      return w.replace(/["'()]/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    });
    var coincide=function(v){
      var n=v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
      return claves.some(function(k){ return n.indexOf(k)>-1; });
    };
    var ordenados=r.voces.filter(coincide).concat(r.voces.filter(function(v){ return !coincide(v); }));
    temas=ordenados.slice(0,14).join(" · ");
    // Con los temas a la vista la ficha no queda vacía: no se muestra ni el
    // "buscando…" ni el aviso de que el PDF no se pudo leer. Si el pasaje
    // llega, aparece arriba; si no, el botón del Lector sigue estando.
    esperando=false; sinPasaje="";
  }
  return '<div class="fuente">'+
    '<div class="f-top"><span class="cod '+f.clase+'">'+esc(f.cod)+'</span>'+
      (metaEnc?'<span class="f-enc">'+metaEnc+'</span>':'')+
      (fechaEnc?'<span class="f-fecha">'+fechaEnc+'</span>':'')+'</div>'+
    '<h3 class="f-nom">'+esc(r.caratula||r.expediente||"(sin carátula)")+'</h3>'+
    (pasaje?'<p class="f-nota">'+pasajeResaltado(pasaje,q,800)+'</p>':'')+
    (temas?'<p class="f-nota"><span style="opacity:.6">Temas que el TSJ asigna a este fallo: </span>'+resaltarSimple(temas,q)+'</p>':'')+
    (esperando?'<p class="f-nota" style="opacity:.55;font-style:italic">Buscando el pasaje en el documento…</p>':'')+
    (sinPasaje?'<p class="f-nota" style="opacity:.55;font-style:italic">'+esc(sinPasaje)+'</p>':'')+
    (f.slug!=="caba"&&r.voces&&r.voces.length?'<div class="voces">'+r.voces.slice(0,6).map(function(v){
      return '<span class="voz" style="cursor:default">'+esc(v)+'</span>';}).join("")+'</div>':"")+
    '<div class="f-acc" style="margin-top:8px">'+
      (r.linkFicha?'<a class="mini" href="'+escU(r.linkFicha)+'" target="_blank" rel="noopener noreferrer">Ver ficha completa</a>':"")+
      marcaTema+marcaVariante+
      (urlLector(f.slug,r)?'<button class="mini" data-act="traer-indice-fallo" data-fuente="'+esc(f.slug)+'" data-url="'+esc(urlLector(f.slug,r))+'">Abrir en el Lector</button>'+
        '<button class="mini lx-mini" data-act="traer-indice-fallo" data-lexia="1" data-fuente="'+esc(f.slug)+'" data-url="'+esc(urlLector(f.slug,r))+'">Preguntarle a Lexia</button>':"")+
      // Si el documento se puede traer, también se puede abrir donde vive:
      // el enlace al sitio oficial es lo que hace citable al resultado.
      //
      // CABA es distinta de las otras cinco y se lo dice el propio sitio: su
      // link no muestra el fallo en una página, lo DESCARGA —manda
      // "Content-Disposition: attachment", verificado contra los dos
      // dominios que usa (uno a veces sirve un .doc, no un PDF, pero con la
      // misma cabecera)—. Un link común ahí no "abre" nada visible: el
      // archivo cae solo a la carpeta de Descargas y quien lo clickea se
      // queda mirando la pantalla preguntándose si pasó algo. Por eso ahí va
      // un atajo aparte que hace lo mismo que ya hacía el link (bajar el
      // archivo) pero de paso te deja en el Lector con el selector abierto,
      // listo para elegir lo que se acaba de bajar.
      (r.linkFallo&&r.descarga
        ?'<button class="mini" data-act="descargar-y-lector" data-url="'+esc(r.linkFallo)+'">Descargar y abrir en el Lector</button>'
        :(r.linkFallo?'<a class="mini" href="'+escU(r.linkFallo)+'" target="_blank" rel="noopener noreferrer">Abrir el original</a>':""))+
      '<button class="mini" data-act="compartir-fallo" data-fuente="'+esc(f.slug)+'" data-id="'+esc(r.id||"")+'">Compartir</button>'+
    '</div></div>';
}

/* Va a buscar el pasaje de cada resultado que no lo traiga de fábrica.
   Mendoza manda el sumario con cada ficha; CABA no manda nada, así que el
   pasaje sale del documento en sí. El servidor los trae de a tandas y en
   un solo pedido (ver routes/indice.js): pedir uno por documento quemaría
   el límite de peticiones en una sola búsqueda. Se van pintando a medida
   que llegan, sin bloquear la lista de resultados, que ya está en pantalla. */
function traerFragmentos(slug,pedido,carril){
  var im=estado.indices[slug];
  var qi=estado.q.trim();
  if(!im||!qi||!estado.api) return;
  // dos carriles a la vez: mientras uno espera un PDF lento, el otro sigue
  if(carril===undefined){ im.fragEnCurso={}; traerFragmentos(slug,pedido,0); traerFragmentos(slug,pedido,1); return; }
  im.fragEnCurso=im.fragEnCurso||{};
  // hasOwnProperty y no truthiness: un documento que no se pudo leer queda
  // guardado como cadena vacía, y con truthiness volvía a entrar en la
  // tanda siguiente para siempre — un bucle infinito contra el servidor.
  var pendientes=im.resultados.filter(function(r){
    var u=urlFragmento(slug,r);
    return u && !sumarioCoincide(r) && !im.fragmentos.hasOwnProperty(u) && !im.fragEnCurso[u];
  });
  var faltan=pendientes.map(function(r){ return urlFragmento(slug,r); });
  if(!faltan.length){ if(!Object.keys(im.fragEnCurso).length){ im.fragCargando=false; render(); } return; }

  // la primera tanda de cada carril es chica: los primeros pasajes aparecen enseguida
  var cuantos=Object.keys(im.fragmentos).length<4?2:4;
  var tanda=faltan.slice(0,cuantos);
  tanda.forEach(function(u){ im.fragEnCurso[u]=1; });
  im.fragCargando=true;
  // con los datos de cada fallo: el servidor guarda en el acervo el texto que lee, y la próxima vez sale al instante
  var registros=pendientes.slice(0,cuantos).map(function(r){ return {id:r.id,url:urlFragmento(slug,r),caratula:r.caratula,fecha:r.fecha,tribunal:r.tribunal,expediente:r.expediente}; });
  var promesaFrag=fetch(estado.api+"/indice/"+slug+"/fragmentos",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q:qi,urls:tanda,registros:registros})
  }).then(function(r){ return r.json(); });
  // Mismo tope que buscarEnFuente y por la misma razón (ver el comentario
  // grande ahí): sin esto, un pedido cortado a mitad de camino en el
  // celular dejaba "Buscando el pasaje…" clavado en cada resultado para
  // siempre, y de paso frenaba la cadena entera —esta función se llama a
  // sí misma para la tanda siguiente, así que una tanda colgada se llevaba
  // puestas todas las que faltaban.
  var idTopeFrag,
      seVencioFrag=new Promise(function(_,reject){
        idTopeFrag=setTimeout(function(){
          reject(new Error("tope de espera del lado del navegador"));
        },40000);
      });
  Promise.race([promesaFrag,seVencioFrag]).then(function(d){ clearTimeout(idTopeFrag); return d; },
    function(err){ clearTimeout(idTopeFrag); throw err; })
    .then(function(d){
      // Si mientras tanto se disparó otra búsqueda, lo que llega es viejo.
      if(im.pedido!==pedido) return;
      (d&&d.fragmentos||[]).forEach(function(f){
        im.fragmentos[f.url]=f.fragmento||"";
      });
      // Todo lo que se pidió queda marcado como intentado, haya vuelto o
      // no: si el servidor frenó por límite de peticiones, la tanda
      // siguiente pediría lo mismo y no terminaría nunca.
      // Salvo los que el servidor dijo que dejó para después (se le acabó el
      // tiempo de la tanda): esos se piden de nuevo en la que sigue.
      var despues=(d&&d.pendientes)||[];
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)&&despues.indexOf(u)===-1) im.fragmentos[u]="";
      });
      tanda.forEach(function(u){ delete im.fragEnCurso[u]; });
      if(d&&d.ok===false){ im.fragCargando=false; render(); return; }
      render();
      traerFragmentos(slug,pedido,carril); // sigue con la tanda siguiente, por el mismo carril
    })["catch"](function(){
      if(im.pedido!==pedido) return;
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)) im.fragmentos[u]="";
        delete im.fragEnCurso[u];
      });
      im.fragCargando=false; render();
    });
}

/* Dispara (o repite) la búsqueda en vivo de una fuente con robot propio.
   La usan tanto el botón "Buscar en…" como el cambio de tribunal, para que
   tocar un chip de tribunal ya te traiga los resultados de ese tribunal en
   vez de dejar en pantalla los de la búsqueda anterior. */
/* ============================================================
   SAIJ desde el navegador
   ============================================================
   El servidor donde está publicada la web (un datacenter de Azure en Brasil)
   recibe 403 de SAIJ: el sitio no atiende pedidos desde ahí. Desde una
   conexión común sí responde, y además manda "Access-Control-Allow-Origin: *",
   o sea que habilita expresamente que un navegador le consulte desde
   cualquier página. Así que cuando el servidor no llega, la consulta la hace
   tu propia computadora, que es el destinatario natural de ese permiso.
   Comprobado a mano: mismo pedido, 403 desde el servidor y 200 desde acá.

   Esto obliga a repetir en el navegador el armado y el filtro que el
   servidor hace en lib/indiceSaij.js y lib/relevancia.js. Es duplicación
   real y molesta, pero la alternativa era dejar la fuente más grande de las
   tres afuera de la versión publicada. */

var SAIJ_URL="https://www.saij.gob.ar/busqueda";
var PROVINCIAS_SAIJ=["Buenos Aires","Ciudad Autónoma de Buenos Aires","Catamarca","Chaco","Chubut","Córdoba",
  "Corrientes","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro",
  "Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"];
var SAIJ_TIPOS={
  sumarios:"Total|Tipo de Documento/Jurisprudencia/Sumario",
  fallos:"Total|Tipo de Documento/Jurisprudencia/Fallo",
  legislacion:"Total|Tipo de Documento/Legislación",
  doctrina:"Total|Tipo de Documento/Doctrina",
  dictamenes:"Total|Tipo de Documento/Dictamen"
};
/* La Corte Suprema sale de SAIJ filtrando por su faceta de tribunal. Solo
   los fallos traen ese campo, así que va siempre por fallos (ver la nota en
   lib/indiceSaij.js del servidor). */
/* Igual que el servidor (lib/indiceSaij.js): la Corte se busca en el texto de
   sus SUMARIOS, que son federales y llevan número con "A"; las fichas de fallos
   no tienen texto y el filtro por modo las descartaba todas. */
var SAIJ_FACETA_CSJN="Total|Tipo de Documento/Jurisprudencia/Sumario|Jurisdicción/Federal";
// las fichas de los fallos de la Corte (con la carátula entera): para buscar un fallo por su nombre
var SAIJ_FACETA_CSJN_FALLOS="Total|Tipo de Documento/Jurisprudencia/Fallo|Tribunal/CORTE SUPREMA DE JUSTICIA DE LA NACION";

function saijPlegar(s){
  try{ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
  catch(e){ return String(s||"").toLowerCase(); }
}
/* Las palabras que definen la búsqueda, de más específica a más genérica,
   recortadas a la raíz. Mismo criterio que lib/relevancia.js del servidor. */
function saijRaices(q){
  return saijPlegar(q).split(/[^a-z0-9]+/)
    .filter(function(p){ return p.length>=3 && !VACIAS[p]; })
    .sort(function(a,b){ return b.length-a.length; })
    .map(function(p){ return p.slice(0,6); });
}
function saijPajar(r){
  return saijPlegar([r.caratula,r.sumario,(r.voces||[]).join(" ")].join(" ")).replace(/\s+/g," ");
}
function saijCuantas(pajar,raices){
  var n=0; raices.forEach(function(x){ if(pajar.indexOf(x)!==-1) n++; }); return n;
}
/* SAIJ busca siempre con OR, así que el modo se aplica acá sobre lo traído. */
function saijFiltrar(lista,q,modo,excluir){
  var raices=saijRaices(q), fuera=saijRaices(excluir||"");
  var vivos=fuera.length?lista.filter(function(r){ return saijCuantas(saijPajar(r),fuera)===0; }):lista.slice();
  if(!raices.length) return {lista:vivos,aflojado:false};
  if(modo==="alguna") return {lista:vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)>0; }),aflojado:false};
  if(modo==="exacta"){
    var frase=saijPlegar(q).replace(/\s+/g," ").trim();
    if(!frase) return {lista:vivos,aflojado:false};
    return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(frase)!==-1; }),aflojado:false};
  }
  var completos=vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)===raices.length; });
  if(completos.length||raices.length===1) return {lista:completos,aflojado:false};
  return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(raices[0])!==-1; }),aflojado:true};
}

function saijLimpiar(s){
  return String(s||"").replace(/\[\[\/?p\]\]/g," ").replace(/\[\[[^\]]*\]\]/g," ").replace(/\s+/g," ").trim();
}
function saijFecha(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||""));
  return m?(m[3]+"/"+m[2]+"/"+m[1]):String(iso||"");
}
/* Cada resultado viene con el documento como JSON dentro de un string. */
function saijARegistro(bruto){
  var doc;
  try{ doc=JSON.parse(bruto.documentAbstract).document; }catch(e){ return null; }
  var c=(doc&&doc.content)||{}, uuid=doc&&doc.metadata&&doc.metadata.uuid;
  if(!uuid) return null;
  var clase=doc.metadata["document-content-type"]||(doc.metadata.document_type==="Dictamen"?"dictamen":"");
  var esSumario=clase==="sumario";
  var partes=[c.actor,c.demandado].filter(Boolean).join(" c/ ")+(c.sobre?" s/ "+c.sobre:"");
  var voces=[].concat((c.descriptores&&c.descriptores.descriptor)||[])
    .map(function(d){ return d&&d.elegido&&d.elegido.termino; }).filter(Boolean);
  /* Legislación, doctrina y dictámenes: este camino sólo ve lo que trae la
     búsqueda (título y temas); el artículo o extracto donde está la
     coincidencia lo agrega el servidor (lib/indiceSaij.js). */
  if(clase==="legislacion"||clase==="doctrina"||clase==="dictamen"){
    var tipoN=(c["tipo-norma"]&&c["tipo-norma"].texto)||"";
    return {
      id:"saij_"+uuid,
      expediente:clase==="legislacion"?[tipoN,c["numero-norma"]].filter(Boolean).join(" ")
        :(clase==="doctrina"?(c["numero-doctrina"]||""):(c.numero_dictamen?"Dictamen "+c.numero_dictamen:"")),
      caratula:(clase==="legislacion"?saijLimpiar(c["titulo-norma"]||c["nombre-coloquial"]||c.sumario)
        :(clase==="doctrina"?saijLimpiar(c["titulo-doctrina"]):saijLimpiar(c.partes||c.titulo)))||"(sin título)",
      sumario:saijLimpiar(c.sumario||c.titulo),
      voces:voces,
      fecha:saijFecha(c.fecha||c["fecha-publicacion"]),
      tribunal:clase==="legislacion"?[c.provincia,c.estado].filter(Boolean).join(" · ")
        :(clase==="doctrina"?saijLimpiar(c.publicacion):saijLimpiar(c.emisor&&c.emisor.descripcion)),
      magistrados:clase==="doctrina"?saijLimpiar(c["autor-doctrina"]&&c["autor-doctrina"].autor):"",
      linkFicha:"https://www.saij.gob.ar/"+uuid,
      linkFallo:null
    };
  }
  return {
    id:"saij_"+uuid,
    expediente:c["numero-interno"]||c["id-infojus"]||"",
    caratula:(esSumario?(c.titulo||saijLimpiar(c.sumario)):partes)||"(sin carátula)",
    numero:String(c["numero-sumario"]||""),
    sumario:esSumario?saijLimpiar(c.texto):"",
    voces:voces,
    fecha:saijFecha(c.fecha),
    tribunal:[c.tribunal,c.provincia,c.jurisdiccion&&c.jurisdiccion.descripcion]
      .filter(Boolean).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(" · "),
    magistrados:c.magistrados||"",
    linkFicha:"https://www.saij.gob.ar/"+uuid,
    linkFallo:null
  };
}

/* Revisa varias páginas antes de aflojar el filtro, igual que el servidor:
   como SAIJ ordena por relevancia pero busca con OR, la primera página puede
   ser toda de una sola de las palabras. */
/**
 * Igual que el servidor: si esto es una búsqueda por artículo, se corren
 * varias formas y se unen los resultados.
 *
 * Tiene que estar duplicado acá y no alcanza con que lo haga el servidor,
 * porque SAIJ le niega la conexión al servidor publicado y estas dos fuentes
 * las termina buscando el navegador. Sin esto, pedir "los fallos que citan el
 * art. 1710" daba cero en la Corte desde el sitio real — que es exactamente
 * el caso que había que arreglar. Ver buscarPorArticulo() en
 * backend/routes/indice.js.
 */
function formasDeArticulo(cuerpo){
  var n=String(cuerpo.articulo||"").trim();
  if(!n) return null;
  var f=["artículo "+n, n];              // los motores tipo SAIJ rinden con la palabra entera
  if(cuerpo.tema) f.push(cuerpo.tema);   // la rúbrica: encuentra a los que aplican sin citar
  return f;
}

function saijEnVivo(cuerpo,slug,delServidor){
  return Promise.resolve().then(function(){ return buscarSaijNavegador(cuerpo,slug); }).then(function(n){
    if(n&&n.ok&&(n.total||!(delServidor&&delServidor.ok))) return n;
    return (delServidor&&delServidor.ok)?delServidor:n;
  },function(e){ if(delServidor&&delServidor.ok) return delServidor; throw e; });
}
function buscarSaijNavegador(cuerpo,slug){
  var formas=formasDeArticulo(cuerpo);
  if(formas){
    var porId={}, orden=[], pendientes=formas.length, resolver;
    var listo=new Promise(function(res){ resolver=res; });
    formas.forEach(function(forma,idx){
      buscarSaijNavegador(Object.assign({},cuerpo,{q:forma,articulo:""}),slug)
        .then(function(d){
          (d&&d.resultados||[]).forEach(function(x){
            if(!x||!x.id) return;
            if(porId[x.id]){ if(idx<2) porId[x.id].citaElNumero=true; return; }
            x.citaElNumero=(idx<2);   // las dos primeras formas llevan el número
            porId[x.id]=x; orden.push(x);
          });
        })["catch"](function(){})
        .then(function(){ if(--pendientes<=0) resolver(); });
    });
    return listo.then(function(){
      return { ok:true, total:orden.length, totalFuente:null, siguienteDesde:null,
               totalParcial:true, revisados:0, resultados:orden, desdeNavegador:true };
    });
  }

  var fichasCsjn=slug==="csjn"&&cuerpo.tribunal==="fallos";
  var faceta=fichasCsjn?SAIJ_FACETA_CSJN_FALLOS:slug==="csjn"?SAIJ_FACETA_CSJN:(SAIJ_TIPOS[cuerpo.tribunal]||SAIJ_TIPOS.sumarios);
  if(slug==="saij"&&PROVINCIAS_SAIJ.indexOf(cuerpo.provincia)!==-1&&cuerpo.tribunal!=="doctrina"&&cuerpo.tribunal!=="dictamenes")
    faceta+="|Jurisdicción/Local/"+cuerpo.provincia;
  var porPagina=20, porPedido=100;
  // Espejo de backend/lib/paginarFiltrado.js, y tiene que seguir siéndolo:
  // este camino se usa justo donde MÁS importa, el servidor publicado, al
  // que SAIJ le responde 403. Si acá quedara el cálculo viejo por número de
  // página, la paginación se pisaría en Azure y andaría bien solo en una
  // máquina local — el peor tipo de bug, el que no se ve donde se prueba.
  var revisados=[];   // los registros que se pudieron leer
  var filaDe=[];      // en qué fila del sitio estaba cada uno
  var totalCrudo=0, agotado=false;
  var arranque=(typeof cuerpo.desde==="number")?Math.max(0,cuerpo.desde)
                                               :(Math.max(1,cuerpo.pagina||1)-1)*porPedido;
  var cursor=arranque;

  var tandasMax=({exacta:8,todas:5,alguna:3})[cuerpo.modo]||3;
  function pedir(i){
    var p=new URLSearchParams({q:cuerpo.q,o:String(cursor),p:String(porPedido),f:faceta});
    return fetch(SAIJ_URL+"?"+p.toString(),{headers:{Accept:"application/json"}})
      .then(function(r){
        if(!r.ok) throw new Error("SAIJ respondió "+r.status);
        return r.json();
      })
      .then(function(d){
        var sr=(d&&d.searchResults)||{};
        if(!totalCrudo){
          var f=(sr.categoriesResultList||[]).filter(function(c){ return c.facetName==="Total"; })[0];
          totalCrudo=(f&&f.facetChildren&&f.facetChildren[0]&&f.facetChildren[0].facetHits)||0;
          if(!totalCrudo){ agotado=true; return null; }
        }
        var crudos=sr.documentResultList||[];
        if(!crudos.length){ agotado=true; return null; }
        // Sin compactar: un documento ilegible ocupa su lugar igual, porque
        // el cursor cuenta filas del sitio (ver lib/paginarFiltrado.js).
        for(var k=0;k<crudos.length;k++){
          var reg=saijARegistro(crudos[k]);
          if(!reg) continue;
          if(slug==="csjn"&&!fichasCsjn&&!/^A\d/i.test(reg.numero||"")) continue; // sumario federal que no es de la Corte
          filaDe.push(cursor+k);
          revisados.push(reg);
        }
        cursor+=crudos.length;
        var parcial=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
        if(parcial.lista.length>=porPagina) return null;
        if(cursor>=totalCrudo){ agotado=true; return null; }
        // Mismas tandas que el servidor (TANDAS_POR_MODO en lib/indiceSaij.js):
        // más para frase exacta y «todas», donde lo buscado suele ser raro.
        return i<tandasMax-1?pedir(i+1):null;
      });
  }

  return pedir(0).then(function(){
    if(!totalCrudo) return {ok:true,total:0,totalFuente:0,siguienteDesde:null,resultados:[],revisados:0,desdeNavegador:true};
    var res=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
    var resultados=res.lista.slice(0,porPagina);
    var siguienteDesde;
    if(resultados.length>=porPagina){
      siguienteDesde=filaDe[revisados.indexOf(resultados[resultados.length-1])]+1;
    }else{
      siguienteDesde=agotado?null:cursor;
    }
    return {
      ok:true,
      total:resultados.length,
      // El conteo del OR de SAIJ: no es "cuántos hay sobre el tema", es
      // cuántas filas devuelve. La pantalla lo dice así (ver conteoIndice).
      totalFuente:totalCrudo,
      siguienteDesde:siguienteDesde,
      // "Parcial" es que el número de arriba salió de una muestra.
      totalParcial:siguienteDesde!==null,
      revisados:cursor-arranque,
      aflojado:res.aflojado,
      resultados:resultados,
      desdeNavegador:true
    };
  });
}

/** Cuántos resultados pide cada página. Tiene que ser el mismo número que
 * usan por default lib/indiceMza.js, lib/indiceCaba.js y lib/indiceSaij.js. */
var POR_PAGINA_INDICE=20;

/**
 * Hasta cuántos resultados en total se precargan solos, de fondo, apenas
 * llega la página 1 — para que pasar de página sea instantáneo CUANDO llega
 * a tiempo. Se probaron las dos puntas y las dos tienen un costo:
 *
 *   - De fondo, sin bloquear nada (esto): la página 1 aparece rápido, como
 *     siempre, pero si el usuario hace clic en "siguiente" antes de que la
 *     precarga de esa página termine —muy probable con CABA, que puede
 *     tardar 10-15 segundos reales por página—, no hay mejora: se pide en
 *     vivo igual, exactamente como si esto no existiera.
 *   - Esperando a tenerlas todas antes de mostrar la primera (lo que había
 *     antes de esto): "página siguiente" queda garantizado instantáneo,
 *     pero a costa de una espera inicial más larga y tediosa, sobre todo
 *     con una fuente lenta — y esa espera resultó peor que el problema
 *     original.
 *
 * Entre las dos, mejor esta: nunca hace esperar de más al principio, y
 * cuando la persona se toma un momento en leer la página 1 antes de pasar
 * de página, la mejora sí está. No es una garantía, es una ayuda que a
 * veces llega a tiempo y a veces no. Con más resultados que esto (una
 * búsqueda de concepto en Dialnet puede dar 30 mil) no se intenta: además
 * de la espera sería maltratar al sitio oficial de gusto, para páginas que
 * nadie va a hojear.
 */
var UMBRAL_PRECARGA_INDICE=5*POR_PAGINA_INDICE;

/**
 * Vuelca la respuesta del servidor (fresca o de un caché de página) al
 * estado de esa fuente y renderiza. Compartido entre "pedir de verdad" y
 * "ya la tenía precargada" para no repetir la misma docena de líneas.
 */
function aplicarPaginaIndice(slug,fCfg,imBusco,d,pagina,esNueva){
  imBusco.pagina=pagina;
  imBusco.cargando=false;
  if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
  imBusco.desdeNavegador=!!d.desdeNavegador;
  imBusco.resultados=d.resultados||[];
  imBusco.total=d.total||0;
  // Cuántos dice tener el SITIO con esas palabras. Es otra cosa que
  // "total": ese es cuántos pasaron el filtro entre los que se alcanzaron a
  // revisar. Puede venir null (respaldo local: no hay sitio que preguntar).
  imBusco.totalFuente=(typeof d.totalFuente==="number")?d.totalFuente:null;
  imBusco.guardados=d.guardadosEnIndice||0;
  imBusco.local=!!d.desdeIndiceLocal;
  imBusco.avisoFalla=d.avisoFalla||"";
  imBusco.parcial=!!d.totalParcial;
  imBusco.revisados=d.revisados||0;
  imBusco.aflojado=!!d.aflojado;
  // Dónde sigue la próxima. Si vino null, esta era la última: se borra el
  // cursor para que el paginador no ofrezca un "Siguiente" que no existe.
  if(typeof d.siguienteDesde==="number") imBusco.cursores[pagina+1]=d.siguienteDesde;
  else delete imBusco.cursores[pagina+1];
  imBusco.fragmentos={}; imBusco.fragErr={};
  render();
  // Los resultados ya están en pantalla; los pasajes que esta fuente no
  // manda se van completando atrás, sin hacer esperar a nadie.
  if(imBusco.resultados.some(function(r){return urlFragmento(slug,r)&&!sumarioCoincide(r);})){
    traerFragmentos(slug,imBusco.pedido);
  }
  var nombreTrib=(fCfg.tribunales||[]).filter(function(t){return t.v===imBusco.tribunal;})[0];
  var enDonde=fCfg.nombre+(nombreTrib?" · "+nombreTrib.n:"");
}

/**
 * Trae de fondo las páginas 2, 3... de la búsqueda que se acaba de hacer,
 * sin spinner ni bloquear nada: la página 1 ya está en pantalla desde antes
 * de llamar a esto. Si para cuando el usuario hace clic en "página
 * siguiente" ya llegó, buscarEnFuente la sirve del caché al toque; si no,
 * la pide en vivo como si esto no existiera (ver la nota grande de arriba).
 * Una a la vez y en orden, no todas juntas: son pedidos reales al sitio
 * oficial, con la misma espera de cortesía entre pedidos que ya respeta el
 * servidor (ver esperarTurno en lib/descargador.js) — pedirlas en paralelo
 * no las traería más rápido, solo se atropellarían.
 */
function precargarPaginasIndice(slug,imBusco,busquedaId,cuerpoBase){
  var maxPaginas=Math.ceil(UMBRAL_PRECARGA_INDICE/POR_PAGINA_INDICE);
  // De a una y en orden, no porque sea prolijo sino porque es obligatorio:
  // el arranque de la página N+1 lo dice la respuesta de la N. Sin esa
  // respuesta no hay a dónde ir, así que no se pueden pedir en paralelo
  // aunque se quisiera. Y de paso respeta la espera de cortesía entre
  // pedidos al sitio oficial (esperarTurno, en lib/descargador.js).
  function siguiente(pagina){
    if(pagina>maxPaginas) return;
    // Se compara contra busquedaId (una búsqueda, con q/modo/tribunal
    // fijos), NO contra imBusco.pedido: eso último cambia con cada clic en
    // una página, y si esto revisara pedido, con solo pasar de página a
    // mano mientras la precarga sigue en vuelo se cortaría entera pensando
    // que la búsqueda había quedado vieja, cuando en realidad es la misma.
    if(imBusco.busquedaId!==busquedaId) return;
    var cursor=imBusco.cursores[pagina];
    if(typeof cursor!=="number") return;              // se acabaron las páginas
    if(imBusco.paginas[pagina]) return siguiente(pagina+1); // ya la tenía
    var cuerpo=Object.assign({},cuerpoBase,{pagina:pagina,desde:cursor});
    fetch(estado.api+"/indice/"+slug+"/buscar",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(cuerpo)
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(imBusco.busquedaId!==busquedaId) return;
        if(d&&d.ok&&!d.desdeIndiceLocal){
          imBusco.paginas[pagina]=d;
          // Anotar el arranque de la que sigue, que es lo que permite
          // encadenar. Si no vino, se llegó al final y la cadena termina.
          if(typeof d.siguienteDesde==="number") imBusco.cursores[pagina+1]=d.siguienteDesde;
          // Los botones numerados salen de imBusco.cursores, así que cada
          // página precargada agrega uno: hay que repintar para que se vea.
          render();
        }
        siguiente(pagina+1);
      })["catch"](function(){ /* si falla precargando, buscarEnFuente la pide de nuevo cuando haga falta */ });
  }
  siguiente(2);
}

/**
 * @param slug fuente a consultar.
 * @param pagina si se omite es una búsqueda nueva (arranca en la página 1);
 *   si se pasa un número, es "ir a esa página" de una búsqueda ya hecha —
 *   reemplaza la lista, no la suma a la anterior.
 */
function buscarEnFuente(slug,pagina){
  var fCfg=FUENTES_INDICE.filter(function(x){return x.slug===slug;})[0];
  var qi=estado.q.trim();
  if(!fCfg) return;
  if(!qi){ flash("Escriba algo en «¿Qué desea consultar?» primero"); return; }
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }
  recordar(qi);
  var imBusco=estado.indices[slug];
  var esNueva=!(pagina>=1);
  var paginaPedida=esNueva?1:pagina;

  // Si esta página ya está precargada (de fondo o de haberla visitado antes
  // en esta misma búsqueda), servirla de ahí: no hace falta esperar de
  // nuevo al sitio oficial para algo que ya se trajo.
  if(!esNueva&&imBusco.paginas[paginaPedida]){
    aplicarPaginaIndice(slug,fCfg,imBusco,imBusco.paginas[paginaPedida],paginaPedida,false);
    return;
  }

  // Si esta fuente es lenta (CABA puede tardar 30s) y se dispara otra
  // búsqueda antes de que vuelva la anterior, la respuesta vieja no debe
  // pisar a la nueva. Un token por pedido: solo aplica si nadie más
  // arrancó una búsqueda de esta misma fuente después.
  var pedido=(imBusco.pedido||0)+1; imBusco.pedido=pedido;
  // Con qué rango de años se está pidiendo esto, para poder avisar después
  // si el usuario lo cambia y lo que quedó en pantalla ya no corresponde.
  imBusco.filtro=rangoAnios();
  // Distinto de "pedido": esto identifica la búsqueda (q/modo/tribunal),
  // no cada clic. Cambia solo con una búsqueda nueva, así que ir pasando
  // de página a mano no corta la precarga de fondo de esta misma búsqueda
  // (ver precargarPaginasIndice).
  if(esNueva){ imBusco.busquedaId=(imBusco.busquedaId||0)+1; imBusco.paginas={}; imBusco.cursores={1:0}; imBusco.porCopia=false; }
  var busquedaId=imBusco.busquedaId;
  imBusco.cargando=true; imBusco.error=null; imBusco.inicio=Date.now(); render();
  // El modo y las palabras a excluir viajan al servidor: antes se elegían
  // acá y no cambiaban nada de la búsqueda real (ver lib/relevancia.js).
  var cuerpo={q:qi,modo:estado.modo||"todas",pagina:paginaPedida};
  // El cursor de esa página, si se conoce. Sin esto el servidor cae al
  // cálculo por número de página, que es justo lo que se pisaba.
  if(typeof imBusco.cursores[paginaPedida]==="number") cuerpo.desde=imBusco.cursores[paginaPedida];
  if(estado.excluir.trim()) cuerpo.excluir=estado.excluir.trim();
  // El rango de años. Antes estos dos campos existían en pantalla pero NO
  // viajaban: sólo se usaban para la búsqueda de respaldo por Google
  // (rangoFechas), así que poner "2015–2026" y buscar en Mendoza devolvía
  // fallos de cualquier año. Una promesa rota en la interfaz.
  // Si esto viene de la solapa Norma, va el número de artículo: el servidor
  // le arma a cada buscador la consulta que ESE buscador entiende.
  if(estado.articulo){
    cuerpo.articulo=estado.articulo;
    if(estado.articuloNorma) cuerpo.norma=estado.articuloNorma;
    if(estado.articuloTema) cuerpo.tema=estado.articuloTema;
  }
  if(/^\d{4}$/.test(estado.desde)) cuerpo.anioDesde=Number(estado.desde);
  if(/^\d{4}$/.test(estado.hasta)) cuerpo.anioHasta=Number(estado.hasta);
  if(imBusco.tribunal) cuerpo.tribunal=imBusco.tribunal;
  if(slug==="saij"&&imBusco.provincia) cuerpo.provincia=imBusco.provincia;
  // Las formas equivalentes del término (tesauro): el servidor las busca también
  // y suma, en la primera página, lo que encuentre con cada una.
  var nom=nombreBuscado(qi),sinNombre=citaSinNombre(qi);
  if(sinNombre){ cuerpo.q=sinNombre; cuerpo.modo="exacta"; }
  else if(nom){
    // a la base se le piden las partes; el tribunal y el año sirven para ordenar
    cuerpo.q=nom.consulta; cuerpo.modo="todas";
    // en SAIJ, las fichas de los fallos: son las que traen la carátula completa
    if(slug==="csjn"||slug==="saij") cuerpo.tribunal="fallos";
  }else if(estado.conEquivalentes&&!estado.articulo){
    var eqs=equivalentesDe(qi);
    if(eqs.length) cuerpo.variantes=eqs;
  }
  // La copia local del servidor contesta al instante y con su total exacto: se
  // muestra mientras el sitio oficial responde, y la respuesta en vivo la
  // reemplaza al llegar (salvo que ya se esté hojeando la copia). Una búsqueda
  // que vino de la copia se sigue paginando ahí.
  if(!esNueva&&imBusco.local) cuerpo.local=true;
  var vivoListo=false;
  if(esNueva&&!estado.articulo){
    fetch(estado.api+"/indice/"+slug+"/local",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(vivoListo||imBusco.pedido!==pedido||!d||!d.ok||!d.resultados||!d.resultados.length) return;
        if(nom) d.resultados=IVSNombre.ordenar(d.resultados,nom);
        imBusco.busco=true; imBusco.porCopia=true;
        aplicarPaginaIndice(slug,fCfg,imBusco,d,1,false);
        imBusco.paginas[1]=d;
      })["catch"](function(){ /* sin copia: se espera al sitio, como siempre */ });
  }
  // la copia local va por …/local: no le pregunta a ningún sitio oficial y no cuenta para el límite de peticiones
  var promesaBusco=fetch(estado.api+"/indice/"+slug+(cuerpo.local?"/local":"/buscar"),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo)
  }).then(function(r){ return r.json(); })
    .then(function(d){
      // SAIJ no atiende al servidor donde está publicada la web, pero sí a
      // los navegadores (ver el bloque de "SAIJ desde el navegador"). Si el
      // servidor no pudo, lo intenta tu computadora antes de darse por
      // vencida.
      // SAIJ le responde 403 al servidor publicado: si el servidor no pudo (o
      // contestó con su respaldo), la consulta en vivo se hace desde el navegador;
      // el respaldo queda sólo si eso también falla.
      if((slug==="saij"||slug==="csjn")&&(!d||!d.ok||d.desdeIndiceLocal)) return saijEnVivo(cuerpo,slug,d);
      return d;
    }).then(function(d){
      // por nombre: primero lo que más se parece a la carátula buscada, sin fichas repetidas
      if(nom&&d&&d.ok&&d.resultados) d.resultados=IVSNombre.ordenar(d.resultados,nom);
      return d;
    });
  // Sin esto, un pedido que se corta a mitad de camino —típico en el celular:
  // se apaga la pantalla, cambia de wifi a datos, la pestaña pasa a segundo
  // plano un rato— podía quedar esperando una respuesta que ya no iba a
  // llegar nunca, con "Consultando el buscador…" clavado en pantalla para
  // siempre y sin ningún botón para salir de ahí (reportado en vivo: se
  // quedaba tildado en el celular, no en la computadora). El servidor ya
  // tiene su propio tope por pedido (25s, ver config.js); acá se le da un
  // poco más de margen —la ida y vuelta real, no solo lo que tarda el
  // origen— y, si ni así contesta, se fuerza el error para poder reintentar
  // en vez de quedar esperando de por vida.
  var idTope,
      seVencio=new Promise(function(_,reject){
        idTope=setTimeout(function(){
          reject(Object.assign(new Error("tope de espera del lado del navegador"),{tope:true}));
        },40000);
      });
  Promise.race([promesaBusco,seVencio]).then(function(d){ clearTimeout(idTope); return d; },
    function(err){ clearTimeout(idTope); throw err; })
    .then(function(d){
      if(imBusco.pedido!==pedido) return; // ya hay un pedido mas nuevo en vuelo
      vivoListo=true;
      // ya se está mostrando la copia: si el sitio no contestó, o si se está hojeando la copia, queda la copia
      if(imBusco.porCopia&&(!d||!d.ok||imBusco.pagina>1)){ imBusco.cargando=false; render(); return; }
      if(imBusco.porCopia&&esNueva){ imBusco.paginas={}; imBusco.cursores={1:0}; imBusco.porCopia=false; }
      imBusco.busco=true;
      if(!d||!d.ok){
        imBusco.cargando=false;
        if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
        imBusco.error=(d&&d.mensaje)||"El servidor no devolvió resultados.";
        render(); return;
      }
      aplicarPaginaIndice(slug,fCfg,imBusco,d,paginaPedida,esNueva);
      // Se haya pedido a mano o de una búsqueda nueva, cualquier página que
      // de verdad se trajo del sitio queda guardada: volver a pasar por
      // ella (ida y vuelta entre páginas) también es instantáneo.
      imBusco.paginas[paginaPedida]=d;
      // Búsqueda nueva, con más de una página y no demasiado grande: se van
      // trayendo las siguientes solas, de fondo, sin hacer esperar a nadie
      // (ver la nota grande de arriba de precargarPaginasIndice).
      // Búsqueda nueva y hay una página siguiente: se van trayendo solas,
      // de fondo (ver la nota grande de arriba de precargarPaginasIndice).
      // Antes esto se salteaba cuando d.total era grande, para no maltratar
      // al sitio con páginas que nadie iba a hojear; ahora el tope es
      // directamente cuántas se precargan (maxPaginas), que es el mismo
      // cuidado dicho donde de verdad se aplica.
      if(esNueva&&!d.desdeIndiceLocal&&typeof d.siguienteDesde==="number"){
        precargarPaginasIndice(slug,imBusco,busquedaId,cuerpo);
      }
    })["catch"](function(err){
      if(imBusco.pedido!==pedido) return;
      imBusco.cargando=false; imBusco.busco=true;
      if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
      imBusco.error=(err&&err.tope)
        ?"Tardó demasiado y no llegó respuesta — puede haberse cortado la conexión a mitad de camino. Pruebe de nuevo."
        :(slug==="saij"||slug==="csjn")
          ?"No fue posible consultar SAIJ, ni desde el servidor ni desde el navegador. Intente nuevamente en unos minutos."
          :"Se cortó la comunicación con el servidor.";
      render();
    });
}

/**
 * Números de página, tipo "‹ 1 2 3 … 12 ›", para navegar los resultados de
 * una fuente en vivo sin acumular todo en una sola lista larguísima.
 *
 * El respaldo local (im.local) ya trae todo lo que hay guardado en una sola
 * tanda, así que ahí no hay "página siguiente" que ofrecer.
 */
function paginadorIndice(f,im){
  var porPagina=POR_PAGINA_INDICE;
  var actual=Math.max(1,im.pagina||1);

  // Las páginas alcanzables son aquellas cuyo arranque ya se conoce. Se van
  // sumando a medida que se avanza: cada respuesta trae el cursor de la
  // siguiente y ninguna otra. No se puede saltar de la 1 a la 12 porque
  // nadie sabe todavía en qué fila del sitio empieza la 12 — depende de
  // cuántas descarte el filtro en el medio, que solo se sabe mirándolas.
  var ultima=actual;
  while(typeof im.cursores[ultima+1]==="number") ultima++;

  // La numeración de RESULTADOS sí es corrida: cada página muestra
  // exactamente porPagina (salvo la última) y la siguiente arranca justo
  // después de la última mostrada, así que la página N empieza en el
  // resultado (N-1)*porPagina+1 sin trampa.
  var desde=(actual-1)*porPagina+1;
  var hasta=desde+im.resultados.length-1;

  // Qué filas del sitio se miraron para armar ESTA página. Es el dato que
  // convierte "20 resultados" en algo interpretable: veinte de entre
  // sesenta filas revisadas no es lo mismo que veinte de entre veinte.
  var filaA=(im.cursores[actual]||0)+1;
  var filaB=(im.cursores[actual]||0)+(im.revisados||0);

  var out='<p style="font-size:12.5px;color:var(--humo);margin:0 0 8px">Mostrando '+
    desde.toLocaleString("es-AR")+'–'+hasta.toLocaleString("es-AR")+
    (im.revisados
      ? ' · revisadas las filas '+filaA.toLocaleString("es-AR")+'–'+filaB.toLocaleString("es-AR")+' del sitio'
      : '')+
    (typeof im.cursores[actual+1]!=="number"&&actual>1?' · es la última página':'')+
    '</p>';
  if(ultima<=1&&actual<=1) return out;

  // Ventana de números alrededor de la actual; el principio queda siempre a
  // la vista. No hay "última página" acá: no se sabe cuál es hasta llegar.
  var desdeN=Math.max(1,actual-2), hastaN=Math.min(ultima,actual+2);
  var nums=[];
  if(desdeN>1){ nums.push(1); if(desdeN>2) nums.push(null); }
  for(var i=desdeN;i<=hastaN;i++) nums.push(i);

  var botones=nums.map(function(pag){
    if(pag===null) return '<span style="padding:0 3px;color:var(--humo)">…</span>';
    return '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+pag+'"'+
      (pag===actual?' aria-pressed="true" disabled':'')+'>'+pag+'</button>';
  }).join("");

  return out+'<div class="paginador" style="margin:0 0 12px">'+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual-1)+'"'+
      (actual<=1?' disabled':'')+'>‹ Anterior</button>'+
    botones+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual+1)+'"'+
      (typeof im.cursores[actual+1]==="number"?'':' disabled')+'>Siguiente ›</button>'+
    '</div>';
}

/**
 * La línea de arriba de todo: de qué tamaño es lo que hay para revisar.
 *
 * Es más delicada de lo que parece, porque "cuántos resultados hay" no
 * siempre se puede contestar. Hay dos situaciones distintas:
 *
 *   - El sitio resolvió el modo pedido (CABA siempre; las demás en "todas"
 *     las palabras o "alguna"). Ahí su contador ES el total y se dice.
 *   - El filtro corrió de nuestro lado (frase exacta, excluir). Ahí NADIE
 *     sabe el total sin revisar las filas una por una: el sitio no puede
 *     contarlo porque no sabe hacer ese modo, y nosotros contaríamos solo
 *     lo revisado hasta ahora. Se dice entonces el tamaño del material —
 *     cuántas filas devuelve el sitio— que es lo que sí se puede afirmar.
 *
 * Antes se mostraba el conteo de la muestra rotulado "N resultado(s) que
 * coinciden de verdad", y eso se leía como el total. No lo era: "daño moral"
 * en Mendoza decía 52 cuando el sitio devuelve 319 filas, y en Dialnet decía
 * 38 sobre 3.228. Un abogado que lee 52 y cierra la página se pierde el
 * resto.
 *
 * Ojo con cómo se redacta el segundo número. Cada sitio cuenta a su manera y
 * el de SAIJ cuenta con OR: para "daño moral" informa 44.220, que son los
 * que tienen "daño" O "moral", no los que tratan de daño moral. Por eso la
 * frase NO dice "hay 44.220 sobre el tema" —sería cambiar una exageración
 * por otra— sino que el sitio DEVUELVE esas filas. Eso es cierto para los
 * seis buscadores, cuenten como cuenten.
 */
function conteoIndice(im,local,visibles){
  var n=function(x){ return '<b>'+(x||0).toLocaleString("es-AR")+'</b>'; };
  // Dialnet: sólo cuentan los que tienen el término en su texto (no el total crudo del sitio)
  if(visibles!=null) return n(visibles)+' resultado(s) con texto en esta página'+(typeof im.cursores[(im.pagina||1)+1]==="number"?'; pase de página para ver más':'');
  if(local) return n(im.total)+' resultado(s)';
  // Sin revisados, el filtro lo hizo el propio sitio: su contador es el total.
  // Si la fuente avisa que el conteo todavía no está cerrado (la Corte IDH
  // verifica la frase exacta de a tandas), se dice «al menos».
  if(!im.revisados) return im.parcial?'al menos '+n(im.total)+' coincidencia(s); pase de página para ver más':n(im.total)+' coincidencia(s) en total';
  if(im.totalFuente===null) return 'coincidencias entre lo revisado hasta acá';
  return 'el sitio devuelve '+n(im.totalFuente)+' filas para esta consulta'+
    (im.parcial
      ? ', y se van revisando de a tandas: pase de página para seguir'
      : ', ya revisadas todas');
}

function panelIndice(f){
  var im=estado.indices[f.slug];
  var local=im.busco&&im.local;
  var nombreTrib=((f.tribunales||[]).filter(function(t){return t.v===im.tribunal;})[0]||{}).n;
  // La clase por slug ya no pinta el borde: define --punto, y el rótulo de
  // abajo lo usa para su contorno y su bolita (ver .rotulo-fuente).
  // El borde izquierdo dorado del caso "local" se mantiene: no es decoración
  // sino un aviso —estos resultados salieron de la copia guardada, no del
  // sitio— y sigue siendo UN borde, con un lado marcado.
  var out='<div class="panel vivo f-'+f.slug+'" id="panel-'+f.slug+'">'+
    '<div class="rotulo rotulo-fuente" data-cod="'+esc(f.cod)+'" style="margin-top:0"><span>'+esc(f.nombre)+(local?'':' <span class="en-vivo">En vivo</span>')+'</span></div>';

  if(f.slug==="saij"){
    // SAIJ indexa la jurisprudencia y la legislación de las 24 jurisdicciones:
    // elegir una la convierte en el buscador de esa provincia.
    out+='<label class="campo" style="max-width:340px;margin:0 0 12px"><span>Provincia</span>'+
      '<select id="provSaij"><option value="">Todo el país</option>'+PROVINCIAS_SAIJ.map(function(p){
        return '<option'+(im.provincia===p?' selected':'')+'>'+esc(p)+'</option>';
      }).join("")+'</select></label>';
  }
  if(f.tribunales){
    out+='<div class="chips" style="margin:18px 0 10px">'+f.tribunales.map(function(t){
      return '<button class="chip" data-act="indice-tribunal" data-fuente="'+f.slug+'" data-tribunal="'+t.v+
        '" aria-pressed="'+(im.tribunal===t.v?"true":"false")+'">'+esc(t.n)+'</button>';
    }).join("")+'</div>';
  }
  // CABA no filtra del lado del sitio (ver lib/indiceCaba.js): esto filtra
  // sobre lo que ya se trajo, según la secretaría que cada resultado trae.
  var secsPresentes=(f.slug==="caba"&&im.busco)
    ? Array.from(new Set(im.resultados.map(function(r){return r.secretaria;}).filter(Boolean)))
    : [];
  if(secsPresentes.length>1){
    out+='<div class="chips" style="margin:18px 0 10px">'+secsPresentes.map(function(s){
      return '<button class="chip" data-act="indice-secretaria" data-fuente="'+f.slug+'" data-sec="'+esc(s)+
        '" aria-pressed="'+(im.secFiltro===s?"true":"false")+'">'+esc(SECRETARIAS_CABA[s]||s)+'</button>';
    }).join("")+'</div>';
  }

  if(im.cargando){
    out+='<p style="font-size:13px;color:var(--humo);margin:0">Procesando consulta… La respuesta puede demorar hasta 30 segundos debido a los tiempos de respuesta de los servidores oficiales; el sistema se encuentra activo.</p></div>';
    return out;
  }
  if(im.error){
    out+='<p style="font-size:13px;color:var(--humo);margin:0">Sin coincidencias en '+esc(f.nombre)+' para esta búsqueda. Pruebe con menos palabras.</p></div>';
    return out;
  }
  if(!im.busco){
    out+='<p style="font-size:13px;color:var(--humo);margin:0 0 10px">'+esc(f.nota||f.nombre)+'</p></div>';
    return out;
  }
  // Los resultados en pantalla se trajeron con el rango de años que había en
  // ese momento; si desde entonces se tocó, hay que decirlo en vez de dejar
  // una lista que ya no corresponde al filtro puesto (ver invalidarBusquedas).
  var avisoRango=(im.busco&&!mismoRango(im.filtro,rangoAnios()))
    ? '<div class="aviso" style="margin:0 0 10px"><strong>Se cambió el rango de años.</strong> Estos resultados son de la búsqueda anterior y no respetan el rango indicado ahora. '+
      '<button class="mini" data-act="buscar-indice" data-fuente="'+esc(f.slug)+'" style="margin-left:6px">Rehacer la búsqueda</button></div>'
    : '';
  var avisoLocal=avisoRango;
  if(!im.resultados.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Sin coincidencias en '+esc(f.nombre)+
      (nombreTrib?' ('+esc(nombreTrib)+')':'')+' para esta búsqueda. Pruebe con menos palabras.</p></div>';
    return out;
  }
  var visibles=(im.secFiltro?im.resultados.filter(function(r){return r.secretaria===im.secFiltro;}):im.resultados).filter(function(r){ return conTexto(f,r)!==false; });
  var nombreSec=SECRETARIAS_CABA[im.secFiltro];
  if(!visibles.length&&!im.secFiltro){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">'+(im.fragCargando?'Buscando los pasajes…':'Sin coincidencias en '+esc(f.nombre)+' para esta búsqueda en esta página.')+'</p>'+paginadorIndice(f,im)+'</div>';
    return out;
  }
  if(!visibles.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Ninguno de los '+im.resultados.length+
      ' resultados que trajo esta página es de '+esc(nombreSec||im.secFiltro)+'. Puede estar en otra página del sitio oficial.</p></div>';
    return out;
  }
  out+=avisoLocal+'<p style="font-size:12.5px;color:var(--humo);margin:0 0 4px">'+
    (nombreTrib?'<b style="color:var(--lacre)">'+esc(nombreTrib)+'</b> · ':'')+
    (nombreSec?'<b style="color:var(--lacre)">'+esc(nombreSec)+'</b> · '+visibles.length+' de sus ':'')+
    // Cuando el sitio de origen no sabe hacer el modo pedido, el filtro corre
    // de nuestro lado y su contador ya no aplica al modo pedido: se dice
    // cuántos se verificaron. Ver lib/relevancia.js.
    conteoIndice(im,local,f.slug==="dialnet"?visibles.length:null)+
    // Antes acá también decía "· N guardadas en tu índice local hasta
    // ahora": un detalle interno (cuántos documentos se acumularon con el
    // tiempo en la copia de respaldo, ver lib/indice.js) que no ayuda a
    // nadie a leer cuántos resultados dio ESTA búsqueda, y encima se
    // mezclaba en la misma frase. Sacado a pedido de un usuario que no le
    // encontraba sentido — con razón.
    '</p>'+
    // Números de página arriba de la lista: antes esto era un botón "ver más"
    // que iba sumando de a 20 sin fin; ahora se ve de entrada cuánto hay y
    // se puede saltar directo a cualquier página, como en cualquier buscador.
    paginadorIndice(f,im)+
    // «Frase exacta» es el modo por defecto y es el más estricto: sólo cuentan
    // los documentos con las palabras juntas y en ese orden. Cuando deja poco,
    // se ofrece el modo siguiente con un clic (con «daño extrapatrimonial» el TSJ
    // da 3 por frase y 6 por todas las palabras: se vio en uso real).
    (estado.modo==="exacta"&&!local&&(im.total||0)<=12&&String(estado.q||"").trim().split(/\s+/).length>1
      ?'<div class="aviso" style="margin:0 0 10px">Con «frase exacta» el resultado es corto: sólo cuentan los documentos que traen las palabras juntas y en ese orden. <button type="button" class="mini" data-act="modo-y-buscar" data-modo="todas" data-fuente="'+esc(f.slug)+'">Probar con «todas las palabras»</button></div>'
      :'')+
    (im.aflojado?'<div class="aviso" style="margin:0 0 10px">Ningún resultado tiene <b>todas</b> las palabras buscadas. Estos coinciden solo con la más específica, así que revíselos con cuidado: puede que no sean del tema buscado.</div>':'')+
    // El sitio de CABA no manda un resumen del fallo con cada resultado
    // como hace Mendoza: los pasajes se sacan del documento en sí, de a
    // tandas, mientras la lista ya está en pantalla (ver traerFragmentos).
    (f.slug==="caba"&&im.fragCargando?'<p style="font-size:12.5px;color:var(--humo);margin:0 0 10px">Este buscador no manda un resumen con cada resultado, así que los pasajes se van sacando de cada documento — aparecen solos, de a poco.</p>':'')+
    visibles.map(function(r){ return fichaIndice(f,r); }).join("")+
    '</div>';
  return out;
}


/* ============================================================
   Tesauro con fallos cargados
   ============================================================
   Por cada voz de cada rama, los fallos principales ya guardados en
   datos/tesauro/<rama>.json (los arma backend/scripts/armarTesauroFallos.mjs
   desde los sumarios oficiales de SAIJ, la Corte Suprema, la SCBA y la Suprema
   Corte de Mendoza). Se abren al instante, sin costo y aunque los sitios
   oficiales no respondan; para lo más nuevo, «Buscar más» va a las bases en vivo. */
var TES={}; // rama -> {cargando, error, datos}
function tesCargar(id){
  if(TES[id]&&(TES[id].datos||TES[id].cargando)) return;
  TES[id]={cargando:true};
  fetch("datos/tesauro/"+encodeURIComponent(id)+".json",{cache:"default"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ TES[id]={datos:d}; render(); })
    ["catch"](function(){ TES[id]={error:true}; render(); });
}
function tesPanel(rama){
  var t=TES[rama.id];
  if(!t||t.cargando) return '<div class="tes-panel"><p class="tes-nota">Cargando los fallos de esta rama…</p></div>';
  if(t.error||!t.datos) return '<div class="tes-panel"><p class="tes-nota">Todavía no hay fallos cargados para esta rama.</p></div>';
  var voces=t.datos.voces||{};
  var conFallos=rama.v.filter(function(v){ return (voces[v]||[]).length; });
  return '<div class="tes-panel">'+
    '<p class="tes-nota">Fallos guardados de fuentes oficiales, al '+esc((t.datos.generado||"").split("-").reverse().join("/"))+
      '. Seleccione una voz para verlos; para los más recientes, utilice «Buscar más».</p>'+
    conFallos.map(function(v){
      var fs=voces[v];
      return '<details class="tes-voz"><summary><span>'+esc(comoTitulo(v))+'</span><small>'+fs.length+' fallo'+(fs.length>1?"s":"")+'</small></summary>'+
        fs.map(function(f){
          var leer=f.link&&(f.f==="scba"||f.f==="mendoza")
            ?'<button class="mini" data-act="traer-indice-fallo" data-fuente="'+esc(f.f)+'" data-url="'+esc(f.link)+'">Leer en el Lector</button>':'';
          return '<article class="tes-fallo"><div class="tes-meta"><span class="cod">'+esc(f.cod)+'</span>'+
              (f.trib?'<span>'+esc(f.trib)+'</span>':'')+(f.fecha?'<span>'+esc(f.fecha)+'</span>':'')+'</div>'+
            (f.car?'<h4>'+esc(f.car)+'</h4>':'')+
            '<p>'+resaltarSimple(f.txt,v)+'</p>'+
            '<div class="f-acc">'+leer+
              (f.link?'<a class="mini" href="'+esc(f.link)+'" target="_blank" rel="noopener noreferrer">Ver en la fuente</a>':'')+
            '</div></article>';
        }).join("")+
        '<button class="mini tes-mas" data-act="voz" data-v="'+esc(v)+'">Buscar más sobre «'+esc(comoTitulo(v))+'» en las bases</button>'+
      '</details>';
    }).join("")+
    (conFallos.length<rama.v.length?'<p class="tes-nota">'+(rama.v.length-conFallos.length)+' voces de esta rama todavía no tienen fallos cargados.</p>':'')+
  '</div>';
}

  html+='<input type="text" id="buscarReq" class="rail-buscador" style="max-width:420px;margin:0 0 16px" '+

  if(!visibles.length) html+='<div class="vacio">Ningún trámite coincide con «'+esc(estado.buscarReq)+'».</div>';

function fichaRequisito(x){
  var cuerpo='';
  if(x.req&&x.req.length){
    // Cada requisito se puede tildar a medida que se reúne: la ficha pasa a

    cuerpo+='<div class="rotulo" style="margin-top:12px">Qué exige la norma'+
        (n?' <span class="req-progreso">· '+n+' de '+x.req.length+' cumplidos</span>':'')+'</div>'+
      '<ol class="req-lista">'+x.req.map(function(r,i){
        return '<li><button type="button" class="req-item" data-act="req-tilde" data-req="'+esc(x.id)+'" data-i="'+i+'"'+
          ' aria-pressed="'+(hechos[i]?"true":"false")+'"><span class="req-caja" aria-hidden="true"></span>'+
          '<span class="req-txt">'+esc(r)+'</span></button></li>';

      (n?'<button class="mini" data-act="req-reiniciar" data-req="'+esc(x.id)+'" style="margin-top:10px">Desmarcar todo</button>':'');

  }
  var fuente=x.norma
    ? '<div class="req-norma">'+esc(x.norma)+
      (x.url?' · <a href="'+escU(x.url)+'" target="_blank" rel="noopener noreferrer">ver el texto oficial</a>':'')+

    '</div></div>';

/**
 * Entiende una referencia escrita como la escribe un abogado.
 *
 * Nadie tipea "norma: código civil / artículo: 1741" en dos campos separados:
 * escribe "art 1741 CCyC", "artículo 70 del código civil y comercial",
 * "1741 CCCN" o "LCT 245". Esto saca de ahí el número y, si se nombró la
 * norma, también cuál es — así el desplegable se acomoda solo.
 *
 * Devuelve {art, clave} con clave en null si no se nombró ninguna norma
 * (entonces se respeta la que ya estaba elegida).
 */
function parsearReferencia(texto){
  var t=(" "+String(texto||"")+" ").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");   // sin tildes
  var clave=null;
  // Se prueba de la pista más específica a la más genérica: "civil y
  // comercial" antes que "civil" suelto, que también aparece en otras.
  if(/procesal civil|cpccn|c\.p\.c\.c|17\.?454/.test(t)) clave="cpccn";
  else if(/civil y comercial|ccyc|cccn|ccyn|c\.c\.c/.test(t)) clave="ccyc";
  else if(/constitucion|const\.|\bcn\b|carta magna/.test(t)) clave="cn";
  else if(/riesgos del trabajo|\blrt\b|24\.?557/.test(t)) clave="lrt";
  else if(/contrato de trabajo|\blct\b|20\.?744|ley de trabajo/.test(t)) clave="lct";
  else if(/consumidor|\bldc\b|24\.?240/.test(t)) clave="ldc";
  else if(/sociedades|\blgs\b|\blsc\b|19\.?550/.test(t)) clave="lgs";
  else if(/codigo penal|\bcp\b|11\.?179/.test(t)) clave="cp";
  else if(/concurso|quiebra|\blcq\b|24\.?522/.test(t)) clave="lcq";
  else if(/procedimiento administrativo|administrativ|\blpa\b|19\.?549/.test(t)) clave="lpa";
  else if(/amparo|16\.?986/.test(t)) clave="amparo";

  // El número del artículo: se ignoran los números que son parte del nombre
  // de la ley (20.744, 24.522...) para no confundirlos con el articulado.
  var limpio=t.replace(/\b\d{2}\.?\d{3}\b/g," ");
  var m=/\b(\d{1,4})\s*(bis|ter|quater)?\b/.exec(limpio);
  return { art: m?(m[1]+(m[2]?" "+m[2]:"")):"", clave: clave };
}

/**
 * Solapa Norma: el texto oficial de un artículo, más los fallos que lo citan.
 *
 * Cierra el círculo que le faltaba a la app. Todo lo demás mira
 * JURISPRUDENCIA —qué dijeron los tribunales—, pero un fallo se lee citando
 * artículos, y hasta ahora había que salir a otra pestaña a buscar el texto.
 * El texto no lo escribe esta web: lo trae de InfoLeg, que es el repositorio
 * del Ministerio de Justicia, en su versión "texto actualizado".
 */
/* Cómo se agrupan las seis fuentes al compararlas. Es la pregunta real que
   se hace un abogado —"¿qué dice Mendoza, qué dice Nación, qué dice CABA?"—
   y no coincide con el orden de la lista de buscadores: Mendoza son dos
   fuentes (el Poder Judicial y la revista) y Nación otras dos (la Corte y
   SAIJ). Dialnet va aparte porque no es jurisprudencia. */
var GRUPOS_COMPARAR=[
  ["Nación",   ["csjn","saij"]],
  ["Mendoza",  ["mendoza","mendozalegal"]],
  ["Ciudad de Buenos Aires", ["caba","juristeca"]],
  ["Buenos Aires", ["scba"]],
  ["Santa Fe", ["santafe"]],
  ["Río Negro", ["rionegro"]],
  ["Internacional", ["corteidh"]],
  ["Doctrina", ["dialnet"]]
];

/**
 * Corre la MISMA consulta en las seis fuentes a la vez.
 *
 * En paralelo y no una tras otra: son seis servidores distintos, así que la
 * espera de cortesía del backend (esperarTurno, por host) no se pisa entre
 * ellos. Secuencial tardaría unos cuarenta segundos —CABA sola tarda
 * catorce—; así tarda lo que la más lenta.
 *
 * Cada fuente se pinta apenas contesta, sin esperar a las demás: con una
 * lenta en el grupo, quedarse mirando una pantalla vacía sería peor.
 */
function compararFuentes(){
  var qi=estado.q.trim();
  if(!qi){ flash("Escriba algo en «¿Qué desea consultar?» primero"); return; }
  if(!estado.api){ flash("El comparador necesita el servidor de extracción"); return; }
  recordar(qi);
  estado.comparar={corriendo:true,hecho:false,q:qi,porFuente:{}};
  render();

  var pendientes=FUENTES_INDICE.length;
  FUENTES_INDICE.forEach(function(f){
    var cuerpo={q:qi,modo:estado.modo||"todas"};
    if(estado.excluir.trim()) cuerpo.excluir=estado.excluir.trim();
    if(/^\d{4}$/.test(estado.desde)) cuerpo.anioDesde=Number(estado.desde);
    if(/^\d{4}$/.test(estado.hasta)) cuerpo.anioHasta=Number(estado.hasta);
    var trib=estado.indices[f.slug]&&estado.indices[f.slug].tribunal;
    if(trib) cuerpo.tribunal=trib;

    // con tope: una base colgada no deja la tarjeta en «Consultando…» para siempre
    Promise.race([
      fetch(estado.api+"/indice/"+f.slug+"/buscar",{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)
      }).then(function(r){ return r.json(); }),
      new Promise(function(_,no){ setTimeout(function(){ no(new Error("tope")); },45000); })
    ])
      .then(function(d){
        // Mismo respaldo que en el buscador normal: a SAIJ el servidor
        // publicado no llega (403), pero el navegador sí.
        if((f.slug==="saij"||f.slug==="csjn")&&(!d||!d.ok||d.desdeIndiceLocal)) return saijEnVivo(cuerpo,f.slug,d);
        return d;
      })
      .then(function(d){
        estado.comparar.porFuente[f.slug]=(d&&d.ok)
          ?{ok:true,total:d.total||0,totalFuente:(typeof d.totalFuente==="number"?d.totalFuente:null),
            parcial:!!d.totalParcial,local:!!d.desdeIndiceLocal,resultados:d.resultados||[]}
          :{ok:false,error:(d&&d.mensaje)||"no respondió"};
      })
      ["catch"](function(){
        estado.comparar.porFuente[f.slug]={ok:false,error:"se cortó la comunicación"};
      })
      .then(function(){
        if(--pendientes<=0){ estado.comparar.corriendo=false; estado.comparar.hecho=true; }
        render();
      });
  });
}

function tarjetaComparar(f){
  var r=estado.comparar.porFuente[f.slug];
  var cab='<h4><span class="cod '+f.clase+'" style="margin-right:7px">'+esc(f.cod)+'</span>'+esc(f.nombre)+'</h4>';
  var borde='';

  if(!r) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">Consultando…</p></div>';
  if(!r.ok) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">Sin coincidencias.</p></div>';
  if(!r.resultados.length) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">Sin coincidencias.</p></div>';

  // NO se muestra el contador crudo del sitio, aunque lo tengamos.
  //
  // Poner "44.222" en la tarjeta de SAIJ al lado de "319" en la de Mendoza
  // era una comparación falsa: SAIJ cuenta los documentos que tienen ALGUNA
  // de las palabras y Mendoza los que tienen TODAS, así que esos dos números
  // no miden lo mismo y la pantalla invitaba justamente a compararlos. Un
  // aviso al pie no alcanzaba — el número grande es lo que se lee.
  //
  // Lo que se muestra es lo único que significa lo mismo en las seis: cuántos
  // resultados de verdad trajo esta consulta acá. Es un piso, no un censo, y
  // se dice así.
  // La barra: lo que trajo esta base contra la que más trajo, para leer la
  // comparación de un vistazo. Es material encontrado, no un ranking: los
  // contadores oficiales miden distinto (ver el aviso de la solapa).
  var tope=Math.max.apply(null,FUENTES_INDICE.map(function(x){
    var y=estado.comparar.porFuente[x.slug]; return y&&y.ok?y.resultados.length:0;
  }).concat([1]));
  var barra='<span class="comp-barra" aria-hidden="true"><i style="width:'+Math.round(r.resultados.length/tope*100)+'%"></i></span>';
  var cifra='<p class="comp-cifra"><b>'+r.resultados.length.toLocaleString("es-AR")+'</b> resultado'+
    (r.resultados.length===1?'':'s')+' encontrados'+
    (r.parcial?' (hay más para revisar)':'')+
'</p>';

  var items=r.resultados.slice(0,3).map(function(x){
    var enlace=x.linkFicha||x.linkFallo;
    var titulo=esc((x.caratula||x.expediente||"(sin carátula)").slice(0,150));
    return '<div class="comp-item">'+
      (enlace?'<a href="'+escU(enlace)+'" target="_blank" rel="noopener noreferrer">'+titulo+'</a>':titulo)+
      (x.fecha?'<span class="comp-fecha">'+esc(x.fecha)+'</span>':'')+
      '</div>';
  }).join("");

  return '<div class="comp-card"'+borde+'>'+cab+cifra+barra+items+
    '<div class="f-acc" style="margin-top:10px">'+
      '<button class="mini" data-act="ir-a-fuente" data-fuente="'+esc(f.slug)+'">Ver todos en Buscar</button>'+
    '</div></div>';
}

/**
 * Solapa Comparar: la misma pregunta contestada por cada jurisdicción.
 *
 * Antes esto existía como "Buscar en todas a la vez", pero no buscaba en
 * ningún lado: armaba una consulta de Google con site: y abría otra pestaña.
 * Ahora corre de verdad contra los seis buscadores integrados y muestra las
 * respuestas juntas, que es la pregunta que un abogado se hace todo el
 * tiempo: si Mendoza resuelve distinto que la Corte, quiero verlo de un
 * vistazo, no abriendo seis solapas.
 */
function vistaComparar(){
  var c=estado.comparar;
  var html='<div class="aviso"><span class="av-tit">Esta función permite contrastar los criterios de resolución de la SCJM, el TSJ y la CSJN</span>'+
    'Cada bloque indica los documentos obtenidos para esta búsqueda específica, no el total de la base de datos. '+
    'Al usar criterios de medición heterogéneos, los contadores oficiales no son comparables entre sí. '+
    'Esta función es un localizador de material.</div>';

  html+='<div class="panel"><div class="campo"><span>¿Qué desea consultar?</span>'+
    '<input type="text" id="q" value="'+esc(estado.q)+'" autocomplete="off" placeholder="daño moral"></div>'+
    '<div class="acciones" style="margin:0;padding:0;border:0">'+
      '<button class="btn" data-act="comparar"'+(c.corriendo?" disabled":"")+'>'+
        (c.corriendo?"Consultando las "+FUENTES_INDICE.length+"…":"Comparar las "+FUENTES_INDICE.length+" fuentes")+'</button>'+
    '</div></div>';

  if(!c.corriendo&&!c.hecho) return html;

  html+='<p class="conteo">'+(c.corriendo?'Consultando… cada fuente aparece apenas contesta':'Resultados para «'+esc(c.q)+'»')+'</p>';

  // una base nueva sin grupo no queda afuera: va a «Otras»
  var agrupadas=[].concat.apply([],GRUPOS_COMPARAR.map(function(g){ return g[1]; }));
  var otras=FUENTES_INDICE.filter(function(f){ return agrupadas.indexOf(f.slug)===-1; }).map(function(f){ return f.slug; });
  GRUPOS_COMPARAR.concat(otras.length?[["Otras",otras]]:[]).forEach(function(g){
    var fs=FUENTES_INDICE.filter(function(f){ return g[1].indexOf(f.slug)!==-1; });
    if(!fs.length) return;
    html+='<div class="grupo"><h3>'+esc(g[0])+'</h3>'+
      '<div class="comp-grid">'+fs.map(tarjetaComparar).join("")+'</div></div>';
  });
  return html;
}

/**
 * El aviso de "no se pudo traer", en un solo lugar para poder mostrarlo
 * tanto si el Lector estaba vacío como si ya tenía un fallo abierto.
 *
 * Antes esto sólo se pintaba cuando el Lector estaba vacío: si ya había un
 * documento cargado y "Traer texto completo" fallaba para uno nuevo (algo
 * frecuente con los PDF del TSJ de CABA, que muchas veces no le contestan
 * al servidor publicado en Azure), el pedido fallaba en silencio y quedaba
 * en pantalla el fallo anterior, como si fuera el que se acababa de pedir.
 */
function avisoErrorLector(){
  if(!estado.errorLink&&!estado.cargandoOcr) return '';
  if(estado.cargandoOcr){
    return '<div class="aviso" style="margin:0 0 14px">'+
      '<strong>Aplicando OCR…</strong> puede tardar varios minutos —no son milisegundos como el resto de esta app—, '+
      'sobre todo si el servidor anda con poca CPU en este momento. No hace falta recargar ni volver a tocar el botón: '+
      'déjelo trabajando.'+
      (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Mientras tanto se sigue viendo el fallo anterior.</span>':'')+
      '</div>';
  }
  var esEscaneo=estado.errorLink.codigo==="PDF_ESCANEADO";
  // El escaneo puede venir de un enlace (queda la URL para pedirle el OCR
  // al servidor) o de un archivo subido a mano (no hay URL, pero el propio
  // archivo quedó guardado en memoria — ver el listener de "change" más
  // abajo — así que el OCR se le puede pedir igual sin volver a elegirlo).
  var puedeOcr=esEscaneo&&(estado.errorLink.url||estado.errorLink.archivo);
  return '<div class="aviso" style="margin:0 0 14px"><strong>No se pudo traer este documento.</strong> '+
    esc(estado.errorLink.mensaje)+
    (estado.errorLink.ayuda?'<br><span style="color:var(--humo);font-size:12.5px">'+esc(estado.errorLink.ayuda)+'</span>':'')+
    (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Se sigue mostrando el fallo que ya estaba abierto, no el que acaba de pedirse.</span>':'')+
    ((estado.errorLink.url||puedeOcr)
      ?'<div class="f-acc" style="margin-top:10px">'+
         // El escaneo no tiene "el original y guardarlo" como primer paso:
         // ahí el enlace es al PDF sin texto, y lo que sirve es pedirle al
         // servidor que le aplique OCR, no abrirlo a mano.
         (puedeOcr
           ?'<button class="mini" data-act="aplicar-ocr"'+(estado.errorLink.url?' data-url="'+esc(estado.errorLink.url)+'"':'')+'>Aplicar OCR (tarda varios minutos)</button>'
           :'')+
         (estado.errorLink.url
           ?'<a class="mini" href="'+escU(estado.errorLink.url)+'" target="_blank" rel="noopener noreferrer">'+(esEscaneo?"Abrir el original":"1 · Abrir el original y guardarlo")+'</a>'
           :'')+
         (esEscaneo||!estado.errorLink.url?'':'<button class="mini" data-act="elegir-archivo">2 · Subirlo aquí</button>')+
       '</div>'
      :'')+
    '</div>';
}

function conteoLector(cs){
  var el=document.getElementById("doc-cnt");
  if(!el) return;
  if(!cs.length){
    el.innerHTML=cadena()?'Sin coincidencias para <b>'+esc(cadena())+'</b>'
                         :'Escriba en «Qué buscar dentro del fallo» para resaltar';
    return;
  }
  var vis=Math.min(cs.length,TOPE_MARCAS);
  el.innerHTML='<b>'+cs.length+'</b> coincidencia'+(cs.length===1?"":"s")+
    (cs.length>TOPE_MARCAS?" (se marcan las primeras "+TOPE_MARCAS+")":"")+
    ' · '+(estado.marca+1)+' de '+vis;
}

/* Orden de lectura de la ficha del Lector: jerarquía legal de arriba hacia
   abajo (Constitución > tratados/leyes > fondo > forma), y adentro de cada
   norma, los artículos ordenados numéricamente en vez de por orden de
   aparición en el texto. */
function numDeCadena(s){
  var m=String(s).replace(/\./g,"").match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function ordenArt(a,b){
  var na=numDeCadena(a),nb=numDeCadena(b);
  return na!==nb?na-nb:a.localeCompare(b);
}
var RANGO_FUENTE={
  "CCyC (vigente)":10,"Código Civil (derogado)":11,"Código de Comercio (derogado)":12,"Código Penal":13,
  "Ley de Contrato de Trabajo (LCT)":14,"Ley de Defensa del Consumidor (LDC)":15,"Ley de Seguros (LS)":16,
  "Ley General de Sociedades (LGS)":17,"Ley de Concursos y Quiebras (LCQ)":18,"Ley de Riesgos del Trabajo (LRT)":19,
  "Constitución provincial":29,"CPCCN":30,"CPCCyT (Mendoza)":31,"CPC":32,"Código Procesal Penal":33,"Ley Arancelaria (LA)":34
};
function rangoDeFuente(label){
  return RANGO_FUENTE.hasOwnProperty(label)?RANGO_FUENTE[label]:99;
}

function pintarLector(){
  if(estado.tab!=="lector"||!estado.texto) return;
  if(estado.lxFoco){
    estado.lxFoco=false;
    setTimeout(function(){ var lq=document.getElementById("lx-q"), sec=document.getElementById("lx-fallo");
      if(sec) sec.scrollIntoView({behavior:"smooth",block:"start"}); if(lq) lq.focus({preventScroll:true}); },350);
  }
  var texto=estado.texto,cs=coincidencias(texto),d=datosDoc(texto);
  if(estado.marca>=cs.length) estado.marca=0;
  conteoLector(cs);

  var meta=document.getElementById("doc-meta");
  if(meta){
    var top=[];
    if(d.trib) top.push(["Tribunal",d.trib+(d.sala?" · "+d.sala:"")]);
    if(d.fecha) top.push(["Fecha",d.fecha]);
    if(d.exp) top.push(["Expediente",d.exp]);
    if(d.tomo&&d.pag) top.push(["Colección","Fallos: "+d.tomo+":"+d.pag]);
    var infoDer=estado.infoDoc?esc(estado.infoDoc.tipo.toUpperCase()+
      (estado.infoDoc.paginas?" · "+estado.infoDoc.paginas+" pág.":"")+
      " · "+estado.infoDoc.caracteres.toLocaleString("es-AR")+" caracteres"+
      (estado.infoDoc.desdeCache?" · desde caché":"")):"";

    var htmlTop=(top.length||d.car||infoDer)?(
      '<div class="meta-top">'+
        (d.car?'<div class="meta-car">'+esc(d.car)+
          (estado.fichaConocida?' <span class="verif"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1"/><path d="M6.4 10.3l2.5 2.5 4.7-5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>Verificado en el Buscador Oficial</span>':"")+
          '</div>':"")+
        (top.length||infoDer?'<div class="meta-fila">'+
          '<div class="izq">'+top.map(function(x){ return '<b>'+esc(x[0])+':</b> '+esc(x[1]); }).join(' <span class="sep">·</span> ')+'</div>'+
          (infoDer?'<div class="der">'+infoDer+'</div>':"")+
        '</div>':"")+
      '</div>'
    ):"";

    var A=IVSAnalisis.analizar(texto,{car:d.car,tipo:d.tipo});
    /* Los artículos que el fallo cita SÓLO al regular honorarios o imponer
       costas (Ley 9131, art. 36 CPCCyT…) no fundan la decisión: van aparte. */
    var soloAccesorio={},vistoFund={};
    (d.citas||[]).forEach(function(c){
      var k=c.f+"|"+c.l,ctx=A.contextoDe(c.pos);
      if(ctx==="honorarios"||ctx==="costas"){ if(!vistoFund[k]) soloAccesorio[k]=true; }
      else { vistoFund[k]=true; delete soloAccesorio[k]; }
    });
    var accesorios=[];
    var porFuente=(d.artsPorFuente||[]).map(function(g){
      var quedan=g[1].filter(function(a){ return !soloAccesorio[g[0]+"|"+a]; }),van=g[1].filter(function(a){ return soloAccesorio[g[0]+"|"+a]; });
      if(van.length) accesorios.push([g[0],van,g[2]]);
      return [g[0],quedan,g[2],van.length>0&&!quedan.length];
    }).filter(function(g){ return !g[3]; });
    var pend=porFuente.filter(function(g){ return g[0]==="Sin ley identificada"; })[0];
    var porCat={cn:[],tratados:[],fondo:[],leyes:[],provincial:[],local:[]};
    porFuente.forEach(function(g){
      if(g[0]==="Sin ley identificada") return;
      var cat=porCat.hasOwnProperty(g[2])?g[2]:"leyes";
      porCat[cat].push(g);
    });
    porCat.leyes.sort(function(a,b){ return numDeCadena(a[0])-numDeCadena(b[0]); });
    porCat.fondo.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.provincial.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.tratados.sort(function(a,b){ return a[0].localeCompare(b[0]); });
    porCat.local.sort(function(a,b){ return a[0].localeCompare(b[0]); });

    function bloqueNorma(g,claseExtra){
      return '<div class="meta-bloque'+(claseExtra?" "+claseExtra:"")+'"><h3>'+esc(g[0])+'</h3>'+
        '<div class="meta-tags">'+g[1].slice().sort(ordenArt).map(function(a){
          return '<span class="meta-tag">'+esc(a)+'</span>';
        }).join("")+'</div></div>';
    }
    function bloqueTags(items){
      return '<div class="meta-bloque"><div class="meta-tags">'+
        items.map(function(x){ return '<span class="meta-tag">'+esc(x)+'</span>'; }).join("")+
      '</div></div>';
    }

    /* Jerarquía normativa decreciente: Constitución > tratados > códigos de
       fondo > leyes nacionales > leyes provinciales/procesales > normativa
       local. Cada norma aparece una sola vez, con todos sus artículos
       consolidados en el mismo contenedor. */
    var bloques="";
    porCat.cn.forEach(function(g){ bloques+=bloqueNorma(g,"cn"); });
    if(porCat.tratados.length){
      bloques+='<div class="meta-cat">Tratados internacionales</div>';
      porCat.tratados.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.fondo.length){
      bloques+='<div class="meta-cat">Códigos de fondo</div>';
      porCat.fondo.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.leyes.length){
      bloques+='<div class="meta-cat">Leyes nacionales</div>';
      porCat.leyes.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.provincial.length){
      bloques+='<div class="meta-cat">Leyes provinciales y códigos procesales</div>';
      porCat.provincial.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.local.length){
      bloques+='<div class="meta-cat">Normativa local y decretos</div>';
      porCat.local.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(accesorios.length){
      bloques+='<div class="meta-cat">Citadas sólo al regular honorarios o costas</div>';
      accesorios.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    // Precedentes: los de la Corte Suprema y los provinciales que se pudieron
    // identificar (con carátula, fecha o registro), no sólo «Fallos: X:Y».
    var precs=A.precedentes.filter(function(x){ return x.tipo==="csjn"||x.tipo==="provincial"||x.tipo==="otro_tribunal"; });
    if(precs.length){
      bloques+='<div class="meta-cat">Jurisprudencia citada</div>'+bloqueTags(precs.map(function(x){
        return [x.caratula?"«"+x.caratula+"»":null,x.tipo==="csjn"?"CSJN":null,x.fecha,x.publicacion].filter(Boolean).join(" · ");
      }))+'<div class="meta-bloque"><div class="txt" style="font-size:12px;color:var(--mute-2)">Detectada por reglas: puede no ser exhaustiva.</div></div>';
    }
    if(pend) bloques+='<div class="meta-bloque pendiente"><h3>Artículos pendientes de clasificación</h3>'+
      '<div class="meta-tags">'+pend[1].slice().sort(ordenArt).map(function(a){
        return '<span class="meta-tag">'+esc(a)+'</span>';
      }).join("")+'</div></div>';

    meta.innerHTML=htmlTop+
      (bloques?'<div class="meta-cuerpo">'+bloques+'</div>'
        :(htmlTop?"":'<div class="meta-bloque"><h3>Sin datos detectados</h3><div class="txt">El encabezado no sigue un formato reconocible. Cargue los datos a mano en «Citar».</div></div>'))+
      '<div class="meta-acc">'+
      '<button class="mini" data-act="meta-a-cita">Pasar estos datos al formateador de citas</button>'+
      '<button class="mini" data-act="copiar-doc-cita">Copiar solo la cita</button>'+
      '</div>';
  }

  var doc=document.getElementById("doc");
  if(doc) doc.innerHTML=textoResaltado(texto,cs);
  pintarMinimapa();

  var tit=document.getElementById("doc-tit-pas");
  var cont=document.getElementById("pasajes");
  if(cont){
    if(!cs.length){
      if(tit) tit.textContent="Pasajes";
      cont.innerHTML='<div class="vacio">'+(cadena()
        ?'Su búsqueda no aparece en este texto. Pruebe con «Palabra parcial: sí», con menos palabras o cambiando el modo a «Alguna palabra» en la solapa Buscar.'
        :'Escriba algo arriba y los pasajes aparecerán aquí.')+'</div>';
