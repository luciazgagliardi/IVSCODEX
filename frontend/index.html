      if(tit) tit.textContent=ps.length+" pasaje"+(ps.length===1?"":"s")+" con contexto";
      cont.innerHTML=ps.map(function(p,i){
        return '<div class="pasaje"><div class="txt">'+p.html+'</div><div class="acc">'+
          '<button class="mini" data-act="pas-cita" data-i="'+i+'">Copiar con la cita</button>'+
          '<button class="mini" data-act="pas-copiar" data-i="'+i+'">Copiar el pasaje</button>'+
          '<button class="mini" data-act="pas-guardar" data-i="'+i+'">Guardar</button>'+
          '<button class="mini" data-act="pas-compartir" data-i="'+i+'">Compartir</button>'+
          '<span class="pos">carácter '+p.ini+'</span></div></div>';
      }).join("");
      cont._ps=ps;
    }
  }
  irAMarca(false);
}

/* El minimapa del Lector: una franja junto al fallo con una marca por cada
   coincidencia, a la altura en que aparece en el texto. De un vistazo se
   ve dónde se concentran —en los considerandos, en la parte resolutiva— y
   tocar una marca lleva hasta ella. Una ventana tenue muestra qué parte
   del fallo está a la vista. Complementa la grilla de pasajes: los pasajes
   dicen qué; el minimapa, dónde. */
function pintarMinimapa(){
  var doc=document.getElementById("doc"),mm=document.getElementById("minimapa");
  if(!doc||!mm) return;
  var ms=doc.querySelectorAll("mark"),alto=doc.scrollHeight||1,h="";
  for(var k=0;k<ms.length;k++){
    h+='<button type="button" class="mm-marca'+(k===estado.marca?' actual':'')+'" data-act="ir-marca" data-i="'+k+'"'+
       ' style="top:'+(ms[k].offsetTop/alto*100).toFixed(2)+'%" aria-label="Coincidencia '+(k+1)+' de '+ms.length+'"></button>';
  }
  mm.innerHTML='<span class="mm-ventana" id="mm-ventana"></span>'+h;
  mm.hidden=!ms.length;
  ventanaMinimapa();
  if(!doc._conMinimapa){ doc._conMinimapa=true; doc.addEventListener("scroll",ventanaMinimapa,{passive:true}); }
}
function ventanaMinimapa(){
  var doc=document.getElementById("doc"),v=document.getElementById("mm-ventana");
  if(!doc||!v) return;
  var alto=doc.scrollHeight||1;
  v.style.top=(doc.scrollTop/alto*100)+"%";
  v.style.height=Math.max(3,doc.clientHeight/alto*100)+"%";
}

function irAMarca(mover){
  try{
    var doc=document.getElementById("doc");
    if(!doc) return;
    var ms=doc.querySelectorAll("mark");
    if(!ms.length) return;
    var i=Math.max(0,Math.min(estado.marca,ms.length-1));
    for(var k=0;k<ms.length;k++) ms[k].className=(k===i?"actual":"");
    var mm=document.querySelectorAll("#minimapa .mm-marca");
    for(var m=0;m<mm.length;m++) mm[m].classList.toggle("actual",m===i);
    if(mover&&ms[i].scrollIntoView) ms[i].scrollIntoView({block:"center"});
  }catch(e){}
}

/* ============================================================
   Verificador de citas
   ============================================================
   Pegás una cita, el servidor la lee (backend/lib/citas.js) y la busca en
   los buscadores oficiales que sabe consultar (backend/lib/verificarCita.js).
   Todo lo que se ve acá sale de esa respuesta: esta página no concluye nada
   por su cuenta y, sobre todo, no convierte un "no lo encontré" en un "es
   falsa". El alcance de la búsqueda queda escrito en pantalla siempre, haya
   o no resultado, porque es la única forma de que el veredicto se lea con la
   reserva que corresponde. */

var VEREDICTOS={
  verificada:{clase:"si",rotulo:"Coincidencia encontrada"},
  no_encontrada:{clase:"no",rotulo:"No la encontramos"},
  no_verificable:{clase:"duda",rotulo:"No se pudo verificar"}
};

function verificarCitaPegada(){
  var ta=document.getElementById("cita-in");
  var txt=(ta?ta.value:estado.cita.texto||"").trim();
  estado.cita.texto=txt;
  if(!txt){ flash("Pegue la cita que desea verificar"); return; }
  if(!estado.api){ flash("Esta función necesita el servidor, y ahora no responde"); return; }
  if(estado.cita.cargando) return; // ya hay uno en camino, no duplicar el pedido

  estado.cita.cargando=true; estado.cita.error=null; estado.cita.salida=null; render();
  fetch(estado.api+"/verificar-cita",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({texto:txt})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cita.cargando=false;
      if(!d||!d.ok){
        estado.cita.error=(d&&d.mensaje)||"El servidor no pudo verificar la cita.";
        render(); return;
      }
      estado.cita.salida=d;
      estado.cita.cuando=new Date();
      render();
      var v=VEREDICTOS[d.veredicto];
      flash(v?v.rotulo:"Listo");
    })["catch"](function(){
      estado.cita.cargando=false;
      estado.cita.error="Se cortó la comunicación con el servidor.";
      render();
    });
}

/* La constancia de verificación: cuando la cita coincide con un registro
   oficial, queda asentado qué se consultó, qué se encontró, en qué bases
   y cuándo, con el sello de IVS CODEX. Se copia como texto para adjuntar
   al expediente o al borrador del escrito. Acredita la coincidencia a esa
   fecha; no reemplaza la lectura del fallo, y lo dice. */
function datosConstancia(){
  var d=estado.cita.salida,c=d&&(d.candidatos||[])[0];
  // Solo con confianza alta: un identificador exacto (expediente, tomo y
  // página) corroborado por la carátula o la fecha. Con menos que eso la
  // explicación pide abrir el documento y comparar, y una constancia diría
  // más de lo que se comprobó.
  if(!d||d.veredicto!=="verificada"||d.confianza!=="alta"||!c) return null;
  var cuando=estado.cita.cuando||new Date();
  return {
    cita:estado.cita.texto||"",
    caratula:c.caratula||"(sin carátula)",
    meta:[c.nombreFuente,c.tribunal,c.fecha,c.expediente?"Expte. "+c.expediente:""].filter(Boolean).join(" · "),
    link:c.link||"",
    bases:(d.fuentesConsultadas||[]).filter(function(f){return f.ok;}).map(function(f){return f.nombre;}).join(" · "),
    fecha:cuando.toLocaleDateString("es-AR")+" · "+cuando.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}),
    confianza:d.confianza||""
  };
}
function constanciaCita(){
  var k=datosConstancia();
  if(!k) return "";
  function fila(rot,val){ return val?'<div><dt>'+esc(rot)+'</dt><dd>'+esc(val)+'</dd></div>':''; }
  return '<div class="constancia">'+
    '<svg class="constancia__sello" viewBox="0 0 120 120" aria-hidden="true">'+

      '<path d="M46 61l10 10 19-22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg>'+
    '<div class="constancia__txt"><p class="constancia__tit">Constancia de verificación</p>'+
      '<dl>'+fila("Cita consultada",k.cita)+fila("Coincidencia",k.caratula+(k.meta?" — "+k.meta:""))+
        fila("Bases consultadas",k.bases)+fila("Fecha de consulta",k.fecha)+'</dl>'+
      '<div class="acciones">'+
        '<button class="btn" data-act="copiar-constancia">Copiar la constancia</button>'+

      '</div>'+

}

function montarAsistente(){
  if(document.getElementById("asist")) return;
  var el=document.createElement("div");
  el.id="asist"; el.className="asist";
  el.innerHTML='<button type="button" class="asist__fab" id="asist-abrir" aria-haspopup="dialog"><i></i>Lexia</button>'+
    '<section class="asist__panel" role="dialog" aria-label="Lexia, la asistente de IVS CODEX">'+
      '<div class="asist__cab"><b><i></i>Lexia <span style="font-weight:400;color:var(--mute-2);font-size:12.5px">Asistente Virtual</span></b><span class="asist__cabr"><button type="button" class="asist__tut" data-tour>Tutorial</button><button type="button" class="asist__x" id="asist-cerrar" aria-label="Cerrar a Lexia">✕</button></span></div>'+
      '<div class="asist__log" id="asist-log" aria-live="polite"></div>'+
      '<form class="asist__form" id="asist-form" autocomplete="off"><input type="text" id="asist-in" maxlength="300" placeholder="Escríbame lo que necesita…" aria-label="Escriba su consulta a Lexia"><button type="submit">Enviar</button></form>'+
      '<p class="asist__pie">Orientación automática. No reemplaza el consejo de un abogado.</p>'+
    '</section>';
  document.body.appendChild(el);
  var log=document.getElementById("asist-log"), entrada=document.getElementById("asist-in"), arranco=false;
  var ctx={tema:"",propuesta:null,pendiente:"",ultimo:"",usado:{},espera:0};

  /* ---- salida: burbujas cortas, con «escribiendo…» y de a una ---- */
  var cola=[], corriendo=false;
  function ir(){ log.scrollTop=log.scrollHeight; }
  function siguiente(){ var fn=cola.shift(); if(!fn){ corriendo=false; return; } corriendo=true; fn(siguiente); }
  function encolar(fn){ cola.push(fn); if(!corriendo) siguiente(); }
  function pick(clave,arr){
    var i=Math.floor(Math.random()*arr.length);
    if(arr.length>1&&i===ctx.usado[clave]) i=(i+1)%arr.length;
    ctx.usado[clave]=i; return arr[i];
  }
  function sinOpciones(){ [].forEach.call(log.querySelectorAll(".asist__ops"),function(o){ o.remove(); }); }
  function dice(partes,ops){
    if(typeof partes==="string") partes=[partes];
    partes.forEach(function(txt,i){
      encolar(function(next){
        var t=document.createElement("div"); t.className="asist__m bot asist__tipea"; t.innerHTML="<i></i><i></i><i></i>"; log.appendChild(t); ir();

        if(e.classList&&e.classList.contains("marca-app")){

        if(!primero) primero=e;

  function limpiarEspera(){ if(rec.espera){ document.removeEventListener("click",rec.espera,true); rec.espera=null; } }
  function cerrarRecorrido(terminado){
    limpiarEspera(); rec.pila=null;

    document.body.classList.remove("en-recorrido");
    document.removeEventListener("keydown",rec.tecla,true); window.removeEventListener("resize",rec.reubicar); window.removeEventListener("scroll",rec.reubicar,true);
    if(estado.perfilMenu){ estado.perfilMenu=false; pintarNav(); }

    var completo=rec.clave==="completo";
    dice(terminado?(completo?"Eso es todo el recorrido. ¿Le quedó alguna duda? Puedo repetirlo o hacer juntos una parte en particular.":"Listo, lo hicimos juntos. ¿Seguimos con otra parte?"):"Cuando quiera lo retomamos.",
      [{t:"Elegir otra parte",f:elegirRecorrido},{t:"Estoy bien, gracias",suave:true,f:function(){ dice("Un gusto. Éxitos con el caso."); }}]);
  }
  function sigPaso(dir){
    limpiarEspera();
    rec.i+=dir; if(rec.i<0) rec.i=0;
    if(rec.i>=rec.pasos.length){
      if(rec.pila){ var pl=rec.pila; rec.pila=null; rec.clave=pl.clave; rec.pasos=pl.pasos; rec.i=pl.i; if(rec.i>=rec.pasos.length) return cerrarRecorrido(true); return mostrarPaso(1); }
      return cerrarRecorrido(true);
    }
    mostrarPaso(dir);
  }
  function mostrarPaso(dir){
    var p=rec.pasos[rec.i];
    if(!p) return cerrarRecorrido(true);
    if(p.antes) p.antes();
    var rr=rectDe(p.sel);
    if(!rr||!rr.width){
      /* un paso que no se puede mostrar se salta; si es la única forma de seguir, se avisa */
      if(!p.opcional&&!p.espera&&rec.i===0&&(dir>0)){ return cerrarSinMostrar(); }
      if(p.espera&&dir>0){ setTimeout(function(){ if(rec.ov&&rec.pasos[rec.i]===p) mostrarPaso(dir); },900); return; }
      return sigPaso(dir||1);
    }
    rr.el.scrollIntoView({block:"center",behavior:"auto"});
    rr=rectDe(p.sel)||rr;
    var vh0=innerHeight, cabE=document.querySelector(".top"), navE=document.getElementById("botnav");
    var cabB=0; if(cabE){ var cb=cabE.getBoundingClientRect(); if(cb.height) cabB=Math.max(0,cb.bottom); }
    var navT=vh0; if(navE){ var nb=navE.getBoundingClientRect(); if(nb.height&&getComputedStyle(navE).display!=="none") navT=nb.top; }
    var mT=Math.max(22,cabB+14), mB=Math.max(22,vh0-navT+14);   /* lo iluminado queda entero, con aire, sin meterse bajo las barras */
    if(rr.height+mT+mB>=vh0) window.scrollBy(0,rr.top-mT);
    else if(rr.top<mT) window.scrollBy(0,rr.top-mT);
    else if(rr.bottom>vh0-mB) window.scrollBy(0,rr.bottom-(vh0-mB));
    var n=rec.pasos.length, ult=rec.i===n-1;
    rec.hazlo=!!p.hazlo; rec.sel=p.sel;
    rec.ov.setAttribute("data-sel",p.sel);
    rec.card.innerHTML='<div class="tour-n">Paso '+(rec.i+1)+' de '+n+(p.hazlo?' · puede realizarlo usted':'')+'</div><h4>'+esc(p.t)+'</h4><p>'+esc(p.x)+'</p>'+
      '<div class="tour-bt">'+(rec.i>0?'<button type="button" class="tour-b" data-t="ant">Anterior</button>':'')+
      '<button type="button" class="tour-b prim" data-t="sig">'+(ult?"Terminar":"Siguiente")+'</button>'+
      (p.parte&&TOURS[p.parte]?'<button type="button" class="tour-b" data-t="parte">Hacer esta parte</button>':'')+
      '<button type="button" class="tour-b suave" data-t="fin">Salir</button></div>';
    // el cuadro se muestra recién cuando lo iluminado deja de moverse (cambio de
    // sección, tipografías que terminan de cargar): antes aparecía abajo y subía
    if(!rec.vistoUno) rec.ov.classList.add("tour-acomoda"); /* sólo el primer paso aparece quieto; los demás se deslizan de uno a otro */
    rec.vistoUno=true;

      quietos=(k&&k===prev)?quietos+1:0; prev=k;

      requestAnimationFrame(esperar);

  function cerrarSinMostrar(){
    limpiarEspera();
    if(rec.ov){ rec.ov.remove(); rec.ov=null; }
    document.body.classList.remove("en-recorrido");
    document.removeEventListener("keydown",rec.tecla,true); window.removeEventListener("resize",rec.reubicar); window.removeEventListener("scroll",rec.reubicar,true);
    abrir(true);
    var cl=rec.clave;
    if(cl==="resultados"||cl==="bases"||cl==="sugerencias") dice(["Todavía no hay nada para mostrar en esa parte: primero hace falta una búsqueda.","Hagámosla juntos y después vemos esa parte."],[{t:"Sí, hagámosla juntos",f:function(){ iniciarRecorrido("consulta"); }},{t:"Ahora no",suave:true,f:function(){}}]);
    else dice("No pude ubicar esa parte en la pantalla. Pruebe con el recorrido completo.",[{t:"Recorrido completo",f:function(){ iniciarRecorrido("completo"); }}]);

  function ubicar(){
    var r=rec.sel&&rectDe(rec.sel); if(!r||!rec.ov) return;
    var pad=8, m=2, vw=document.documentElement.clientWidth||innerWidth, vh=innerHeight;
    var cw=Math.min(350,vw-24); rec.card.style.width=cw+"px";
    var ch=rec.card.offsetHeight||190;
    /* el marco queda a la misma distancia de lo iluminado por los cuatro lados: si falta lugar de un lado, se achica de todos */
    var pe=Math.max(0,Math.min(pad,r.left-m,r.top-m,vw-m-r.right,vh-m-r.bottom));
    var fL=r.left-pe, fT=r.top-pe, fR=r.right+pe, fB=r.bottom+pe;
    var abajo=Math.min(vh,fB)+14, cabeAbajo=(abajo+ch<=vh-12), cabeArriba=(Math.max(0,fT)-14-ch>=12);
    var top;
    if(cabeAbajo) top=abajo;
    else if(cabeArriba) top=Math.max(12,fT-14-ch);
    else { top=Math.max(12,vh-ch-16); fB=Math.min(fB,top-12); }   /* más alto que lo que queda libre: el marco termina donde empieza el cuadro */
    var L=Math.max(0,fL), T=Math.max(0,fT), R=Math.min(vw,fR), B=Math.min(vh,fB);
    var f=rec.foco.style; f.left=fL+"px"; f.top=fT+"px"; f.width=(fR-fL)+"px"; f.height=Math.max(0,fB-fT)+"px";
    var v=rec.vel; // cuatro paneles alrededor del hueco: sólo bloquean el toque

    v[1].style.cssText="left:0;top:"+B+"px;width:100%;height:"+Math.max(0,vh-B)+"px";
    v[2].style.cssText="left:0;top:"+T+"px;width:"+L+"px;height:"+(B-T)+"px";
    v[3].style.cssText="left:"+R+"px;top:"+T+"px;width:"+Math.max(0,vw-R)+"px;height:"+(B-T)+"px";
    rec.tapa.style.cssText="left:"+L+"px;top:"+T+"px;width:"+(R-L)+"px;height:"+(B-T)+"px;display:"+(rec.hazlo?"none":"block");
    var left=Math.max(12,Math.min(L,vw-cw-12));

  }
  function iniciarRecorrido(clave){
    if(rec.ov) return;

    clave=(typeof clave==="string"&&TOURS[clave])?clave:"completo";
    if(TOURS[clave].requiere&&!TOURS[clave].requiere()){
      abrir(true);
      return dice([clave==="resultados"?"Todavía no hay resultados para mostrar en esa parte.":"Las otras formas de decirlo aparecen cuando escribe un tema, por ejemplo «daño moral».","Hagamos una búsqueda juntos y después vemos esa parte."],

    document.body.appendChild(ov); document.body.classList.add("en-recorrido"); rec.ov=ov; rec.foco=ov.querySelector(".tour-foco"); rec.card=ov.querySelector(".tour-card"); rec.tapa=ov.querySelector(".tour-tapa"); rec.vel=ov.querySelectorAll(".tour-v");

  /* «pidio»: lo que tocó la persona («Tutorial», «Cómo usar»…); queda en la conversación como mensaje suyo, aunque no lo haya escrito */

/* Los dibujos de cada sección: a línea fina, en el mismo trazo que el
   sello de la portada, con un solo punto dorado —el del logo— en el lugar
   que importa de cada uno. Se dibujan solos al entrar a la sección. */
function dibujoSeccion(tab){
  var k=0,h="",i,x,y,a;
  function l(d){ return '<path class="dl" style="--i:'+(k++)+'" pathLength="1" d="'+d+'"/>'; }
  function c(x,y,r){ return '<circle class="dl" style="--i:'+(k++)+'" pathLength="1" cx="'+x+'" cy="'+y+'" r="'+r+'"/>'; }
  function p(x,y,r){ return '<circle class="dd" cx="'+x+'" cy="'+y+'" r="'+(r||4)+'"/>'; }
  /* Todos los dibujos son simétricos respecto del eje vertical (x = 120): lo
     que hay de un lado, hay igual del otro. El único punto dorado, el del
     logo, va sobre el eje. */
  switch(tab){
    case "buscar":   // la consulta sale a las ocho bases, en abanico
      for(i=0;i<8;i++){ a=(-62.5+i*125/7)*Math.PI/180; x=(120+100*Math.sin(a)).toFixed(1); y=(142-100*Math.cos(a)).toFixed(1);
        h+=c(x,y,7)+l("M120 142L"+(120+86*Math.sin(a)).toFixed(1)+" "+(142-86*Math.cos(a)).toFixed(1)); }
      h+=p(120,142,5); break;
    case "comparar": // cinco barras en pirámide
      h+=l("M30 146H210");
      [[48,34],[84,66],[120,100],[156,66],[192,34]].forEach(function(b){ h+=l("M"+b[0]+" 146V"+(146-b[1])); });
      h+=p(120,32,4.5); break;
    case "ramas":    // una voz: un círculo y tres arcos que salen de él
      h+=c(87,80,12)+l("M109.8 54.7A34 34 0 0 1 109.8 105.3")+l("M124.5 38.4A56 56 0 0 1 124.5 121.6")+l("M139.2 22A78 78 0 0 1 139.2 138")+p(87,80,4); break;
    case "requisitos": // la lista de control: tres filas, espejadas
      h+=l("M56 24H184V144H56Z");
      [52,84,116].forEach(function(yy){ h+=c(84,yy,8)+l("M104 "+yy+"H136")+c(156,yy,8); });
      h+=p(120,24,4.5); break;
    case "norma":    // el templo
      h+=l("M64 30H176")+l("M72 40H168")+l("M84 40V128")+l("M102 40V128")+l("M120 40V128")+l("M138 40V128")+l("M156 40V128")+l("M72 128H168")+l("M60 140H180");
      h+=p(120,18,4.5); break;
    case "lector":   // el libro abierto

      h+=p(120,20,4.5); break;

      });

    case "guardados": // fichas apiladas

      h+=p(120,68,4.5); break;

    case "calculos": // el ábaco: tres hileras de tres cuentas, centradas
      h+=l("M44 34H196V138H44Z"); [58,86,114].forEach(function(y){ h+=l("M44 "+y+"H76")+l("M92 "+y+"H112")+l("M128 "+y+"H148")+l("M164 "+y+"H196")+c(84,y,8)+c(120,y,8)+c(156,y,8); }); h+=p(120,20,5); break;
    case "plazos":   // el calendario y el día que vence
      h+=l("M40 34H200V140H40Z")+l("M40 54H200")+l("M76 26V42")+l("M164 26V42");
      for(y=0;y<4;y++) for(x=0;x<7;x++){ if(!(x===3&&y===2)) h+='<circle class="dp" cx="'+(57+x*21)+'" cy="'+(72+y*18)+'" r="1.8"/>'; }
      h+=c(120,108,8)+p(120,108,3.5); break;

      h+=p(170,40,4); break;

  }
  return '<svg class="cab__dibujo" viewBox="0 0 240 160" aria-hidden="true">'+h+'</svg>';

   en el código quedaría viejo sin que nadie lo note. */

/* ---------- números y fechas ---------- */
/* Acepta lo que se escribe en la Argentina: "1.234.567,89", "1500,5",
   "1.500" (mil quinientos) y también "1234567.89". */
function num(v){
  var s=String(v==null?"":v).trim().replace(/[\s$]/g,"");
  if(!s) return NaN;
  if(s.indexOf(",")!==-1) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(/\./g,"");
  var n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function pesos(n){ return isFinite(n)?"$ "+n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"; }
function porc(n,dec){ return isFinite(n)?n.toLocaleString("es-AR",{maximumFractionDigits:dec==null?2:dec})+" %":"—"; }
/* Fechas en UTC: un plazo no puede correrse un día por el horario de verano
   ni por la zona horaria de la computadora. */
function fechaDe(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null; }
function isoDe(d){ return d.toISOString().slice(0,10); }
function masDias(d,n){ return new Date(d.getTime()+n*864e5); }
function diasEntre(a,b){ return Math.round((b-a)/864e5); }
function diasDelMes(a,m){ return new Date(Date.UTC(a,m+1,0)).getUTCDate(); }
function fechaLarga(d){ return d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}); }
function fechaCorta(d){ return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"UTC"}); }
function hoyUTC(){ var h=new Date(); return new Date(Date.UTC(h.getFullYear(),h.getMonth(),h.getDate())); }
/* Suma meses o años "de fecha a fecha" (art. 6 CCyC): si en el mes del
   vencimiento no existe el día equivalente, vence el último día del mes. */
function masMeses(d,meses){
  var a=d.getUTCFullYear(),m=d.getUTCMonth()+meses,dia=d.getUTCDate();
  var aa=a+Math.floor(m/12),mm=((m%12)+12)%12;
  return new Date(Date.UTC(aa,mm,Math.min(dia,diasDelMes(aa,mm))));
}

/* ---------- feriados nacionales (Ley 27.399) ---------- */
/* Domingo de Pascua por el algoritmo de Meeus/Jones/Butcher: de ahí salen
   Carnaval (lunes y martes, 48 y 47 días antes) y el Viernes Santo. */
function pascua(a){
  var b=a%19,c=Math.floor(a/100),d=a%100,e=Math.floor(c/4),f=c%4,g=Math.floor((c+8)/25),h=Math.floor((c-g+1)/3),
      i=(19*b+c-e-h+15)%30,k=Math.floor(d/4),l=d%4,m=(32+2*f+2*k-i-l)%7,n=Math.floor((b+11*i+22*m)/451),
      mes=Math.floor((i+m-7*n+114)/31),dia=((i+m-7*n+114)%31)+1;
  return new Date(Date.UTC(a,mes-1,dia));
}
/* Trasladables (art. 6, Ley 27.399): si caen martes o miércoles pasan al
   lunes anterior; si caen jueves o viernes, al lunes siguiente. */
function trasladar(d){
  var w=d.getUTCDay();
  if(w===2||w===3) return masDias(d,-(w-1));
  if(w===4||w===5) return masDias(d,8-w);
  return d;
}
var FERIADOS_CACHE={};
function feriados(anio,juris){
  var clave=anio+"|"+juris;
  if(FERIADOS_CACHE[clave]) return FERIADOS_CACHE[clave];
  var f={};
  function fijo(m,d,n){ f[isoDe(new Date(Date.UTC(anio,m-1,d)))]=n; }
  fijo(1,1,"Año Nuevo");
  fijo(3,24,"Día Nacional de la Memoria por la Verdad y la Justicia");
  fijo(4,2,"Día del Veterano y de los Caídos en la Guerra de Malvinas");
  fijo(5,1,"Día del Trabajador");
  fijo(5,25,"Día de la Revolución de Mayo");
  fijo(6,20,"Paso a la Inmortalidad del General Manuel Belgrano");
  fijo(7,9,"Día de la Independencia");
  fijo(12,8,"Inmaculada Concepción de María");
  fijo(12,25,"Navidad");
  var p=pascua(anio);
  f[isoDe(masDias(p,-48))]="Carnaval";
  f[isoDe(masDias(p,-47))]="Carnaval";
  f[isoDe(masDias(p,-2))]="Viernes Santo";
  [[6,17,"Paso a la Inmortalidad del General Martín Miguel de Güemes"],
   [8,17,"Paso a la Inmortalidad del General José de San Martín"],
   [10,12,"Día del Respeto a la Diversidad Cultural"],
   [11,20,"Día de la Soberanía Nacional"]].forEach(function(t){
    f[isoDe(trasladar(new Date(Date.UTC(anio,t[0]-1,t[1]))))]=t[2];
  });
  if(juris==="mendoza") fijo(7,25,"Santiago Apóstol, patrono de Mendoza (feriado provincial)");
  FERIADOS_CACHE[clave]=f;
  return f;
}
function inhabilExtra(iso){
  for(var i=0;i<CALC.inhabiles.length;i++){
    var x=CALC.inhabiles[i];
    if(iso>=x.desde&&iso<=(x.hasta||x.desde)) return x.motivo||"Día inhábil";
  }
  return "";
}
/* Por qué un día no es hábil judicial ("" si lo es). */
function motivoInhabil(d,juris){
  var w=d.getUTCDay();
  if(w===0||w===6) return "Fin de semana";
  return feriados(d.getUTCFullYear(),juris)[isoDe(d)]||inhabilExtra(isoDe(d));
}
function siguienteHabil(d,juris){ var x=masDias(d,1); while(motivoInhabil(x,juris)) x=masDias(x,1); return x; }

/* ---------- series oficiales de índices ----------
   CER y UVA: API de Estadísticas del Banco Central (api.bcra.gob.ar, v4.0,
   variables 30 y 31). Antes se pedían a datos.gob.ar, cuya serie de CER
   dejó de actualizarse el 04/10/2024: para cualquier fecha posterior el
   código caía en «el último dato publicado» en las DOS puntas, y una
   actualización del 01/01/2025 al 01/01/2026 daba coeficiente 1 con «CER
   al 04/10/2024» en ambos extremos. IPC: Series de Tiempo de datos.gob.ar.
   RIPTE: la misma API devuelve la serie vacía, así que se usa su archivo
   oficial (infra.datos.gob.ar) a través del servidor, que no tiene la
   restricción de origen del navegador. La regla para elegir el dato de cada
   fecha está en IVSCalculos.elegirDato (calculos.js). */
var SERIES={
  cer:{bcra:30,nombre:"CER",diaria:true,fuente:"API de Estadísticas del Banco Central (variable 30)",
       base:"Coeficiente de Estabilización de Referencia (art. 4 del Decreto 214/2002), que publica el Banco Central."},
  uva:{bcra:31,nombre:"UVA",diaria:true,fuente:"API de Estadísticas del Banco Central (variable 31)",
       base:"Unidad de Valor Adquisitivo (Comunicación «A» 5945 del Banco Central y modificatorias), que se ajusta por CER."},
  ipc:{id:"148.3_INIVELNAL_DICI_M_26",nombre:"IPC",diaria:false,fuente:"Series de Tiempo de datos.gob.ar (serie 148.3_INIVELNAL_DICI_M_26)",
       base:"Índice de Precios al Consumidor nacional del INDEC, nivel general, base diciembre de 2016. Serie mensual."},
  ripte:{id:"158.1_REPTE_0_0_5",respaldo:"ripte",nombre:"RIPTE",diaria:false,fuente:"Secretaría de Trabajo, serie 158.1 de datos.gob.ar",
       base:"Remuneración Imponible Promedio de los Trabajadores Estables (Ley 26.773, arts. 8 y 17, inc. 6, en materia de riesgos del trabajo). Serie mensual."}
};
var API_SERIES="https://apis.datos.gob.ar/series/api/series/";
var API_BCRA="https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/";
function jsonDe(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
/* Las filas [fecha, valor] de la serie alrededor de una fecha, y el último
   dato publicado (para saber si la fecha es posterior). */
function filasSerie(clave,fechaIso){
  var s=SERIES[clave],f=fechaDe(fechaIso);
  if(s.bcra){
    // la API rechaza un «desde» posterior a hoy (400): para fechas futuras
    // alcanza con el último dato publicado, que elegirDato usa avisando
    var desde=isoDe(masDias(f,-15)),hoyIso=isoDe(hoyUTC());
    return Promise.all([
      desde>hoyIso?Promise.resolve(null):jsonDe(API_BCRA+s.bcra+"?desde="+desde+"&hasta="+fechaIso+"&limit=1000"),
      jsonDe(API_BCRA+s.bcra+"?limit=1")
    ]).then(function(v){
      function filas(d){ return ((d&&d.results&&d.results[0]&&d.results[0].detalle)||[]).map(function(x){ return [x.fecha,x.valor]; }); }
      return filas(v[0]).concat(filas(v[1]));
    });
  }
  var ini=isoDe(masMeses(new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth(),1)),-3));
  return Promise.all([
    jsonDe(API_SERIES+"?ids="+s.id+"&start_date="+ini+"&end_date="+fechaIso+"&format=json&limit=1000"),
    jsonDe(API_SERIES+"?ids="+s.id+"&last=1&format=json")
  ]).then(function(v){
    var filas=((v[0]&&v[0].data)||[]).concat((v[1]&&v[1].data)||[]).filter(function(x){ return x[1]!=null; });
    if(filas.length||!s.respaldo) return filas;
    if(!estado.api) throw new Error("La API de datos.gob.ar devuelve vacía la serie "+s.nombre+" y el servidor de la plataforma, que trae el archivo oficial, no está disponible en este momento.");
    // la API de datos.gob.ar devuelve vacía la serie RIPTE: el archivo oficial, vía el servidor
    return jsonDe(estado.api+"/series/"+s.respaldo).then(function(d){ return (d&&d.ok&&d.datos)||[]; });
  });
}
/* El valor de la serie en una fecha, con la fecha del dato realmente usado. */
function valorSerie(clave,fechaIso,esFinal){
  var s=SERIES[clave];
  return filasSerie(clave,fechaIso).then(function(filas){
    var r=IVSCalculos.elegirDato(filas,fechaIso,s.diaria,esFinal);
    if(r.error) throw new Error(r.error);
    return r;
  });
}

/* El resumen fijo de cada cálculo: el resultado grande, el detalle, la

  var nombreTasa={activa:"tasa activa del Banco de la Nación",pasiva:"tasa pasiva promedio del Banco Central",otra:"tasa fijada por el tribunal"}[c.tipo];

    base:"Art. 768 CCyC: a partir de su mora el deudor debe los intereses correspondientes; la tasa se determina por lo que acuerden las partes, por lo que dispongan las leyes especiales y, en subsidio, por las tasas que se fijen según las reglamentaciones del Banco Central. Art. 770 CCyC: no se deben intereses de los intereses, salvo las excepciones que prevé.",
    aLiquidacion:{capital:cap,intereses:total,desde:c.tramos[0].desde,hasta:c.tramos[c.tramos.length-1].hasta},

/* ================= ACTUALIZACIÓN POR ÍNDICES ================= */
function calcActualizacion(){
  var c=CALC.actualizacion,s=SERIES[c.indice],r=c.res;
  if(c.cargando) return {titulo:"Monto actualizado",total:"…",sub:"Consultando la serie oficial de "+s.nombre+"…"};
  if(c.error) return {titulo:"Monto actualizado",total:"—",sub:esc(c.error)};
  if(!r) return null;
  var m=num(c.monto);
  if(!(m>0)) return {titulo:"Monto actualizado",total:"—",sub:"Ingrese un monto mayor que cero."};
  var A=IVSCalculos.actualizar(m,{valor:r.vi},{valor:r.vf});
  if(A.error) return {titulo:"Monto actualizado",total:"—",sub:esc(A.error)};
  var coef=A.coeficiente;

  // la fecha del dato usado, al lado de la pedida, cuando no coinciden
  function rotulo(pedida,usada){ return s.diaria?(pedida===usada?fechaCorta(fechaDe(usada)):fechaCorta(fechaDe(usada))+" (pedido: "+fechaCorta(fechaDe(pedida))+")"):(usada.slice(0,7).split("-").reverse().join("/")+" (mes de "+fechaCorta(fechaDe(pedida))+")"); }
  return {titulo:"Monto actualizado por "+s.nombre,total:pesos(A.monto),

function pedirIndices(){
  var c=CALC.actualizacion;
  var mal=IVSCalculos.validarFechas(fechaDe(c.desde),fechaDe(c.hasta));
  if(mal){ c.res=null; c.error=mal; pintarSalidaC(); flash(mal); return; }
  if(!(num(c.monto)>0)){ c.res=null; c.error="Ingrese un monto mayor que cero."; pintarSalidaC(); return; }
  c.cargando=true;c.error="";c.res=null;pintarSalidaC();
  var clave=c.indice,desde=c.desde,hasta=c.hasta;
  Promise.all([valorSerie(clave,desde,false),valorSerie(clave,hasta,true)]).then(function(v){
    if(CALC.actualizacion.indice!==clave||c.desde!==desde||c.hasta!==hasta) return;
    c.cargando=false;
    c.res={vi:v[0].valor,fi:v[0].fecha,vf:v[1].valor,ff:v[1].fecha,tardio:v[1].tardio,desde:desde,hasta:hasta};
    pintarSalidaC();
  })["catch"](function(e){
    // nunca un dato viejo en silencio: si falla, no hay resultado y se dice por qué
    c.cargando=false;c.res=null;
    c.error=(e&&e.message&&!/^HTTP|Failed to fetch|NetworkError|Load failed/.test(e.message))?e.message:"No se pudo consultar la serie oficial ("+SERIES[clave].fuente+"). Pruebe de nuevo en un momento.";
    pintarSalidaC();
  });
}

/* ================= INDEMNIZACIÓN POR DESPIDO ================= */
function antiguedad(a,b){
  var anios=0; while(masMeses(a,12*(anios+1))<=b) anios++;
  var desdeAniv=masMeses(a,12*anios),meses=0; while(masMeses(desdeAniv,meses+1)<=b) meses++;
  return {anios:anios,meses:meses,masDeTres:masMeses(desdeAniv,3)<b};
}
function diasVacaciones(anios){ return anios<5?14:anios<10?21:anios<20?28:35; }
function calcDespido(){
  var c=CALC.despido,s=num(c.sueldo),a=fechaDe(c.ingreso),b=fechaDe(c.egreso);
  if(String(c.sueldo||"").trim()===""||!c.ingreso||!c.egreso) return null;
  // Antigüedad, art. 245, preaviso e integración: IVSCalculos.despidoComponentes
  // (calculos.js), probado en backend/test/calculos.prueba.js.
  var tope=num(c.tope);
  var K=IVSCalculos.despidoComponentes(s,a,b,{tope:tope,sinPreaviso:c.sinPreaviso,integracion:c.integracion,prueba:c.prueba,sacRubros:c.sacRubros});
  if(K.error) return {titulo:"Liquidación final por despido sin causa",total:"—",sub:esc(K.error)};
  var ant=K.antiguedad,computables=K.computables,base=K.base,notaTope="";
  if(base!==s) notaTope="La remuneración supera el tope del convenio: la base es "+pesos(base)+(base>tope?" (el 67 % de la remuneración, según la doctrina de la Corte en «Vizzoti», 2004)":" (el tope)")+".";
  var dm=K.diasDelMes,dia=K.diasTrabajados;
  var rubros=[];
  function rubro(n,ley,v){ if(v>0) rubros.push([n,ley,v]); }
  rubro("Indemnización por antigüedad ("+computables+(computables===1?" año":" años")+")","art. 245 LCT",K.indemnizacion);
  // Art. 231: un mes si la antigüedad no excede de cinco años; dos meses si
  // es superior (cinco años justos todavía es un mes). Art. 233: la
  // integración no procede durante el período de prueba.
  if(K.preaviso) rubro("Preaviso omitido ("+(c.prueba?"15 días, período de prueba":(K.mesesPreaviso===2?"2 meses":"1 mes"))+")","arts. 231 y 232 LCT",K.preaviso);
  if(K.sacPreaviso) rubro("SAC sobre el preaviso","art. 121 LCT",K.sacPreaviso);
  if(K.integracion) rubro("Integración del mes de despido ("+K.diasIntegracion+" días)","art. 233 LCT",K.integracion);
  if(K.sacIntegracion) rubro("SAC sobre la integración","art. 121 LCT",K.sacIntegracion);
  rubro("Remuneración de los días trabajados del mes ("+dia+")","art. 103 LCT",s/dm*dia);
  var ini=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?0:6,1));
  if(ini<a) ini=a;
  var finSem=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?5:11,b.getUTCMonth()<6?30:31));
  var diasSem=diasEntre(new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?0:6,1)),finSem)+1;
  rubro("SAC proporcional del semestre","art. 123 LCT",s/2*(diasEntre(ini,b)+1)/diasSem);
  var iniAnio=new Date(Date.UTC(b.getUTCFullYear(),0,1)); if(iniAnio<a) iniAnio=a;
  var vacDias=diasVacaciones(antiguedad(a,new Date(Date.UTC(b.getUTCFullYear(),11,31))).anios)*(diasEntre(iniAnio,b)+1)/365;
  var vac=s/25*vacDias;
  rubro("Vacaciones no gozadas proporcionales ("+vacDias.toLocaleString("es-AR",{maximumFractionDigits:1})+" días)","arts. 150, 155 y 156 LCT",vac);
  if(c.sacRubros) rubro("SAC sobre las vacaciones","art. 121 LCT",vac/12);
  var total=rubros.reduce(function(x,r){return x+r[2];},0);
  var avisos=[];
  if(notaTope) avisos.push(notaTope);
  avisos.push("Según la reforma de la Ley 27.742 (2024), la base del art. 245 no incluye el SAC ni los conceptos de pago no mensual, y quedaron derogadas las multas de los arts. 8, 9, 10 y 15 de la Ley 24.013 y de los arts. 1 y 2 de la Ley 25.323: no se incluyen. Tampoco se calculan la indemnización del art. 80 LCT ni los agravamientos de otros regímenes. Verifique la norma vigente y el convenio aplicable.");
  return {titulo:"Liquidación final por despido sin causa",total:pesos(total),
    sub:"Antigüedad: "+ant.anios+(ant.anios===1?" año":" años")+(ant.meses?" y "+ant.meses+(ant.meses===1?" mes":" meses"):"")+" · "+computables+" computables",
    filas:rubros.map(function(r){ return [esc(r[0])+' <span class="calc-ley">'+r[1]+'</span>',pesos(r[2])]; }),
    avisos:avisos,
    base:"Ley de Contrato de Trabajo 20.744: art. 245 (antigüedad: un mes de la mejor remuneración mensual, normal y habitual del último año por cada año o fracción mayor de tres meses), arts. 231 a 233 (preaviso e integración), arts. 121 a 123 (sueldo anual complementario), arts. 150 y 156 (vacaciones).",
    texto:rubros.map(function(r){return r[0]+" ("+r[1]+"): "+pesos(r[2]);}).join("\n")+"\nTotal: "+pesos(total)};
}

/* Ley 27.423, art. 21: escala por cuantía en UMA, con la regla de
   correlación del último párrafo (el honorario no puede ser inferior al
   máximo del grado anterior más la alícuota del grado sobre el excedente).
   El cálculo vive en calculos.js (IVSCalculos.honorariosNacion), con sus
   pruebas en backend/test/calculos.prueba.js. */
function calcHonorarios(){
  var c=CALC.honorarios,m=num(c.monto);
  if(String(c.monto||"").trim()==="") return null;
  if(!(m>0)) return {titulo:"Honorarios",total:"—",sub:"El monto del proceso tiene que ser un número mayor que cero."};
  var filas=[],min,max,avisos=[],base;
  if(c.juris==="nacion"){
    var h=IVSCalculos.honorariosNacion(m,num(c.uma));
    if(h.error) return {titulo:"Honorarios",total:"—",sub:esc(h.error)};
    var uU=function(x){ return x.toLocaleString("es-AR",{maximumFractionDigits:5}); };
    min=h.min;max=h.max;
    filas.push(["Monto del proceso",pesos(m)+" · "+uU(h.enUma)+" UMA"]);
    filas.push(["Tramo de la escala",(h.limiteSuperior===Infinity?"más de 750 UMA":(h.limiteInferior?"más de "+h.limiteInferior+" y hasta ":"hasta ")+h.limiteSuperior+" UMA")+" · del "+h.pMin+" % al "+h.pMax+" %"]);
    filas.push(["Porcentaje sobre todo el monto",pesos(h.directoMin)+" a "+pesos(h.directoMax)]);
    if(h.piso){
      filas.push(["Umbral del grado anterior ("+h.piso.umbralUma+" UMA)",pesos(h.piso.umbral)]);
      filas.push(["Máximo del grado anterior ("+h.piso.pMaxAnterior+" % de "+h.piso.umbralUma+" UMA)",pesos(h.piso.maxAnterior)]);
      filas.push(["Excedente sobre el umbral",pesos(h.piso.excedente)]);
      filas.push(["Piso del art. 21 (máximo anterior + "+h.pMin+" % / "+h.pMax+" % del excedente)",pesos(h.piso.pisoMin)+" a "+pesos(h.piso.pisoMax)]);
      if(h.aplicaPiso) avisos.push("Rige el piso del último párrafo del art. 21: el porcentaje del tramo sobre todo el monto ("+pesos(h.directoMin)+") queda por debajo del máximo del grado anterior más el excedente.");
      if(h.alternativa) avisos.push("Punto pendiente de verificación jurídica: otra lectura del último párrafo del art. 21 toma como «máximo del grado inmediato anterior» el honorario máximo que resulta de aplicar la misma regla en ese grado (escala acumulativa). Con esa lectura el rango sería de "+pesos(h.alternativa.min)+" a "+pesos(h.alternativa.max)+". Verifique el criterio del tribunal.");
    }
    base="Ley 27.423 de honorarios profesionales (Nación), art. 21: escala por cuantía en UMA y, en su último párrafo, «en ningún caso los honorarios podrán ser inferiores al máximo del grado inmediato anterior de la escala, con más el incremento por aplicación al excedente de la alícuota que corresponde al grado siguiente». Los mínimos por tipo de proceso (art. 58), el litisconsorcio, la instancia y el resultado no se calculan acá. Tasa de justicia: Ley 23.898, art. 2.";
  }else{
    // Ley 9131 de Mendoza, art. 2: escala por tramos del monto del proceso
    // expresado en JUS. Se aplica por tramos acumulativos: cada porcentaje
    // alcanza solo a la porción del monto que cae en su tramo.
    var jus=num(c.jus);
    if(!(jus>0)) return {titulo:"Honorarios",total:"—",sub:"Cargue el valor vigente del JUS (mayor que cero): lo fija la Suprema Corte de Mendoza por acordada y la ley no lo contiene."};
    var enJus=m/jus,TR=[[0,20,20],[20,50,16],[50,Infinity,12]],bruto=0;
    TR.forEach(function(t){
      var porcion=Math.max(0,Math.min(enJus,t[1])-t[0]);
      if(porcion>0){
        var v=porcion*jus*t[2]/100; bruto+=v;
        filas.push(["Tramo "+(t[1]===Infinity?"más de "+t[0]:(t[0]?"más de "+t[0]+" a ":"hasta ")+t[1])+" JUS · "+t[2]+" %",
          porcion.toLocaleString("es-AR",{maximumFractionDigits:2})+" JUS · "+pesos(v)]);
      }
    });
    var mer=num(c.merito)||0,f=bruto;
    if(mer>0){ f=f*(1+Math.min(mer,30)/100); filas.push(["Aumento por mérito de la labor (art. 2, hasta 30 %)","+"+porc(Math.min(mer,30))]); }
    if(c.rol==="perdedor"){ f=f*.7; filas.push(["Abogado de la parte perdedora (art. 3)","70 % de lo que corresponde al de la ganadora"]); }
    if(c.proceso==="monitorio"){ f=f*.75; filas.push(["Proceso monitorio sin oposición (art. 7)","reducción del 25 %"]); }
    if(c.proceso==="sucesion"){ f=f*.7; filas.push(["Sucesión (art. 8)","reducción del 30 %"]); }
    if(c.procurador){ f=f*.5; filas.push(["Procurador, primera instancia (art. 31)","50 % del honorario del abogado"]); }
    min=f;max=f;
    filas.unshift(["Monto del proceso",pesos(m)+" · "+enJus.toLocaleString("es-AR",{maximumFractionDigits:2})+" JUS"]);
    base="Ley 9131 de Mendoza (aranceles de abogados y procuradores): art. 2 (escala: hasta 20 JUS, 20 %; más de 20 y hasta 50 JUS, 16 %; más de 50 JUS, 12 %; aumento de hasta 30 % por mérito), art. 3 (parte perdedora, 70 %), art. 7 (monitorio sin oposición, reducción del 25 %), art. 8 (sucesiones, reducción del 30 %) y art. 31 (procurador, 50 % en primera instancia y 30 % en las demás). El valor del JUS lo fija la Suprema Corte. Los mínimos por tipo de proceso (arts. 9 a 19), los honorarios de segunda instancia (art. 15) y los incidentes (art. 14) no se calculan acá.";
    avisos.push("La escala se aplica por tramos acumulativos; verifique ese criterio con la regulación del juzgado.");
  }
  // El IVA va sólo sobre los honorarios, nunca sobre el monto del proceso ni sobre la tasa de justicia.
  if(min===max) filas.push(["Honorarios",pesos(min)+(c.iva?" + IVA "+pesos(IVSCalculos.iva(min,true)):"")]);
  else{
    filas.push(["Honorarios mínimos",pesos(min)+(c.iva?" + IVA "+pesos(IVSCalculos.iva(min,true)):"")]);
    filas.push(["Honorarios máximos",pesos(max)+(c.iva?" + IVA "+pesos(IVSCalculos.iva(max,true)):"")]);
  }
  var tp=num(c.tasaPct);
  if(tp>0) filas.push(["Tasa de justicia ("+porc(tp)+", sin IVA)",pesos(IVSCalculos.tasaDeJusticia(m,tp))]);
  avisos.push("El monto definitivo lo regula el juez dentro de la escala, según la labor, el resultado y la complejidad.");
  return {titulo:"Honorarios según la escala",total:(min===max?pesos(min):pesos(min)+" a "+pesos(max)),sub:c.iva?"Más IVA (21 %) por ser responsable inscripto":"",
    filas:filas,avisos:avisos,base:base,aLiquidacion:{honorarios:max,iva:c.iva,tasa:tp>0?m*tp/100:0},
    texto:filas.map(function(f){return f[0]+": "+f[1];}).join("\n")};
}

/* ================= LIQUIDACIÓN DE SENTENCIA ================= */
function calcLiquidacion(){
  var c=CALC.liquidacion,cap=num(c.capital);
  if(String(c.capital||"").trim()==="") return null;
  var vacio=function(v){ return String(v||"").trim()===""?0:num(v); };
  var L=IVSCalculos.liquidacion({capital:cap,intereses:vacio(c.intereses),honorarios:vacio(c.honorarios),tasa:vacio(c.tasa),otros:vacio(c.otros),iva:c.iva});
  if(L.error) return {titulo:"Planilla de liquidación",total:"—",sub:esc(L.error)};
  var it=L.intereses,h=L.honorarios,iva=L.iva,t=L.tasa,o=L.otros;
  var d=fechaDe(c.desde),hh=fechaDe(c.hasta);
  var filas=[["Capital",pesos(cap)]];
  if(it) filas.push(["Intereses"+(d&&hh?" (del "+fechaCorta(d)+" al "+fechaCorta(hh)+")":""),pesos(it)]);
  filas.push(["Subtotal",pesos(cap+it)]);
  if(h) filas.push(["Honorarios",pesos(h)]);
  if(iva) filas.push(["IVA sobre honorarios (21 %)",pesos(iva)]);
  if(t) filas.push(["Tasa de justicia",pesos(t)]);
  if(o) filas.push(["Otros rubros",pesos(o)]);
  var total=L.total;
  var ancho=46;
  var texto="PLANILLA DE LIQUIDACIÓN\n\n"+filas.map(function(f){
    var a=f[0]+" ",b=" "+f[1];return a+new Array(Math.max(2,ancho-a.length-b.length)).join(".")+b;
  }).join("\n")+"\n"+"TOTAL "+new Array(Math.max(2,ancho-7-pesos(total).length)).join(".")+" "+pesos(total);
  return {titulo:"Planilla de liquidación",total:pesos(total),filas:filas,
    avisos:["Revise la planilla contra la sentencia: los rubros, las fechas de mora y la tasa los fija la resolución que se ejecuta."],
    texto:texto};
}
function formLiquidacion(){
  var c=CALC.liquidacion;
  return campoC("Capital de condena","liquidacion.capital",c.capital,{num:true})+
    '<div class="fila">'+campoC("Intereses","liquidacion.intereses",c.intereses,{num:true})+
      campoC("Desde","liquidacion.desde",c.desde,{tipo:"date"})+campoC("Hasta","liquidacion.hasta",c.hasta,{tipo:"date"})+'</div>'+
    '<div class="fila">'+campoC("Honorarios","liquidacion.honorarios",c.honorarios,{num:true})+
      campoC("Tasa de justicia","liquidacion.tasa",c.tasa,{num:true})+campoC("Otros rubros","liquidacion.otros",c.otros,{num:true})+'</div>'+
    '<div class="calc-tildes">'+tildeC("liquidacion.iva",c.iva,"Agregar el IVA (21 %) sobre los honorarios")+'</div>'+
    '<p class="calc-nota">Los importes de Intereses y de Honorarios pueden traerse con «Llevar a la liquidación» desde esos cálculos.</p>';
}

var JURIS=[["nacion","Nación"],["caba","Ciudad de Buenos Aires"],["mendoza","Mendoza"]];
function calcProcesales(){
  var c=CALC.procesales,n=parseInt(c.dias,10),d=fechaDe(c.notif);
  if(!d||!(n>0)) return null;
  var vence,saltados=[];
  if(c.tipo==="habiles"){
    var x=d,cont=0;
    while(cont<n){ x=masDias(x,1); var mot=motivoInhabil(x,c.juris); if(mot){ if(mot!=="Fin de semana") saltados.push([x,mot]); continue; } cont++; }
    vence=x;
  }else vence=masDias(d,n);
  var gracia=siguienteHabil(vence,c.juris);
  var filas=[["Notificación",fechaLarga(d)],
    ["Plazo",n+(c.tipo==="habiles"?" días hábiles judiciales":" días corridos")+" · desde el día siguiente"],
    ["Plazo de gracia","hasta las dos primeras horas del despacho del "+fechaLarga(gracia)]];
  saltados.forEach(function(s){ filas.push(["No se computa · "+fechaCorta(s[0]),esc(s[1])]); });
  var avisos=[];
  if(c.tipo==="corridos"&&motivoInhabil(vence,c.juris)) avisos.push("El vencimiento cae en un día inhábil: verifique si la norma del plazo lo traslada al día hábil siguiente.");
  avisos.push("Se descuentan los fines de semana, los feriados nacionales"+(c.juris==="mendoza"?" y provinciales":"")+" y los días inhábiles cargados en el calendario (ferias y asuetos). Los días no laborables con fines turísticos y las ferias se fijan cada año por decreto y por acordada: cárguelos si corresponden.");
  return {titulo:"Vencimiento del plazo",total:fechaLarga(vence),
    sub:"Con plazo de gracia: "+fechaLarga(gracia)+", dos primeras horas",
    filas:filas,avisos:avisos,
    base:"El plazo comienza a correr desde el día siguiente al de la notificación y se computan solo los días hábiles judiciales (art. 156 CPCCN y normas procesales locales equivalentes). El escrito puede presentarse válidamente dentro de las dos primeras horas del despacho del día hábil siguiente al del vencimiento (art. 124 CPCCN).",
    texto:"Notificación: "+fechaCorta(d)+"\nPlazo: "+n+(c.tipo==="habiles"?" días hábiles":" días corridos")+"\nVence: "+fechaLarga(vence)+"\nPlazo de gracia: dos primeras horas del "+fechaLarga(gracia)};
}
function formProcesales(){
  var c=CALC.procesales;
  return '<div class="fila">'+campoC("Fecha de notificación","procesales.notif",c.notif,{tipo:"date"})+
      campoC("Plazo (días)","procesales.dias",c.dias,{ph:"5",num:true})+'</div>'+
    '<fieldset class="grupo" style="border:0;padding:0;margin:0"><legend class="busq-rotulo">Cómo se cuenta</legend>'+
      chipsC("procesales.tipo",c.tipo,[["habiles","Días hábiles judiciales"],["corridos","Días corridos"]])+'</fieldset>'+
    '<fieldset class="grupo" style="border:0;padding:0;margin:0"><legend class="busq-rotulo">Jurisdicción</legend>'+
      chipsC("procesales.juris",c.juris,JURIS)+'</fieldset>';
}

function vistaCalendario(){
  var c=CALC.cal,h=hoyUTC();
  if(!c.anio){ c.anio=h.getUTCFullYear(); c.mes=h.getUTCMonth(); }
  var primero=new Date(Date.UTC(c.anio,c.mes,1)),dm=diasDelMes(c.anio,c.mes),lunes=(primero.getUTCDay()+6)%7;
  var celdas="",lista=[];
  for(var i=0;i<lunes;i++) celdas+='<span class="cal-dia vacio"></span>';
  for(var d=1;d<=dm;d++){
    var f=new Date(Date.UTC(c.anio,c.mes,d)),mot=motivoInhabil(f,c.juris),fer=feriados(c.anio,c.juris)[isoDe(f)],ext=inhabilExtra(isoDe(f));

  }
  function estadoDe(x){ var m=motivoInhabil(x,c.juris); return fechaLarga(x)+": "+(m?"inhábil ("+m.toLowerCase()+")":"día hábil judicial"); }

    '<div class="cal-hoy"><p><span class="rf-srv'+(motivoInhabil(h,c.juris)?'':' ok')+'"></span>Hoy, '+estadoDe(h)+'.</p>'+
      '<p class="calc-nota" style="margin:6px 0 0">Mañana, '+estadoDe(masDias(h,1))+'.</p></div>'+
    '<div class="cal-cab"><button class="mini" data-act="cal-mes" data-d="-1" aria-label="Mes anterior">‹</button>'+
      '<h3>'+MESES_N[c.mes]+' de '+c.anio+'</h3><button class="mini" data-act="cal-mes" data-d="1" aria-label="Mes siguiente">›</button>'+
      '<div class="cal-juris">'+chipsC("cal.juris",c.juris,JURIS)+'</div></div>'+
    '<div class="cal-grilla"><span class="cal-sem">lu</span><span class="cal-sem">ma</span><span class="cal-sem">mi</span><span class="cal-sem">ju</span><span class="cal-sem">vi</span><span class="cal-sem">sá</span><span class="cal-sem">do</span>'+celdas+'</div>'+
    '<div class="cal-lista">'+(lista.length?lista.map(function(x){

    '<div class="cal-extra"><h3>Ferias y días inhábiles</h3>'+
      '<p class="calc-nota">Las ferias judiciales y los asuetos los fija cada tribunal por acordada. Cárguelos según la de su jurisdicción: se descuentan de los plazos procesales.</p>'+
      (CALC.inhabiles.length?'<div class="cal-cargados">'+CALC.inhabiles.map(function(x,i){
        return '<p>'+fechaCorta(fechaDe(x.desde))+(x.hasta&&x.hasta!==x.desde?" al "+fechaCorta(fechaDe(x.hasta)):"")+' · '+esc(x.motivo||"Día inhábil")+
          ' <button class="mini" data-act="inhabil-menos" data-i="'+i+'">Quitar</button></p>'; }).join("")+'</div>':'')+
      '<div class="fila">'+campoC("Desde","nuevoInhabil.desde",CALC.nuevoInhabil.desde,{tipo:"date"})+campoC("Hasta","nuevoInhabil.hasta",CALC.nuevoInhabil.hasta,{tipo:"date"})+

/* Un documento de Word armado como HTML con los espacios de nombres de
   Office: Word lo abre como propio y se puede guardar como .docx. No hace
   falta ninguna biblioteca ni el servidor. */
function descargarWord(nombre,titulo,cuerpo){
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>'+esc(titulo)+'</title>'+
    '<style>body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5}h1{font-size:15pt;margin:0 0 4pt}'+
    'p.meta{font-size:9.5pt;color:#555;margin:0 0 14pt}p{margin:0 0 6pt}p.cita{font-size:10.5pt;color:#333}'+
    'blockquote{margin:0 0 6pt 18pt}hr{border:0;border-top:1px solid #aaa;margin:12pt 0}</style></head><body>'+
    '<h1>'+esc(titulo)+'</h1><p class="meta">IVS CODEX · exportado el '+esc(hoy())+'</p>'+cuerpo+'</body></html>';
  var blob=new Blob(["﻿",html],{type:"application/msword"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function parrafosWord(texto){
  return String(texto||"").split("\n").map(function(l){
    l=l.trim(); if(!l) return "";
    return /^«/.test(l)?'<blockquote><p>'+esc(l)+'</p></blockquote>':'<p class="cita">'+esc(l)+'</p>';
  }).join("");
}

/**
 * Estira el listado de ramas de la izquierda (.rail-list, "Buscar rama...")
 * para que termine justo a la altura de lo que hay al lado, en vez de un
 * porcentaje fijo de la pantalla (62vh) que no tiene ninguna relación con
 * ese contenido: según la ventana, el listado quedaba cortado bastante antes
 * de la línea de abajo del panel, o se pasaba de largo — un desalineado que
 * se notaba apenas se miraba la barra de scroll dorada al lado del recuadro.
 *
 * Se mide en JS y no con CSS porque son dos cajas SIN relación de padres e
 * hijos (una está en #rail, la otra en #vista): CSS Grid puede igualar la
 * altura de las dos COLUMNAS enteras, pero no la de un elemento cualquiera
 * de una columna contra un elemento cualquiera de la otra.
 *
 * Solo dos solapas, no las cuatro que muestran este listado (ver sinRail
 * más arriba):
 *
 *   - Buscar: se mide contra #panel-buscar-form, el único panel de la
 *     solapa.
 *   - Guardados: se mide contra el último ".blk" de #vista (son siempre
 *     tres, en el mismo orden — pasajes, fuentes, historial —, así que "el
 *     último" es siempre "Búsquedas de esta sesión"). Mismo problema que en
 *     Buscar: con poco guardado, el listado de ramas se pasaba de largo por
 *     debajo de esas tres cajas.
 *   - Ramas y Fuentes quedan AFUERA a propósito, no por descuido: ahí no hay
 *     un panel acotado con el que alinearse, es una lista larga de verdad
 *     (28 ramas, 106 fuentes) que va a seguir siendo más alta que la
 *     pantalla sea cual sea su ancho. Estirar el listado para que "llegue
 *     hasta el final" ahí lo volvería una columna gigantesca y le sacaría
 *     la gracia a que quede fijo arriba mientras se recorre la lista larga:
 *     el 62vh en esas dos no es el mismo error, es lo que mantiene el
 *     filtro usable.
 *
 * Y solo tiene sentido en el layout de dos columnas: pasados los 860px de
 * ancho (media query de acá arriba) el listado de ramas se acuesta en una
 * fila horizontal arriba del contenido, sin "línea de abajo" con la que
 * alinearse.
 */
function ajustarAlturaRail(){
  var lista=document.getElementById("listaRamas");
  if(!lista) return;

  var objetivo=null;
  if(estado.tab==="buscar"){
    objetivo=document.getElementById("panel-buscar-form");
  }else if(estado.tab==="guardados"){
    var bloques=document.querySelectorAll("#vista > .blk");
    objetivo=bloques[bloques.length-1]||null;
  }

  if(!objetivo||window.innerWidth<=860){
    lista.style.maxHeight=""; // vuelve al 62vh fijo de la hoja de estilos
    return;
  }
  var alto=objetivo.getBoundingClientRect().bottom-lista.getBoundingClientRect().top;
  lista.style.maxHeight=Math.max(120,Math.round(alto))+"px";
}

window.addEventListener("resize",ajustarAlturaRail);

/**
 * Evita que tocar el TEXTO de una etiqueta ("Excluir palabras", "Tipo de
 * cita", "De dónde lo sacaste (opcional, va en la cita)"...) le mande el
 * cursor al campo de al lado, como si se hubiera tocado el recuadro.
 *
 * Cada <label class="campo"> envuelve junto el texto descriptivo y su
 * input/select —así el lector de pantalla asocia uno con otro, y clickear
 * el input funciona como siempre—, pero eso es justo lo que hace que el
 * navegador reenvíe un click en CUALQUIER otra parte del label —el texto de
 * arriba, el espacio entre el texto y el campo— como si hubiera sido un
 * click directo en el input: aparece el cursor titilando ahí, sin haber
 * tocado el recuadro. Con una etiqueta larga como la de "De dónde lo
 * sacaste" ese "cualquier otra parte" es casi toda el área visible del
 * campo — de ahí que pasara con cualquier texto que se tocara.
 *
 * preventDefault() en el click, cuando lo que se tocó es el <span> del
 * texto (no el propio input/select), corta ESE reenvío puntual sin romper
 * la asociación: el campo se sigue enfocando al clickearlo directamente, y
 * un lector de pantalla lo sigue anunciando con su nombre.
 */
document.addEventListener("click",function(ev){
  var etiqueta=ev.target.closest&&ev.target.closest(".campo>span");
  if(etiqueta) ev.preventDefault();
});

    if(sel) estado.norma.clave=sel.value;
    if(inp) estado.norma.art=inp.value.trim();
    // Se acepta escrito como se escribe de verdad ("art 1741 CCyC", "artículo
    // 70 del código civil y comercial", "LCT 245"): el parser saca el número

    if(!ref.art){ flash("No se encontró un número de artículo en lo escrito"); return; }
    estado.norma.num=ref.art;
    if(!estado.api){ flash("Para traer el texto oficial hace falta el servidor"); return; }
    estado.norma.cargando=true; estado.norma.error=null; estado.norma.salida=null; render();

      .then(function(r){ return r.json(); })
      .then(function(d){
        estado.norma.cargando=false;
        if(d&&d.ok){ estado.norma.salida=d; }
        else{ estado.norma.error=(d&&d.mensaje)||"El servidor no devolvió el artículo."; }

    var cuerpoL=[ficha||car2||cita2, sel?('«'+sel.slice(0,600)+'»'):"", (ficha||car2)&&cita2?cita2:""].filter(Boolean).join("\n");

/* Archivo elegido en el Lector: se manda tal cual al servidor, que decide
   como leerlo por la firma de los bytes (PDF o .doc), no por la extensión.
   El archivo no se guarda en ningún lado: se lee y vuelve como texto. */
document.addEventListener("change",function(ev){
  if(ev.target&&ev.target.id==="norma-clave"){ estado.norma.clave=ev.target.value; return; }
  if(!ev.target||ev.target.id!=="doc-archivo") return;
  var arch=ev.target.files&&ev.target.files[0];
  if(!arch) return;
  ev.target.value=""; // permite volver a elegir el mismo archivo
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }

  estado.cargando=true; estado.errorLink=null; render();
  fetch(estado.api+"/extraer-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if(!d||!d.ok){
        // Si es un escaneo, se guarda el propio archivo (un File es
        // inmutable, no hace falta releerlo) para poder ofrecer "Aplicar
        // OCR" sin pedir que lo vuelva a elegir — ver avisoErrorLector().
        estado.errorLink={mensaje:(d&&d.mensaje)||"No se pudo leer el archivo.",
          ayuda:(d&&d.codigo)==="PDF_ESCANEADO"
            ?"Es una foto del papel, sin texto adentro. Toque «Aplicar OCR» aquí abajo."
            :"Se leen PDF y .doc de Word. Si es otro formato, ábralo y pegue el texto a mano.",
          codigo:d&&d.codigo,archivo:(d&&d.codigo)==="PDF_ESCANEADO"?arch:null};
        render(); return;
      }
      estado.texto=d.texto;
      estado.fuenteDe=""; // no hay enlace: el origen es un archivo propio
      estado.infoDoc=d;
      estado.fichaConocida=null;
      estado.marca=0;
      render(); window.scrollTo(0,0);
      flash(arch.name+" · "+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Si el archivo es muy grande puede haberse pasado del límite."};
      render();
    });
},false);

/* ============================================================
   9. Arranque
   ============================================================ */
/* Los separadores "·" del texto, a la mitad de la altura de las palabras.
   Recorre los textos de la página y, cada vez que aparece algo nuevo (todo
   se redibuja con innerHTML), envuelve cada "·" en <span class="pm">. El
   texto no cambia: copiar o buscar sigue viendo el mismo carácter. */
(function(){
  var SALTAR={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1,NOSCRIPT:1};
  function envolver(raiz){
    if(!raiz||raiz.nodeType===8) return;
    if(raiz.nodeType===3){ partir(raiz); return; }
    if(raiz.nodeType!==1||SALTAR[raiz.tagName]||(raiz.classList&&raiz.classList.contains("pm"))) return;
    var w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(n.nodeValue.indexOf("\u00b7")===-1) return NodeFilter.FILTER_REJECT;
      var p=n.parentNode;
      return (p&&(SALTAR[p.tagName]||(p.classList&&p.classList.contains("pm"))))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
    }}),lista=[],n;
    while((n=w.nextNode())) lista.push(n);
    lista.forEach(partir);
  }
  function partir(n){
    var p=n.parentNode;
    if(!p||n.nodeValue.indexOf("\u00b7")===-1||SALTAR[p.tagName]||(p.classList&&p.classList.contains("pm"))) return;
    var trozos=n.nodeValue.split("\u00b7"),f=document.createDocumentFragment();
    trozos.forEach(function(t,i){
      if(i){ var s=document.createElement("span"); s.className="pm"; s.textContent="\u00b7"; f.appendChild(s); }
      if(t) f.appendChild(document.createTextNode(t));
    });
    p.replaceChild(f,n);
  }
  envolver(document.body);
  new MutationObserver(function(ms){
    ms.forEach(function(m){ for(var i=0;i<m.addedNodes.length;i++) envolver(m.addedNodes[i]); });
  }).observe(document.body,{childList:true,subtree:true});
})();

<script>
/* Las listas de elegir (Provincia, Acción…) se abren como un desplegable del sitio, con su animación, en vez de la lista del sistema. */
(function(){
  var CHEV='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function esc2(t){ return String(t).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function cerrarTodas(salvo){ [].forEach.call(document.querySelectorAll(".sel-ui.abre"),function(w){ if(w!==salvo){ w.classList.remove("abre"); var b=w.querySelector(".sel-btn"); if(b) b.setAttribute("aria-expanded","false"); } }); }
  function mejorar(sel){
    if(sel._ui||sel.multiple||sel.size>1||sel.closest(".sel-ui")) return; sel._ui=1;
    var w=document.createElement("div"); w.className="sel-ui";
    var b=document.createElement("button"); b.type="button"; b.className="sel-btn"; b.setAttribute("aria-haspopup","listbox"); b.setAttribute("aria-expanded","false");
    var l=document.createElement("div"); l.className="sel-lista"; l.setAttribute("role","listbox");
    sel.parentNode.insertBefore(w,sel); w.appendChild(b); w.appendChild(l); w.appendChild(sel);
    sel.classList.add("sel-nativo"); sel.tabIndex=-1; sel.setAttribute("aria-hidden","true");
    function pintar(){
      var o=sel.options[sel.selectedIndex];
      b.innerHTML="<span>"+esc2(o?o.textContent:"")+"</span>"+CHEV;
      l.innerHTML=[].map.call(sel.options,function(op,i){ return '<button type="button" role="option" data-i="'+i+'" aria-selected="'+(i===sel.selectedIndex)+'">'+esc2(op.textContent)+"</button>"; }).join("");
    }
    pintar();
    b.addEventListener("click",function(e){
      e.preventDefault(); var abre=!w.classList.contains("abre"); cerrarTodas(abre?w:null);
      w.classList.toggle("abre",abre); b.setAttribute("aria-expanded",String(abre));
      if(abre){ pintar(); var s0=l.querySelector('[aria-selected="true"]'); if(s0) l.scrollTop=Math.max(0,s0.offsetTop-l.clientHeight/2+s0.offsetHeight/2); }
    });
    l.addEventListener("click",function(e){
      var o=e.target.closest&&e.target.closest("[data-i]"); if(!o) return;
      sel.selectedIndex=+o.getAttribute("data-i"); w.classList.remove("abre"); b.setAttribute("aria-expanded","false"); pintar();
      sel.dispatchEvent(new Event("input",{bubbles:true})); sel.dispatchEvent(new Event("change",{bubbles:true}));
    });
    w.addEventListener("keydown",function(e){
      if(e.key==="Escape"&&w.classList.contains("abre")){ w.classList.remove("abre"); b.setAttribute("aria-expanded","false"); b.focus(); e.stopPropagation(); }
      else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&w.classList.contains("abre")){ e.preventDefault(); var it=[].slice.call(l.querySelectorAll("button")),i=it.indexOf(document.activeElement); i=e.key==="ArrowDown"?Math.min(it.length-1,i+1):Math.max(0,i<0?0:i-1); it[i].focus(); }
    });
  }
  document.addEventListener("click",function(e){ if(!(e.target.closest&&e.target.closest(".sel-ui"))) cerrarTodas(null); });
  var pend=false;
  function barrer(){ pend=false; [].forEach.call(document.querySelectorAll("select"),mejorar); }
  new MutationObserver(function(){ if(!pend){ pend=true; requestAnimationFrame(barrer); } }).observe(document.body,{childList:true,subtree:true});
  barrer();
})();
</script>

(function(){
  var ops=[].slice.call(document.querySelectorAll(".tema-op")); if(!ops.length) return;
  var btn=document.querySelector(".tema-btn"),pop=document.querySelector(".tema-pop");
  function abre(si){ if(!pop||!btn) return; if(si){ var sr=btn.parentNode.getBoundingClientRect(),w=pop.offsetWidth; pop.style.left=""; pop.style.right=""; pop.style.transformOrigin=""; if(sr.right-w<8){ var o=sr.left+w-(innerWidth-8); pop.style.left=(o>0?-o:0)+"px"; pop.style.right="auto"; pop.style.transformOrigin="top left"; } pop.classList.add("abre"); } else { pop.classList.remove("abre"); } btn.setAttribute("aria-expanded",String(!!si)); }
  function icono(t){ var o=ops.filter(function(x){ return x.getAttribute("data-tema-op")===t; })[0]; if(!o||!btn) return; var i=o.querySelector("svg,.sw"); btn.innerHTML=i?i.outerHTML:""; btn.title="Colores: "+o.getAttribute("aria-label"); }
  if(btn){
    btn.addEventListener("click",function(e){ e.stopPropagation(); abre(!pop.classList.contains("abre")); });
    document.addEventListener("click",function(e){ if(pop&&pop.classList.contains("abre")&&!pop.contains(e.target)) abre(false); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&pop&&pop.classList.contains("abre")){ abre(false); btn.focus(); } });
  }
  var TEMAS={claro:"#f5f1e7",arena:"#1e252d",salvia:"#181d1b",marino:"#1a2030",negro:"#0b0b0c"};
  function pon(t){
    if(!TEMAS[t]) t="oscuro";
    var r=document.documentElement;
    if(t!=="oscuro") r.setAttribute("data-tema",t); else r.removeAttribute("data-tema");
    ops.forEach(function(o){ o.setAttribute("aria-pressed",String(o.getAttribute("data-tema-op")===t)); });
    icono(t);
    try{ localStorage.setItem("ivs-tema",t); }catch(e){}
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",TEMAS[t]||"#1c1f24");
  }
  pon(document.documentElement.getAttribute("data-tema"));
  ops.forEach(function(o){ o.addEventListener("click",function(){ var t=o.getAttribute("data-tema-op"); pon(t); portada(t); abre(false); }); });
  // la portada (en su marco) lleva el mismo fondo; si se cambia allá, se cambia acá
  function portada(t){ try{ var w=document.getElementById("portada-marco").contentWindow; if(w&&w.IVS6&&w.IVS6.ponTema) w.IVS6.ponTema(t); }catch(e){} }
  addEventListener("storage",function(e){ if(e.key==="ivs-tema") pon(e.newValue); });
})();
