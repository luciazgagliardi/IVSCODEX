  RED_PRIVADA:"El servidor no descarga de direcciones internas. Está bien que pase."
};

/* Trae un documento por enlace y lo deja listo en el Lector. La usan el
   campo "Traer el fallo", el botón "Traer texto completo" de cada resultado
   de índice, y "Abrir en el Lector" desde un pasaje guardado — un solo
   camino, para no repetir el manejo de error tres veces.
   opciones.fichaConocida: metadata ya confirmada por el buscador oficial,
     para no tener que adivinarla de nuevo con detectar() (ver datosDoc()).
   opciones.qRestaurar / opciones.modoRestaurar: si el pasaje se guardó con
     una búsqueda puesta, se restaura para que la cita vuelva a quedar
     resaltada como estaba. */
function traerDocEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargando=true; estado.errorLink=null; estado.tab="lector";
  if(opciones.qRestaurar!==undefined){ estado.q=opciones.qRestaurar; estado.marca=0; }
  if(opciones.modoRestaurar) estado.modo=opciones.modoRestaurar;
  render();
  fetch(estado.api+"/extraer",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if(!d||!d.ok){
        // El servidor no pudo, pero el documento sigue estando a un clic:
        // se guarda el enlace para ofrecer abrirlo y subirlo a mano, que es
        // el camino que sí funciona cuando el sitio de origen no le contesta
        // al servidor (le pasa a los PDF del TSJ de CABA desde Azure). Si es
        // un escaneo (PDF_ESCANEADO) también se ofrece aplicar OCR acá
        // mismo — por eso se guardan código y opciones, para poder
        // reintentar sin perder la ficha ni la búsqueda que traía.
        estado.errorLink={mensaje:(d&&d.mensaje)||"El servidor no devolvió el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash((d.desdeCache?"Traído del caché · ":"")+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Fijate que la terminal siga diciendo «Interfaz http://localhost:3000»."};
      render();
    });
}

/**
 * El OCR es la respuesta a PDF_ESCANEADO: cuando el PDF no tiene capa de
 * texto (es la foto de una hoja de papel), el servidor puede reconocer las
 * letras a partir de la imagen en vez de leerlas del archivo. Es una
 * acción aparte y no algo automático porque tarda muchísimo más —varios
 * segundos por página, no milisegundos— así que hay que pedirlo a
 * propósito sabiendo eso.
 */
function traerOcrEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Probá de nuevo.",
                        codigo:"OCR_CORTADO",url:url,opciones:opciones};
      render();
    });
}

/**
 * Mismo OCR que traerOcrEnLector, pero para un archivo subido a mano en vez
 * de un enlace — sirve para lo que no se puede bajar solo (un sitio que le
 * niega la conexión al servidor publicado): se abre a mano en el navegador,
 * se guarda, y se sube. El archivo (un File, inmutable) ya está guardado en
 * estado.errorLink.archivo desde que falló la primera lectura, así que
 * reintentar con OCR no hace falta volver a elegirlo.
 */
function traerOcrDeArchivo(arch){
  if(!arch||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el archivo.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,archivo:arch};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=""; estado.infoDoc=d;
      estado.fichaConocida=null; estado.marca=0;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Probá de nuevo.",
                        codigo:"OCR_CORTADO",archivo:arch};
      render();
    });
}

function fichaDesdeIndice(slug,r){
  var fecha=r.fecha?(r.fecha.match(/\d{1,2}\/\d{1,2}\/\d{4}/)||[])[0]:"";
  return {tipo:slug==="mendoza"?"scjm":"cam",car:r.caratula,trib:r.tribunal,
          fecha:fecha||r.fecha,exp:r.expediente};
}
function fichaIndice(f,r){
  var q=estado.q;
  var im=estado.indices[f.slug];
  var meta=[r.tribunal,r.secretaria,r.fecha,r.magistrados,r.expediente?"Expte. "+r.expediente:""]
    .filter(Boolean).map(esc).join(" · ");
  // El pasaje puede venir con el resultado (Mendoza manda el sumario) o
  // haberse sacado del documento después (CABA — ver traerFragmentos).
  var pasaje=r.sumario||(r.linkFallo?im.fragmentos[r.linkFallo]:"");
  var esperando=!pasaje&&r.linkFallo&&im.fragCargando&&!im.fragmentos.hasOwnProperty(r.linkFallo);
  return '<div class="fuente">'+
    '<div class="f-top"><span class="cod '+f.clase+'">'+esc(f.cod)+'</span>'+
      '<span class="f-nom">'+esc(r.caratula||r.expediente||"(sin carátula)")+'</span></div>'+
    (pasaje?'<p class="f-nota">'+resaltarSimple(pasaje,q)+'</p>':'')+
    (esperando?'<p class="f-nota" style="opacity:.55;font-style:italic">Buscando el pasaje en el documento…</p>':'')+
    (meta?'<p style="font-size:12px;color:var(--humo);margin:0 0 8px">'+meta+'</p>':'')+
    (r.voces&&r.voces.length?'<div class="voces">'+r.voces.slice(0,6).map(function(v){
      return '<span class="voz" style="cursor:default">'+esc(v)+'</span>';}).join("")+'</div>':"")+
    '<div class="f-acc" style="margin-top:8px">'+
      (r.linkFicha?'<a class="mini" href="'+esc(r.linkFicha)+'" target="_blank" rel="noopener noreferrer">Ver ficha completa</a>':"")+
      (r.linkFallo?'<button class="mini" data-act="traer-indice-fallo" data-fuente="'+esc(f.slug)+'" data-url="'+esc(r.linkFallo)+'">Traer texto completo</button>':"")+
      // Si el documento se puede traer, también se puede abrir donde vive:
      // el enlace al sitio oficial es lo que hace citable al resultado.
      (r.linkFallo?'<a class="mini" href="'+esc(r.linkFallo)+'" target="_blank" rel="noopener noreferrer">Abrir el original</a>':"")+
    '</div></div>';
}

/* Va a buscar el pasaje de cada resultado que no lo traiga de fábrica.
   Mendoza manda el sumario con cada ficha; CABA no manda nada, así que el
   pasaje sale del documento en sí. El servidor los trae de a tandas y en
   un solo pedido (ver routes/indice.js): pedir uno por documento quemaría
   el límite de peticiones en una sola búsqueda. Se van pintando a medida
   que llegan, sin bloquear la lista de resultados, que ya está en pantalla. */
function traerFragmentos(slug,pedido){
  var im=estado.indices[slug];
  var qi=estado.q.trim();
  if(!im||!qi||!estado.api) return;
  // hasOwnProperty y no truthiness: un documento que no se pudo leer queda
  // guardado como cadena vacía, y con truthiness volvía a entrar en la
  // tanda siguiente para siempre — un bucle infinito contra el servidor.
  var faltan=im.resultados.filter(function(r){
    return r.linkFallo && !r.sumario && !im.fragmentos.hasOwnProperty(r.linkFallo);
  }).map(function(r){ return r.linkFallo; });
  if(!faltan.length){ im.fragCargando=false; render(); return; }

  var tanda=faltan.slice(0,6);
  im.fragCargando=true;
  fetch(estado.api+"/indice/"+slug+"/fragmentos",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q:qi,urls:tanda})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      // Si mientras tanto se disparó otra búsqueda, lo que llega es viejo.
      if(im.pedido!==pedido) return;
      (d&&d.fragmentos||[]).forEach(function(f){
        im.fragmentos[f.url]=f.fragmento||"";
      });
      // Todo lo que se pidió queda marcado como intentado, haya vuelto o
      // no: si el servidor frenó por límite de peticiones, la tanda
      // siguiente pediría lo mismo y no terminaría nunca.
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)) im.fragmentos[u]="";
      });
      if(d&&d.ok===false){ im.fragCargando=false; render(); return; }
      render();
      traerFragmentos(slug,pedido); // sigue con la tanda siguiente
    })["catch"](function(){
      if(im.pedido!==pedido) return;
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)) im.fragmentos[u]="";
      });
      im.fragCargando=false; render();
    });
}

/* Dispara (o repite) la búsqueda en vivo de una fuente con robot propio.
   La usan tanto el botón "Buscar en…" como el cambio de tribunal, para que
   tocar un chip de tribunal ya te traiga los resultados de ese tribunal en
   vez de dejar en pantalla los de la búsqueda anterior. */
/* ============================================================
   SAIJ desde el navegador
   ============================================================
   El servidor donde está publicada la web (un datacenter de Azure en Brasil)
   recibe 403 de SAIJ: el sitio no atiende pedidos desde ahí. Desde una
   conexión común sí responde, y además manda "Access-Control-Allow-Origin: *",
   o sea que habilita expresamente que un navegador le consulte desde
   cualquier página. Así que cuando el servidor no llega, la consulta la hace
   tu propia computadora, que es el destinatario natural de ese permiso.
   Comprobado a mano: mismo pedido, 403 desde el servidor y 200 desde acá.

   Esto obliga a repetir en el navegador el armado y el filtro que el
   servidor hace en lib/indiceSaij.js y lib/relevancia.js. Es duplicación
   real y molesta, pero la alternativa era dejar la fuente más grande de las
   tres afuera de la versión publicada. */

var SAIJ_URL="https://www.saij.gob.ar/busqueda";
var SAIJ_TIPOS={
  sumarios:"Total|Tipo de Documento/Jurisprudencia/Sumario",
  fallos:"Total|Tipo de Documento/Jurisprudencia/Fallo"
};
/* La Corte Suprema sale de SAIJ filtrando por su faceta de tribunal. Solo
   los fallos traen ese campo, así que va siempre por fallos (ver la nota en
   lib/indiceSaij.js del servidor). */
var SAIJ_FACETA_CSJN="Total|Tipo de Documento/Jurisprudencia/Fallo|Tribunal/CORTE SUPREMA DE JUSTICIA DE LA NACION";

function saijPlegar(s){
  try{ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
  catch(e){ return String(s||"").toLowerCase(); }
}
/* Las palabras que definen la búsqueda, de más específica a más genérica,
   recortadas a la raíz. Mismo criterio que lib/relevancia.js del servidor. */
function saijRaices(q){
  return saijPlegar(q).split(/[^a-z0-9]+/)
    .filter(function(p){ return p.length>=3 && !VACIAS[p]; })
    .sort(function(a,b){ return b.length-a.length; })
    .map(function(p){ return p.slice(0,6); });
}
function saijPajar(r){
  return saijPlegar([r.caratula,r.sumario,(r.voces||[]).join(" ")].join(" ")).replace(/\s+/g," ");
}
function saijCuantas(pajar,raices){
  var n=0; raices.forEach(function(x){ if(pajar.indexOf(x)!==-1) n++; }); return n;
}
/* SAIJ busca siempre con OR, así que el modo se aplica acá sobre lo traído. */
function saijFiltrar(lista,q,modo,excluir){
  var raices=saijRaices(q), fuera=saijRaices(excluir||"");
  var vivos=fuera.length?lista.filter(function(r){ return saijCuantas(saijPajar(r),fuera)===0; }):lista.slice();
  if(!raices.length) return {lista:vivos,aflojado:false};
  if(modo==="alguna") return {lista:vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)>0; }),aflojado:false};
  if(modo==="exacta"){
    var frase=saijPlegar(q).replace(/\s+/g," ").trim();
    if(!frase) return {lista:vivos,aflojado:false};
    return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(frase)!==-1; }),aflojado:false};
  }
  var completos=vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)===raices.length; });
  if(completos.length||raices.length===1) return {lista:completos,aflojado:false};
  return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(raices[0])!==-1; }),aflojado:true};
}

function saijLimpiar(s){
  return String(s||"").replace(/\[\[\/?p\]\]/g," ").replace(/\[\[[^\]]*\]\]/g," ").replace(/\s+/g," ").trim();
}
function saijFecha(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||""));
  return m?(m[3]+"/"+m[2]+"/"+m[1]):String(iso||"");
}
/* Cada resultado viene con el documento como JSON dentro de un string. */
function saijARegistro(bruto){
  var doc;
  try{ doc=JSON.parse(bruto.documentAbstract).document; }catch(e){ return null; }
  var c=(doc&&doc.content)||{}, uuid=doc&&doc.metadata&&doc.metadata.uuid;
  if(!uuid) return null;
  var esSumario=doc.metadata["document-content-type"]==="sumario";
  var partes=[c.actor,c.demandado].filter(Boolean).join(" c/ ")+(c.sobre?" s/ "+c.sobre:"");
  var voces=[].concat((c.descriptores&&c.descriptores.descriptor)||[])
    .map(function(d){ return d&&d.elegido&&d.elegido.termino; }).filter(Boolean);
  return {
    id:"saij_"+uuid,
    expediente:c["numero-interno"]||c["id-infojus"]||"",
    caratula:(esSumario?(c.titulo||saijLimpiar(c.sumario)):partes)||"(sin carátula)",
    sumario:esSumario?saijLimpiar(c.texto):"",
    voces:voces,
    fecha:saijFecha(c.fecha),
    tribunal:[c.tribunal,c.provincia,c.jurisdiccion&&c.jurisdiccion.descripcion]
      .filter(Boolean).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(" · "),
    magistrados:c.magistrados||"",
    linkFicha:"https://www.saij.gob.ar/"+uuid,
    linkFallo:null
  };
}

/* Revisa varias páginas antes de aflojar el filtro, igual que el servidor:
   como SAIJ ordena por relevancia pero busca con OR, la primera página puede
   ser toda de una sola de las palabras. */
function buscarSaijNavegador(cuerpo,slug){
  var faceta=slug==="csjn"?SAIJ_FACETA_CSJN:(SAIJ_TIPOS[cuerpo.tribunal]||SAIJ_TIPOS.sumarios);
  var porPagina=20, porPedido=100, revisados=[], totalCrudo=0;
  // Mismo cálculo que lib/indiceSaij.js: "página 2" no es volver a pedir
  // desde el principio, es arrancar donde termina la página anterior.
  var arranque=(Math.max(1,cuerpo.pagina||1)-1)*porPagina;
  function pedir(i){
    var p=new URLSearchParams({q:cuerpo.q,o:String(arranque+i*porPedido),p:String(porPedido),f:faceta});
    return fetch(SAIJ_URL+"?"+p.toString(),{headers:{Accept:"application/json"}})
      .then(function(r){
        if(!r.ok) throw new Error("SAIJ respondió "+r.status);
        return r.json();
      })
      .then(function(d){
        var sr=(d&&d.searchResults)||{};
        if(i===0){
          var f=(sr.categoriesResultList||[]).filter(function(c){ return c.facetName==="Total"; })[0];
          totalCrudo=(f&&f.facetChildren&&f.facetChildren[0]&&f.facetChildren[0].facetHits)||0;
          if(!totalCrudo) return null;
        }
        var crudos=sr.documentResultList||[];
        if(!crudos.length) return null;
        crudos.map(saijARegistro).filter(Boolean).forEach(function(r){ revisados.push(r); });
        var parcial=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
        if(parcial.lista.length>=porPagina||revisados.length>=totalCrudo) return null;
        return i<2?pedir(i+1):null;
      });
  }
  return pedir(0).then(function(){
    if(!totalCrudo) return {ok:true,total:0,resultados:[],revisados:0};
    var res=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
    return {
      ok:true,
      total:res.lista.length,
      // "Parcial" es caducidad, no paginación: ver la nota en lib/indiceSaij.js.
      totalParcial:res.lista.length<porPagina&&revisados.length<totalCrudo,
      revisados:revisados.length,
      aflojado:res.aflojado,
      resultados:res.lista.slice(0,porPagina),
      desdeNavegador:true
    };
  });
}

/** Cuántos resultados pide cada página. Tiene que ser el mismo número que
 * usan por default lib/indiceMza.js, lib/indiceCaba.js y lib/indiceSaij.js. */
var POR_PAGINA_INDICE=20;

/**
 * Hasta cuántos resultados en total se precargan solos, de fondo, apenas
 * llega la página 1 — para que pasar de página sea instantáneo CUANDO llega
 * a tiempo. Se probaron las dos puntas y las dos tienen un costo:
 *
 *   - De fondo, sin bloquear nada (esto): la página 1 aparece rápido, como
 *     siempre, pero si el usuario hace clic en "siguiente" antes de que la
 *     precarga de esa página termine —muy probable con CABA, que puede
 *     tardar 10-15 segundos reales por página—, no hay mejora: se pide en
 *     vivo igual, exactamente como si esto no existiera.
 *   - Esperando a tenerlas todas antes de mostrar la primera (lo que había
 *     antes de esto): "página siguiente" queda garantizado instantáneo,
 *     pero a costa de una espera inicial más larga y tediosa, sobre todo
 *     con una fuente lenta — y esa espera resultó peor que el problema
 *     original.
 *
 * Entre las dos, mejor esta: nunca hace esperar de más al principio, y
 * cuando la persona se toma un momento en leer la página 1 antes de pasar
 * de página, la mejora sí está. No es una garantía, es una ayuda que a
 * veces llega a tiempo y a veces no. Con más resultados que esto (una
 * búsqueda de concepto en Dialnet puede dar 30 mil) no se intenta: además
 * de la espera sería maltratar al sitio oficial de gusto, para páginas que
 * nadie va a hojear.
 */
var UMBRAL_PRECARGA_INDICE=5*POR_PAGINA_INDICE;

/**
 * Vuelca la respuesta del servidor (fresca o de un caché de página) al
 * estado de esa fuente y renderiza. Compartido entre "pedir de verdad" y
 * "ya la tenía precargada" para no repetir la misma docena de líneas.
 */
function aplicarPaginaIndice(slug,fCfg,imBusco,d,pagina,esNueva){
  imBusco.pagina=pagina;
  imBusco.cargando=false;
  imBusco.desdeNavegador=!!d.desdeNavegador;
  imBusco.resultados=d.resultados||[];
  imBusco.total=d.total||0;
  imBusco.guardados=d.guardadosEnIndice||0;
  imBusco.local=!!d.desdeIndiceLocal;
  imBusco.avisoFalla=d.avisoFalla||"";
  imBusco.parcial=!!d.totalParcial;
  imBusco.revisados=d.revisados||0;
  imBusco.aflojado=!!d.aflojado;
  imBusco.fragmentos={};
  render();
  // Los resultados ya están en pantalla; los pasajes que esta fuente no
  // manda se van completando atrás, sin hacer esperar a nadie.
  if(imBusco.resultados.some(function(r){return r.linkFallo&&!r.sumario;})){
    traerFragmentos(slug,imBusco.pedido);
  }
  var nombreTrib=(fCfg.tribunales||[]).filter(function(t){return t.v===imBusco.tribunal;})[0];
  var enDonde=fCfg.nombre+(nombreTrib?" · "+nombreTrib.n:"");
  if(esNueva) flash(imBusco.local
    ?"El sitio oficial no respondió: mostrando "+d.resultados.length+" resultado(s) ya guardados"
    :(d.total?d.total.toLocaleString("es-AR")+" coincidencias en "+enDonde:"Sin coincidencias en "+enDonde));
}

/**
 * Trae de fondo las páginas 2, 3... de la búsqueda que se acaba de hacer,
 * sin spinner ni bloquear nada: la página 1 ya está en pantalla desde antes
 * de llamar a esto. Si para cuando el usuario hace clic en "página
 * siguiente" ya llegó, buscarEnFuente la sirve del caché al toque; si no,
 * la pide en vivo como si esto no existiera (ver la nota grande de arriba).
 * Una a la vez y en orden, no todas juntas: son pedidos reales al sitio
 * oficial, con la misma espera de cortesía entre pedidos que ya respeta el
 * servidor (ver esperarTurno en lib/descargador.js) — pedirlas en paralelo
 * no las traería más rápido, solo se atropellarían.
 */
function precargarPaginasIndice(slug,imBusco,busquedaId,cuerpoBase,total){
  var totalPaginas=Math.min(Math.ceil(total/POR_PAGINA_INDICE),Math.ceil(UMBRAL_PRECARGA_INDICE/POR_PAGINA_INDICE));
  function siguiente(pagina){
    if(pagina>totalPaginas) return;
    // Se compara contra busquedaId (una búsqueda, con q/modo/tribunal
    // fijos), NO contra imBusco.pedido: eso último cambia con cada clic en
    // una página, y si esto revisara pedido, con solo pasar de página a
    // mano mientras la precarga sigue en vuelo se cortaría entera pensando
    // que la búsqueda había quedado vieja, cuando en realidad es la misma.
    if(imBusco.busquedaId!==busquedaId) return;
    if(imBusco.paginas[pagina]) return siguiente(pagina+1); // ya la tenía (poco probable, no hace daño)
    var cuerpo=Object.assign({},cuerpoBase,{pagina:pagina});
    fetch(estado.api+"/indice/"+slug+"/buscar",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(cuerpo)
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(imBusco.busquedaId!==busquedaId) return;
        if(d&&d.ok&&!d.desdeIndiceLocal) imBusco.paginas[pagina]=d;
        siguiente(pagina+1);
      })["catch"](function(){ /* si falla precargando, buscarEnFuente la pide de nuevo cuando haga falta */ });
  }
  siguiente(2);
}

/**
 * @param slug fuente a consultar.
 * @param pagina si se omite es una búsqueda nueva (arranca en la página 1);
 *   si se pasa un número, es "ir a esa página" de una búsqueda ya hecha —
 *   reemplaza la lista, no la suma a la anterior.
 */
function buscarEnFuente(slug,pagina){
  var fCfg=FUENTES_INDICE.filter(function(x){return x.slug===slug;})[0];
  var qi=estado.q.trim();
  if(!fCfg) return;
  if(!qi){ flash("Escribí algo en «Qué buscás» primero"); return; }
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }
  recordar(qi);
  var imBusco=estado.indices[slug];
  var esNueva=!(pagina>=1);
  var paginaPedida=esNueva?1:pagina;

  // Si esta página ya está precargada (de fondo o de haberla visitado antes
  // en esta misma búsqueda), servirla de ahí: no hace falta esperar de
  // nuevo al sitio oficial para algo que ya se trajo.
  if(!esNueva&&imBusco.paginas[paginaPedida]){
    aplicarPaginaIndice(slug,fCfg,imBusco,imBusco.paginas[paginaPedida],paginaPedida,false);
    return;
  }

  // Si esta fuente es lenta (CABA puede tardar 30s) y se dispara otra
  // búsqueda antes de que vuelva la anterior, la respuesta vieja no debe
  // pisar a la nueva. Un token por pedido: solo aplica si nadie más
  // arrancó una búsqueda de esta misma fuente después.
  var pedido=(imBusco.pedido||0)+1; imBusco.pedido=pedido;
  // Distinto de "pedido": esto identifica la búsqueda (q/modo/tribunal),
  // no cada clic. Cambia solo con una búsqueda nueva, así que ir pasando
  // de página a mano no corta la precarga de fondo de esta misma búsqueda
  // (ver precargarPaginasIndice).
  if(esNueva){ imBusco.busquedaId=(imBusco.busquedaId||0)+1; imBusco.paginas={}; }
  var busquedaId=imBusco.busquedaId;
  imBusco.cargando=true; imBusco.error=null; render();
  // El modo y las palabras a excluir viajan al servidor: antes se elegían
  // acá y no cambiaban nada de la búsqueda real (ver lib/relevancia.js).
  var cuerpo={q:qi,modo:estado.modo||"todas",pagina:paginaPedida};
  if(estado.excluir.trim()) cuerpo.excluir=estado.excluir.trim();
  if(imBusco.tribunal) cuerpo.tribunal=imBusco.tribunal;
  fetch(estado.api+"/indice/"+slug+"/buscar",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo)
  }).then(function(r){ return r.json(); })
    .then(function(d){
      // SAIJ no atiende al servidor donde está publicada la web, pero sí a
      // los navegadores (ver el bloque de "SAIJ desde el navegador"). Si el
      // servidor no pudo, lo intenta tu computadora antes de darse por
      // vencida.
      if((slug==="saij"||slug==="csjn")&&(!d||!d.ok)) return buscarSaijNavegador(cuerpo,slug);
      return d;
    })
    .then(function(d){
      if(imBusco.pedido!==pedido) return; // ya hay un pedido mas nuevo en vuelo
      imBusco.busco=true;
      if(!d||!d.ok){
        imBusco.cargando=false;
        imBusco.error=(d&&d.mensaje)||"El servidor no devolvió resultados.";
        render(); return;
      }
      aplicarPaginaIndice(slug,fCfg,imBusco,d,paginaPedida,esNueva);
      // Se haya pedido a mano o de una búsqueda nueva, cualquier página que
      // de verdad se trajo del sitio queda guardada: volver a pasar por
      // ella (ida y vuelta entre páginas) también es instantáneo.
      if(!d.desdeIndiceLocal) imBusco.paginas[paginaPedida]=d;
      // Búsqueda nueva, con más de una página y no demasiado grande: se van
      // trayendo las siguientes solas, de fondo, sin hacer esperar a nadie
      // (ver la nota grande de arriba de precargarPaginasIndice).
      if(esNueva&&!d.desdeIndiceLocal&&d.total>POR_PAGINA_INDICE&&d.total<=UMBRAL_PRECARGA_INDICE){
        precargarPaginasIndice(slug,imBusco,busquedaId,cuerpo,d.total);
      }
    })["catch"](function(){
      if(imBusco.pedido!==pedido) return;
      imBusco.cargando=false; imBusco.busco=true;
      imBusco.error=(slug==="saij"||slug==="csjn")
        ?"No se pudo consultar SAIJ, ni desde el servidor ni desde acá. Probá de nuevo en un rato."
        :"Se cortó la comunicación con el servidor.";
      render();
    });
}

/**
 * Números de página, tipo "‹ 1 2 3 … 12 ›", para navegar los resultados de
 * una fuente en vivo sin acumular todo en una sola lista larguísima.
 *
 * El respaldo local (im.local) ya trae todo lo que hay guardado en una sola
 * tanda, así que ahí no hay "página siguiente" que ofrecer.
 */
function paginadorIndice(f,im){
  if(im.local) return '';
  var porPagina=POR_PAGINA_INDICE;
  var actual=Math.max(1,im.pagina||1);
  var total=im.total||0;
  var totalPaginas=Math.max(actual,Math.ceil(total/porPagina));
  var desde=(actual-1)*porPagina+1;
  var hasta=desde+im.resultados.length-1;

  var out='<p style="font-size:12.5px;color:var(--humo);margin:0 0 8px">Mostrando '+
    desde.toLocaleString("es-AR")+'–'+hasta.toLocaleString("es-AR")+' de '+total.toLocaleString("es-AR")+
    ' resultado(s)'+(im.parcial?' verificados hasta ahora — puede haber más':'')+'</p>';
  if(totalPaginas<=1) return out;

  // Ventana de números alrededor de la página actual; el principio y el
  // final quedan siempre a la vista aunque estén lejos de esa ventana.
  var desdeN=Math.max(1,actual-2), hastaN=Math.min(totalPaginas,actual+2);
  var nums=[];
  if(desdeN>1){ nums.push(1); if(desdeN>2) nums.push(null); }
  for(var i=desdeN;i<=hastaN;i++) nums.push(i);
  if(hastaN<totalPaginas){ if(hastaN<totalPaginas-1) nums.push(null); nums.push(totalPaginas); }

  var botones=nums.map(function(p){
    if(p===null) return '<span style="padding:0 3px;color:var(--humo)">…</span>';
    return '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+p+'"'+
      (p===actual?' aria-pressed="true" disabled':'')+'>'+p+'</button>';
  }).join("");

  return out+'<div class="paginador" style="margin:0 0 12px">'+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual-1)+'"'+
      (actual<=1?' disabled':'')+'>‹ Anterior</button>'+
    botones+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual+1)+'"'+
      (actual>=totalPaginas?' disabled':'')+'>Siguiente ›</button>'+
    '</div>';
}

function panelIndice(f){
  var im=estado.indices[f.slug];
  var local=im.busco&&im.local;
  var nombreTrib=((f.tribunales||[]).filter(function(t){return t.v===im.tribunal;})[0]||{}).n;
  var out='<div class="panel vivo"'+(local?' style="border-left-color:var(--oro)"':'')+'>'+
    '<div class="rotulo" style="margin-top:0">'+esc(f.nombre)+(local?' · desde tu índice local':' · en vivo')+'</div>';

  if(f.tribunales){
    out+='<div class="chips" style="margin-bottom:10px">'+f.tribunales.map(function(t){
      return '<button class="chip" data-act="indice-tribunal" data-fuente="'+f.slug+'" data-tribunal="'+t.v+
        '" aria-pressed="'+(im.tribunal===t.v?"true":"false")+'">'+esc(t.n)+'</button>';
    }).join("")+'</div>';
  }
  // CABA no filtra del lado del sitio (ver lib/indiceCaba.js): esto filtra
  // sobre lo que ya se trajo, según la secretaría que cada resultado trae.
  var secsPresentes=(f.slug==="caba"&&im.busco)
    ? Array.from(new Set(im.resultados.map(function(r){return r.secretaria;}).filter(Boolean)))
    : [];
  if(secsPresentes.length>1){
    out+='<div class="chips" style="margin-bottom:10px">'+secsPresentes.map(function(s){
      return '<button class="chip" data-act="indice-secretaria" data-fuente="'+f.slug+'" data-sec="'+esc(s)+
        '" aria-pressed="'+(im.secFiltro===s?"true":"false")+'">'+esc(SECRETARIAS_CABA[s]||s)+'</button>';
    }).join("")+'</div>';
  }

  if(im.cargando){
    out+='<p style="font-size:13px;color:var(--humo);margin:0">Consultando el buscador… puede tardar hasta 30 segundos: son sistemas oficiales viejos, no es que se haya colgado.</p></div>';
    return out;
  }
  if(im.error){
    out+='<div class="aviso" style="margin:0"><strong>No se pudo consultar.</strong> '+esc(im.error)+'</div></div>';
    return out;
  }
  if(!im.busco){
    out+='<p style="font-size:13px;color:var(--humo);margin:0 0 10px">Además de armar la consulta para las bases oficiales, esta búsqueda puede traer resultados reales de '+esc(f.nombre)+', acá mismo, guardándolos de paso en tu índice local.'+
      (f.nota?' <span style="color:var(--humo)">'+esc(f.nota)+'</span>':'')+'</p></div>';
    return out;
  }
  var avisoLocal=local?'<div class="aviso" style="margin:0 0 10px"><strong>El buscador de '+esc(f.nombre)+' no respondió'+
    (im.avisoFalla?' ('+esc(im.avisoFalla)+')':'')+'.</strong> Esto es lo que ya tenías guardado de búsquedas anteriores en tu índice local — puede estar incompleto o desactualizado. Probá de nuevo en un rato para la versión en vivo.</div>':'';
  if(!im.resultados.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Sin coincidencias en '+esc(f.nombre)+
      (nombreTrib?' ('+esc(nombreTrib)+')':'')+' para esta búsqueda. Probá con menos palabras.</p></div>';
    return out;
  }
  var visibles=im.secFiltro?im.resultados.filter(function(r){return r.secretaria===im.secFiltro;}):im.resultados;
  var nombreSec=SECRETARIAS_CABA[im.secFiltro];
  if(!visibles.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Ninguno de los '+im.resultados.length+
      ' resultados que trajo esta página es de '+esc(nombreSec||im.secFiltro)+'. Puede estar en otra página del sitio oficial.</p></div>';
    return out;
  }
  out+=avisoLocal+'<p style="font-size:12.5px;color:var(--humo);margin:0 0 4px">'+
    (nombreTrib?'<b style="color:var(--lacre)">'+esc(nombreTrib)+'</b> · ':'')+
    (nombreSec?'<b style="color:var(--lacre)">'+esc(nombreSec)+'</b> · '+visibles.length+' de sus ':'')+
    // Cuando el sitio de origen no sabe hacer el modo pedido, el filtro corre
    // de nuestro lado y su contador ya no aplica: se dice cuántos se
    // verificaron, no un número inventado. Ver lib/relevancia.js.
    (local
      ? im.total.toLocaleString("es-AR")+' resultado(s) guardados'
      : (im.revisados
          ? im.total.toLocaleString("es-AR")+' resultado(s) que coinciden de verdad'+
            (im.parcial?' (revisamos los primeros '+im.revisados.toLocaleString("es-AR")+' del sitio; puede haber más)':'')
          : im.total.toLocaleString("es-AR")+' coincidencias en total'))+
    // Antes acá también decía "· N guardadas en tu índice local hasta
    // ahora": un detalle interno (cuántos documentos se acumularon con el
    // tiempo en la copia de respaldo, ver lib/indice.js) que no ayuda a
    // nadie a leer cuántos resultados dio ESTA búsqueda, y encima se
    // mezclaba en la misma frase. Sacado a pedido de un usuario que no le
    // encontraba sentido — con razón.
    '</p>'+
    // Números de página arriba de la lista: antes esto era un botón "ver más"
    // que iba sumando de a 20 sin fin; ahora se ve de entrada cuánto hay y
    // se puede saltar directo a cualquier página, como en cualquier buscador.
    paginadorIndice(f,im)+
    (im.desdeNavegador?'<div class="aviso" style="margin:0 0 10px">Esta búsqueda la hizo <b>tu computadora</b>, no el servidor: SAIJ no atiende pedidos desde donde está publicada la web, pero sí desde un navegador común. Por eso estos resultados no quedan guardados en el índice local.</div>':'')+
    (im.aflojado?'<div class="aviso" style="margin:0 0 10px">Ningún resultado tiene <b>todas</b> las palabras que buscaste. Estos coinciden solo con la más específica, así que revisalos con cuidado: puede que no sean del tema que buscabas.</div>':'')+
    // El sitio de CABA no manda un resumen del fallo con cada resultado
    // como hace Mendoza: los pasajes se sacan del documento en sí, de a
    // tandas, mientras la lista ya está en pantalla (ver traerFragmentos).
    (f.slug==="caba"&&im.fragCargando?'<p style="font-size:12.5px;color:var(--humo);margin:0 0 10px">Este buscador no manda un resumen con cada resultado, así que los pasajes se van sacando de cada documento — aparecen solos, de a poco.</p>':'')+
    visibles.map(function(r){ return fichaIndice(f,r); }).join("")+
    '</div>';
  return out;
}

function vistaRamas(){
  var html='<div class="aviso"><strong>Las voces son el atajo.</strong> Los buscadores judiciales argentinos indexan por descriptores, no por lenguaje natural. '+
    'Tocá una voz y la web la carga en la consulta con las comillas puestas.</div>';
  var lista=estado.rama?RAMAS.filter(function(x){return x.id===estado.rama;}):RAMAS;
  html+='<p class="conteo">'+lista.length+' de '+RAMAS.length+' ramas</p>';
  html+=lista.map(function(x){
    var n=F.filter(function(f){return f.r==="*"||f.r.split(",").indexOf(x.id)!==-1;}).length;
    return '<div class="rama"><h3>'+esc(x.n)+'</h3><p>'+esc(x.d)+'</p>'+
      '<div class="rotulo">Voces para buscar</div>'+
      '<div class="voces">'+x.v.map(function(v){
        return '<button class="voz" data-act="voz" data-v="'+esc(v)+'">'+esc(v)+'</button>';}).join("")+'</div>'+
      '<div class="rotulo" style="margin-top:10px">'+n+' fuentes cubren esta rama</div>'+
      '<button class="mini" data-act="ir-rama" data-rama="'+esc(x.id)+'">Ver esas fuentes</button>'+
      '</div>';
  }).join("");
  return html;
}

/**
 * El aviso de "no se pudo traer", en un solo lugar para poder mostrarlo
 * tanto si el Lector estaba vacío como si ya tenía un fallo abierto.
 *
 * Antes esto sólo se pintaba cuando el Lector estaba vacío: si ya había un
 * documento cargado y "Traer texto completo" fallaba para uno nuevo (algo
 * frecuente con los PDF del TSJ de CABA, que muchas veces no le contestan
 * al servidor publicado en Azure), el pedido fallaba en silencio y quedaba
 * en pantalla el fallo anterior, como si fuera el que se acababa de pedir.
 */
function avisoErrorLector(){
  if(!estado.errorLink&&!estado.cargandoOcr) return '';
  if(estado.cargandoOcr){
    return '<div class="aviso" style="margin:0 0 14px">'+
      '<strong>Aplicando OCR…</strong> puede tardar varios minutos —no son milisegundos como el resto de esta app—, '+
      'sobre todo si el servidor anda con poca CPU en este momento. No hace falta que recargues ni vuelvas a tocar el botón: '+
      'dejalo trabajando.'+
      (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Mientras tanto se sigue viendo el fallo anterior.</span>':'')+
      '</div>';
  }
  var esEscaneo=estado.errorLink.codigo==="PDF_ESCANEADO";
  // El escaneo puede venir de un enlace (queda la URL para pedirle el OCR
  // al servidor) o de un archivo subido a mano (no hay URL, pero el propio
  // archivo quedó guardado en memoria — ver el listener de "change" más
  // abajo — así que el OCR se le puede pedir igual sin volver a elegirlo).
  var puedeOcr=esEscaneo&&(estado.errorLink.url||estado.errorLink.archivo);
  return '<div class="aviso" style="margin:0 0 14px"><strong>No se pudo traer este documento.</strong> '+
    esc(estado.errorLink.mensaje)+
    (estado.errorLink.ayuda?'<br><span style="color:var(--humo);font-size:12.5px">'+esc(estado.errorLink.ayuda)+'</span>':'')+
    (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Se sigue mostrando el fallo que ya tenías abierto, no el que acabás de pedir.</span>':'')+
    ((estado.errorLink.url||puedeOcr)
      ?'<div class="f-acc" style="margin-top:10px">'+
         // El escaneo no tiene "el original y guardarlo" como primer paso:
         // ahí el enlace es al PDF sin texto, y lo que sirve es pedirle al
         // servidor que le aplique OCR, no abrirlo a mano.
         (puedeOcr
           ?'<button class="mini" data-act="aplicar-ocr"'+(estado.errorLink.url?' data-url="'+esc(estado.errorLink.url)+'"':'')+'>Aplicar OCR (tarda varios minutos)</button>'
           :'')+
         (estado.errorLink.url
           ?'<a class="mini" href="'+esc(estado.errorLink.url)+'" target="_blank" rel="noopener noreferrer">'+(esEscaneo?"Abrir el original":"1 · Abrir el original y guardarlo")+'</a>'
           :'')+
         (esEscaneo||!estado.errorLink.url?'':'<button class="mini" data-act="elegir-archivo">2 · Subirlo acá</button>')+
       '</div>'
      :'')+
    '</div>';
}

function conteoLector(cs){
  var el=document.getElementById("doc-cnt");
  if(!el) return;
  if(!cs.length){
    el.innerHTML=cadena()?'Sin coincidencias para <b>'+esc(cadena())+'</b>'
                         :'Escribí abajo para resaltar dentro del fallo';
    return;
  }
  var vis=Math.min(cs.length,TOPE_MARCAS);
  el.innerHTML='<b>'+cs.length+'</b> coincidencia'+(cs.length===1?"":"s")+
    (cs.length>TOPE_MARCAS?" (se marcan las primeras "+TOPE_MARCAS+")":"")+
    ' · '+(estado.marca+1)+' de '+vis;
}

/* Orden de lectura de la ficha del Lector: jerarquía legal de arriba hacia
   abajo (Constitución > tratados/leyes > fondo > forma), y adentro de cada
   norma, los artículos ordenados numéricamente en vez de por orden de
   aparición en el texto. */
function numDeCadena(s){
  var m=String(s).replace(/\./g,"").match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function ordenArt(a,b){
  var na=numDeCadena(a),nb=numDeCadena(b);
  return na!==nb?na-nb:a.localeCompare(b);
}
var RANGO_FUENTE={
  "CCyC (vigente)":10,"Código Civil (derogado)":11,"Código de Comercio (derogado)":12,"Código Penal":13,
  "LCT":14,"LDC":15,"Ley de Seguros (LS)":16,
  "CPCCN":30,"CPC":31,"Código Procesal Penal":32,"Ley Arancelaria (LA)":33
};
function rangoDeFuente(label){
  return RANGO_FUENTE.hasOwnProperty(label)?RANGO_FUENTE[label]:99;
}

function pintarLector(){
  if(estado.tab!=="lector"||!estado.texto) return;
  var texto=estado.texto,cs=coincidencias(texto),d=datosDoc(texto);
  if(estado.marca>=cs.length) estado.marca=0;
  conteoLector(cs);

  var meta=document.getElementById("doc-meta");
  if(meta){
    var top=[];
    if(d.trib) top.push(["Tribunal",d.trib+(d.sala?" · "+d.sala:"")]);
    if(d.fecha) top.push(["Fecha",d.fecha]);
    if(d.exp) top.push(["Expediente",d.exp]);
    if(d.tomo&&d.pag) top.push(["Colección","Fallos: "+d.tomo+":"+d.pag]);
    var infoDer=estado.infoDoc?esc(estado.infoDoc.tipo.toUpperCase()+
      (estado.infoDoc.paginas?" · "+estado.infoDoc.paginas+" pág.":"")+
      " · "+estado.infoDoc.caracteres.toLocaleString("es-AR")+" caracteres"+
      (estado.infoDoc.desdeCache?" · desde caché":"")):"";

    var htmlTop=(top.length||d.car||infoDer)?(
      '<div class="meta-top">'+
        (d.car?'<div class="meta-car">'+esc(d.car)+
          (estado.fichaConocida?' <span style="font-size:11px;font-weight:600;color:var(--acequia)">· verificado en el buscador oficial</span>':"")+
          '</div>':"")+
        (top.length||infoDer?'<div class="meta-fila">'+
          '<div class="izq">'+top.map(function(x){ return '<b>'+esc(x[0])+':</b> '+esc(x[1]); }).join(' <span class="sep">·</span> ')+'</div>'+
          (infoDer?'<div class="der">'+infoDer+'</div>':"")+
        '</div>':"")+
      '</div>'
    ):"";

    var porFuente=d.artsPorFuente||[];
    var pend=porFuente.filter(function(g){ return g[0]==="Sin ley identificada"; })[0];
    var porCat={cn:[],tratados:[],fondo:[],leyes:[],provincial:[],local:[]};
    porFuente.forEach(function(g){
      if(g[0]==="Sin ley identificada") return;
      var cat=porCat.hasOwnProperty(g[2])?g[2]:"leyes";
      porCat[cat].push(g);
    });
    porCat.leyes.sort(function(a,b){ return numDeCadena(a[0])-numDeCadena(b[0]); });
    porCat.fondo.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.provincial.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.tratados.sort(function(a,b){ return a[0].localeCompare(b[0]); });
    porCat.local.sort(function(a,b){ return a[0].localeCompare(b[0]); });

    function bloqueNorma(g,claseExtra){
      return '<div class="meta-bloque'+(claseExtra?" "+claseExtra:"")+'"><h3>'+esc(g[0])+'</h3>'+
        '<div class="meta-tags">'+g[1].slice().sort(ordenArt).map(function(a){
          return '<span class="meta-tag">'+esc(a)+'</span>';
        }).join("")+'</div></div>';
    }
    function bloqueTags(items){
      return '<div class="meta-bloque"><div class="meta-tags">'+
        items.map(function(x){ return '<span class="meta-tag">'+esc(x)+'</span>'; }).join("")+
      '</div></div>';
    }

    /* Jerarquía normativa decreciente: Constitución > tratados > códigos de
       fondo > leyes nacionales > leyes provinciales/procesales > normativa
       local. Cada norma aparece una sola vez, con todos sus artículos
       consolidados en el mismo contenedor. */
    var bloques="";
    porCat.cn.forEach(function(g){ bloques+=bloqueNorma(g,"cn"); });
    if(porCat.tratados.length){
      bloques+='<div class="meta-cat">Tratados internacionales</div>';
      porCat.tratados.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.fondo.length){
      bloques+='<div class="meta-cat">Códigos de fondo</div>';
      porCat.fondo.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.leyes.length){
      bloques+='<div class="meta-cat">Leyes nacionales</div>';
      porCat.leyes.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.provincial.length){
      bloques+='<div class="meta-cat">Leyes provinciales y códigos procesales</div>';
      porCat.provincial.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.local.length){
      bloques+='<div class="meta-cat">Normativa local y decretos</div>';
      porCat.local.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(d.citados&&d.citados.length){
      bloques+='<div class="meta-cat">Jurisprudencia citada</div>'+bloqueTags(d.citados);
    }
    if(pend) bloques+='<div class="meta-bloque pendiente"><h3>Artículos pendientes de clasificación</h3>'+
      '<div class="meta-tags">'+pend[1].slice().sort(ordenArt).map(function(a){
        return '<span class="meta-tag">'+esc(a)+'</span>';
      }).join("")+'</div></div>';

    meta.innerHTML=htmlTop+
      (bloques?'<div class="meta-cuerpo">'+bloques+'</div>'
        :(htmlTop?"":'<div class="meta-bloque"><h3>Sin datos detectados</h3><div class="txt">El encabezado no sigue un formato reconocible. Cargá los datos a mano en «Cómo citar».</div></div>'))+
      '<div class="meta-acc">'+
      '<button class="mini" data-act="meta-a-cita">Pasar estos datos al formateador de citas</button>'+
      '<button class="mini" data-act="copiar-doc-cita">Copiar solo la cita</button>'+
      '</div>';
  }

  var doc=document.getElementById("doc");
  if(doc) doc.innerHTML=textoResaltado(texto,cs);

  var tit=document.getElementById("doc-tit-pas");
  var cont=document.getElementById("pasajes");
  if(cont){
    if(!cs.length){
      if(tit) tit.textContent="Pasajes";
      cont.innerHTML='<div class="vacio">'+(cadena()
        ?'Tu búsqueda no aparece en este texto. Probá con «Palabra parcial: sí», con menos palabras o cambiando el modo a «Alguna palabra» en la solapa Buscar.'
        :'Escribí algo arriba y los pasajes aparecen acá.')+'</div>';
      cont._ps=[];
    }else{
      var ps=pasajesDe(texto,cs);
      if(tit) tit.textContent=ps.length+" pasaje"+(ps.length===1?"":"s")+" con contexto";
      cont.innerHTML=ps.map(function(p,i){
        return '<div class="pasaje"><div class="txt">'+p.html+'</div><div class="acc">'+
          '<button class="mini" data-act="pas-cita" data-i="'+i+'">Copiar con la cita</button>'+
          '<button class="mini" data-act="pas-copiar" data-i="'+i+'">Copiar el pasaje</button>'+
          '<button class="mini" data-act="pas-guardar" data-i="'+i+'">Guardar</button>'+
          '<span class="pos">carácter '+p.ini+'</span></div></div>';
      }).join("");
      cont._ps=ps;
    }
  }
  irAMarca(false);
}

function irAMarca(mover){
  try{
    var doc=document.getElementById("doc");
    if(!doc) return;
    var ms=doc.querySelectorAll("mark");
    if(!ms.length) return;
    var i=Math.max(0,Math.min(estado.marca,ms.length-1));
    for(var k=0;k<ms.length;k++) ms[k].className=(k===i?"actual":"");
    if(mover&&ms[i].scrollIntoView) ms[i].scrollIntoView({block:"center"});
  }catch(e){}
}

function formatoCita(tipo,c){
  var C=c.car?'"'+c.car+'"':'"[carátula]"';
  if(tipo==="csjn") return "CSJN, "+C+(c.fecha?", sent. del "+c.fecha:"")+(c.tomo&&c.pag?", Fallos: "+c.tomo+":"+c.pag:"")+".";
  if(tipo==="scjm") return "SCJM"+(c.trib?", "+c.trib:"")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
  if(tipo==="cidh") return "Corte IDH, Caso "+(c.car||"[caso]")+(c.fecha?". Sentencia de "+c.fecha:"")+(c.tomo?". Serie "+c.tomo:"")+(c.pag?" n.º "+c.pag:"")+".";
  if(tipo==="tedh") return "TEDH, "+C+(c.pag?", n.º "+c.pag:"")+(c.fecha?", sentencia de "+c.fecha:"")+".";
  return (c.trib||"[tribunal]")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
}

/* ============================================================
   Verificador de citas
   ============================================================
   Pegás una cita, el servidor la lee (backend/lib/citas.js) y la busca en
   los buscadores oficiales que sabe consultar (backend/lib/verificarCita.js).
   Todo lo que se ve acá sale de esa respuesta: esta página no concluye nada
   por su cuenta y, sobre todo, no convierte un "no lo encontré" en un "es
   falsa". El alcance de la búsqueda queda escrito en pantalla siempre, haya
   o no resultado, porque es la única forma de que el veredicto se lea con la
   reserva que corresponde. */

var VEREDICTOS={
  verificada:{clase:"si",rotulo:"Coincidencia encontrada"},
  no_encontrada:{clase:"no",rotulo:"No la encontramos"},
  no_verificable:{clase:"duda",rotulo:"No se pudo verificar"}
};

function verificarCitaPegada(){
  var ta=document.getElementById("cita-in");
  var txt=(ta?ta.value:estado.cita.texto||"").trim();
  estado.cita.texto=txt;
  if(!txt){ flash("Pegá la cita que querés verificar"); return; }
  if(!estado.api){ flash("Esta función necesita el servidor, y ahora no responde"); return; }
  if(estado.cita.cargando) return; // ya hay uno en camino, no duplicar el pedido

  estado.cita.cargando=true; estado.cita.error=null; estado.cita.salida=null; render();
  fetch(estado.api+"/verificar-cita",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({texto:txt})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cita.cargando=false;
      if(!d||!d.ok){
        estado.cita.error=(d&&d.mensaje)||"El servidor no pudo verificar la cita.";
        render(); return;
      }
      estado.cita.salida=d;
      render();
      var v=VEREDICTOS[d.veredicto];
      flash(v?v.rotulo:"Listo");
    })["catch"](function(){
      estado.cita.cargando=false;
      estado.cita.error="Se cortó la comunicación con el servidor.";
      render();
    });
}

    (sinServidor

      :'')+
    '<div class="acciones" style="margin-top:4px">'+
      '<button class="btn" data-act="verificar-cita"'+((estado.cita.cargando||sinServidor)?" disabled":"")+'>'+
        (estado.cita.cargando?"Buscando en las fuentes…":"Verificar la cita")+'</button>'+
      '<button class="btn sec" data-act="limpiar-cita">Empezar de nuevo</button>'+
    '</div>'+
    (estado.cita.error?'<p style="font-size:13.5px;color:#e0a3a3;margin:12px 0 0">'+esc(estado.cita.error)+'</p>':'')+
    '</div>';
}

function vistaVerificar(){
  // El alcance va fijo y arriba, no escondido en el resultado: sin eso, un
  // "no la encontramos" se lee como "no existe", que es exactamente lo que
  // este verificador no puede afirmar.
  var alcance=(estado.cita.salida&&estado.cita.salida.alcance)||
    "Poder Judicial de Mendoza · TSJ de la Ciudad de Buenos Aires · SAIJ · Corte Suprema (vía SAIJ)";
  return '<div class="aviso"><strong>Una cita inventada te cuesta el caso.</strong> Ya hubo sanciones a abogados por citar fallos generados por inteligencia artificial que no existían. '+
    'Pegá la cita acá abajo y la busco en las fuentes oficiales; después, el protocolo completo tarda dos minutos.</div>'+
    panelVerificadorCita()+
    resultadoCita()+
    '<div class="aviso" style="border-style:dashed"><strong>Hasta dónde llega esta verificación.</strong> Solo puedo buscar en los buscadores que este proyecto tiene integrados: '+
      esc(alcance)+'. Ninguno publica todo lo que su tribunal dictó, y la jurisprudencia argentina vive repartida en decenas de sistemas más. '+
      'Por eso <strong>no encontrar una cita acá no prueba que sea falsa</strong>: puede no estar indexada, estar cargada con otra carátula, o no ser real. '+
      'Y al revés: que el fallo exista no significa que diga lo que la cita le atribuye — eso solo se comprueba leyendo el considerando.</div>'+
    '<div class="blk"><h3>Protocolo de verificación</h3><ol>'+
      '<li><strong>Buscá la carátula literal</strong> en la base oficial del tribunal que la dictó. Si no aparece, no existe hasta que se pruebe lo contrario.</li>'+
      '<li><strong>Cruzá tomo y página</strong> con la colección Fallos si es de la CSJN, o el número de expediente si es provincial.</li>'+
      '<li><strong>Abrí el texto completo</strong> y leé el considerando que vas a citar. Los sumarios recortan y a veces el holding está en otro voto.</li>'+
      '<li><strong>Fijate quién votó y si hubo disidencia.</strong> Citar una disidencia como doctrina mayoritaria es un error caro.</li>'+
      '<li><strong>Controlá si sigue vigente:</strong> revocaciones posteriores, cambios de composición del tribunal, reformas legislativas que dejaron el criterio sin objeto.</li>'+
      '<li><strong>Guardá el PDF con fecha de consulta.</strong> Si después el enlace cae, tenés el respaldo.</li>'+
    '</ol></div>'+
    '<div class="blk"><h3>Señales de que una cita puede ser falsa</h3><ul>'+
      '<li>La carátula es demasiado prolija y le calza perfecto a tu caso.</li>'+
      '<li>No aparece en ninguna base oficial, solo en un resumen o en un chat.</li>'+
      '<li>El tomo de Fallos no corresponde al año de la sentencia.</li>'+
      '<li>El tribunal citado no tenía competencia en esa materia en esa época.</li>'+
      '<li>Nadie más la cita: ni doctrina, ni fallos posteriores, ni el buscador del propio tribunal.</li>'+
    '</ul></div>'+
    '<div class="blk"><h3>Por qué los resultados no aparecen solos</h3>'+
      '<p>Los navegadores impiden que un sitio lea el contenido de otro salvo que ese otro lo autorice expresamente. Ningún organismo judicial argentino da esa autorización, '+
      'así que ninguna página puede mostrarte adentro los resultados de la SCJM, de SAIJ o del CIJ. Saltearlo exige montar un servidor intermediario que se rompe cada vez que el organismo cambia su sitio.</p>'+
      '<p>La alternativa que sí es segura: la búsqueda te lleva a la fuente, y el <strong>Lector</strong> te trae el texto de vuelta con todo resaltado. '+
      'Si además dejás activado «Resaltar la frase en la página que se abre», el navegador te marca el pasaje en el sitio oficial apenas carga.</p>'+
      '<p>Nunca vas a leer acá un fallo que no hayas traído vos desde una base oficial. Esa es la garantía.</p>'+
    '</div>'+
    '<div class="blk"><h3>Qué hace y qué no hace esta web</h3>'+
      '<p><strong>Hace:</strong> arma la consulta con operadores correctos, mantiene el catálogo de bases oficiales y te lleva directo al buscador que corresponde.</p>'+
      '<p><strong>No hace:</strong> no guarda copias de fallos, no los resume, no los interpreta y no genera texto jurídico. Todo lo que leas viene de la fuente oficial que abras.</p>'+
      '<p>Si un enlace dejó de funcionar porque el organismo movió su sitio, usá «Buscar en el sitio» en esa misma ficha: esa búsqueda se resuelve por dominio y encuentra la página nueva.</p>'+
    '</div>';
}

     :'<div class="vacio">Todavía no guardaste ninguna fuente. Tocá la estrella en cualquier ficha para tenerla a mano.</div>')+'</div>';
  h+='<div class="blk"><h3>Búsquedas de esta sesión</h3>';

  }
  h+='</div>';
  return h;
}

document.addEventListener("click",function(ev){
  var t=ev.target;
  var b=t.closest?t.closest("[data-act],[data-tab],[data-rama]"):null;
  if(!b) return;

  if(b.hasAttribute("data-tab")){ estado.tab=b.getAttribute("data-tab"); render(); return; }

  var act=b.getAttribute("data-act");

  if(b.hasAttribute("data-rama")&&act!=="ir-rama"){
    estado.rama=b.getAttribute("data-rama")||""; render(); return;
  }
  if(act==="ir-rama"){ estado.rama=b.getAttribute("data-rama")||""; estado.tab="buscar"; render(); window.scrollTo(0,0); return; }

  if(act==="modo"){ estado.modo=b.getAttribute("data-modo"); render(); return; }
  if(act==="amb"){
    var k=b.getAttribute("data-amb");
    estado.ambitos[k]=!estado.ambitos[k];
    if(!Object.keys(estado.ambitos).some(function(x){return estado.ambitos[x];})){
      estado.ambitos[k]=true; flash("Dejá al menos un ámbito activo");
    }
    render(); return;
  }
  if(act==="voz"||act==="rehacer"){
    estado.q=b.getAttribute("data-v")||""; estado.modo="exacta"; estado.tab="buscar";
    render(); window.scrollTo(0,0);
    var i=document.getElementById("q"); if(i) i.focus();
    return;
  }
  if(act==="fav"){
    var id=b.getAttribute("data-id");
    estado.fav[id]=!estado.fav[id];
    store.set("jedj:fav",estado.fav);
    guardarEnCuenta(); // con sesión iniciada, también queda en la cuenta
    render(); return;
  }
  if(act==="auth-modo"){ estado.authModo=b.getAttribute("data-modo"); estado.authError=null; render(); return; }
  if(act==="auth-registro"||act==="auth-login"){
    if(!estado.api){ flash("El servidor no está disponible ahora"); return; }
    enviarAuth(act==="auth-registro"?"registro":"login");
    return;
  }
  if(act==="auth-logout"){
    var tok=estado.token;
    estado.authCargando=true; render();
    fetch(estado.api+"/auth/logout",{method:"POST",headers:{authorization:"Bearer "+tok}})
      ["catch"](function(){})
      .then(function(){
        estado.authCargando=false; estado.token=null; estado.usuario=null;
        store.set("jedj:token",null);
        // Lo traído de la cuenta se va con la sesión: si esto es una
        // computadora prestada, no queda a la vista de quien entre después.
        estado.fav={}; estado.hist=[]; estado.pasajes=[]; estado.sincronizadoEn=null;
        store.set("jedj:fav",{}); store.set("jedj:pasajes",[]);
        render();
      });
    return;
  }
  if(act==="google"){
    var c=cadena();
    if(!c){ flash("Escribí algo en «Qué buscás» primero"); return; }
    recordar(c);
    window.open(urlGoogleSitio(b.getAttribute("data-dom")),"_blank","noopener");
    return;
  }
  if(act==="indice-tribunal"){
    var slugT=b.getAttribute("data-fuente");
    estado.indices[slugT].tribunal=b.getAttribute("data-tribunal");
    // Si ya habías buscado, cambiar de tribunal repite la búsqueda sola —
    // si no, cambiar el chip no parece hacer nada hasta tocar "Buscar" de nuevo.
    if(estado.indices[slugT].busco && estado.q.trim()) buscarEnFuente(slugT);
    else render();
    return;
  }
  if(act==="indice-secretaria"){
    var slugS=b.getAttribute("data-fuente"), sec=b.getAttribute("data-sec");
    var imS=estado.indices[slugS];
    // Filtro sobre lo ya traído, no vuelve a pedirle nada al sitio — tocar
    // la misma otra vez la saca (vuelve a mostrar todas las secretarías).
    imS.secFiltro=(imS.secFiltro===sec)?"":sec;
    render(); return;
  }
  if(act==="buscar-indice"){
    buscarEnFuente(b.getAttribute("data-fuente"));
    return;
  }
  if(act==="indice-pagina"){
    var slugP=b.getAttribute("data-fuente");
    var paginaP=Number(b.getAttribute("data-pagina"));
    if(paginaP>=1) buscarEnFuente(slugP,paginaP);
    return;
  }
  if(act==="traer-indice-fallo"){
    var linkIdx=b.getAttribute("data-url");
    var slugIdx=b.getAttribute("data-fuente");
    // La ficha ya vino con carátula, tribunal, expediente y fecha directo
    // del buscador oficial: la guardamos para no tener que adivinarla de
    // nuevo con detectar() sobre el texto crudo (ver datosDoc()).
    var imIdx=estado.indices[slugIdx];
    var fichaIdx=(imIdx&&imIdx.resultados||[]).filter(function(x){return x.linkFallo===linkIdx;})[0];
    traerDocEnLector(linkIdx,{fichaConocida:fichaIdx?fichaDesdeIndice(slugIdx,fichaIdx):null});
    return;
  }
  if(act==="barrido"){
    var q=cadena();
    if(!q){ flash("Escribí algo en «Qué buscás» primero"); return; }
    var doms=[],vistos={};
    fuentesFiltradas().forEach(function(f){
      if(!vistos[f.dom]&&doms.length<12){vistos[f.dom]=1;doms.push(f.dom);}
    });
    if(!doms.length){ flash("No hay fuentes seleccionadas"); return; }
    recordar(q);
    var expr="("+doms.map(function(d){return "site:"+d;}).join(" OR ")+") "+q+rangoFechas();
    window.open("https://www.google.com/search?q="+encodeURIComponent(expr),"_blank","noopener");
    flash("Buscando en "+doms.length+" sitios a la vez");
    return;
  }
  if(act==="copiar-cadena"){ copiar(cadena()); return; }
  if(act==="limpiar"){
    estado.q="";estado.excluir="";estado.desde="";estado.hasta="";estado.rama="";estado.modo="exacta";
    render(); return;
  }
  if(act==="verificar-cita"){ verificarCitaPegada(); return; }
  if(act==="limpiar-cita"){
    estado.cita={texto:"",cargando:false,error:null,salida:null};
    render(); window.scrollTo(0,0); return;
  }
  if(act==="armar-cita"){ armarCita(); return; }
  if(act==="copiar-cita"){
    var o=document.getElementById("cita-out");
    copiar(o?o.textContent.trim():""); return;
  }

  /* ---- lector ---- */
  if(act==="traer-link"){
    var iu=document.getElementById("doc-url");
    var link=iu?iu.value.trim():"";
    if(!link){ flash("Pegá el enlace del fallo"); return; }
    traerDocEnLector(link);
    return;
  }
  if(act==="aplicar-ocr"){
    if(estado.cargandoOcr) return; // ya hay uno en camino, no duplicar el pedido
    var urlOcr=b.getAttribute("data-url");
    if(urlOcr) traerOcrEnLector(urlOcr,estado.errorLink&&estado.errorLink.opciones);
    else if(estado.errorLink&&estado.errorLink.archivo) traerOcrDeArchivo(estado.errorLink.archivo);
    return;
  }
  if(act==="elegir-archivo"){
    var inpArch=document.getElementById("doc-archivo");
    if(inpArch) inpArch.click();
    return;
  }
  if(act==="analizar"){
    var ta=document.getElementById("doc-in"),de=document.getElementById("doc-de");
    var txt=ta?ta.value:"";
    if(!txt||txt.trim().length<40){ flash("Pegá el texto del fallo primero"); return; }
    if(txt.length>2000000){ txt=txt.slice(0,2000000); flash("El fallo era enorme: se cargaron los primeros 2 millones de caracteres"); }
    estado.texto=txt; estado.fuenteDe=de?de.value.trim():""; estado.marca=0; estado.fichaConocida=null;
    render(); window.scrollTo(0,0); return;
  }
  if(act==="doc-otro"){ estado.texto=""; estado.fuenteDe=""; estado.marca=0; estado.infoDoc=null; estado.fichaConocida=null; estado.errorLink=null; render(); window.scrollTo(0,0); return; }
  if(act==="marca-sig"||act==="marca-ant"){
    var cs2=coincidencias(estado.texto),total=Math.min(cs2.length,TOPE_MARCAS);
    if(!total){ flash("No hay coincidencias para recorrer"); return; }
    estado.marca=(estado.marca+(act==="marca-sig"?1:-1)+total)%total;
    irAMarca(true); conteoLector(cs2);
    return;
  }
  if(act==="tog-parcial"){ estado.parcial=!estado.parcial; estado.marca=0; pintarLector();
    var bp=document.querySelector('[data-act="tog-parcial"]');
    if(bp){ bp.setAttribute("aria-pressed",estado.parcial?"true":"false");
            bp.textContent=estado.parcial?"Palabra parcial: sí":"Palabra parcial: no"; }
    return; }
  if(act==="meta-a-cita"){
    var dd=datosDoc(estado.texto||"");
    estado.tab="citas"; render();
    function pon(id,v){ var e=document.getElementById(id); if(e&&v) e.value=v; }
    pon("c-tipo",dd.tipo||"cam"); pon("c-car",dd.car); pon("c-trib",dd.sala||dd.trib);
    pon("c-fecha",dd.fecha); pon("c-tomo",dd.tomo); pon("c-pag",dd.pag); pon("c-exp",dd.exp);
    armarCita(); window.scrollTo(0,0); return;
  }
  if(act==="copiar-doc-cita"){ copiar(citaDelDoc()); return; }
  if(act==="pas-copiar"||act==="pas-cita"||act==="pas-guardar"){
    var cont=document.getElementById("pasajes");
    var ps=cont&&cont._ps?cont._ps:[];
    var p=ps[parseInt(b.getAttribute("data-i"),10)];
    if(!p){ flash("No pude recuperar ese pasaje"); return; }
    if(act==="pas-copiar"){ copiar(p.txt); return; }
    var bloque=citaDelDoc()+"\n«"+p.txt+"»\n(consultado el "+hoy()+(estado.fuenteDe?" en "+estado.fuenteDe:"")+")";
    if(act==="pas-cita"){ copiar(bloque); return; }
    // Guarda de dónde salió (para "Ver el original" y "Abrir en el Lector")
    // y con qué búsqueda estaba resaltado (para que, al reabrirlo, la cita
    // vuelva a marcarse igual). Un pasaje pegado a mano sin URL de origen
    // guarda url:"" — no hay adónde volver, y la vista lo dice.
    estado.pasajes=[{t:bloque,r:cadena(),url:estado.fuenteDe||"",q:estado.q,modo:estado.modo}]
      .concat(estado.pasajes).slice(0,60);
    store.set("jedj:pasajes",estado.pasajes);
    guardarEnCuenta();
    flash("Pasaje guardado · "+estado.pasajes.length+" en total");
    return;
  }
  if(act==="pasajes-copiar"){
    copiar(estado.pasajes.map(function(x){return x.t;}).join("\n\n———\n\n")); return;
  }
  if(act==="pasajes-borrar"){
    estado.pasajes=[]; store.set("jedj:pasajes",[]); guardarEnCuenta(); render(); return;
  }
  if(act==="pasaje-a-lector"){
    var pl=estado.pasajes[parseInt(b.getAttribute("data-i"),10)];
    if(!pl){ flash("No pude recuperar ese pasaje"); return; }
    if(!pl.url){ flash("Este pasaje se pegó a mano: no tiene un enlace de origen al que volver."); return; }
    traerDocEnLector(pl.url,{qRestaurar:pl.q,modoRestaurar:pl.modo});
    return;
  }
  if(act==="tog-frag"){ estado.resaltarFuente=!estado.resaltarFuente; render(); return; }
},false);

/* inputs */
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="q"){
    estado.q=ev.target.value; estado.marca=0; pintarCadena();
    if(estado.tab==="lector"){
      if(estado.texto.length<150000){ pintarLector(); }
      else { clearTimeout(window._tl); window._tl=setTimeout(pintarLector,170); }
    }
  }
  else if(id==="buscarRama"){
    estado.buscarRama=ev.target.value;
    var lr=document.getElementById("listaRamas");
    if(lr) lr.innerHTML=listaRamasHTML();
  }
  else if(id==="auth-email"){estado.authEmail=ev.target.value;}
  // Se guarda sin repintar: un render() acá le sacaría el foco al textarea
  // en mitad de la frase. El repintado llega solo cuando se toca "Verificar".
  else if(id==="cita-in"){estado.cita.texto=ev.target.value;}
  else if(id==="excluir"){estado.excluir=ev.target.value;pintarCadena();}
  else if(id==="desde"){estado.desde=ev.target.value;pintarCadena();}
  else if(id==="hasta"){estado.hasta=ev.target.value;pintarCadena();}
},false);

/* Archivo elegido en el Lector: se manda tal cual al servidor, que decide
   como leerlo por la firma de los bytes (PDF o .doc), no por la extensión.
   El archivo no se guarda en ningún lado: se lee y vuelve como texto. */
document.addEventListener("change",function(ev){
  if(!ev.target||ev.target.id!=="doc-archivo") return;
  var arch=ev.target.files&&ev.target.files[0];
  if(!arch) return;
  ev.target.value=""; // permite volver a elegir el mismo archivo
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }

  estado.cargando=true; estado.errorLink=null; render();
  fetch(estado.api+"/extraer-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if(!d||!d.ok){
        // Si es un escaneo, se guarda el propio archivo (un File es
        // inmutable, no hace falta releerlo) para poder ofrecer "Aplicar
        // OCR" sin pedir que lo vuelva a elegir — ver avisoErrorLector().
        estado.errorLink={mensaje:(d&&d.mensaje)||"No se pudo leer el archivo.",
          ayuda:(d&&d.codigo)==="PDF_ESCANEADO"
            ?"Es una foto del papel, sin texto adentro. Tocá «Aplicar OCR» acá abajo."
            :"Se leen PDF y .doc de Word. Si es otro formato, abrilo y pegá el texto a mano.",
          codigo:d&&d.codigo,archivo:(d&&d.codigo)==="PDF_ESCANEADO"?arch:null};
        render(); return;
      }
      estado.texto=d.texto;
      estado.fuenteDe=""; // no hay enlace: el origen es un archivo propio
      estado.infoDoc=d;
      estado.fichaConocida=null;
      estado.marca=0;
      render(); window.scrollTo(0,0);
      flash(arch.name+" · "+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Si el archivo es muy grande puede haberse pasado del límite."};
      render();
    });
},false);

/* Enter: en Buscar lanza el barrido, en el Lector salta a la coincidencia siguiente */
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="q"){
    ev.preventDefault();
    var sel=estado.tab==="lector"?'[data-act="marca-sig"]':'[data-act="barrido"]';
    var btn=document.querySelector(sel);
    if(btn) btn.click();
  }
  if(ev.key==="/"&&ev.target&&["INPUT","TEXTAREA","SELECT"].indexOf(ev.target.tagName)===-1){
    var i=document.getElementById("q");
    if(i){ev.preventDefault();i.focus();i.select();}
  }
},false);

function recordar(q){
  if(!q) return;
  estado.hist=[q].concat(estado.hist.filter(function(x){return x!==q;})).slice(0,20);
  guardarEnCuenta();
}

function armarCita(){
  function val(id){var e=document.getElementById(id);return e?String(e.value).trim():"";}
  var tipo=val("c-tipo")||"csjn";
  var s=formatoCita(tipo,{car:val("c-car"),trib:val("c-trib"),fecha:val("c-fecha"),
                          tomo:val("c-tomo"),pag:val("c-pag"),exp:val("c-exp")});
  var o=document.getElementById("cita-out");
  if(o) o.textContent=s;
  flash("Cita armada — verificá los datos en la fuente");
}

   9. Arranque

render();
detectarServidor();
store.get("jedj:fav",function(v){
  if(!v||typeof v!=="object") return;
  estado.fav=v;
  var activo=document.activeElement;
  if(activo&&["INPUT","SELECT","TEXTAREA"].indexOf(activo.tagName)!==-1) return;
  render();
});
store.get("jedj:pasajes",function(v){
  if(!Array.isArray(v)||!v.length) return;
  estado.pasajes=v;
  var activo2=document.activeElement;
  if(activo2&&["INPUT","SELECT","TEXTAREA"].indexOf(activo2.tagName)!==-1) return;
  render();
});

})();
</script>
