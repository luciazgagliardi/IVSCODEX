  function etiquetaBase(n){
    var b=LEYES_BASE[soloDigitos(n)];
    return b?"Ley "+formatLeyNum(n)+" — "+b.nombre+(b.vigente===false?" (derogada)":""):null;
  }
  var reLeyBase=/^Ley\s+([\d.]+)$/;
  var grupos2={},ordenGrupos2=[],catDeGrupo2={};
  ordenGrupos.forEach(function(k){
    var mm=k.match(reLeyBase),destino=k,catOverride=null;
    if(mm){
      var b=LEYES_BASE[soloDigitos(mm[1])];
      if(b){ destino=etiquetaBase(mm[1]); catOverride=b.cat; }
    }
    if(!grupos2[destino]){
      grupos2[destino]=[]; ordenGrupos2.push(destino);
      catDeGrupo2[destino]=catOverride||catDeGrupo[k];
    }
    grupos[k].forEach(function(a){ if(grupos2[destino].indexOf(a)===-1) grupos2[destino].push(a); });
  });
  grupos=grupos2; ordenGrupos=ordenGrupos2; catDeGrupo=catDeGrupo2;
  /* Segunda pasada: toda ley nombrada en el texto, tenga o no un artículo
     puntual cerca (esta regex no exige "art." al lado, solo "ley N"). Antes
     las que no tenían artículo se listaban aparte, como una etiqueta suelta
     al mismo nivel visual que un número de artículo — confuso, porque una
     ley entera y un artículo puntual no son lo mismo. Ahora entran al mismo
     agrupador que las demás: siempre título de ley + sus artículos (aunque
     la lista de artículos quede vacía), nunca una etiqueta sin más. */
  var leyes={},reLey=/\bley(?:es)?\s*(?:provincial(?:es)?\s+|nacional(?:es)?\s+|federal(?:es)?\s+)?(?:n[°ºo.]?\s*)?((?:\d[\d\.]{2,7}(?:\s*(?:,|y|e)\s*(?:n[°ºo.]?\s*)?)?)+)/gi,mLey;
  while((mLey=reLey.exec(texto))){
    var esProv=/provincial/i.test(mLey[0]);
    var numsLey=mLey[1].match(/\d[\d\.]{2,7}/g)||[];
    numsLey.forEach(function(n){
      var etiqueta=etiquetaBase(n)||("Ley "+formatLeyNum(n));
      if(!leyes.hasOwnProperty(etiqueta)){
        var b=LEYES_BASE[soloDigitos(n)];
        leyes[etiqueta]=b?b.cat:(esProv?"provincial":"leyes");
      }
    });
  }
  Object.keys(leyes).forEach(function(k){
    if(grupos[k]) return; // ya tiene su propio grupo con artículos detectados
    grupos[k]=[]; ordenGrupos.push(k); catDeGrupo[k]=leyes[k];
  });
  d.artsPorFuente=ordenGrupos.map(function(k){ return [k,grupos[k],catDeGrupo[k]]; });
  d.arts=[].concat.apply([],ordenGrupos.map(function(k){ return grupos[k]; }));
  var cit={},cs2=texto.match(/Fallos:?\s*\d{2,3}\s*:\s*\d{1,4}/gi)||[];
  cs2.forEach(function(a){ cit[a.replace(/\s+/g," ")]=1; });
  d.citados=Object.keys(cit);
  return d;
}
/* Cuando el fallo llegó desde un buscador con robot propio (SCJM, CABA),
   ya sabemos la carátula, el tribunal, el expediente y la fecha de la
   fuente oficial: son mejores que cualquier adivinanza por regex sobre
   el texto crudo, así que pisan lo que detectar() haya encontrado. Los
   datos normativos (leyes citadas, artículos) siguen saliendo del texto
   igual, porque de eso el índice no sabe nada. */
function datosDoc(texto){
  var d=detectar(texto);
  var fc=estado.fichaConocida;
  if(fc){
    if(fc.tipo) d.tipo=fc.tipo;
    if(fc.car) d.car=fc.car;
    if(fc.trib){ d.trib=fc.trib; d.sala=""; }
    if(fc.fecha) d.fecha=fc.fecha;
    if(fc.exp) d.exp=fc.exp;
  }

}

/* Ramas y voces se muestran como título ("Obligaciones y Contratos"), a
   pedido. Se hace ACÁ, al dibujar, y nunca sobre RAMAS: los 115 puentes
   del intérprete apuntan a cada voz por su texto exacto, así que cambiarle

   backend/test/interprete.prueba.js). Por lo mismo, el valor que viaja en
   data-v sigue siendo el original — lo que cambia es sólo lo que se lee. */
var SIGUE_EN_MINUSCULA={y:1,e:1,o:1,u:1,de:1,del:1,la:1,las:1,el:1,los:1,
  en:1,a:1,al:1,por:1,para:1,con:1,sin:1,un:1,una:1,se:1,su:1,sus:1,que:1};
function comoTitulo(t){
  return String(t||"").split(" ").map(function(p,i){
    var bajo=p.toLowerCase();
    if(i>0&&SIGUE_EN_MINUSCULA[bajo]) return bajo;
    // slice(1) y no toLowerCase: así "CADH", "TRHA" o "IV" quedan enteras.
    return p.charAt(0).toUpperCase()+p.slice(1);
  }).join(" ");
}

function nombreRama(id){

/* ============================================================
   Estado en la URL — para poder compartir una búsqueda
   ============================================================
   Hasta ahora la dirección nunca cambiaba: daba igual lo que hubieras
   escrito, la URL seguía siendo la raíz. Eso significaba que no se podía
   mandar una búsqueda a un colega, ni guardarla en favoritos, ni volver a
   ella con el botón "atrás" del navegador.

   Van sólo los campos que definen QUÉ se busca (consulta, modo, excluir,
   años, rama, solapa). NO van los resultados: son de los sitios oficiales,
   cambian solos y meterlos en la URL sería congelar algo que no nos
   pertenece. Quien abre el link corre la búsqueda de nuevo y ve lo que hay
   hoy, que es lo correcto para jurisprudencia.

   Tampoco va nada de la cuenta ni del historial: una URL se pega en un mail
   o en un chat, y lo que viaje ahí deja de ser privado. */

var CLAVES_URL=[["q","q"],["modo","m"],["excluir","x"],["desde","d"],["hasta","h"],["rama","r"],["tab","t"]];

/** Vuelca el estado actual a la barra de direcciones, sin ensuciar el historial. */
function guardarEnURL(){
  try{
    var p=new URLSearchParams();
    CLAVES_URL.forEach(function(par){
      var v=estado[par[0]];
      if(v===undefined||v===null||v==="") return;
      if(par[0]==="tab"&&v==="buscar") return;   // la solapa por defecto no hace falta
      if(par[0]==="modo"&&v==="exacta") return;  // el modo por defecto tampoco
      p.set(par[1],String(v));
    });
    var qs=p.toString();
    // replaceState y no pushState: escribir en el campo de búsqueda no debe
    // dejar una entrada en el historial por cada tecla.
    history.replaceState(null,"",qs?("?"+qs):location.pathname);
  }catch(e){ /* si el navegador no deja tocar el historial, la app sigue igual */ }
}

/** Lee la URL al abrir y deja el estado listo antes del primer render. */
function leerDeURL(){
  try{
    var p=new URLSearchParams(location.search);
    if(!p.toString()) return;
    CLAVES_URL.forEach(function(par){
      if(!p.has(par[1])) return;
      var v=p.get(par[1]);
      if(par[0]==="tab"){ if(TABS.some(function(t){return t[0]===v;})) estado.tab=v; return; }
      if(par[0]==="modo"){ if(["exacta","todas","alguna"].indexOf(v)!==-1) estado.modo=v; return; }
      if(par[0]==="rama"){ if(RAMAS.some(function(x){return x.id===v;})) estado.rama=v; return; }
      if(par[0]==="desde"||par[0]==="hasta"){ if(/^\d{4}$/.test(v)) estado[par[0]]=v; return; }
      estado[par[0]]=String(v).slice(0,300);
    });
  }catch(e){ /* URL rara: se ignora y se abre como siempre */ }
}

/**
 * Botón "Compartir" con sus destinos.

 * corre contra los sitios oficiales en ese momento.
 *
 * WhatsApp y el correo se abren con enlaces estándar (wa.me y mailto:), que
 * funcionan igual en la computadora y en el teléfono y no necesitan que esta
 * web hable con ningún servicio: es el navegador el que abre la aplicación

}

/**
 * Menú de compartir, al lado del botón que lo abrió.
 *
 * Reemplaza dos cosas que no servían. Una: el menú del sistema
 * (navigator.share), que en la Mac ofrece AirDrop, Mensajes, Notas —nada
 * de lo que se usa para pasarle un fallo a alguien—. Otra: el desplegable
 * de Buscar, que quedaba tapado por la tarjeta de la fuente de abajo,
 * porque los paneles llevaban backdrop-filter y eso armaba su propio
 * contexto de apilado: ningún z-index de adentro podía subir por encima del
 * panel siguiente. El filtro se sacó al limpiar el vidrio, así que esa causa
 * puntual ya no existe.
 *
 * El menú se sigue colgando del body en posición fija, calculada contra el
 * botón: los contenedores con overflow lo recortarían igual, y así sirve
 * también en los pasajes del Lector, que se pintan por su cuenta y no por
 * render().
 */
function cerrarMenuCompartir(){
  var v=document.getElementById("menu-compartir");
  if(v) v.remove();
}
function menuCompartir(boton,texto,url){
  var abierto=document.getElementById("menu-compartir");
  var mismo=abierto&&abierto._de===boton;
  cerrarMenuCompartir();
  if(mismo) return;   // volver a tocar el mismo botón lo cierra

  var m=document.createElement("div");
  m.id="menu-compartir"; m.className="compartir-menu flotante"; m._de=boton;
  m.innerHTML='<button type="button" data-comp="copiar">Copiar</button>'+
    '<button type="button" data-comp="whatsapp">Enviar por WhatsApp</button>'+
    '<button type="button" data-comp="mail">Enviar por correo</button>';
  document.body.appendChild(m);

  var r=boton.getBoundingClientRect(), alto=m.offsetHeight, ancho=m.offsetWidth;
  // Se abre para abajo salvo que no entre; ahí sube. Y no se pasa del
  // borde derecho de la ventana.
  var arriba=(r.bottom+alto+8>innerHeight)&&(r.top-alto-8>0);
  m.style.top=(arriba?r.top-alto-6:r.bottom+6)+"px";
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-ancho-8))+"px";

  m.addEventListener("click",function(ev){
    var q=ev.target.closest&&ev.target.closest("[data-comp]");
    if(!q) return;
    var que=q.getAttribute("data-comp"), todo=texto+"\n"+url;
    cerrarMenuCompartir();
    if(que==="whatsapp"){ window.open("https://wa.me/?text="+encodeURIComponent(todo),"_blank","noopener"); return; }
    if(que==="mail"){ location.href="mailto:?subject="+encodeURIComponent(String(texto).split("\n")[0].slice(0,120))+
      "&body="+encodeURIComponent(todo); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(todo).then(function(){ flash("Copiado — puede pegarlo donde lo necesite"); })
        ["catch"](function(){ flash("No se pudo copiar automáticamente"); });
    }else flash("No se pudo copiar automáticamente");
  });
}
/* Se cierra solo: tocando afuera, con Escape, o si la página se mueve

document.addEventListener("click",function(ev){

  if(!m) return;
  if(m.contains(ev.target)||m._de===ev.target||(ev.target.closest&&ev.target.closest("[data-act^=compartir]"))) return;
  cerrarMenuCompartir();
},true);
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape") cerrarMenuCompartir(); });
addEventListener("scroll",cerrarMenuCompartir,true);
addEventListener("resize",cerrarMenuCompartir);

/* Todas las formas de un anillo, con qué relación entró cada una. */
function formasDe(anillo){
  var out=[{t:anillo.canonico,rel:"canonico"}];
  (anillo.equivalentes||[]).forEach(function(t){ out.push({t:t,rel:"equivalente"}); });
  (anillo.relacionados||[]).forEach(function(t){ out.push({t:t,rel:"relacionado"}); });
  return out;
}

/* ¿A qué anillo pertenece lo que se escribió? Se busca por el canónico y
   por los equivalentes, no por los relacionados: entrar por un vecino no
   convierte la consulta en el concepto de al lado. */
function anilloDe(termino){
  var t=sinTildes(termino).trim();
  if(!t) return null;
  // Los anillos propios se miran PRIMERO: si la dueña del proyecto escribió
  // uno para un término que también trae el catálogo de fábrica, manda el
  // suyo — es la que sabe de derecho.
  var todos=(estado.anillos||[]).concat(TESAURO);
  for(var i=0;i<todos.length;i++){
    var a=todos[i];
    var candidatos=[a.canonico].concat(a.equivalentes||[]);
    for(var j=0;j<candidatos.length;j++){
      if(sinTildes(candidatos[j])===t) return a;
    }
  }
  return null;
}

/* ¿Este anillo lo cargó la usuaria o vino de fábrica? Se muestra distinto:
   uno se puede borrar y el otro no. */
function esAnilloPropio(a){
  return (estado.anillos||[]).indexOf(a)!==-1;
}

/* Las otras formas de decir lo mismo, sin repetir la que ya está escrita. */
function expandir(termino){
  var a=anilloDe(termino);
  if(!a) return null;
  var puesto=sinTildes(termino).trim();
  return {
    anillo:a,
    variantes:formasDe(a).filter(function(v){ return sinTildes(v.t)!==puesto; })
  };
}

function menuAbierto(on){
  var m=document.getElementById("menu"),b=document.getElementById("abrir-menu");
  if(!m||!b) return;
  m.classList.toggle("is-on",on);
  b.setAttribute("aria-expanded",String(on));
  b.querySelector(".txt").textContent=on?"Cerrar":"Todas las secciones";
  document.documentElement.style.overflow=on?"hidden":"";
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(!t.closest) return;
  if(t.closest("#abrir-menu")){ menuAbierto(!document.getElementById("menu").classList.contains("is-on")); return; }
  if(t.closest("#menu [data-tab]")||t.closest("[data-portada]")) menuAbierto(false);
});
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape") menuAbierto(false); });

/* La cabecera de cada sección: palabra latina, grupo y título. El primer
   aviso de la solapa —el que explica para qué sirve— sube a la cabecera
   y hace de bajada: es el mismo texto de siempre, en el mismo orden, solo
   que sin caja. Las notas sueltas que lo acompañan suben con él.
   La animación de entrada corre solo al cambiar de solapa: render() se
   llama a cada tecla, y repetirla ahí haría parpadear el título. */
function pintarCabecera(v){
  var c=document.getElementById("cab");
  if(!c) return;
  var t=TABS.filter(function(x){return x[0]===estado.tab;})[0]||TABS[0];
  var s=SECCIONES[t[0]];
  c.classList.toggle("quieta",c.getAttribute("data-tab")===t[0]);
  c.setAttribute("data-tab",t[0]);
  c.innerHTML=dibujoSeccion(t[0])+'<p class="cab__ojo"><span class="cab__lat">'+s[0]+'</span>'+esc(s[1])+'</p>'+
    '<h1>'+esc(t[1])+'.</h1>'+
    (t[0]==="buscar"?'<p class="cab__intro">La plataforma interroga de forma simultánea los repositorios oficiales integrados, '+
      'extiende la consulta a las denominaciones equivalentes de cada figura y presenta los resultados unificados, '+
      'con indicación expresa de su procedencia y con el enlace directo al documento de origen.</p>':'');
  var primero=v.firstElementChild;
  if(primero&&primero.classList.contains("aviso")&&(primero.querySelector(".av-tit,.av-oro")||t[0]==="cuenta")){
    c.appendChild(primero);
    var sig=v.firstElementChild;
    while(sig&&sig.classList.contains("nota-suelta")){ c.appendChild(sig); sig=v.firstElementChild; }
  }
}

function pintarRail(){
  var r=document.getElementById("rail");
  var w=document.getElementById("wrap");
  // "requisitos" también queda sin riel: el filtro de ahí es por RAMA, y acá
  // el listado es por TRÁMITE — mostrarlo daría un control que no filtra nada.
  var sinRail=(estado.tab==="citas"||estado.tab==="verificar"||estado.tab==="lector"||estado.tab==="cuenta"||estado.tab==="requisitos"||estado.tab==="norma"||estado.tab==="comparar"||
    estado.tab==="calculos"||estado.tab==="plazos"||estado.tab==="glosario"||estado.tab==="herramientas");
  if(w) w.classList.toggle("sin-rail",sinRail);
  if(sinRail){ r.innerHTML=""; return; }
  // Las fuentes sólo en Buscar: en las otras solapas no hay una búsqueda en
  // curso de la que informar, y el conteo quedaría congelado de la anterior.
  var fuentes="";
  if(estado.tab==="buscar"){
    // Estado de las bases: por cada una, si ya se consultó, si está
    // respondiendo, cuántos documentos trajo y cuánto tardó. Es el mapa de
    // la búsqueda: de un vistazo se ve quién contestó, quién no y quién
    // sigue pensando, sin bajar hasta su sección. Arriba, si el servidor
    // de búsqueda está en línea.
    var consultadas=0,respondieron=0;
    var filas=FUENTES_INDICE.map(function(f){
      var im=estado.indices[f.slug]||{};
      var clase="",der="";
      if(im.cargando){
        clase=" consultando"; der='<span class="rf-t">consultando…</span>'; consultadas++;
      }else if(im.busco&&im.error){
        clase=" con-error"; der='<span class="rf-t">sin respuesta</span>'; consultadas++;
      }else if(im.busco){
        consultadas++; respondieron++;
        der='<span class="rf-n">'+(im.total||im.resultados.length)+'</span>'+
            (im.ms?'<span class="rf-t">'+(im.ms/1000).toLocaleString("es-AR",{maximumFractionDigits:1})+' s</span>':'');
      }else{
        clase=" sin-buscar"; der='<span class="rf-t">en espera</span>';
      }
      // La sigla y no el nombre largo: en el riel "Tribunal Superior de
      // Justicia de la Ciudad de Buenos Aires" parte en dos renglones. Es
      // además la misma sigla que lleva el sello de sus resultados.
      return '<div class="rail-fuente f-'+f.slug+clase+'"><span class="rf-punto"></span>'+
        '<span class="rf-nom">'+esc(f.cod)+'</span>'+der+'</div>';
    }).join("");
    var servidor=estado.api?'Servidor en línea':(estado.api===false?'Servidor sin conexión':'Comprobando el servidor…');
    fuentes='<h2>Estado de las bases</h2>'+
      '<p class="rail-resumen"><span class="rf-srv'+(estado.api?' ok':'')+'"></span>'+servidor+
        (consultadas?' · '+respondieron+' de '+FUENTES_INDICE.length+' respondieron':'')+'</p>'+
      '<div class="rail-fuentes">'+filas+'</div>';
  }
  r.innerHTML=fuentes+
    '<h2>Ramas del derecho</h2>'+
    '<input type="text" id="buscarRama" class="rail-buscador" value="'+esc(estado.buscarRama)+
    '" placeholder="Buscar rama…" autocomplete="off">'+
    '<div class="rail-list" id="listaRamas">'+listaRamasHTML()+'</div>';
}

/* La tira de voces sugeridas, debajo de "Qué buscás".
   Deliberadamente NO reescribe la consulta sola: muestra lo que entendió y
   deja que el abogado toque. Que un buscador jurídico cambie la búsqueda a
   tus espaldas es justo lo que no se puede auditar después. */
/* Cuándo se muestran voces y cuándo se borran.
   Antes esto sólo pisaba la lista si la consulta nueva daba algo, así que
   escribir un caso que el diccionario no conoce dejaba en pantalla las
   voces del caso anterior: se escribía "mi ex se llevó a los chicos a
   España" y seguía ofreciendo "desaparición forzada". Es peor que no
   sugerir nada, porque parece que entendió.
   La única lista que sí se conserva es la de recién: al tocar una voz la
   consulta pasa a ser esa voz, y ahí las hermanas tienen que seguir a
   mano para poder cambiar de una a otra sin reescribir el caso. */
function recalcularSugeridas(){
  var q=sinTildes(estado.q).trim();
  if(estado.sugeridas.some(function(s){ return sinTildes(s.voz)===q; })) return;
  var antes=estado.sugeridas.length, antesR=estado.sugeridaRama;
  var leido=interpretarConsulta(estado.q);
  // Una voz idéntica a lo ya escrito no se ofrece: no agrega nada y
  // ensucia — es el caso de quien ya puso el descriptor exacto.
  estado.sugeridas=leido.voces.filter(function(s){ return sinTildes(s.voz)!==q; });
  // Hay consultas que se reconocen sólo hasta la rama: "divorcio" no cae
  // en ninguna voz puntual, pero sí en Familia. Ofrecer la rama es mejor
  // que no mostrar nada, y forzar un descriptor que no corresponde sería
  // peor que las dos cosas. Se ofrece sólo cuando no hubo voces: con
  // voces, la rama ya va implícita en ellas.
  estado.sugeridaRama=(!estado.sugeridas.length&&leido.ramas.length&&estado.rama!==leido.ramas[0])
    ?leido.ramas[0]:"";

  // Debajo del campo pueden aparecer tres cosas distintas: las voces del
  // intérprete, los equivalentes del tesauro y el ofrecimiento de proponer
  // un anillo nuevo. Repintar sólo cuando cambian las voces dejaba las otras
  // dos sin dibujarse nunca. La firma resume qué debería verse ahora, y el
  // repintado ocurre sólo si cambió — render() rehace el HTML y se lleva
  // puesto el cursor del campo, así que después se devuelve donde estaba.
  var anillo=expandir(String(estado.q||"").trim());
  var firma=(anillo?anillo.anillo.id:"")+"|"+(tiraProponer()?"p":"");
  var cambioAbajo=(firma!==estado.firmaTiras);
  estado.firmaTiras=firma;

  if(antes||estado.sugeridas.length||antesR||estado.sugeridaRama||cambioAbajo){
    var campo=document.getElementById("q");
    var donde=campo?campo.selectionStart:null;
    render();
    if(donde!==null){
      var nuevoCampo=document.getElementById("q");
      if(nuevoCampo){ nuevoCampo.focus(); try{ nuevoCampo.setSelectionRange(donde,donde); }catch(e){} }
    }
  }
}

function tiraSugerencias(){
  if(estado.tab!=="buscar") return "";
  // Si lo escrito ya cae en un anillo del tesauro, manda el tesauro: dice
  // lo mismo pero con la relación tipada (equivalente o cercano), y las
  // dos tiras juntas repetían el mismo chip dos veces.
  if(expandir(String(estado.q||"").trim())) return "";
  if(!estado.sugeridas.length&&estado.sugeridaRama){
    return '<div class="sugeridas">'+
      '<p class="sug-nota">No se encontró una voz puntual para la consulta escrita, '+
      'pero el tema cae en una rama. Abrirla muestra sus voces.</p>'+
      '<div class="chips"><button class="chip voz-sug" data-act="usar-rama" data-rama="'+esc(estado.sugeridaRama)+'">'+
      esc(comoTitulo(nombreRama(estado.sugeridaRama)))+'</button>'+
      '<button class="chip sug-cerrar" data-act="cerrar-sugeridas" title="Ocultar">✕</button></div></div>';
  }
  if(!estado.sugeridas.length) return "";
  var chips=estado.sugeridas.map(function(s){
    var puesta=sinTildes(estado.q).trim()===sinTildes(s.voz).trim();
    return '<button class="chip voz-sug" data-act="usar-voz" data-voz="'+esc(s.voz)+'"'+
           ' aria-pressed="'+(puesta?"true":"false")+'">'+esc(comoTitulo(s.voz))+'</button>';
  }).join("");
  return '<div class="sugeridas">'+
    '<p class="sug-nota"><b>Los buscadores del fuero indexan por voces</b>, no por lenguaje natural: '+
    'la frase entera casi siempre da cero. Para la consulta escrita, las voces son estas.</p>'+
    '<div class="chips">'+chips+
      '<button class="chip sug-cerrar" data-act="cerrar-sugeridas" title="Ocultar">✕</button>'+
    '</div></div>';
}

/* Las otras formas de escribir lo mismo, debajo de la consulta.
   Los equivalentes y los cercanos van en grupos separados y rotulados
   distinto — mezclarlos sería exactamente el error que el tesauro existe
   para evitar (ver la nota grande de TESAURO). */
function tiraEquivalentes(){
  if(estado.tab!=="buscar") return "";
  var e=expandir(String(estado.q||"").trim());
  if(!e||!e.variantes.length) return "";
  function chips(rel){
    return e.variantes.filter(function(v){return v.rel===rel;}).map(function(v){
      return '<button class="chip voz-sug" data-act="usar-equivalente" data-voz="'+esc(v.t)+'">'+
             esc(comoTitulo(v.t))+'</button>';
    }).join("");
  }
  var eq=chips("canonico")+chips("equivalente"), cer=chips("relacionado");
  if(!eq&&!cer) return "";
  return '<div class="sugeridas">'+
    (eq?'<p class="sug-nota"><b>Los tribunales escriben esto mismo de otras formas</b>, y cada una devuelve fallos '+
        'distintos: buscar sólo una deja material afuera.</p><div class="chips">'+eq+'</div>':'')+
    (cer?'<p class="sug-nota" style="margin-top:10px">Cercanos, <b>pero no lo mismo</b> — cambian los presupuestos, '+
        'revíselos antes de citarlos.</p><div class="chips">'+cer+'</div>':'')+
    (e.anillo.nota?'<p class="sug-nota" style="margin:9px 0 0;font-style:italic">'+esc(e.anillo.nota)+'</p>':'')+
    '</div>';
}

/* Pedir una propuesta de anillo cuando lo escrito no está en el tesauro.
   Lo que vuelve es una PROPUESTA, no un cambio: el tesauro se edita a mano,
   con revisión. Por eso abajo hay un botón para copiar el anillo listo para
   pegar, y no uno que diga "agregar". */
function tiraProponer(){
  if(estado.tab!=="buscar"||!estado.api||estado.modeloTesauro!==true) return "";
  var q=String(estado.q||"").trim();
  if(q.length<3||q.length>120) return "";
  if(expandir(q)) return "";                    // ya tiene anillo: no hay nada que proponer
  var p=estado.propuesta;

  if(p.cargando&&p.para===q)
    return '<div class="sugeridas"><p class="sug-nota">Buscando de qué otras formas se escribe «'+esc(q)+'»…</p></div>';

  if(p.error&&p.para===q)
    return '<div class="sugeridas"><p class="sug-nota">'+esc(p.error)+'</p></div>';

  if(p.salida&&p.para===q){
    var s=p.salida;
    function chips(lista){
      return (lista||[]).map(function(t){
        return '<button class="chip voz-sug" data-act="usar-equivalente" data-voz="'+esc(t)+'">'+esc(comoTitulo(t))+'</button>';
      }).join("");
    }
    if(!s.equivalentes.length&&!s.relacionados.length)
      return '<div class="sugeridas"><p class="sug-nota">No se encontraron otras formas de escribir «'+esc(q)+'».</p></div>';
    return '<div class="sugeridas">'+
      '<p class="sug-nota"><b>Propuesta, para revisar.</b> Esto lo sugirió el asistente y todavía no está en el tesauro: '+
      'compruébelo antes de darlo por bueno.</p>'+
      (s.equivalentes.length?'<p class="sug-nota" style="margin-top:8px">Serían lo mismo:</p><div class="chips">'+chips(s.equivalentes)+'</div>':'')+
      (s.relacionados.length?'<p class="sug-nota" style="margin-top:10px">Cercanos, <b>pero no lo mismo</b>:</p><div class="chips">'+chips(s.relacionados)+'</div>':'')+
      (s.nota?'<p class="sug-nota" style="margin:9px 0 0;font-style:italic">'+esc(s.nota)+'</p>':'')+
      '<div class="chips" style="margin-top:10px">'+
        '<button class="chip sug-cerrar" data-act="copiar-anillo">Copiar el anillo para el tesauro</button>'+
        '<button class="chip sug-cerrar" data-act="cerrar-propuesta">✕</button>'+
      '</div></div>';
  }

  return '<div class="sugeridas"><p class="sug-nota">«'+esc(comoTitulo(q))+'» todavía no está en el tesauro. '+
    'Si los tribunales lo escriben de otra forma, esa otra forma trae fallos distintos.</p>'+
    '<div class="chips"><button class="chip voz-sug" data-act="pedir-propuesta">Buscar cómo se escribe de otras formas</button></div></div>';
}

function vistaBuscar(){
  var ambChips=Object.keys(AMB).map(function(k){
    return '<button class="chip amb" data-act="amb" data-amb="'+k+'" aria-pressed="'+(estado.ambitos[k]?"true":"false")+'">'+esc(AMB[k].n)+'</button>';
  }).join("");
  var modos=[["exacta","Frase exacta"],["todas","Todas las palabras"],["alguna","Alguna palabra"]].map(function(m){
    return '<button class="chip" data-act="modo" data-modo="'+m[0]+'" aria-pressed="'+(estado.modo===m[0]?"true":"false")+'">'+esc(m[1])+'</button>';
  }).join("");

  var sug="";
  if(estado.rama){
    var R=RAMAS.filter(function(x){return x.id===estado.rama;})[0];

      tiraSugerencias()+

      '<div class="busq-grupo"><span class="busq-rotulo">Cómo combinar las palabras</span><div class="chips">'+modos+'</div></div>'+
      '<div class="busq-grupo"><span class="busq-rotulo">Dónde buscar</span><div class="chips">'+ambChips+'</div></div>'+
      '<div class="fila">'+
        '<label class="campo"><span>Excluir palabras</span><input type="text" id="excluir" value="'+esc(estado.excluir)+'" placeholder="seguro laboral" autocomplete="off"></label>'+
        '<label class="campo"><span>Año desde</span><input type="number" id="desde" value="'+esc(estado.desde)+'" min="1863" max="2100" placeholder="2015"></label>'+
        '<label class="campo"><span>Año hasta</span><input type="number" id="hasta" value="'+esc(estado.hasta)+'" min="1863" max="2100" placeholder="2026"></label>'+

        FUENTES_INDICE.map(function(f){

    // Qué servidor está atendiendo. Importa saberlo: el publicado corre en un

    (estado.api?avisoServidor():"")+

}

function avisoServidor(){
  var local=/localhost|127\.0\.0\.1/.test(String(estado.api||""))||String(estado.api||"").charAt(0)==="/";
  if(local) return '<p style="font-size:12px;color:var(--humo);margin:0 0 12px">Servidor: <b style="color:var(--lacre)">el propio</b> · todo disponible, incluido el texto completo de los fallos de CABA.</p>';
  // Sin número acá adentro: decía "las cuatro búsquedas andan" y ya iban
  // seis. El conteo sale de FUENTES_INDICE, que es donde se agregan.
  return '<p style="font-size:12px;color:var(--humo);margin:0 0 12px">Para procesar el texto completo de un fallo de CABA, '+
    'es necesario descargarlo previamente e introducirlo de manera directa en el Lector.</p>';
}

/* Conectores que aparecen en cualquier texto jurídico. No se resaltan: en
   "archivo de desidia" marcar cada "de" del fallo ensucia todo y no dice
   nada. Misma lista que usa el servidor en lib/relevancia.js. */
var VACIAS={de:1,del:1,la:1,las:1,el:1,los:1,un:1,una:1,unos:1,unas:1,
  y:1,e:1,o:1,u:1,en:1,al:1,a:1,ante:1,con:1,sin:1,por:1,para:1,que:1,
  se:1,su:1,sus:1,lo:1,le:1,les:1,es:1,son:1,como:1,mas:1,sobre:1,
  entre:1,desde:1,hasta:1,segun:1,contra:1,ni:1,no:1};

/* Las palabras de la consulta que vale la pena resaltar. */
function palabrasResaltables(q){
  return palabras(q).filter(function(w){
    var limpia=w.replace(/["'()]/g,"");
    if(limpia.length<3) return false;
    try{ limpia=limpia.normalize("NFD").replace(/[̀-ͯ]/g,""); }catch(e){}
    return !VACIAS[limpia.toLowerCase()];
  });
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

/* ---- Resultados en vivo de los buscadores con robot propio ---- */
function resaltarSimple(texto,q){
  var t=esc(texto||"");
  // Frase exacta: se marca la frase entera y nada más. Marcando palabra por
  // palabra, "archivo desidia" resaltaba "archivo" por un lado y "desidia"
  // por otro, como si hubieran coincidido separadas — que es justo lo que
  // ese modo NO busca. Si la frase no está, no se resalta nada.
  if(estado.modo==="exacta"){
    var frase=String(q||"").replace(/["'()]/g," ").replace(/\s+/g," ").trim();
    if(!frase) return t;
    var reF=new RegExp("("+escRe(esc(frase)).replace(/\\?\s+/g,"\\s+")+")","ig");
    return t.replace(reF,"<mark>$1</mark>");
  }
  palabrasResaltables(q).forEach(function(w){
    var re=new RegExp("("+escRe(esc(w.replace(/["'()]/g,"")))+")","ig");
    t=t.replace(re,"<mark>$1</mark>");
  });
  return t;
}

/* Cada fuente trae los campos que su buscador ofrece: Mendoza da voces y
   sumario, CABA da carátula y secretaría pero no sumario. La ficha se
   arma con lo que haya. */
/* La fecha del índice viene como "27/07/2026 - Sentencia": nos quedamos
   solo con la parte de fecha, que es la que entiende el formateador. */
/* Mensajes de ayuda según el código de error que devuelve /api/extraer,
   compartidos por todo lo que trae un documento al Lector. */
var AYUDAS_ERROR_LINK={
  DOMINIO_NO_PERMITIDO:"Agregue el dominio en server/config.js y reinicie el servidor.",
  PDF_ESCANEADO:"Es una foto del papel, sin texto adentro. Toque «Aplicar OCR» aquí abajo — tarda, pero funciona sin salir de la página.",
  HTML_SIN_TEXTO:"Pasa cuando el fallo está dentro de un frame o se arma con JavaScript. Abra el enlace y pegue el texto a mano.",
  RESPUESTA_NO_OK:"Verifique que el enlace sea el del documento y no el del buscador.",
  TIEMPO_AGOTADO:"Los sitios judiciales se ponen lentos en horario de tribunales. Pruebe más tarde.",
  RED_PRIVADA:"El servidor no descarga de direcciones internas. Está bien que pase."
};

/* Trae un documento por enlace y lo deja listo en el Lector. La usan el
   campo "Traer el fallo", el botón "Traer texto completo" de cada resultado
   de índice, y "Abrir en el Lector" desde un pasaje guardado — un solo
   camino, para no repetir el manejo de error tres veces.
   opciones.fichaConocida: metadata ya confirmada por el buscador oficial,
     para no tener que adivinarla de nuevo con detectar() (ver datosDoc()).
   opciones.qRestaurar / opciones.modoRestaurar: si el pasaje se guardó con
     una búsqueda puesta, se restaura para que la cita vuelva a quedar
     resaltada como estaba. */
function traerDocEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargando=true; estado.errorLink=null; estado.tab="lector";
  if(opciones.qRestaurar!==undefined){ estado.q=opciones.qRestaurar; estado.marca=0; }
  if(opciones.modoRestaurar) estado.modo=opciones.modoRestaurar;
  render();
  fetch(estado.api+"/extraer",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if(!d||!d.ok){
        // El servidor no pudo, pero el documento sigue estando a un clic:
        // se guarda el enlace para ofrecer abrirlo y subirlo a mano, que es
        // el camino que sí funciona cuando el sitio de origen no le contesta
        // al servidor (le pasa a los PDF del TSJ de CABA desde Azure). Si es
        // un escaneo (PDF_ESCANEADO) también se ofrece aplicar OCR acá
        // mismo — por eso se guardan código y opciones, para poder
        // reintentar sin perder la ficha ni la búsqueda que traía.
        estado.errorLink={mensaje:(d&&d.mensaje)||"El servidor no devolvió el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash((d.desdeCache?"Traído del caché · ":"")+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Verifique que la terminal siga diciendo «Interfaz http://localhost:3000»."};
      render();
    });
}

/**
 * El OCR es la respuesta a PDF_ESCANEADO: cuando el PDF no tiene capa de
 * texto (es la foto de una hoja de papel), el servidor puede reconocer las
 * letras a partir de la imagen en vez de leerlas del archivo. Es una
 * acción aparte y no algo automático porque tarda muchísimo más —varios
 * segundos por página, no milisegundos— así que hay que pedirlo a
 * propósito sabiendo eso.
 */
function traerOcrEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Pruebe de nuevo.",
                        codigo:"OCR_CORTADO",url:url,opciones:opciones};
      render();
    });
}

/**
 * Mismo OCR que traerOcrEnLector, pero para un archivo subido a mano en vez
 * de un enlace — sirve para lo que no se puede bajar solo (un sitio que le
 * niega la conexión al servidor publicado): se abre a mano en el navegador,
 * se guarda, y se sube. El archivo (un File, inmutable) ya está guardado en
 * estado.errorLink.archivo desde que falló la primera lectura, así que
 * reintentar con OCR no hace falta volver a elegirlo.
 */
function traerOcrDeArchivo(arch){
  if(!arch||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el archivo.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,archivo:arch};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=""; estado.infoDoc=d;
      estado.fichaConocida=null; estado.marca=0;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Pruebe de nuevo.",
                        codigo:"OCR_CORTADO",archivo:arch};
      render();
    });
}

function fichaDesdeIndice(slug,r){
  var fecha=r.fecha?(r.fecha.match(/\d{1,2}\/\d{1,2}\/\d{4}/)||[])[0]:"";
  return {tipo:slug==="mendoza"?"scjm":"cam",car:r.caratula,trib:r.tribunal,
          fecha:fecha||r.fecha,exp:r.expediente};
}
function fichaIndice(f,r){
  var q=estado.q;
  var im=estado.indices[f.slug];
  var metaEnc=[r.tribunal,r.secretaria,r.magistrados,r.expediente?"Expte. "+r.expediente:""]
    .filter(Boolean).map(esc).join(" · ");
  var fechaEnc=r.fecha?esc(r.fecha):"";
  // Cuando la búsqueda fue por artículo, se distingue quién CITA el número de
  // quién apareció por el tema del artículo (su rúbrica). No es un detalle:
  // citar como "aplica el art. 1710" un fallo que sólo habla de prevención
  // del daño sería poner en boca del tribunal algo que no dijo.
  var marcaTema=(r.citaElNumero===false)
    ? '<span class="tag" style="border-color:var(--lacre2);color:var(--lacre2)">por el tema, no cita el número</span>'
    : '';
  // El pasaje puede venir con el resultado (Mendoza manda el sumario) o
  // haberse sacado del documento después (CABA — ver traerFragmentos).
  var pasaje=r.sumario||(r.linkFallo?im.fragmentos[r.linkFallo]:"");
  var esperando=!pasaje&&r.linkFallo&&im.fragCargando&&!im.fragmentos.hasOwnProperty(r.linkFallo);
  return '<div class="fuente">'+
    '<div class="f-top"><span class="cod '+f.clase+'">'+esc(f.cod)+'</span>'+
      (metaEnc?'<span class="f-enc">'+metaEnc+'</span>':'')+
      (fechaEnc?'<span class="f-fecha">'+fechaEnc+'</span>':'')+'</div>'+
    '<h3 class="f-nom">'+esc(r.caratula||r.expediente||"(sin carátula)")+'</h3>'+
    (pasaje?'<p class="f-nota">'+resaltarSimple(pasaje,q)+'</p>':'')+
    (esperando?'<p class="f-nota" style="opacity:.55;font-style:italic">Buscando el pasaje en el documento…</p>':'')+
    (r.voces&&r.voces.length?'<div class="voces">'+r.voces.slice(0,6).map(function(v){
      return '<span class="voz" style="cursor:default">'+esc(v)+'</span>';}).join("")+'</div>':"")+
    '<div class="f-acc" style="margin-top:8px">'+
      (r.linkFicha?'<a class="mini" href="'+esc(r.linkFicha)+'" target="_blank" rel="noopener noreferrer">Ver ficha completa</a>':"")+
      marcaTema+
      (r.linkFallo?'<button class="mini" data-act="traer-indice-fallo" data-fuente="'+esc(f.slug)+'" data-url="'+esc(r.linkFallo)+'">Traer texto completo</button>':"")+
      // Si el documento se puede traer, también se puede abrir donde vive:
      // el enlace al sitio oficial es lo que hace citable al resultado.
      //
      // CABA es distinta de las otras cinco y se lo dice el propio sitio: su
      // link no muestra el fallo en una página, lo DESCARGA —manda
      // "Content-Disposition: attachment", verificado contra los dos
      // dominios que usa (uno a veces sirve un .doc, no un PDF, pero con la
      // misma cabecera)—. Un link común ahí no "abre" nada visible: el
      // archivo cae solo a la carpeta de Descargas y quien lo clickea se
      // queda mirando la pantalla preguntándose si pasó algo. Por eso ahí va
      // un atajo aparte que hace lo mismo que ya hacía el link (bajar el
      // archivo) pero de paso te deja en el Lector con el selector abierto,
      // listo para elegir lo que se acaba de bajar.
      (r.linkFallo&&r.descarga
        ?'<button class="mini" data-act="descargar-y-lector" data-url="'+esc(r.linkFallo)+'">Descargar y abrir en el Lector</button>'
        :(r.linkFallo?'<a class="mini" href="'+esc(r.linkFallo)+'" target="_blank" rel="noopener noreferrer">Abrir el original</a>':""))+
      '<button class="mini" data-act="compartir-fallo" data-fuente="'+esc(f.slug)+'" data-id="'+esc(r.id||"")+'">Compartir</button>'+
    '</div></div>';
}

/* Va a buscar el pasaje de cada resultado que no lo traiga de fábrica.
   Mendoza manda el sumario con cada ficha; CABA no manda nada, así que el
   pasaje sale del documento en sí. El servidor los trae de a tandas y en
   un solo pedido (ver routes/indice.js): pedir uno por documento quemaría
   el límite de peticiones en una sola búsqueda. Se van pintando a medida
   que llegan, sin bloquear la lista de resultados, que ya está en pantalla. */
function traerFragmentos(slug,pedido){
  var im=estado.indices[slug];
  var qi=estado.q.trim();
  if(!im||!qi||!estado.api) return;
  // hasOwnProperty y no truthiness: un documento que no se pudo leer queda
  // guardado como cadena vacía, y con truthiness volvía a entrar en la
  // tanda siguiente para siempre — un bucle infinito contra el servidor.
  var faltan=im.resultados.filter(function(r){
    return r.linkFallo && !r.sumario && !im.fragmentos.hasOwnProperty(r.linkFallo);
  }).map(function(r){ return r.linkFallo; });
  if(!faltan.length){ im.fragCargando=false; render(); return; }

  var tanda=faltan.slice(0,6);
  im.fragCargando=true;
  var promesaFrag=fetch(estado.api+"/indice/"+slug+"/fragmentos",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q:qi,urls:tanda})
  }).then(function(r){ return r.json(); });
  // Mismo tope que buscarEnFuente y por la misma razón (ver el comentario
  // grande ahí): sin esto, un pedido cortado a mitad de camino en el
  // celular dejaba "Buscando el pasaje…" clavado en cada resultado para
  // siempre, y de paso frenaba la cadena entera —esta función se llama a
  // sí misma para la tanda siguiente, así que una tanda colgada se llevaba
  // puestas todas las que faltaban.
  var idTopeFrag,
      seVencioFrag=new Promise(function(_,reject){
        idTopeFrag=setTimeout(function(){
          reject(new Error("tope de espera del lado del navegador"));
        },40000);
      });
  Promise.race([promesaFrag,seVencioFrag]).then(function(d){ clearTimeout(idTopeFrag); return d; },
    function(err){ clearTimeout(idTopeFrag); throw err; })
    .then(function(d){
      // Si mientras tanto se disparó otra búsqueda, lo que llega es viejo.
      if(im.pedido!==pedido) return;
      (d&&d.fragmentos||[]).forEach(function(f){
        im.fragmentos[f.url]=f.fragmento||"";
      });
      // Todo lo que se pidió queda marcado como intentado, haya vuelto o
      // no: si el servidor frenó por límite de peticiones, la tanda
      // siguiente pediría lo mismo y no terminaría nunca.
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)) im.fragmentos[u]="";
      });
      if(d&&d.ok===false){ im.fragCargando=false; render(); return; }
      render();
      traerFragmentos(slug,pedido); // sigue con la tanda siguiente
    })["catch"](function(){
      if(im.pedido!==pedido) return;
      tanda.forEach(function(u){
        if(!im.fragmentos.hasOwnProperty(u)) im.fragmentos[u]="";
      });
      im.fragCargando=false; render();
    });
}

/* Dispara (o repite) la búsqueda en vivo de una fuente con robot propio.
   La usan tanto el botón "Buscar en…" como el cambio de tribunal, para que
   tocar un chip de tribunal ya te traiga los resultados de ese tribunal en
   vez de dejar en pantalla los de la búsqueda anterior. */
/* ============================================================
   SAIJ desde el navegador
   ============================================================
   El servidor donde está publicada la web (un datacenter de Azure en Brasil)
   recibe 403 de SAIJ: el sitio no atiende pedidos desde ahí. Desde una
   conexión común sí responde, y además manda "Access-Control-Allow-Origin: *",
   o sea que habilita expresamente que un navegador le consulte desde
   cualquier página. Así que cuando el servidor no llega, la consulta la hace
   tu propia computadora, que es el destinatario natural de ese permiso.
   Comprobado a mano: mismo pedido, 403 desde el servidor y 200 desde acá.

   Esto obliga a repetir en el navegador el armado y el filtro que el
   servidor hace en lib/indiceSaij.js y lib/relevancia.js. Es duplicación
   real y molesta, pero la alternativa era dejar la fuente más grande de las
   tres afuera de la versión publicada. */

var SAIJ_URL="https://www.saij.gob.ar/busqueda";
var SAIJ_TIPOS={
  sumarios:"Total|Tipo de Documento/Jurisprudencia/Sumario",
  fallos:"Total|Tipo de Documento/Jurisprudencia/Fallo"
};
/* La Corte Suprema sale de SAIJ filtrando por su faceta de tribunal. Solo
   los fallos traen ese campo, así que va siempre por fallos (ver la nota en
   lib/indiceSaij.js del servidor). */
var SAIJ_FACETA_CSJN="Total|Tipo de Documento/Jurisprudencia/Fallo|Tribunal/CORTE SUPREMA DE JUSTICIA DE LA NACION";

function saijPlegar(s){
  try{ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
  catch(e){ return String(s||"").toLowerCase(); }
}
/* Las palabras que definen la búsqueda, de más específica a más genérica,
   recortadas a la raíz. Mismo criterio que lib/relevancia.js del servidor. */
function saijRaices(q){
  return saijPlegar(q).split(/[^a-z0-9]+/)
    .filter(function(p){ return p.length>=3 && !VACIAS[p]; })
    .sort(function(a,b){ return b.length-a.length; })
    .map(function(p){ return p.slice(0,6); });
}
function saijPajar(r){
  return saijPlegar([r.caratula,r.sumario,(r.voces||[]).join(" ")].join(" ")).replace(/\s+/g," ");
}
function saijCuantas(pajar,raices){
  var n=0; raices.forEach(function(x){ if(pajar.indexOf(x)!==-1) n++; }); return n;
}
/* SAIJ busca siempre con OR, así que el modo se aplica acá sobre lo traído. */
function saijFiltrar(lista,q,modo,excluir){
  var raices=saijRaices(q), fuera=saijRaices(excluir||"");
  var vivos=fuera.length?lista.filter(function(r){ return saijCuantas(saijPajar(r),fuera)===0; }):lista.slice();
  if(!raices.length) return {lista:vivos,aflojado:false};
  if(modo==="alguna") return {lista:vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)>0; }),aflojado:false};
  if(modo==="exacta"){
    var frase=saijPlegar(q).replace(/\s+/g," ").trim();
    if(!frase) return {lista:vivos,aflojado:false};
    return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(frase)!==-1; }),aflojado:false};
  }
  var completos=vivos.filter(function(r){ return saijCuantas(saijPajar(r),raices)===raices.length; });
  if(completos.length||raices.length===1) return {lista:completos,aflojado:false};
  return {lista:vivos.filter(function(r){ return saijPajar(r).indexOf(raices[0])!==-1; }),aflojado:true};
}

function saijLimpiar(s){
  return String(s||"").replace(/\[\[\/?p\]\]/g," ").replace(/\[\[[^\]]*\]\]/g," ").replace(/\s+/g," ").trim();
}
function saijFecha(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||""));
  return m?(m[3]+"/"+m[2]+"/"+m[1]):String(iso||"");
}
/* Cada resultado viene con el documento como JSON dentro de un string. */
function saijARegistro(bruto){
  var doc;
  try{ doc=JSON.parse(bruto.documentAbstract).document; }catch(e){ return null; }
  var c=(doc&&doc.content)||{}, uuid=doc&&doc.metadata&&doc.metadata.uuid;
  if(!uuid) return null;
  var esSumario=doc.metadata["document-content-type"]==="sumario";
  var partes=[c.actor,c.demandado].filter(Boolean).join(" c/ ")+(c.sobre?" s/ "+c.sobre:"");
  var voces=[].concat((c.descriptores&&c.descriptores.descriptor)||[])
    .map(function(d){ return d&&d.elegido&&d.elegido.termino; }).filter(Boolean);
  return {
    id:"saij_"+uuid,
    expediente:c["numero-interno"]||c["id-infojus"]||"",
    caratula:(esSumario?(c.titulo||saijLimpiar(c.sumario)):partes)||"(sin carátula)",
    sumario:esSumario?saijLimpiar(c.texto):"",
    voces:voces,
    fecha:saijFecha(c.fecha),
    tribunal:[c.tribunal,c.provincia,c.jurisdiccion&&c.jurisdiccion.descripcion]
      .filter(Boolean).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(" · "),
    magistrados:c.magistrados||"",
    linkFicha:"https://www.saij.gob.ar/"+uuid,
    linkFallo:null
  };
}

/* Revisa varias páginas antes de aflojar el filtro, igual que el servidor:
   como SAIJ ordena por relevancia pero busca con OR, la primera página puede
   ser toda de una sola de las palabras. */
/**
 * Igual que el servidor: si esto es una búsqueda por artículo, se corren
 * varias formas y se unen los resultados.
 *
 * Tiene que estar duplicado acá y no alcanza con que lo haga el servidor,
 * porque SAIJ le niega la conexión al servidor publicado y estas dos fuentes
 * las termina buscando el navegador. Sin esto, pedir "los fallos que citan el
 * art. 1710" daba cero en la Corte desde el sitio real — que es exactamente
 * el caso que había que arreglar. Ver buscarPorArticulo() en
 * backend/routes/indice.js.
 */
function formasDeArticulo(cuerpo){
  var n=String(cuerpo.articulo||"").trim();
  if(!n) return null;
  var f=["artículo "+n, n];              // los motores tipo SAIJ rinden con la palabra entera
  if(cuerpo.tema) f.push(cuerpo.tema);   // la rúbrica: encuentra a los que aplican sin citar
  return f;
}

function buscarSaijNavegador(cuerpo,slug){
  var formas=formasDeArticulo(cuerpo);
  if(formas){
    var porId={}, orden=[], pendientes=formas.length, resolver;
    var listo=new Promise(function(res){ resolver=res; });
    formas.forEach(function(forma,idx){
      buscarSaijNavegador(Object.assign({},cuerpo,{q:forma,articulo:""}),slug)
        .then(function(d){
          (d&&d.resultados||[]).forEach(function(x){
            if(!x||!x.id) return;
            if(porId[x.id]){ if(idx<2) porId[x.id].citaElNumero=true; return; }
            x.citaElNumero=(idx<2);   // las dos primeras formas llevan el número
            porId[x.id]=x; orden.push(x);
          });
        })["catch"](function(){})
        .then(function(){ if(--pendientes<=0) resolver(); });
    });
    return listo.then(function(){
      return { ok:true, total:orden.length, totalFuente:null, siguienteDesde:null,
               totalParcial:true, revisados:0, resultados:orden, desdeNavegador:true };
    });
  }

  var faceta=slug==="csjn"?SAIJ_FACETA_CSJN:(SAIJ_TIPOS[cuerpo.tribunal]||SAIJ_TIPOS.sumarios);
  var porPagina=20, porPedido=100;
  // Espejo de backend/lib/paginarFiltrado.js, y tiene que seguir siéndolo:
  // este camino se usa justo donde MÁS importa, el servidor publicado, al
  // que SAIJ le responde 403. Si acá quedara el cálculo viejo por número de
  // página, la paginación se pisaría en Azure y andaría bien solo en una
  // máquina local — el peor tipo de bug, el que no se ve donde se prueba.
  var revisados=[];   // los registros que se pudieron leer
  var filaDe=[];      // en qué fila del sitio estaba cada uno
  var totalCrudo=0, agotado=false;
  var arranque=(typeof cuerpo.desde==="number")?Math.max(0,cuerpo.desde)
                                               :(Math.max(1,cuerpo.pagina||1)-1)*porPedido;
  var cursor=arranque;

  function pedir(i){
    var p=new URLSearchParams({q:cuerpo.q,o:String(cursor),p:String(porPedido),f:faceta});
    return fetch(SAIJ_URL+"?"+p.toString(),{headers:{Accept:"application/json"}})
      .then(function(r){
        if(!r.ok) throw new Error("SAIJ respondió "+r.status);
        return r.json();
      })
      .then(function(d){
        var sr=(d&&d.searchResults)||{};
        if(!totalCrudo){
          var f=(sr.categoriesResultList||[]).filter(function(c){ return c.facetName==="Total"; })[0];
          totalCrudo=(f&&f.facetChildren&&f.facetChildren[0]&&f.facetChildren[0].facetHits)||0;
          if(!totalCrudo){ agotado=true; return null; }
        }
        var crudos=sr.documentResultList||[];
        if(!crudos.length){ agotado=true; return null; }
        // Sin compactar: un documento ilegible ocupa su lugar igual, porque
        // el cursor cuenta filas del sitio (ver lib/paginarFiltrado.js).
        for(var k=0;k<crudos.length;k++){
          var reg=saijARegistro(crudos[k]);
          if(!reg) continue;
          filaDe.push(cursor+k);
          revisados.push(reg);
        }
        cursor+=crudos.length;
        var parcial=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
        if(parcial.lista.length>=porPagina) return null;
        if(cursor>=totalCrudo){ agotado=true; return null; }
        return i<2?pedir(i+1):null;
      });
  }

  return pedir(0).then(function(){
    if(!totalCrudo) return {ok:true,total:0,totalFuente:0,siguienteDesde:null,resultados:[],revisados:0,desdeNavegador:true};
    var res=saijFiltrar(revisados,cuerpo.q,cuerpo.modo,cuerpo.excluir);
    var resultados=res.lista.slice(0,porPagina);
    var siguienteDesde;
    if(resultados.length>=porPagina){
      siguienteDesde=filaDe[revisados.indexOf(resultados[resultados.length-1])]+1;
    }else{
      siguienteDesde=agotado?null:cursor;
    }
    return {
      ok:true,
      total:resultados.length,
      // El conteo del OR de SAIJ: no es "cuántos hay sobre el tema", es
      // cuántas filas devuelve. La pantalla lo dice así (ver conteoIndice).
      totalFuente:totalCrudo,
      siguienteDesde:siguienteDesde,
      // "Parcial" es que el número de arriba salió de una muestra.
      totalParcial:siguienteDesde!==null,
      revisados:cursor-arranque,
      aflojado:res.aflojado,
      resultados:resultados,
      desdeNavegador:true
    };
  });
}

/** Cuántos resultados pide cada página. Tiene que ser el mismo número que
 * usan por default lib/indiceMza.js, lib/indiceCaba.js y lib/indiceSaij.js. */
var POR_PAGINA_INDICE=20;

/**
 * Hasta cuántos resultados en total se precargan solos, de fondo, apenas
 * llega la página 1 — para que pasar de página sea instantáneo CUANDO llega
 * a tiempo. Se probaron las dos puntas y las dos tienen un costo:
 *
 *   - De fondo, sin bloquear nada (esto): la página 1 aparece rápido, como
 *     siempre, pero si el usuario hace clic en "siguiente" antes de que la
 *     precarga de esa página termine —muy probable con CABA, que puede
 *     tardar 10-15 segundos reales por página—, no hay mejora: se pide en
 *     vivo igual, exactamente como si esto no existiera.
 *   - Esperando a tenerlas todas antes de mostrar la primera (lo que había
 *     antes de esto): "página siguiente" queda garantizado instantáneo,
 *     pero a costa de una espera inicial más larga y tediosa, sobre todo
 *     con una fuente lenta — y esa espera resultó peor que el problema
 *     original.
 *
 * Entre las dos, mejor esta: nunca hace esperar de más al principio, y
 * cuando la persona se toma un momento en leer la página 1 antes de pasar
 * de página, la mejora sí está. No es una garantía, es una ayuda que a
 * veces llega a tiempo y a veces no. Con más resultados que esto (una
 * búsqueda de concepto en Dialnet puede dar 30 mil) no se intenta: además
 * de la espera sería maltratar al sitio oficial de gusto, para páginas que
 * nadie va a hojear.
 */
var UMBRAL_PRECARGA_INDICE=5*POR_PAGINA_INDICE;

/**
 * Vuelca la respuesta del servidor (fresca o de un caché de página) al
 * estado de esa fuente y renderiza. Compartido entre "pedir de verdad" y
 * "ya la tenía precargada" para no repetir la misma docena de líneas.
 */
function aplicarPaginaIndice(slug,fCfg,imBusco,d,pagina,esNueva){
  imBusco.pagina=pagina;
  imBusco.cargando=false;
  if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
  imBusco.desdeNavegador=!!d.desdeNavegador;
  imBusco.resultados=d.resultados||[];
  imBusco.total=d.total||0;
  // Cuántos dice tener el SITIO con esas palabras. Es otra cosa que
  // "total": ese es cuántos pasaron el filtro entre los que se alcanzaron a
  // revisar. Puede venir null (respaldo local: no hay sitio que preguntar).
  imBusco.totalFuente=(typeof d.totalFuente==="number")?d.totalFuente:null;
  imBusco.guardados=d.guardadosEnIndice||0;
  imBusco.local=!!d.desdeIndiceLocal;
  imBusco.avisoFalla=d.avisoFalla||"";
  imBusco.parcial=!!d.totalParcial;
  imBusco.revisados=d.revisados||0;
  imBusco.aflojado=!!d.aflojado;
  // Dónde sigue la próxima. Si vino null, esta era la última: se borra el
  // cursor para que el paginador no ofrezca un "Siguiente" que no existe.
  if(typeof d.siguienteDesde==="number") imBusco.cursores[pagina+1]=d.siguienteDesde;
  else delete imBusco.cursores[pagina+1];
  imBusco.fragmentos={};
  render();
  // Los resultados ya están en pantalla; los pasajes que esta fuente no
  // manda se van completando atrás, sin hacer esperar a nadie.
  if(imBusco.resultados.some(function(r){return r.linkFallo&&!r.sumario;})){
    traerFragmentos(slug,imBusco.pedido);
  }
  var nombreTrib=(fCfg.tribunales||[]).filter(function(t){return t.v===imBusco.tribunal;})[0];
  var enDonde=fCfg.nombre+(nombreTrib?" · "+nombreTrib.n:"");
  if(esNueva) flash(imBusco.local
    ?"El sitio oficial no respondió: mostrando "+d.resultados.length+" resultado(s) ya guardados"
    :(d.total?d.total.toLocaleString("es-AR")+" coincidencias en "+enDonde:"Sin coincidencias en "+enDonde));
}

/**
 * Trae de fondo las páginas 2, 3... de la búsqueda que se acaba de hacer,
 * sin spinner ni bloquear nada: la página 1 ya está en pantalla desde antes
 * de llamar a esto. Si para cuando el usuario hace clic en "página
 * siguiente" ya llegó, buscarEnFuente la sirve del caché al toque; si no,
 * la pide en vivo como si esto no existiera (ver la nota grande de arriba).
 * Una a la vez y en orden, no todas juntas: son pedidos reales al sitio
 * oficial, con la misma espera de cortesía entre pedidos que ya respeta el
 * servidor (ver esperarTurno en lib/descargador.js) — pedirlas en paralelo
 * no las traería más rápido, solo se atropellarían.
 */
function precargarPaginasIndice(slug,imBusco,busquedaId,cuerpoBase){
  var maxPaginas=Math.ceil(UMBRAL_PRECARGA_INDICE/POR_PAGINA_INDICE);
  // De a una y en orden, no porque sea prolijo sino porque es obligatorio:
  // el arranque de la página N+1 lo dice la respuesta de la N. Sin esa
  // respuesta no hay a dónde ir, así que no se pueden pedir en paralelo
  // aunque se quisiera. Y de paso respeta la espera de cortesía entre
  // pedidos al sitio oficial (esperarTurno, en lib/descargador.js).
  function siguiente(pagina){
    if(pagina>maxPaginas) return;
    // Se compara contra busquedaId (una búsqueda, con q/modo/tribunal
    // fijos), NO contra imBusco.pedido: eso último cambia con cada clic en
    // una página, y si esto revisara pedido, con solo pasar de página a
    // mano mientras la precarga sigue en vuelo se cortaría entera pensando
    // que la búsqueda había quedado vieja, cuando en realidad es la misma.
    if(imBusco.busquedaId!==busquedaId) return;
    var cursor=imBusco.cursores[pagina];
    if(typeof cursor!=="number") return;              // se acabaron las páginas
    if(imBusco.paginas[pagina]) return siguiente(pagina+1); // ya la tenía
    var cuerpo=Object.assign({},cuerpoBase,{pagina:pagina,desde:cursor});
    fetch(estado.api+"/indice/"+slug+"/buscar",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(cuerpo)
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(imBusco.busquedaId!==busquedaId) return;
        if(d&&d.ok&&!d.desdeIndiceLocal){
          imBusco.paginas[pagina]=d;
          // Anotar el arranque de la que sigue, que es lo que permite
          // encadenar. Si no vino, se llegó al final y la cadena termina.
          if(typeof d.siguienteDesde==="number") imBusco.cursores[pagina+1]=d.siguienteDesde;
          // Los botones numerados salen de imBusco.cursores, así que cada
          // página precargada agrega uno: hay que repintar para que se vea.
          render();
        }
        siguiente(pagina+1);
      })["catch"](function(){ /* si falla precargando, buscarEnFuente la pide de nuevo cuando haga falta */ });
  }
  siguiente(2);
}

/**
 * @param slug fuente a consultar.
 * @param pagina si se omite es una búsqueda nueva (arranca en la página 1);
 *   si se pasa un número, es "ir a esa página" de una búsqueda ya hecha —
 *   reemplaza la lista, no la suma a la anterior.
 */
function buscarEnFuente(slug,pagina){
  var fCfg=FUENTES_INDICE.filter(function(x){return x.slug===slug;})[0];
  var qi=estado.q.trim();
  if(!fCfg) return;
  if(!qi){ flash("Escriba algo en «¿Qué desea consultar?» primero"); return; }
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }
  recordar(qi);
  var imBusco=estado.indices[slug];
  var esNueva=!(pagina>=1);
  var paginaPedida=esNueva?1:pagina;

  // Si esta página ya está precargada (de fondo o de haberla visitado antes
  // en esta misma búsqueda), servirla de ahí: no hace falta esperar de
  // nuevo al sitio oficial para algo que ya se trajo.
  if(!esNueva&&imBusco.paginas[paginaPedida]){
    aplicarPaginaIndice(slug,fCfg,imBusco,imBusco.paginas[paginaPedida],paginaPedida,false);
    return;
  }

  // Si esta fuente es lenta (CABA puede tardar 30s) y se dispara otra
  // búsqueda antes de que vuelva la anterior, la respuesta vieja no debe
  // pisar a la nueva. Un token por pedido: solo aplica si nadie más
  // arrancó una búsqueda de esta misma fuente después.
  var pedido=(imBusco.pedido||0)+1; imBusco.pedido=pedido;
  // Con qué rango de años se está pidiendo esto, para poder avisar después
  // si el usuario lo cambia y lo que quedó en pantalla ya no corresponde.
  imBusco.filtro=rangoAnios();
  // Distinto de "pedido": esto identifica la búsqueda (q/modo/tribunal),
  // no cada clic. Cambia solo con una búsqueda nueva, así que ir pasando
  // de página a mano no corta la precarga de fondo de esta misma búsqueda
  // (ver precargarPaginasIndice).
  if(esNueva){ imBusco.busquedaId=(imBusco.busquedaId||0)+1; imBusco.paginas={}; imBusco.cursores={1:0}; }
  var busquedaId=imBusco.busquedaId;
  imBusco.cargando=true; imBusco.error=null; imBusco.inicio=Date.now(); render();
  // El modo y las palabras a excluir viajan al servidor: antes se elegían
  // acá y no cambiaban nada de la búsqueda real (ver lib/relevancia.js).
  var cuerpo={q:qi,modo:estado.modo||"todas",pagina:paginaPedida};
  // El cursor de esa página, si se conoce. Sin esto el servidor cae al
  // cálculo por número de página, que es justo lo que se pisaba.
  if(typeof imBusco.cursores[paginaPedida]==="number") cuerpo.desde=imBusco.cursores[paginaPedida];
  if(estado.excluir.trim()) cuerpo.excluir=estado.excluir.trim();
  // El rango de años. Antes estos dos campos existían en pantalla pero NO
  // viajaban: sólo se usaban para la búsqueda de respaldo por Google
  // (rangoFechas), así que poner "2015–2026" y buscar en Mendoza devolvía
  // fallos de cualquier año. Una promesa rota en la interfaz.
  // Si esto viene de la solapa Norma, va el número de artículo: el servidor
  // le arma a cada buscador la consulta que ESE buscador entiende.
  if(estado.articulo){
    cuerpo.articulo=estado.articulo;
    if(estado.articuloNorma) cuerpo.norma=estado.articuloNorma;
    if(estado.articuloTema) cuerpo.tema=estado.articuloTema;
  }
  if(/^\d{4}$/.test(estado.desde)) cuerpo.anioDesde=Number(estado.desde);
  if(/^\d{4}$/.test(estado.hasta)) cuerpo.anioHasta=Number(estado.hasta);
  if(imBusco.tribunal) cuerpo.tribunal=imBusco.tribunal;
  var promesaBusco=fetch(estado.api+"/indice/"+slug+"/buscar",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo)
  }).then(function(r){ return r.json(); })
    .then(function(d){
      // SAIJ no atiende al servidor donde está publicada la web, pero sí a
      // los navegadores (ver el bloque de "SAIJ desde el navegador"). Si el
      // servidor no pudo, lo intenta tu computadora antes de darse por
      // vencida.
      if((slug==="saij"||slug==="csjn")&&(!d||!d.ok)) return buscarSaijNavegador(cuerpo,slug);
      return d;
    });
  // Sin esto, un pedido que se corta a mitad de camino —típico en el celular:
  // se apaga la pantalla, cambia de wifi a datos, la pestaña pasa a segundo
  // plano un rato— podía quedar esperando una respuesta que ya no iba a
  // llegar nunca, con "Consultando el buscador…" clavado en pantalla para
  // siempre y sin ningún botón para salir de ahí (reportado en vivo: se
  // quedaba tildado en el celular, no en la computadora). El servidor ya
  // tiene su propio tope por pedido (25s, ver config.js); acá se le da un
  // poco más de margen —la ida y vuelta real, no solo lo que tarda el
  // origen— y, si ni así contesta, se fuerza el error para poder reintentar
  // en vez de quedar esperando de por vida.
  var idTope,
      seVencio=new Promise(function(_,reject){
        idTope=setTimeout(function(){
          reject(Object.assign(new Error("tope de espera del lado del navegador"),{tope:true}));
        },40000);
      });
  Promise.race([promesaBusco,seVencio]).then(function(d){ clearTimeout(idTope); return d; },
    function(err){ clearTimeout(idTope); throw err; })
    .then(function(d){
      if(imBusco.pedido!==pedido) return; // ya hay un pedido mas nuevo en vuelo
      imBusco.busco=true;
      if(!d||!d.ok){
        imBusco.cargando=false;
        if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
        imBusco.error=(d&&d.mensaje)||"El servidor no devolvió resultados.";
        render(); return;
      }
      aplicarPaginaIndice(slug,fCfg,imBusco,d,paginaPedida,esNueva);
      // Se haya pedido a mano o de una búsqueda nueva, cualquier página que
      // de verdad se trajo del sitio queda guardada: volver a pasar por
      // ella (ida y vuelta entre páginas) también es instantáneo.
      if(!d.desdeIndiceLocal) imBusco.paginas[paginaPedida]=d;
      // Búsqueda nueva, con más de una página y no demasiado grande: se van
      // trayendo las siguientes solas, de fondo, sin hacer esperar a nadie
      // (ver la nota grande de arriba de precargarPaginasIndice).
      // Búsqueda nueva y hay una página siguiente: se van trayendo solas,
      // de fondo (ver la nota grande de arriba de precargarPaginasIndice).
      // Antes esto se salteaba cuando d.total era grande, para no maltratar
      // al sitio con páginas que nadie iba a hojear; ahora el tope es
      // directamente cuántas se precargan (maxPaginas), que es el mismo
      // cuidado dicho donde de verdad se aplica.
      if(esNueva&&!d.desdeIndiceLocal&&typeof d.siguienteDesde==="number"){
        precargarPaginasIndice(slug,imBusco,busquedaId,cuerpo);
      }
    })["catch"](function(err){
      if(imBusco.pedido!==pedido) return;
      imBusco.cargando=false; imBusco.busco=true;
      if(imBusco.inicio) imBusco.ms=Date.now()-imBusco.inicio;
      imBusco.error=(err&&err.tope)
        ?"Tardó demasiado y no llegó respuesta — puede haberse cortado la conexión a mitad de camino. Pruebe de nuevo."
        :(slug==="saij"||slug==="csjn")
          ?"No se pudo consultar SAIJ, ni desde el servidor ni desde acá. Pruebe de nuevo en un rato."
          :"Se cortó la comunicación con el servidor.";
      render();
    });
}

/**
 * Números de página, tipo "‹ 1 2 3 … 12 ›", para navegar los resultados de
 * una fuente en vivo sin acumular todo en una sola lista larguísima.
 *
 * El respaldo local (im.local) ya trae todo lo que hay guardado en una sola
 * tanda, así que ahí no hay "página siguiente" que ofrecer.
 */
function paginadorIndice(f,im){
  if(im.local) return '';
  var porPagina=POR_PAGINA_INDICE;
  var actual=Math.max(1,im.pagina||1);

  // Las páginas alcanzables son aquellas cuyo arranque ya se conoce. Se van
  // sumando a medida que se avanza: cada respuesta trae el cursor de la
  // siguiente y ninguna otra. No se puede saltar de la 1 a la 12 porque
  // nadie sabe todavía en qué fila del sitio empieza la 12 — depende de
  // cuántas descarte el filtro en el medio, que solo se sabe mirándolas.
  var ultima=actual;
  while(typeof im.cursores[ultima+1]==="number") ultima++;

  // La numeración de RESULTADOS sí es corrida: cada página muestra
  // exactamente porPagina (salvo la última) y la siguiente arranca justo
  // después de la última mostrada, así que la página N empieza en el
  // resultado (N-1)*porPagina+1 sin trampa.
  var desde=(actual-1)*porPagina+1;
  var hasta=desde+im.resultados.length-1;

  // Qué filas del sitio se miraron para armar ESTA página. Es el dato que
  // convierte "20 resultados" en algo interpretable: veinte de entre
  // sesenta filas revisadas no es lo mismo que veinte de entre veinte.
  var filaA=(im.cursores[actual]||0)+1;
  var filaB=(im.cursores[actual]||0)+(im.revisados||0);

  var out='<p style="font-size:12.5px;color:var(--humo);margin:0 0 8px">Mostrando '+
    desde.toLocaleString("es-AR")+'–'+hasta.toLocaleString("es-AR")+
    (im.revisados
      ? ' · revisadas las filas '+filaA.toLocaleString("es-AR")+'–'+filaB.toLocaleString("es-AR")+' del sitio'
      : '')+
    (typeof im.cursores[actual+1]!=="number"&&actual>1?' · es la última página':'')+
    '</p>';
  if(ultima<=1&&actual<=1) return out;

  // Ventana de números alrededor de la actual; el principio queda siempre a
  // la vista. No hay "última página" acá: no se sabe cuál es hasta llegar.
  var desdeN=Math.max(1,actual-2), hastaN=Math.min(ultima,actual+2);
  var nums=[];
  if(desdeN>1){ nums.push(1); if(desdeN>2) nums.push(null); }
  for(var i=desdeN;i<=hastaN;i++) nums.push(i);

  var botones=nums.map(function(pag){
    if(pag===null) return '<span style="padding:0 3px;color:var(--humo)">…</span>';
    return '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+pag+'"'+
      (pag===actual?' aria-pressed="true" disabled':'')+'>'+pag+'</button>';
  }).join("");

  return out+'<div class="paginador" style="margin:0 0 12px">'+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual-1)+'"'+
      (actual<=1?' disabled':'')+'>‹ Anterior</button>'+
    botones+
    '<button class="mini" data-act="indice-pagina" data-fuente="'+f.slug+'" data-pagina="'+(actual+1)+'"'+
      (typeof im.cursores[actual+1]==="number"?'':' disabled')+'>Siguiente ›</button>'+
    '</div>';
}

/**
 * La línea de arriba de todo: de qué tamaño es lo que hay para revisar.
 *
 * Es más delicada de lo que parece, porque "cuántos resultados hay" no
 * siempre se puede contestar. Hay dos situaciones distintas:
 *
 *   - El sitio resolvió el modo pedido (CABA siempre; las demás en "todas"
 *     las palabras o "alguna"). Ahí su contador ES el total y se dice.
 *   - El filtro corrió de nuestro lado (frase exacta, excluir). Ahí NADIE
 *     sabe el total sin revisar las filas una por una: el sitio no puede
 *     contarlo porque no sabe hacer ese modo, y nosotros contaríamos solo
 *     lo revisado hasta ahora. Se dice entonces el tamaño del material —
 *     cuántas filas devuelve el sitio— que es lo que sí se puede afirmar.
 *
 * Antes se mostraba el conteo de la muestra rotulado "N resultado(s) que
 * coinciden de verdad", y eso se leía como el total. No lo era: "daño moral"
 * en Mendoza decía 52 cuando el sitio devuelve 319 filas, y en Dialnet decía
 * 38 sobre 3.228. Un abogado que lee 52 y cierra la página se pierde el
 * resto.
 *
 * Ojo con cómo se redacta el segundo número. Cada sitio cuenta a su manera y
 * el de SAIJ cuenta con OR: para "daño moral" informa 44.220, que son los
 * que tienen "daño" O "moral", no los que tratan de daño moral. Por eso la
 * frase NO dice "hay 44.220 sobre el tema" —sería cambiar una exageración
 * por otra— sino que el sitio DEVUELVE esas filas. Eso es cierto para los
 * seis buscadores, cuenten como cuenten.
 */
function conteoIndice(im,local){
  var n=function(x){ return '<b>'+(x||0).toLocaleString("es-AR")+'</b>'; };
  if(local) return n(im.total)+' resultado(s) guardados';
  // Sin revisados, el filtro lo hizo el propio sitio: su contador es el total.
  if(!im.revisados) return n(im.total)+' coincidencia(s) en total';
  if(im.totalFuente===null) return 'coincidencias entre lo revisado hasta acá';
  return 'el sitio devuelve '+n(im.totalFuente)+' filas para esta consulta'+
    (im.parcial
      ? ', y se van revisando de a tandas: pase de página para seguir'
      : ', ya revisadas todas');
}

function panelIndice(f){
  var im=estado.indices[f.slug];
  var local=im.busco&&im.local;
  var nombreTrib=((f.tribunales||[]).filter(function(t){return t.v===im.tribunal;})[0]||{}).n;
  // La clase por slug ya no pinta el borde: define --punto, y el rótulo de
  // abajo lo usa para su contorno y su bolita (ver .rotulo-fuente).
  // El borde izquierdo dorado del caso "local" se mantiene: no es decoración
  // sino un aviso —estos resultados salieron de la copia guardada, no del
  // sitio— y sigue siendo UN borde, con un lado marcado.
  var out='<div class="panel vivo f-'+f.slug+'"'+(local?' style="border-left-color:var(--oro)"':'')+'>'+
    '<div class="rotulo rotulo-fuente" data-cod="'+esc(f.cod)+'" style="margin-top:0">'+esc(f.nombre)+(local?' · desde su índice local':' · en vivo')+'</div>';

  if(f.tribunales){
    out+='<div class="chips" style="margin-bottom:10px">'+f.tribunales.map(function(t){
      return '<button class="chip" data-act="indice-tribunal" data-fuente="'+f.slug+'" data-tribunal="'+t.v+
        '" aria-pressed="'+(im.tribunal===t.v?"true":"false")+'">'+esc(t.n)+'</button>';
    }).join("")+'</div>';
  }
  // CABA no filtra del lado del sitio (ver lib/indiceCaba.js): esto filtra
  // sobre lo que ya se trajo, según la secretaría que cada resultado trae.
  var secsPresentes=(f.slug==="caba"&&im.busco)
    ? Array.from(new Set(im.resultados.map(function(r){return r.secretaria;}).filter(Boolean)))
    : [];
  if(secsPresentes.length>1){
    out+='<div class="chips" style="margin-bottom:10px">'+secsPresentes.map(function(s){
      return '<button class="chip" data-act="indice-secretaria" data-fuente="'+f.slug+'" data-sec="'+esc(s)+
        '" aria-pressed="'+(im.secFiltro===s?"true":"false")+'">'+esc(SECRETARIAS_CABA[s]||s)+'</button>';
    }).join("")+'</div>';
  }

  if(im.cargando){
    out+='<p style="font-size:13px;color:var(--humo);margin:0">Consultando el buscador… puede tardar hasta 30 segundos: son sistemas oficiales viejos, no es que se haya colgado.</p></div>';
    return out;
  }
  if(im.error){
    out+='<div class="aviso" style="margin:0"><strong>No se pudo consultar.</strong> '+esc(im.error)+'</div></div>';
    return out;
  }
  if(!im.busco){
    out+='<p style="font-size:13px;color:var(--humo);margin:0 0 10px">'+esc(f.nota||f.nombre)+'</p></div>';
    return out;
  }
  // Los resultados en pantalla se trajeron con el rango de años que había en
  // ese momento; si desde entonces se tocó, hay que decirlo en vez de dejar
  // una lista que ya no corresponde al filtro puesto (ver invalidarBusquedas).
  var avisoRango=(im.busco&&!mismoRango(im.filtro,rangoAnios()))
    ? '<div class="aviso" style="margin:0 0 10px"><strong>Se cambió el rango de años.</strong> Estos resultados son de la búsqueda anterior y no respetan el rango indicado ahora. '+
      '<button class="mini" data-act="buscar-indice" data-fuente="'+esc(f.slug)+'" style="margin-left:6px">Rehacer la búsqueda</button></div>'
    : '';
  var avisoLocal=avisoRango+(local?'<div class="aviso" style="margin:0 0 10px"><strong>El buscador de '+esc(f.nombre)+' no respondió'+
    (im.avisoFalla?' ('+esc(im.avisoFalla)+')':'')+'.</strong> Esto es lo que ya estaba guardado de búsquedas anteriores en su índice local — puede estar incompleto o desactualizado. Pruebe de nuevo en un rato para la versión en vivo.</div>':'');
  if(!im.resultados.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Sin coincidencias en '+esc(f.nombre)+
      (nombreTrib?' ('+esc(nombreTrib)+')':'')+' para esta búsqueda. Pruebe con menos palabras.</p></div>';
    return out;
  }
  var visibles=im.secFiltro?im.resultados.filter(function(r){return r.secretaria===im.secFiltro;}):im.resultados;
  var nombreSec=SECRETARIAS_CABA[im.secFiltro];
  if(!visibles.length){
    out+=avisoLocal+'<p style="font-size:13px;color:var(--humo);margin:0">Ninguno de los '+im.resultados.length+
      ' resultados que trajo esta página es de '+esc(nombreSec||im.secFiltro)+'. Puede estar en otra página del sitio oficial.</p></div>';
    return out;
  }
  out+=avisoLocal+'<p style="font-size:12.5px;color:var(--humo);margin:0 0 4px">'+
    (nombreTrib?'<b style="color:var(--lacre)">'+esc(nombreTrib)+'</b> · ':'')+
    (nombreSec?'<b style="color:var(--lacre)">'+esc(nombreSec)+'</b> · '+visibles.length+' de sus ':'')+
    // Cuando el sitio de origen no sabe hacer el modo pedido, el filtro corre
    // de nuestro lado y su contador ya no aplica al modo pedido: se dice
    // cuántos se verificaron. Ver lib/relevancia.js.
    conteoIndice(im,local)+
    // Antes acá también decía "· N guardadas en tu índice local hasta
    // ahora": un detalle interno (cuántos documentos se acumularon con el
    // tiempo en la copia de respaldo, ver lib/indice.js) que no ayuda a
    // nadie a leer cuántos resultados dio ESTA búsqueda, y encima se
    // mezclaba en la misma frase. Sacado a pedido de un usuario que no le
    // encontraba sentido — con razón.
    '</p>'+
    // Números de página arriba de la lista: antes esto era un botón "ver más"
    // que iba sumando de a 20 sin fin; ahora se ve de entrada cuánto hay y
    // se puede saltar directo a cualquier página, como en cualquier buscador.
    paginadorIndice(f,im)+
    (im.desdeNavegador?'<div class="aviso" style="margin:0 0 10px">Esta búsqueda la hizo <b>su computadora</b>, no el servidor: SAIJ no atiende pedidos desde donde está publicada la web, pero sí desde un navegador común. Por eso estos resultados no quedan guardados en el índice local.</div>':'')+
    (im.aflojado?'<div class="aviso" style="margin:0 0 10px">Ningún resultado tiene <b>todas</b> las palabras buscadas. Estos coinciden solo con la más específica, así que revíselos con cuidado: puede que no sean del tema buscado.</div>':'')+
    // El sitio de CABA no manda un resumen del fallo con cada resultado
    // como hace Mendoza: los pasajes se sacan del documento en sí, de a
    // tandas, mientras la lista ya está en pantalla (ver traerFragmentos).
    (f.slug==="caba"&&im.fragCargando?'<p style="font-size:12.5px;color:var(--humo);margin:0 0 10px">Este buscador no manda un resumen con cada resultado, así que los pasajes se van sacando de cada documento — aparecen solos, de a poco.</p>':'')+
    visibles.map(function(r){ return fichaIndice(f,r); }).join("")+
    '</div>';
  return out;
}

function fichaRequisito(x){
  var cuerpo='';
