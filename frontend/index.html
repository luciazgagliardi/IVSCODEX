/* ---------- el asistente ---------- */
.asist{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 24px));z-index:60;font-family:var(--sans)}
.asist__fab{display:inline-flex;align-items:center;gap:10px;padding:13px 20px 12px;border:1px solid var(--gold);border-radius:999px;background:var(--bg);color:var(--fg);font:500 14.5px/1 var(--sans);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:background .3s,color .3s}
.asist__fab i{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.asist__fab:hover{background:var(--gold);color:var(--bg)}
.asist__fab:hover i{background:var(--bg)}
.asist.is-on .asist__fab{display:none}
.asist__panel{display:none;flex-direction:column;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 140px));background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden}
.asist.is-on .asist__panel{display:flex}
.asist__cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.asist__cab b{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.asist__cab b i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.asist__x{appearance:none;border:1px solid var(--line);background:none;color:var(--mute);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
.asist__x:hover{border-color:var(--gold);color:var(--gold)}
.asist__log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.asist__m{max-width:88%;padding:11px 15px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-line}
@keyframes asistentra{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.asist__m,.asist__ops{animation:asistentra .5s cubic-bezier(.2,1.15,.3,1) both}
.asist__m.bot,.asist__ops{transform-origin:left bottom}
.asist__m.yo{transform-origin:right bottom}
.asist__ops button{animation:asistentra .5s cubic-bezier(.2,1.15,.3,1) both}
.asist__ops button:nth-child(2){animation-delay:.06s}.asist__ops button:nth-child(3){animation-delay:.12s}.asist__ops button:nth-child(4){animation-delay:.18s}.asist__ops button:nth-child(5){animation-delay:.24s}.asist__ops button:nth-child(n+6){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.asist__m,.asist__ops,.asist__ops button{animation:none}}
.asist__m.bot{align-self:flex-start;background:rgba(var(--tx),.07);color:var(--fg)}
.asist__m.yo{align-self:flex-end;background:var(--fg);color:var(--bg)}
.asist__tipea{display:flex;gap:5px;align-items:center;padding:14px 16px}
.asist__tipea i{width:6px;height:6px;border-radius:50%;background:var(--mute-2);animation:asistPunto 1s infinite ease-in-out}
.asist__tipea i:nth-child(2){animation-delay:.15s}.asist__tipea i:nth-child(3){animation-delay:.3s}
@keyframes asistPunto{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.asist__cabr{display:flex;align-items:center;gap:8px}
.asist__tut{appearance:none;border:1px solid var(--gold-55);background:transparent;color:var(--gold);border-radius:999px;padding:5px 12px 4px;font:400 12px/1.2 var(--sans);cursor:pointer}
.asist__tut:hover{background:rgba(var(--gold-rgb),.1);border-color:var(--gold)}
.tour-ov{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.tour-v{position:fixed;background:transparent;pointer-events:auto}   /* sólo bloquean el toque: lo oscuro lo da el hueco redondeado del marco */
.tour-tapa{position:fixed;pointer-events:auto}
.tour-foco{position:fixed;border-radius:16px;box-shadow:0 0 0 1px var(--gold-55),0 0 0 100vmax rgba(var(--ov-rgb),.8);pointer-events:none;transition:left .4s var(--ease),top .4s var(--ease),width .4s var(--ease),height .4s var(--ease)}
.tour-card{pointer-events:auto;z-index:2;position:fixed;padding:18px 20px 16px;background:#17140f;border:1px solid var(--gold-55);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.7);transition:left .4s var(--ease),top .4s var(--ease)}
.tour-card h4{margin:2px 0 6px;font:500 17px/1.3 var(--sans);color:var(--fg)}
.tour-card p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--mute)}
.tour-n{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tour-bt{display:flex;flex-wrap:wrap;gap:8px}
.tour-b{appearance:none;padding:8px 16px 7px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:400 13.5px/1.2 var(--sans);cursor:pointer}
.tour-b:hover{border-color:var(--gold)}
.tour-b.prim{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:500}
.tour-b.prim:hover{background:var(--fg);border-color:var(--fg)}
.tour-b.suave{border-color:transparent;color:var(--mute-2);margin-left:auto}
.asist__ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:-2px}
.asist__ops button{appearance:none;padding:9px 15px;border-radius:999px;border:1px solid var(--gold-55);background:transparent;color:var(--gold);font:400 13.5px/1.2 var(--sans);cursor:pointer;text-align:left}
.asist__ops button:hover{background:rgba(var(--gold-rgb),.1);border-color:var(--gold)}
.asist__ops button.suave{border-color:var(--line);color:var(--fg-82)}
.asist__form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.asist .asist__form input[type=text]{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font:400 14.5px/1.2 var(--sans)}
.asist .asist__form input[type=text]:focus{outline:none;border-color:var(--gold-55)}
.asist__form button{appearance:none;padding:11px 18px;border-radius:999px;border:0;background:var(--gold);color:var(--bg);font:500 14px/1 var(--sans);cursor:pointer}
.asist__pie{margin:0;padding:0 18px 12px;font-size:11.5px;color:var(--mute-2)}
@media (max-width:520px){.asist__panel{height:min(78vh,560px)}}
@media (prefers-reduced-motion:no-preference){.asist__panel{animation:asistEntra .28s var(--ease) both}@keyframes asistEntra{from{opacity:0;transform:translateY(10px)}}}
.campo-check{display:flex;align-items:flex-start;gap:10px;margin:0 0 22px;font-size:14px;color:var(--mute);cursor:pointer}
.campo-check input{margin-top:3px;accent-color:var(--gold)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select{
  display:block;width:100%;padding:8px 0 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;
  background:transparent;color:var(--fg);font:400 17px/1.5 var(--sans);transition:border-color .3s
}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--bg);color:var(--fg)}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus,input[type=date]:focus,select:focus{outline:none;border-bottom-color:var(--gold)}
textarea{
  display:block;width:100%;min-height:220px;padding:18px 20px;border:1px solid var(--line);border-radius:0;background:var(--ficha);
  color:var(--fg);font:400 15.5px/1.65 var(--sans);resize:vertical;transition:border-color .3s
}
textarea:focus{outline:none;border-color:var(--gold-55)}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 28px}
.fila>*{min-width:0}
.acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}

/* El punto de los títulos es un círculo: esta fuente trae un solo carácter («.») y mide como el cuadrado de Instrument Sans. */
@font-face{font-family:"Punto redondo";src:url(./punto-redondo.woff) format("woff");font-weight:400;font-style:normal;unicode-range:U+002E;font-display:block}

/* ================================================================== *
   CABECERA DE LA APLICACIÓN
 * ================================================================== */
.top{
  position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px)
}   /* sin línea separadora debajo, en ninguna sección */
/* El fondo de la barra se funde hacia abajo (fondo y desenfoque con máscara): no deja un corte
   contra las luces de color de la página, y al desplazarse el texto se desvanece sin borde. */
.top::before{
  content:"";position:absolute;left:0;right:0;top:0;bottom:-30px;z-index:-1;pointer-events:none;
  background:rgba(var(--bg-rgb),.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 100%)
}
.nav-wrap{display:flex;align-items:center;gap:24px;padding:22px var(--pad)}   /* mismo margen izquierdo que el contenido: el nombre queda sobre el mismo borde que el título */
/* Las medidas son las de sigillvm.com: la marca ocupa 180 × 44 px, el
   símbolo mide 24 px y la palabra va 12 px a su derecha. */
.marca-sello{display:block;width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(var(--tx),.24)}
.marca2{display:inline-flex;align-items:center;gap:.32em;font:600 16px/1 var(--sans);letter-spacing:-.02em;color:var(--fg);white-space:nowrap}
.marca2 span{font-weight:400;color:var(--mute)}
.marca2 .m-pt{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--gold);flex:none}
.marca-app{gap:10px;display:inline-flex;align-items:center;flex:none;width:auto;height:auto;padding:0;border:0;background:none;color:var(--fg)}
.marca-app .marca{font-size:15.5px;font-weight:500;letter-spacing:.26em;--ls:.26em;line-height:1.55;padding-right:.26em;position:relative;top:.4px}
.nav{display:flex;align-items:center;gap:clamp(16px,2vw,30px);min-width:0;margin-left:clamp(20px,4vw,72px)}
.nav button{
  padding:0;border:0;background:none;line-height:1.55;
  font-size:15px;color:var(--mute);white-space:nowrap;transition:color .3s,border-color .3s
}
.nav button:hover,.nav button:active{color:var(--gold)}
.nav button[aria-current="page"]{color:var(--gold)}
.nav-fin{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-perfil{padding:10px 18px;gap:9px;font-size:13.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.perfil-wrap{position:relative;display:inline-flex}
.btn-perfil .fl{font-size:10px;opacity:.7}
.perfil-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:70;width:min(310px,calc(100vw - 28px));padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.perfil-menu[hidden]{display:none}
.pm-cab{display:grid;gap:2px;padding:10px 12px 12px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.pm-cab b{font-weight:500;font-size:15px}
.pm-cab span{font-size:12.5px;color:var(--mute-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-it{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:9px 12px;border:0;background:none;border-radius:12px;color:var(--fg);font:400 14px/1.3 var(--sans);text-align:left;cursor:pointer;transition:background .2s}
.pm-it:hover{background:rgba(var(--tx),.07);color:var(--gold)}
.pm-n{font-size:12.5px;color:var(--mute-2);font-variant-numeric:tabular-nums}
.pm-q{font-size:13px;color:var(--mute)}
.pm-q span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-rot{padding:12px 12px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2)}
.pm-vacio{padding:4px 12px 8px;font-size:12.5px;color:var(--mute-2)}
.pm-sep{height:1px;background:var(--line-2);margin:6px 4px}
.btn-perfil[aria-current="page"]{border-color:var(--gold);color:var(--gold)}
.btn-menu{padding:10px 18px 9px;font-size:13.5px}
.btn-menu .fl{display:inline-block;transition:transform .4s var(--ease)}
.btn-menu[aria-expanded="true"] .fl{transform:rotate(180deg)}
@media (max-width:980px){ .nav{display:none} }
/* En el teléfono el nombre y el botón del índice tienen que entrar juntos:
   el rótulo se acorta a "Secciones" y el nombre se aprieta un poco. */
@media (max-width:520px){
  .btn-perfil{display:none}
  .nav-wrap{gap:12px}
  .marca-app .marca{letter-spacing:.2em;--ls:.2em}
  .btn-menu{padding:10px 18px 9px;font-size:13.5px}
  .btn-menu .txt{font-size:0}
  .btn-menu .txt::after{content:"Secciones";font-size:13.5px}
  .btn-menu[aria-expanded="true"] .txt::after{content:"Cerrar"}
}

/* el índice de las once secciones */
.menu{
  position:fixed;inset:0;z-index:45;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(118px + env(safe-area-inset-top,0px)) var(--pad) 64px;
  background:rgba(var(--bg-rgb),.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s
}
.menu.is-on{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.menu__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(40px,5vw,64px) clamp(24px,3vw,56px)}
.menu__grupo h2{margin:0;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:400;color:var(--mute-2)}
.menu__item{display:block;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;transition:border-color .5s}
.menu__item:hover{border-bottom-color:var(--gold-55)}
.menu__item b{display:block;font:400 clamp(24px,2.3vw,34px)/1.1 var(--titulo);letter-spacing:-.02em;transition:color .3s}
.menu__item:hover b{color:var(--gold)}
.menu__item span{display:block;margin-top:6px;font-size:13.5px;color:var(--mute)}
.menu__item[aria-current="page"] b,.menu__item:active b{color:var(--gold)}
.menu__item[aria-current="page"] b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:12px;border-radius:50%;background:var(--gold);vertical-align:.14em}
.menu.is-on .menu__item{animation:entra .7s var(--ease) both;animation-delay:calc(var(--k) * 40ms)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sel-ui{position:relative;display:block;max-width:100%}
.sel-ui .sel-nativo{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.sel-btn{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 18px 11px 20px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:400 17px/1.5 var(--sans);text-align:left;cursor:pointer;transition:border-color .3s}
.sel-btn:hover,.sel-ui.abre .sel-btn{border-color:var(--gold-55)}
.sel-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn svg{flex:none;width:13px;height:13px;color:var(--mute);transition:transform .35s cubic-bezier(.2,1.15,.3,1)}
.sel-ui.abre .sel-btn svg{transform:rotate(180deg)}
.sel-lista{position:absolute;z-index:90;left:0;right:0;top:calc(100% + 8px);max-height:min(54vh,330px);overflow-y:auto;overscroll-behavior:contain;padding:6px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 18px 44px rgba(0,0,0,.35);scrollbar-width:thin;transform-origin:top center;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.94);transition:opacity .2s ease,transform .3s cubic-bezier(.4,0,.6,1),visibility 0s linear .3s}
.sel-ui.abre .sel-lista{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .5s cubic-bezier(.2,1.15,.3,1),visibility 0s}
.sel-lista button{appearance:none;display:block;width:100%;padding:10px 16px;border:0;border-radius:999px;background:transparent;color:var(--fg);font:400 14.5px/1.3 var(--sans);text-align:left;cursor:pointer;transition:background .2s,color .2s}
.sel-lista button:hover,.sel-lista button:focus-visible{outline:none;background:rgba(var(--tx),.07)}
.sel-lista button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.sel-lista,.sel-ui.abre .sel-lista,.sel-btn svg{transition:none}}
@keyframes desplegar{from{opacity:0;transform:translateY(-10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes desplegar-hoja{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.perfil-menu:not([hidden]):not(.perfil-hoja),.compartir-menu,.bq-drawer.is-on{animation:desplegar .45s cubic-bezier(.2,1.15,.3,1) both;transform-origin:top right}
.bq-drawer.is-on{transform-origin:top center}
.perfil-hoja.perfil-menu:not([hidden]){animation:desplegar-hoja .5s cubic-bezier(.2,1.1,.3,1) both;transform-origin:bottom center}
.rail.abierto .rail-cuerpo{animation:desplegar .4s cubic-bezier(.2,1.15,.3,1) both;transform-origin:top center}
@media (prefers-reduced-motion:reduce){.perfil-menu,.compartir-menu,.bq-drawer.is-on,.rail.abierto .rail-cuerpo{animation:none!important}}
@keyframes entrapag{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.entra-pag{animation:entrapag .65s var(--ease) both}
@media (prefers-reduced-motion:reduce){.entra-pag{animation:none}}
@media (max-width:980px){ .menu__grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px} }
@media (max-width:560px){ .menu__grid{grid-template-columns:minmax(0,1fr)} }

/* ---------- la cabecera de cada sección ---------- */
.cab{padding:clamp(12px,2vh,22px) var(--pad) 0}
.cab>*{animation:entra .9s var(--ease) both}
body.en-recorrido .cab>*{animation:none}
.tour-ov.tour-acomoda .tour-foco,.tour-ov.tour-acomoda .tour-card{opacity:0;transition:none}
.cab>*:nth-child(2){animation-delay:.07s}.cab>*:nth-child(3){animation-delay:.14s}.cab>*:nth-child(4){animation-delay:.21s}
.cab__saludo{margin:0 0 16px;font-size:15px;color:var(--mute)}
.cab__saludo b{font-weight:400;color:var(--fg)}
.cab__ojo{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:0;font-size:14px;color:var(--mute)}
.cab__lat{font:500 15px/1 var(--caps);letter-spacing:.24em;color:var(--gold)}
.cab h1{margin:18px 0 0;font:400 clamp(36px,4.4vw,68px)/1.02 var(--titulo);letter-spacing:-.035em}
.cab__intro{max-width:46em;margin:22px 0 0;color:var(--mute)}
/* El primer aviso de cada solapa sube a la cabecera y hace de bajada:
   es el mismo texto de siempre, sin caja. */
.cab .aviso{max-width:52em;margin:22px 0 0;padding:0;border:0;background:none;color:var(--mute);font-size:16px}
.cab .aviso .av-tit{display:block;margin-bottom:6px;font-size:18px;font-weight:500;color:var(--fg)}
.cab .aviso .av-oro{color:var(--mute)}
.cab .aviso strong{color:var(--fg)}
.cab .nota-suelta{max-width:52em;margin:12px 0 0;padding:0;font-size:13.5px;color:var(--mute-2)}

/* ---------- estructura ---------- */
.wrap{
  display:grid;grid-template-columns:268px minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start;
  padding:clamp(44px,5.5vw,72px) var(--pad) 110px
}
.wrap.en-buscar{padding-top:clamp(20px,2.2vw,30px)}
.wrap.sin-rail{grid-template-columns:minmax(0,1fr)}
.wrap.sin-rail .rail{display:none}
.col{min-width:0}

/* el riel: las fuentes en vivo y las ramas */
.rail{position:sticky;top:96px;min-width:0}
.rail h2{margin:0 0 12px;font-size:13px;font-weight:400;color:var(--mute)}
.rail-fuentes{display:flex;flex-direction:column}
.rail-fuente{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:var(--tinta2);line-height:1.3;cursor:pointer;border-bottom:1px solid var(--line-2)}
.rail-fuente:hover .rf-nom{color:var(--gold)}
.rf-buscar{appearance:none;flex:none;padding:5px 11px 4px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg-82);font:400 11.5px/1.2 var(--sans);cursor:pointer;transition:border-color .3s,color .3s,background .3s}
.rf-buscar:hover{border-color:var(--gold);color:var(--gold)}
.rf-buscar:disabled{opacity:.45;cursor:default}
.rf-todas{appearance:none;width:100%;margin:16px 0 36px;padding:10px 16px 9px;border:1px solid var(--gold);border-radius:999px;background:var(--gold);color:var(--bg);font:500 13.5px/1.2 var(--sans);cursor:pointer}
.rf-todas:hover{background:var(--fg);border-color:var(--fg)}
.rail-fuente .rf-punto{width:6px;height:6px;border-radius:50%;flex:none;background:var(--punto,var(--humo))}
.rail-fuente .rf-nom{flex:1 1 auto;min-width:0;font:500 12.5px/1.2 var(--caps);letter-spacing:.14em}
.rail-fuente .rf-n{flex:none;font-size:13px;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.rail-fuente.sin-buscar{color:var(--humo)}
.rail-fuente.sin-buscar .rf-punto{background:var(--line)}
.rail-buscador{margin-bottom:10px;font-size:15px!important}
.rail-list{display:flex;flex-direction:column;max-height:62vh;overflow:auto;padding-right:6px}
.rail-list button{
  position:relative;text-align:left;padding:8px 0 8px 16px;border:0;background:none;
  font-size:14px;line-height:1.35;color:var(--tinta2);transition:color .25s
}
.rail-list button:hover{color:var(--fg)}
.rail-list button[aria-pressed="true"]{color:var(--fg)}
.rail-list button[aria-pressed="true"]::before{content:"";position:absolute;left:2px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--gold)}
.f-mendoza{--punto:var(--f-mendoza)}
.f-mendozalegal{--punto:var(--f-mendozalegal)}
.f-caba{--punto:var(--f-caba)}
.f-csjn{--punto:var(--f-csjn)}
.f-saij{--punto:var(--f-saij)}
.f-dialnet{--punto:var(--f-dialnet)}
.f-corteidh{--punto:var(--f-corteidh)}
.f-scba{--punto:var(--f-scba)}
.f-rionegro{--punto:var(--f-rionegro)}
.f-juristeca{--punto:var(--f-juristeca)}
.f-santafe{--punto:var(--f-santafe)}

/* ---------- sin cajas: un filete arriba y aire ---------- */
.panel,.blk,.rama,.aviso{
  margin:0 0 48px;padding:24px 0 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;
  transition:border-color .5s
}
.blk:hover,.rama:hover{border-top-color:var(--gold-55)}
.panel.vivo{border-top-color:rgba(143,191,154,.45)}
/* Lector sin fallo: cada opción en su recuadro redondeado, sin filetes de más */
.op-caja,.op-caja.vivo{margin:0 0 16px;padding:22px 24px 24px;border:1px solid var(--line);border-radius:22px;background:rgba(var(--tx),.02)}
.op-caja .rotulo{margin:0 0 6px;color:var(--fg)}
.op-caja .campo{margin-bottom:14px}
.op-caja .campo input[type=text]{padding:11px 18px;border:1px solid var(--line);border-radius:999px}
.op-caja .campo input[type=text]:focus{border-color:var(--gold-55)}
.op-caja textarea{border-radius:18px}
.op-caja .acciones{margin-top:14px!important;padding-top:0;border-top:0}
.blk.op-caja:hover{border-top-color:var(--line)}
.blk.op-caja .sin-items p{padding:7px 0;border-top:0}
.aviso.sin-filete{padding-top:0;border-top:0}
.aviso{color:var(--mute);font-size:15px}
.aviso strong{color:var(--fg)}
.av-tit{display:block;margin-bottom:4px;color:var(--fg);font-weight:500}
.av-oro{color:var(--gold)}
.nota-suelta{margin:-30px 0 40px;font-size:13.5px;line-height:1.55;color:var(--mute-2)}
.blk h3,.grupo>h3{margin:0 0 14px;font:400 clamp(24px,2.2vw,32px)/1.12 var(--titulo);letter-spacing:-.025em}
.blk p{margin:0 0 12px;color:var(--fg-82)}
.blk ol,.blk ul{margin:0 0 12px;padding-left:20px;color:var(--fg-82)}
.blk li{margin-bottom:6px}
.rama h3{margin:0 0 8px;font:500 21px/1.25 var(--sans);letter-spacing:-.015em}
.rama p{margin:0 0 14px;color:var(--mute)}
.rotulo{display:block;margin:16px 0 10px;font-size:13px;color:var(--mute)}
.rotulo strong{font-weight:500;color:var(--fg)}
.conteo{margin:0 0 18px;font-size:13px;color:var(--mute-2)}
.rail-grupo{display:block;margin:16px 0 4px;padding:0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.rail-grupo:first-child{margin-top:4px}
.rail-sub{display:block;margin:8px 0 2px;padding:0 9px;font-size:12px;color:var(--mute-2);font-style:italic}
.ramas-indice{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 36px}
.ramas-indice button{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--gold-55);border-radius:999px;background:none;color:var(--gold);font:500 14px/1.2 var(--sans);cursor:pointer;transition:border-color .3s,background-color .3s}
.ramas-indice button:hover,.ramas-indice button:focus-visible{border-color:var(--gold);background:rgba(var(--gold-rgb),.08)}
.ramas-indice button span{color:var(--mute-2);font-size:12.5px}
.rama-grupo{margin:0 0 28px;padding-top:40px;border-top:1px solid var(--line);scroll-margin-top:90px}
.rama-grupo:first-of-type{padding-top:8px;border-top:0}
.rama-grupo h2{margin:0 0 8px;font:500 clamp(15px,1.4vw,18px)/1.25 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.rama-grupo p{margin:0;max-width:62ch;font-size:15px;color:var(--mute)}
.col.v-ramas>.ramas-indice,.col.v-ramas>.rama-grupo,.col.v-ramas>.rama-sub,.col.v-ramas>.conteo,.col.v-ramas>.aviso{grid-column:1/-1}
.rama-sub{margin:0 0 18px;font:500 12px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.vacio{padding:32px 24px;border:1px dashed var(--line);color:var(--mute);text-align:center;font-size:15px}
.vacio--inicio{border:1px solid var(--line);border-radius:22px;padding:26px 30px;text-align:left;line-height:1.6}
.out{
  padding:22px 24px;border:0;background:var(--ficha);
  font:400 clamp(17px,1.4vw,20px)/1.55 var(--sans);color:var(--fg);white-space:pre-wrap;word-break:break-word;min-height:44px
}
.voces-tit{margin:0 0 14px;font:500 22px/1.2 var(--sans);letter-spacing:-.015em}
.voces-tit .punto{color:var(--gold)}
.voces-tit .rama-nom{color:var(--gold);font-style:normal}

/* ================================================================== *
   BUSCAR — el formulario de presupuesto de sigillvm, con su resumen
   fijo al costado
 * ================================================================== */
.brief{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:clamp(28px,3.4vw,64px);align-items:start;margin-bottom:clamp(56px,7vw,96px)}
.brief__form{display:grid;gap:32px;min-width:0}
.brief__form .panel{margin:0}
.brief__form .campo,.brief__form .fila .campo{margin-bottom:0}
.campo--q input[type=text]{
  padding:4px 0 14px;border-bottom-color:rgba(var(--tx),.3);
  font:400 clamp(26px,3vw,42px)/1.15 var(--sans);letter-spacing:-.02em
}
.busq-grupo{min-width:0}
.busq-rotulo{display:block;margin-bottom:14px;font-size:14px;color:var(--mute)}
.brief__summary{position:sticky;top:96px;padding:clamp(24px,2.4vw,32px);border:1px solid var(--line);background:var(--ficha);min-width:0}
.brief__title{margin:0;font:500 20px/1.25 var(--sans)}
.brief__list{margin:22px 0 0;display:grid;gap:16px}
.brief__list div{padding-top:14px;border-top:1px solid var(--line)}
.brief__list dt{font-size:13px;color:var(--mute-2)}
.brief__list dd{margin:6px 0 0;overflow-wrap:anywhere}
#cadena{display:block;font:400 15px/1.5 var(--sans);color:var(--mute)}
#cadena b{color:var(--gold);font-weight:500}
.brief__summary .acciones{margin-top:16px;padding-top:0;border-top:0;gap:8px}
.brief__summary .btn--ancho{margin-top:26px}
.brief__sub{margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mute-2)}
.brief__summary .btn.sec{padding:8px 14px 7px;font-size:13px}
.sugeridas{margin:0;padding:2px 0;border:0;background:none;border-radius:0}
.sug-nota{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--mute);max-width:62ch}
.sug-nota b{color:var(--fg);font-weight:500}
@media (max-width:1180px){ .brief{grid-template-columns:minmax(0,1fr)} .brief__summary{position:static} }

/* ---------- resultados en vivo: cada base con su sello de procedencia ---------- */
.panel.f-mendoza,.panel.f-mendozalegal,.panel.f-caba,.panel.f-csjn,.panel.f-saij,.panel.f-dialnet,.panel.f-corteidh,.panel.f-scba,.panel.f-rionegro,.panel.f-juristeca,.panel.f-santafe{
  margin:0 0 64px;padding:0;border-top:0
}
.rotulo-fuente{
  display:flex;align-items:center;gap:18px;margin:0 0 6px;padding:0;border-bottom:0;
  font:500 18px/1.3 var(--sans);letter-spacing:-.01em;color:var(--fg);min-width:0;overflow-wrap:anywhere
}
/* el sello: la sigla de la base en un aro doble, del tono de esa base */
.rotulo-fuente::before{
  content:attr(data-cod);flex:none;display:grid;place-items:center;height:46px;padding:0 24px;border-radius:999px;
  border:1px solid var(--punto,var(--gold));outline:1px solid var(--punto,var(--gold));outline-offset:-5px;
  font:500 12px/1 var(--caps);letter-spacing:.14em;text-align:center;white-space:nowrap;color:var(--fg);overflow-wrap:normal
}
.panel .fuente{padding:22px 0;margin:0;border:0;border-bottom:1px solid var(--line);background:none;transition:border-color .5s}
.panel .fuente:hover{border-bottom-color:var(--gold-55)}
.panel .f-top{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.panel .f-top .cod{border-color:var(--punto,var(--line));color:var(--fg)}
.panel .f-enc{font-size:13px;color:var(--mute-2);min-width:0}
.panel .f-fecha{margin-left:auto;font-size:13px;color:var(--mute-2);font-variant-numeric:tabular-nums;flex:none}
.panel h3.f-nom,.panel .f-nom{margin:0 0 10px;font:500 clamp(18px,1.5vw,21px)/1.3 var(--sans);letter-spacing:-.01em;color:var(--fg)}
.panel .f-nota{margin:0 0 14px;max-width:70ch;font-size:15.5px;line-height:1.65;color:var(--fg-82)}
.panel .f-nota mark{background:none;color:var(--gold);box-shadow:inset 0 -1px 0 var(--gold-55);padding:0}
.panel .voces{margin-bottom:12px}
.panel .f-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.paginador{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}

/* ---------- el catálogo de fuentes ---------- */
.grupo{margin-bottom:clamp(56px,7vw,88px)}
.grupo>h3{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.grupo>p.desc{margin:10px 0 8px;color:var(--mute)}
/* Solo dentro de los grupos del catálogo: .fuente también es la clase de
   cada resultado en vivo, que tiene su propio orden (ver más arriba). */
.grupo>.fuente{
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px clamp(20px,3vw,48px);align-items:start;
  padding:20px 0;border-bottom:1px solid var(--line);transition:border-color .5s
}
.grupo>.fuente:hover{border-bottom-color:var(--gold-55)}
.grupo .f-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;min-width:0}
.grupo .f-nom{font:500 17px/1.35 var(--sans);min-width:0}
.leader{display:none}
.grupo .f-org{flex-basis:100%;font-size:13px;color:var(--mute-2)}
.grupo .f-nota{margin:0;font-size:14.5px;line-height:1.6;color:var(--mute)}
.grupo .f-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;max-width:300px}
@media (max-width:900px){ .grupo>.fuente{grid-template-columns:minmax(0,1fr)} .grupo .f-acc{justify-content:flex-start;max-width:none} }

/* ---------- ramas ---------- */
.col.v-ramas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(28px,3.4vw,56px);align-items:start}
.col.v-ramas>.conteo,.col.v-ramas>.aviso{grid-column:1/-1}
.col.v-ramas .rama{margin-bottom:56px}
@media (max-width:1100px){ .col.v-ramas{grid-template-columns:minmax(0,1fr)} }

/* ---------- requisitos ---------- */
.req-lista{margin:6px 0 0;padding:0;list-style:none;counter-reset:inc}
.req-lista li{counter-increment:inc;display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:10px;margin:0;padding:10px 0;border-top:1px solid var(--line-2);color:var(--fg-82)}
.req-lista li::before{content:counter(inc,lower-alpha) ")";font:500 15px/1.5 var(--caps);letter-spacing:.06em;color:var(--gold)}
.req-aviso{margin:10px 0 0;font-size:14.5px;color:var(--mute)}
.req-norma{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}

/* ---------- comparar ---------- */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 clamp(24px,3vw,48px);margin-bottom:24px}
.comp-card{padding:20px 0 0;border:0;border-top:1px solid var(--line);background:none;border-radius:0;transition:border-color .5s}
.comp-card:hover{border-top-color:var(--gold-55)}
.comp-card h4{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;font:500 16px/1.3 var(--sans);color:var(--fg)}
.comp-cifra{margin:0 0 12px;font-size:13.5px;color:var(--mute)}
.comp-cifra b{display:block;font:400 clamp(40px,4vw,56px)/1 var(--sans);letter-spacing:-.04em;color:var(--fg);font-variant-numeric:tabular-nums;margin-bottom:6px}
.comp-item{padding:10px 0;border-top:1px solid var(--line-2);font-size:14.5px;line-height:1.45}
.comp-item a{color:var(--fg-82);text-decoration:none;transition:color .3s}
.comp-item a:hover{color:var(--gold)}
.comp-fecha{display:block;margin-top:3px;font-size:12.5px;color:var(--mute-2)}
.comp-vacio{font-size:14px;color:var(--mute)}

/* ---------- verificar ---------- */
.veredicto{
  display:inline-flex;align-items:center;gap:10px;padding:8px 16px 7px;border:1px solid currentColor;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--fg-82);background:transparent
}
.veredicto .bolita{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.veredicto.si{color:var(--verde)}
.veredicto.duda{color:var(--gold)}
.veredicto.no{color:var(--rojo)}
.campos-cita{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.campo-cita{padding:7px 14px 6px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--fg-82)}
.campo-cita b{margin-right:6px;font-size:11.5px;font-weight:500;color:var(--mute-2)}
.campo-cita.falta{border-style:dashed;color:var(--mute-2)}
.candidato{padding:18px 0;border-top:1px solid var(--line)}
.candidato .porque{margin:8px 0 10px;padding-left:18px;font-size:14px;color:var(--mute)}
.candidato .porque li{margin-bottom:3px}
/* las guías: una línea con un punto por paso */
.fichas{display:grid;gap:26px;margin-top:10px;padding-left:0}
.ficha-paso{
  position:relative;display:block;width:100%;padding:0;border:0;background:none;text-align:left;
  font:400 16px/1.55 var(--sans);color:var(--fg-82);transition:color .3s
}
.ficha-paso::before{content:"";position:absolute;left:-35px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--gold);transition:background .3s}
.ficha-paso:hover{color:var(--fg)}
.ficha-paso:hover::before{background:var(--gold)}
.ficha-paso em{color:inherit}
.blk .sin-items{display:grid;gap:0}
.blk .sin-items p{margin:0;padding:12px 0;border-top:1px solid var(--line-2);font-size:15.5px;color:var(--mute);transition:color .3s}
.blk .sin-items p:hover{color:var(--fg)}



/* ---------- tesauro con fallos cargados ---------- */
.tes-acc{display:flex;flex-wrap:wrap;gap:8px}
.tes-btn[aria-expanded="true"]{border-color:var(--gold-55);color:var(--gold)}
.tes-panel{margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.tes-nota{margin:8px 0 10px;font-size:12.5px;color:var(--mute-2)}
.tes-voz{border-bottom:1px solid var(--line)}
.tes-voz summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;cursor:pointer;list-style:none;font-size:15px}
.tes-voz summary::-webkit-details-marker{display:none}
.tes-voz summary::after{content:"▾";color:var(--mute-2);font-size:12px;transition:transform .3s}
.tes-voz[open] summary::after{transform:rotate(180deg)}
.tes-voz summary small{margin-left:auto;color:var(--mute-2);font-size:12.5px}
.tes-fallo{padding:12px 0;border-top:1px solid var(--line)}
.tes-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--mute-2);margin-bottom:6px}
.tes-fallo h4{margin:0 0 6px;font:500 14.5px/1.35 var(--sans)}
.tes-fallo p{margin:0 0 8px;font-size:14px;line-height:1.55;color:var(--mute)}
.tes-mas{margin:10px 0 14px}
/* ---------- Lexia sobre el fallo (local) ---------- */
.lector-lado{position:sticky;top:170px;max-height:calc(100vh - 200px);overflow:auto;overflow-x:hidden;padding:0 6px 0 0}
.lector-lado .meta{position:static;max-height:none;overflow:visible;padding:0}
.lector-lado .lx-fallo{margin:0 0 20px;padding:16px}
.lector-lado .lx-fila{grid-template-columns:78px minmax(0,1fr)}
.lx-mini{border-color:var(--gold-55);color:var(--gold)}
.lx-fallo{margin:28px 0 8px;padding:20px;border:1px solid var(--gold-55);border-radius:24px;background:rgba(var(--gold-rgb),.035);scroll-margin-top:150px}
.verif{display:inline-flex;align-items:center;gap:7px;margin-left:6px;font-size:12px;font-weight:400;line-height:1;color:var(--acequia);vertical-align:middle}
.verif svg{flex:none;display:block}
.lx-pill{appearance:none;display:inline-flex;align-items:center;gap:9px;padding:9px 18px 8px 14px;border:1px solid var(--gold-55);border-radius:999px;background:rgba(var(--gold-rgb),.1);color:var(--gold);font:500 14px/1 var(--sans);cursor:pointer}
.lx-sub{margin:9px 0 0;padding:0;font-size:12.5px;color:var(--mute-2)}
.lx-fallo:not(.abre){padding:0;border:0;background:none}
.lx-fallo .lx-cuerpo{display:none;margin-top:14px}
.lx-fallo.abre .lx-cuerpo{display:block}
.lx-cab{display:flex;align-items:center;gap:10px;font-size:16px}
.lx-cab b{font-weight:500}
.lx-cab span:last-child{color:var(--mute-2);font-size:13.5px}
.lx-punto{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.16)}
.lx-nota{margin:6px 0 14px;font-size:12.5px;color:var(--mute-2)}
.lx-sug{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lx-sug .chip{padding:8px 14px 7px;font-size:13px}
.lx-form{display:flex;gap:8px;align-items:center;padding:5px 5px 5px 16px;border:1px solid var(--line-2,var(--line));border-radius:999px;background:rgba(var(--tx),.03)}
.lx-form input{flex:1;min-width:0;border:0!important;background:none!important;padding:8px 0!important;font-size:15px;outline:none}
.lx-form .btn{padding:9px 16px 8px;font-size:13.5px}
#lx-resp{display:grid;gap:14px;margin-top:16px}
.lx-r{padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:96px;border-radius:16px;transition:box-shadow .35s,background-color .35s,padding .2s}
.lx-r:focus{outline:none}
.lx-r:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
/* la respuesta que se acaba de pedir: cuadro dorado y la pregunta en dorado */
.lx-r--ahora{padding:14px 14px 10px;margin:0 -14px;border-top-color:transparent;box-shadow:0 0 0 1.5px var(--gold),0 0 28px rgba(var(--gold-rgb),.18);background:rgba(var(--gold-rgb),.06)}
.lx-r--ahora .lx-q{color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:reduce){ .lx-r{transition:none} }
.lx-q{margin:0 0 8px;font-size:13px;color:var(--gold)}
.lx-lista{margin:4px 0 10px;padding-left:18px;font-size:14px;line-height:1.55;color:var(--fg-82,var(--fg))}
.lx-lista li{margin:0 0 5px}
.lx-lista.lx-sec{color:var(--mute);font-size:13.5px}
.lx-lista .mini{margin:0 0 0 4px;padding:2px 9px}
.lx-estado{padding:8px 12px;border:1px solid var(--line);border-radius:14px}
.lx-mas{margin:6px 0 8px;font-size:13.5px;color:var(--mute)}
.lx-mas summary{cursor:pointer;color:var(--gold)}
.lx-art{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted var(--gold-55);text-underline-offset:3px;cursor:pointer}
.lx-nota-in{font-size:12px;color:var(--mute-2)}
.lx-r p{margin:0 0 8px;font-size:14.5px;line-height:1.55;color:var(--fg-82,var(--fg))}
.lx-r h4{margin:14px 0 6px;font-size:13px;font-weight:500;color:var(--mute)}
.lx-r h4.lx-parte{margin:18px 0 6px;padding-top:10px;border-top:1px solid var(--line,rgba(127,127,127,.18));font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.lx-r h4.lx-parte:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.lx-r .lx-sint{color:var(--gold);font-weight:500}
.lx-pas{margin:4px 0 6px;padding:2px 0;font-size:14px;line-height:1.6;color:var(--mute)}
.lx-r .mini{margin-bottom:6px}
.lx-ficha{display:grid;gap:6px;margin-bottom:6px}
.lx-fila{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:14px}
.lx-fila b{font-weight:400;color:var(--mute-2);font-size:12.5px}
.lx-tags{display:flex;flex-wrap:wrap;gap:6px}
.lx-tags .meta-tag{background:none;cursor:pointer}
.lx-nada{color:var(--mute-2)!important}
.lx-r .lx-nota{margin-top:10px;font-size:12px;color:var(--mute-2)}
.lx-monto{margin:10px 0 2px!important}
.lx-chip{display:none}
.lector-acciones{display:none}
@media (max-width:760px){
  /* Lexia vive en el buscador: sin botón flotante que tape la barra */
  .asist__fab{display:none!important}
  .lx-chip{display:inline-flex;flex:none;align-items:center;gap:6px;margin-right:8px;padding:7px 11px 6px;border:0;border-radius:999px;background:rgba(var(--gold-rgb),.14);color:var(--gold);font:500 12.5px/1 var(--sans)}
  .lx-chip i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .bq-barra .cq{display:flex;align-items:center;min-width:0;max-width:100%;box-sizing:border-box}
  .bq-barra{min-width:0}
  .bq-barra .cq input{flex:1 1 0;min-width:0;width:0}
  .bq-barra .cq .btn{flex:none}
  /* el fallo a pantalla completa: sin la barra de secciones, con acciones propias */
  body.en-lector .botnav{display:none}
  body.en-lector .lector-acciones{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:56;
    padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(var(--bg-rgb),.96);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .lector-acciones button{appearance:none;border:0;background:none;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font:400 11.5px/1.1 var(--sans)}
  .lector-acciones button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .lector-acciones button.lx{color:var(--gold)}
  body.en-lector .barra-doc{top:calc(56px + env(safe-area-inset-top,0px));gap:8px;padding:10px 0;margin-bottom:14px}
  body.en-lector .barra-doc .cnt{flex:1 1 100%;font-size:13px}
  body.en-lector .barra-doc [data-act="tog-parcial"],body.en-lector .barra-doc [data-act="doc-otro"],body.en-lector .barra-doc [data-act="compartir-lector"]{display:none}
  body.en-lector .barra-doc [data-act="marca-ant"],body.en-lector .barra-doc [data-act="marca-sig"]{min-height:40px;padding:0 16px}
  /* diseño E: el fallo primero */
  body.en-lector #cab{display:none}
  body.en-lector .wrap{padding-top:0}
  body.en-lector .barra-doc{flex-wrap:wrap;align-items:center}
  body.en-lector .barra-doc .cnt{flex:1 1 0;order:1}
  body.en-lector .barra-doc [data-act="marca-ant"],body.en-lector .barra-doc [data-act="marca-sig"]{order:2;width:40px;min-height:40px;padding:0;font-size:0;justify-content:center}
  body.en-lector .barra-doc [data-act="marca-ant"]::before{content:"▲";font-size:13px}
  body.en-lector .barra-doc [data-act="marca-sig"]::before{content:"▼";font-size:13px}
  body.en-lector .barra-doc .campo{order:3;flex:1 1 100%}
  body.en-lector .barra-doc .campo span{display:none}
  body.en-lector .barra-doc .campo input{font-size:16px;padding:4px 0 6px}
  body.en-lector .lector-grid{display:flex;flex-direction:column}
  body.en-lector .lector-grid>.lector-lado{order:2;position:static;max-height:none;overflow:visible;margin-top:18px}
  body.en-lector .doc{font-size:16px;line-height:1.7}
  .lx-fallo{padding:16px;margin-left:-2px;margin-right:-2px}
  .lx-fila{grid-template-columns:82px minmax(0,1fr)}
}

/* ---------- el lector ---------- */
.barra-doc{
  position:sticky;top:calc(71px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  margin:0 0 22px;padding:14px 0
}
/* Sin franja oscura de bordes rectos ni línea debajo: el fondo llega hasta los bordes de la pantalla y se funde
   hacia arriba y hacia abajo (fondo y desenfoque con máscara), como el de la barra de arriba. */
.barra-doc::before{
  content:"";position:absolute;z-index:-1;pointer-events:none;left:calc(var(--pad) * -1);right:calc(var(--pad) * -1);top:-14px;bottom:-30px;
  background:rgba(var(--bg-rgb),.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 58%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 58%,transparent 100%)
}
.barra-doc .cnt{flex:1 1 220px;min-width:0;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.barra-doc .cnt b{color:var(--fg);font-weight:500}
.barra-doc .campo{flex:1 1 260px;margin:0}
.barra-doc .campo span{margin-bottom:2px;font-size:12.5px}
.barra-doc .campo input{padding:11px 22px 10px;font-size:18px}
.lector-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:clamp(24px,3vw,48px);align-items:start;margin-bottom:12px}
.meta{position:sticky;top:170px;max-height:calc(100vh - 200px);overflow:auto;overflow-x:hidden;padding:0 6px 0 0;border:0;background:none}
.meta-top{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta-car{margin:0 0 10px;font:500 16px/1.4 var(--sans);color:var(--fg)}
.meta-fila{display:grid;gap:6px}
.meta-fila .izq{font-size:13.5px;line-height:1.6;color:var(--fg-82)}
.meta-fila .izq b{font-size:12px;font-weight:400;color:var(--mute-2);margin-right:3px}
.meta-fila .izq .sep{color:var(--mute-2);margin:0 3px}
.meta-fila .der{font-size:12px;color:var(--mute-2)}
.meta-cuerpo{display:grid;gap:16px;margin-bottom:16px}
.meta-bloque h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--fg-82)}
.meta-bloque.cn h3{color:var(--gold)}
.meta-cat{margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute-2)}
.meta-cat:first-child{padding-top:0;border-top:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.meta-tag{padding:4px 11px 3px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--fg-82);max-width:100%;overflow-wrap:anywhere}
.meta-bloque.pendiente h3{color:var(--mute);font-weight:400}
.meta-bloque.pendiente .meta-tag{border-style:dashed;color:var(--mute-2)}
.meta-acc{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.doc{
  max-height:72vh;overflow:auto;padding:4px clamp(14px,2vw,28px) 4px 0;border:0;
  font:400 17px/1.8 var(--sans);color:var(--fg-82);white-space:pre-wrap;word-wrap:break-word
}
mark{background:rgba(var(--gold-rgb),.26);color:var(--fg);padding:0 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.actual{background:var(--gold);color:var(--bg)}
/* Los pasajes, todos a la vista a la vez: una grilla de recortes debajo
   del fallo, cada uno con su contexto y sus acciones. */
#doc-tit-pas{margin:clamp(48px,6vw,72px) 0 0;padding-bottom:16px;border-bottom:1px solid var(--line);font:400 clamp(24px,2.2vw,32px)/1.1 var(--titulo);letter-spacing:-.025em;color:var(--fg)}
#pasajes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0 clamp(24px,3vw,48px)}
.pasaje{margin:0;padding:22px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;transition:border-color .5s}
.pasaje:hover{border-bottom-color:var(--gold-55)}
.pasaje .txt{margin-bottom:14px;font:400 15.5px/1.65 var(--sans);color:var(--fg-82)}
.pasaje .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pasaje .pos{font-size:12px;color:var(--mute-2)}
@media (max-width:980px){ .lector-grid{grid-template-columns:minmax(0,1fr)} .meta,.lector-lado{position:static;max-height:none;overflow:visible} }

/* ---------- estado de las bases (riel de Buscar) ---------- */
.rail-resumen{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;font-size:12.5px;color:var(--mute-2)}
.rf-srv{display:inline-block;width:5px;height:5px;margin-right:7px;vertical-align:middle;border-radius:50%;background:var(--rojo);flex:none}
.rf-srv.ok{background:var(--verde);box-shadow:0 0 0 2.5px rgba(143,191,154,.15)}
.rail-fuente .rf-t{flex:none;margin-left:8px;font-size:11.5px;color:var(--mute-2);font-variant-numeric:tabular-nums}
.rail-fuente.consultando .rf-punto{animation:parpadeo 1s ease-in-out infinite alternate}
.rail-fuente.consultando .rf-t{color:var(--gold)}
.rail-fuente.con-error .rf-punto{background:var(--rojo)}
.rail-fuente.con-error .rf-t{color:var(--rojo)}
@keyframes parpadeo{from{opacity:.25}to{opacity:1}}

/* ---------- comparar: la barra de cada base ---------- */
.comp-barra{display:block;height:3px;margin:0 0 14px;border-radius:999px;background:var(--line-2);overflow:hidden}
.comp-barra i{display:block;height:100%;border-radius:999px;background:var(--punto,var(--gold));transition:width .9s var(--ease)}

/* ---------- lector: el minimapa ---------- */
.doc-marco{position:relative;min-width:0;padding-right:26px}
.doc{position:relative}
.minimapa{position:absolute;top:0;right:0;bottom:0;width:12px;border-radius:999px;background:rgba(var(--tx),.05)}
.mm-ventana{position:absolute;left:0;right:0;border-radius:999px;background:rgba(var(--tx),.12);pointer-events:none}
.mm-marca{position:absolute;left:1px;right:1px;height:3px;margin-top:-1.5px;padding:0;border:0;border-radius:2px;background:var(--gold-55);cursor:pointer;transition:background .2s}
.mm-marca::before{content:"";position:absolute;inset:-4px -3px}
.mm-marca:hover{background:var(--fg)}
.mm-marca.actual{background:var(--gold);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.28)}

/* ---------- verificar: la constancia ---------- */
.constancia{
  display:grid;grid-template-columns:120px minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;
  margin:24px 0;padding:clamp(22px,2.6vw,32px);border:1px solid var(--gold-55);background:rgba(var(--gold-rgb),.04)
}
.constancia__sello{width:120px;height:120px;color:var(--gold);font-family:var(--caps);animation:sella .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sella{from{opacity:0;transform:scale(1.35) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
.constancia__tit{margin:0 0 14px;font:500 20px/1.25 var(--sans);color:var(--fg)}
.constancia dl{display:grid;gap:12px;margin:0}
.constancia dl div{padding-top:10px;border-top:1px solid var(--line)}
.constancia dt{font-size:12.5px;color:var(--mute-2)}
.constancia dd{margin:4px 0 0;color:var(--fg-82);overflow-wrap:anywhere}
.constancia .acciones{margin-top:18px;padding-top:0;border-top:0}
.constancia__nota{margin:14px 0 0;font-size:12.5px;color:var(--mute-2)}
@media (max-width:640px){ .constancia{grid-template-columns:minmax(0,1fr)} .constancia__sello{width:96px;height:96px} }

/* ---------- requisitos: la lista de control ---------- */
.req-item{
  display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:0;border:0;background:none;
  text-align:left;font:inherit;color:var(--fg-82);cursor:pointer
}
.req-caja{width:18px;height:18px;margin-top:3px;border:1px solid var(--mute-2);border-radius:50%;transition:background .25s,border-color .25s,box-shadow .25s}
.req-item:hover .req-caja{border-color:var(--gold)}
.req-item[aria-pressed="true"] .req-caja{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--bg)}
.req-item[aria-pressed="true"] .req-txt{color:var(--mute-2);text-decoration:line-through;text-decoration-color:var(--gold-55)}
.req-progreso{color:var(--gold)}

/* ---------- los dibujos de cada sección ---------- */
.cab{display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,19vw,260px);column-gap:clamp(24px,4vw,72px);align-items:start}
.cab>*{grid-column:1}
.cab>.cab__dibujo{grid-column:2;grid-row:1 / span 6;align-self:center;width:100%;height:auto;overflow:visible;color:var(--fg)}
.cab__dibujo .dl{fill:none;stroke:rgba(var(--tx),.5);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:0}
.cab__dibujo .dd{fill:var(--gold)}
.cab__dibujo .dp{fill:rgba(var(--tx),.35)}
.cab:not(.quieta) .cab__dibujo .dl{animation:trazo 1.4s var(--ease) both;animation-delay:calc(.15s + var(--i,0) * 45ms)}
.cab:not(.quieta) .cab__dibujo .dd{animation:aparece .6s var(--ease) 1.1s both}
@keyframes trazo{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@media (max-width:760px){ .cab{grid-template-columns:minmax(0,1fr)} .cab>.cab__dibujo{display:none} }

/* ---------- cálculos ---------- */
.calc-sel{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0 0 40px;padding:4px;border:1px solid var(--line);border-radius:999px}
.calc-sel__b{padding:9px 16px 8px;border:0;border-radius:999px;background:none;font-size:14px;color:var(--mute);transition:background .3s,color .3s}
.calc-sel__b:hover{color:var(--fg)}
.calc-sel__b[aria-selected="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:640px){ .calc-sel{border:0;padding:0;gap:8px} .calc-sel__b{border:1px solid var(--line)} .calc-sel__b[aria-selected="true"]{border-color:var(--fg)} }
.calc-total{margin:18px 0 0;font:400 clamp(28px,2.6vw,40px)/1.1 var(--sans);letter-spacing:-.025em;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:normal}
.calc-total::first-letter{text-transform:uppercase}
.calc-sub{margin:10px 0 0;font-size:14px;color:var(--mute)}
.calc-vacio{margin:16px 0 0;color:var(--mute)}
.calc-aviso{margin:16px 0 0;padding-left:0;font-size:13px;line-height:1.55;color:var(--mute)}
.calc-base{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--mute)}
.calc-nota{margin:0;font-size:13.5px;line-height:1.55;color:var(--mute-2)}
.calc-ley{display:block;margin-top:2px;font-size:12px;color:var(--mute-2)}
.brief__summary .brief__list dd{font-variant-numeric:tabular-nums}
.calc-tildes{display:grid;gap:14px}
.tramos{display:grid;gap:22px}
.tramo{padding-top:16px;border-top:1px solid var(--line-2)}
.tramo__n{margin:0 0 6px;font-size:12.5px;color:var(--mute-2)}
.tramo .fila{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){ .tramo .fila{grid-template-columns:minmax(0,1fr)} }
input[type=date]{color-scheme:dark;min-height:46px}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}


/* ---------- herramientas para PDF ---------- */
.her{margin:0 0 clamp(36px,5vw,64px);padding-top:28px;border-top:1px solid var(--line)}
.her-cab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:start;margin-bottom:20px}
.her-n{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;font:500 14px/1 var(--caps);color:var(--gold)}
.her-cab h2{margin:3px 0 4px;font:500 clamp(20px,2vw,26px)/1.2 var(--sans);letter-spacing:-.02em}
.her-cab p{margin:0;max-width:62ch;color:var(--mute);font-size:14.5px}
.her-zona{display:block;margin:0 0 14px;padding:18px 22px;border:1px dashed rgba(var(--tx),.22);border-radius:999px;
  color:var(--mute);cursor:pointer;transition:border-color .3s,color .3s}
.her-zona:hover,.her-zona:focus-within{border-color:var(--gold);color:var(--fg)}
.her-zona__t b{color:var(--fg);font-weight:500}
.her-zona input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.her-lista{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--line)}
.her-lista li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.her-nom{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.her-peso{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.her-ctl{display:flex;gap:6px}
.her-opc{display:grid;gap:12px;margin:0 0 16px}
.her-opc--fila{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.her-opc--fila .her-radio{grid-column:1/-1}
.her-campo{margin:0}
.her-radio{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer}
.her-radio input{margin-top:5px;accent-color:var(--gold)}
.her-radio em{font-style:normal;color:var(--mute);font-size:13px}
.her-sub{display:grid;gap:8px;margin:0 0 4px 28px}
.her-acc{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 8px}
.her-acc .btn[disabled],.her-ctl .mini[disabled]{opacity:.4;cursor:not-allowed}
.her-estado{min-height:1.4em;margin:6px 0 0;font-size:14px;color:var(--fg)}
.her-estado.mal{color:#e0a0a0}
.her-nota{margin:10px 0 0;max-width:70ch;font-size:13px;line-height:1.55;color:var(--mute)}
.her-nota--solo{margin:0;font-size:14px}
.her-texto{width:100%;margin:10px 0;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:none;color:var(--fg);font:400 14px/1.6 var(--sans);resize:vertical}

/* ---------- calendario judicial ---------- */
.cal{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,1fr);gap:28px clamp(28px,4vw,64px);align-items:start}
.cal-hoy{grid-column:1/-1;padding-bottom:22px;border-bottom:1px solid var(--line)}
.cal-hoy p{display:flex;align-items:center;gap:10px;margin:0;font-size:17px}
.cal-hoy p::first-letter{text-transform:uppercase}
.cal-cab{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cal-cab h3{min-width:11ch;margin:0;text-align:center;font:500 22px/1.2 var(--sans);letter-spacing:-.015em}
.cal-cab h3::first-letter{text-transform:uppercase}
.cal-juris{flex-basis:100%;margin-top:8px}
.cal-grilla{grid-column:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:420px}
.cal-sem{padding-bottom:6px;font-size:12px;color:var(--mute-2);text-align:center}
.cal-dia{display:grid;place-items:center;aspect-ratio:1;max-width:100%;border:1px solid var(--line-2);border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg-82)}
.cal-dia.vacio{border:0}
.cal-dia.fin{color:var(--mute-2);border-color:transparent}
.cal-dia.feriado{border-color:var(--gold);color:var(--gold)}
.cal-dia.extra{border-color:var(--gold-55);border-style:dashed;color:var(--gold)}
.cal-dia.hoy{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.cal-lista{grid-column:2;grid-row:2 / span 2;display:grid;gap:10px}
.cal-lista p{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:10px;margin:0;padding-top:10px;border-top:1px solid var(--line-2);font-size:14.5px;color:var(--fg-82)}
.cal-lista b{font-weight:500;font-variant-numeric:tabular-nums}
.cal-lista .cal-feriado{color:var(--gold)}
.cal-lista .cal-extra{color:var(--gold-55)}
.cal-extra{grid-column:1/-1;margin-top:24px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:16px}
.cal-extra h3{margin:0;font:500 20px/1.2 var(--sans)}
.cal-cargados{display:grid;gap:8px}
.cal-cargados p{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0;font-size:14.5px;color:var(--fg-82)}
@media (max-width:860px){ .cal{grid-template-columns:minmax(0,1fr)} .cal-lista{grid-column:1;grid-row:auto} }

/* ---------- glosario ---------- */
.glos-barra{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
.glos-barra .campo{flex:0 1 420px;margin:0}
.glos-letras{display:flex;flex-wrap:wrap;gap:4px 14px;margin:28px 0 8px;font:500 15px/1 var(--caps);letter-spacing:.12em}
.glos-letras a{color:var(--mute);text-decoration:none;transition:color .3s}
.glos-letras a:hover{color:var(--gold)}
.glos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(28px,4vw,64px);margin:0}
.glos-item{padding:20px 0;border-top:1px solid var(--line);scroll-margin-top:110px;transition:border-color .5s}
.glos-item:hover{border-top-color:var(--gold-55)}
.glos dt{font:500 clamp(19px,1.6vw,23px)/1.2 var(--caps);letter-spacing:.06em;color:var(--gold)}
.glos dd{margin:8px 0 0;color:var(--fg-82)}
.glos-lit{display:block;margin-bottom:4px;font-size:14px;color:var(--mute)}
@media (max-width:860px){ .glos{grid-template-columns:minmax(0,1fr)} }

/* ---------- exportar ---------- */
.pas-export{margin:14px 0 0}
.pasaje,.pasaje .txt,.blk{min-width:0;max-width:100%}
.pasaje .txt,.blk p,.blk .vacio{overflow-wrap:anywhere;word-break:break-word}
.perfil-menu,.pm-cab{overflow-wrap:break-word}

/* El punto medio "·" de la tipografía cae alto (su centro está a 38,6 % del
   cuerpo; la mitad de una palabra, entre minúsculas y mayúsculas, está a
   30 %). Cada uno va en un <span class="pm"> —ver centrarSeparadores— y se
   baja esa diferencia, igual en todos. */
.pm{position:relative;top:.087em}


/* ---------- compartir, avisos flotantes, error ---------- */
.compartir{position:relative;display:inline-block}
.compartir-menu.flotante{position:fixed;z-index:200;right:auto;top:auto}
.compartir-menu{
  position:absolute;z-index:30;right:0;top:calc(100% + 8px);min-width:220px;padding:6px;
  background:#16130f;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)
}
.compartir-menu button,.compartir-menu a{
  display:block;width:100%;padding:10px 14px;border:0;border-radius:999px;background:none;text-align:left;
  font-size:14px;color:var(--fg-82);text-decoration:none
}
.compartir-menu button:hover,.compartir-menu a:hover{background:rgba(var(--tx),.06);color:var(--fg)}
#flash{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;transform:translateX(-50%);display:none;
  max-width:calc(100vw - 32px);padding:12px 20px 11px;border-radius:999px;background:var(--fg);color:var(--bg);
  font-size:14px;font-weight:500;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)
}
#panic{display:none;padding:12px var(--pad);background:#5c1f1a;color:var(--fg);font-size:14px}
#panic button{margin-left:12px;padding:5px 14px;border:0;border-radius:999px;background:var(--fg);color:#5c1f1a;cursor:pointer}

/* ---------- pie ---------- */
.pie{padding:0 var(--pad) calc(40px + env(safe-area-inset-bottom,0px));font-size:13px;line-height:1.6;color:var(--mute-2)}
.pie hr{display:none}
/* El pie queda fijo abajo, sin fondo, y sólo aparece cuando se llega al final de la página. */
.pie{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;line-height:1.5;
  opacity:0;pointer-events:none;transition:opacity .35s ease}
.pie.on{opacity:1}
body.en-lector .pie,body.menu-on .pie{display:none!important}
html,body{overflow-anchor:none}
/* la página termina por encima del pie fijo: nada queda debajo de él */
.wrap{padding-bottom:max(110px,150px)}
body.en-lector .pie{bottom:0}
@media (max-width:760px){.pie{bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:56;padding:8px var(--pad);font-size:11px}.wrap{padding-bottom:190px}}
.pie strong{color:var(--fg-82)}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:24px}
  .rail{position:static}
  .rail-list{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;max-height:none;gap:6px;padding-bottom:8px}
  .rail-list button{white-space:nowrap;padding:7px 14px;border:1px solid var(--line);border-radius:999px}
  .rail-list button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .rail-list button[aria-pressed="true"]::before{display:none}
}

/* ================================================================== *
   PORTADA — el afiche de sigillvm. Se abre al entrar y se cierra al
   elegir a dónde ir; el nombre de la cabecera la vuelve a abrir.
 * ================================================================== */
.entrada{
  position:fixed;inset:0;z-index:100;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:var(--bg);color:var(--fg);opacity:1;transition:opacity .9s ease-in-out
}
.entrada.saliendo{opacity:0;pointer-events:none}
.portada-marco{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:block}
/* El grano de la portada es el mismo de sigillvm.com, con sus dos texturas
   y sus mismos valores: uno detrás del contenido y otro, más fino, por
   encima de todo —letras incluidas— mezclado en "overlay", corridos medio
   ciclo entre sí para que se muevan como película. */
.entrada .grano{
  position:fixed;z-index:0;inset:0;opacity:1;
  background:url("./grano.png") 0 0/256px 256px repeat;
  animation:grano .9s steps(1,end) infinite
}
.entrada .grano--sobre{
  z-index:30;opacity:.32;mix-blend-mode:overlay;
  background:url("./grano-sobre.png") 0 0/256px 256px repeat;animation-delay:-.45s
}
.pt-in{position:relative;z-index:1}
.pt-hdr{
  position:fixed;top:0;left:0;right:var(--sbw,0px);z-index:20;display:flex;align-items:center;gap:clamp(28px,4vw,72px);
  padding:calc(22px + env(safe-area-inset-top,0px)) var(--pad) 18px;border-bottom:1px solid transparent;
  transition:background .5s,border-color .5s,padding .5s
}
.pt-hdr.is-solid{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;background:rgba(var(--bg-rgb),.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pt-brand{position:relative;display:block;width:180px;height:44px;flex:none}
.pt-brand__tag,.pt-brand__name{position:absolute;left:0;top:50%;transition:opacity .45s,transform .45s var(--ease)}
.pt-brand__tag{transform:translateY(-50%);font-size:15px;line-height:1.35;white-space:nowrap}
.pt-brand__name{display:inline-flex;align-items:center;gap:12px;opacity:0;transform:translateY(-20%)}
.pt-brand__name .marca{font-size:15px;font-weight:500;letter-spacing:.26em;--ls:.26em;line-height:18px}
.pt-hdr.is-solid .pt-brand__tag{opacity:0;transform:translateY(-80%)}
.pt-hdr.is-solid .pt-brand__name{opacity:1;transform:translateY(-50%)}
.pt-nav{display:flex;gap:clamp(18px,2vw,30px)}
.pt-nav button{padding:4px 0;border:0;background:none;font-size:15px;color:var(--mute);transition:color .3s}
.pt-nav button:hover,.pt-nav button:active{color:var(--gold)}
.pt-hdr .btn{margin-left:auto;padding:9px 16px 8px;font-size:13.5px}

.pt-hero{position:relative;display:flex;min-height:100vh;min-height:100svh;overflow-x:clip}
.pt-sello{
  position:absolute;left:80vw;top:44%;width:128vh;height:128vh;color:var(--fg);pointer-events:none;
  transform:translate(-50%,calc(-50% + var(--hp,0) * 90px));opacity:calc(1 - var(--hp,0) * .6)
}
.pt-sello svg{width:100%;height:100%;overflow:visible}
.sg-texto{font-family:var(--caps);fill:currentColor}
.sg-aro{fill:none;stroke:currentColor}
.sg-renglones path{fill:none;stroke:currentColor;stroke-dasharray:1 1;stroke-dashoffset:0;animation:renglon 1.1s var(--ease) both;animation-delay:calc(.35s + var(--i) * 42ms)}
.sg-punto{fill:var(--gold);transform-box:fill-box;transform-origin:center;animation:punto .9s cubic-bezier(.34,1.56,.64,1) 2.3s both}
@keyframes renglon{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes punto{from{transform:scale(0)}to{transform:scale(1)}}
/* el radar del sello: un haz que gira y, bajo él, las letras de cada fallo que se encienden a su paso */
.pt-sello canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.rf-cap{position:absolute;left:0;top:0;width:1000px;height:1000px;transform-origin:0 0;pointer-events:none}
.rf{position:absolute;width:max-content;max-width:410px}
.rf-t{display:flex;align-items:baseline;gap:20px;white-space:nowrap}
.rf-n{font:400 27px/1.1 var(--caps);letter-spacing:.04em;color:var(--fg)}
.rf-d{font:400 20px/1.1 var(--sans);color:var(--gold)}
.rf-f,.rf-a,.rf-c{margin:0}
.rf-f{margin-top:12px;font:400 15px/19px var(--sans);color:rgba(var(--tx),.82)}
.rf-a{margin-top:12px;font:400 12.5px/17px var(--sans);color:var(--mute)}
.rf-c{margin-top:8px;font:500 13px/1.2 var(--caps);letter-spacing:.06em;color:var(--gold)}
.rk{opacity:0}
@media (max-width:900px){.rf-cap{display:none}}


.gira{animation:gira 240s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes gira{to{transform:rotate(360deg)}}
.pt-copia{position:relative;flex:1;min-width:0;padding:clamp(110px,26vh,280px) var(--pad) 40px;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
.pt-copia>*{pointer-events:auto}
.pt-titular{margin:0;max-width:20ch;font:400 clamp(30px,3.4vw,54px)/1.06 var(--titulo);letter-spacing:-.02em}
.pt-titular em{font-style:normal}
.pt-datos{display:flex;flex-wrap:wrap;gap:8px 26px;margin:24px 0 0;font-size:13px;color:var(--mute)}
.pt-datos>div{display:flex;align-items:baseline;gap:6px}
.pt-datos dt{order:2;text-transform:lowercase}
.pt-datos dd{order:1;margin:0;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.pt-datos>div:first-child::before{content:"";align-self:center;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--gold);animation:late 2.4s var(--ease) infinite}
@keyframes late{0%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.55)}100%{box-shadow:0 0 0 8px rgba(var(--gold-rgb),0)}}
.pt-acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.pt-marca{
  margin:auto 0 -16px;padding-top:48px;white-space:nowrap;pointer-events:none!important;--ls:.02em;
  font:300 clamp(64px,11.5vw,220px)/.86 var(--caps);letter-spacing:.02em;color:rgba(var(--tx),.8)
}
/* Igual que el nombre de sigillvm.com: Cormorant SC en peso 300, 11,5 % del
   ancho, interlineado .86, y las letras que se esfuman una tras otra y
   vuelven en el mismo orden. La V, la X y el punto llevan el dorado. */
.pt-marca>span{display:inline-block;animation:disuelve 11s ease-in-out infinite;animation-delay:calc(1.6s + var(--i) * .22s)}
.pt-marca .v,.pt-marca .m-punto{background:linear-gradient(170deg,#f0c75a 8%,#d9a31b 46%,#a77a0c 92%)}
.pt-marca .v{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
/* El punto, a igual distancia de la tinta de la S y de la C y a media altura
   de las mayúsculas, con más aire que en la marca chica por el tamaño. */
.pt-marca .m-punto{width:.17em;height:.17em;vertical-align:.24em;margin:0 .091em 0 .066em}
@keyframes disuelve{0%,38%{opacity:1;filter:blur(0)}48%,60%{opacity:0;filter:blur(18px)}70%,100%{opacity:1;filter:blur(0)}}

.pt-sec{position:relative;padding:clamp(100px,16vh,190px) var(--pad) 0}
.pt-sec__tit{margin:0;font:400 clamp(36px,4.4vw,68px)/1.02 var(--titulo);letter-spacing:-.035em}
.pt-sec__intro{margin:24px 0 0;max-width:46em;color:var(--mute)}
.pt-parrafo{margin:0;max-width:24ch;font:400 clamp(30px,4.2vw,70px)/1.05 var(--titulo);letter-spacing:-.03em}
.pt-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 clamp(24px,3vw,56px);margin-top:clamp(56px,8vh,110px)}
.pt-cols--3{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:clamp(40px,5vw,64px)}
.pt-col{min-width:0;padding-top:22px;border-top:1px solid var(--line);transition:border-color .5s}
.pt-col:hover{border-top-color:var(--gold-55)}
/* Las seis bases llevan el color con que se identifica cada una en toda la
   página: el filete, la sigla y un punto. */
.pt-col[class*=" f-"]{border-top-color:color-mix(in srgb,var(--punto) 70%,transparent)}
.pt-col[class*=" f-"]:hover{border-top-color:var(--punto)}
.pt-col[class*=" f-"] .pt-lat{color:var(--punto)!important}
.pt-col[class*=" f-"] .pt-lat::after{content:"";display:inline-block;width:.32em;height:.32em;margin-left:.6em;border-radius:50%;background:var(--punto);vertical-align:.165em}
.pt-col h3{margin:0;font:500 17px/1.3 var(--sans)}
.pt-col p{margin:10px 0 0;color:var(--mute)}
.pt-col button{margin-top:18px;padding:0;border:0;background:none;font-size:14px;color:var(--fg);transition:color .3s}
.pt-col button:hover{color:var(--gold)}
.pt-lat{margin:0 0 18px!important;font:400 clamp(18px,2vw,30px)/1 var(--caps)!important;letter-spacing:.16em;color:var(--gold)!important;white-space:nowrap}
.pt-entrada{margin:0;font-size:15px;color:var(--mute)}
.pt-entrada span{margin:0 .5em;color:var(--gold)}
.pt-nombre{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(32px,6vw,120px);margin-top:26px;padding-top:clamp(28px,4vw,48px);border-top:1px solid var(--line)}
.pt-nombre h2{margin:0;max-width:21ch;font:400 clamp(28px,3vw,46px)/1.14 var(--titulo);letter-spacing:-.02em}
.pt-nombre div{display:grid;gap:1.1em;color:var(--mute);max-width:40em}
.pt-nombre p{margin:0}
.pt-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 32px;margin-top:clamp(56px,7vw,88px);padding-top:28px;border-top:1px solid var(--line)}
.pt-pie p{margin:0;max-width:40em;color:var(--mute)}
.pasos{position:relative;margin-top:clamp(56px,7vw,96px);container-type:inline-size}
.pasos__onda{display:block;width:100%;height:auto;overflow:visible}
.pasos__onda path{fill:none;stroke-width:1.2}
.pasos__pista{stroke:var(--line)}
.pasos__linea{stroke:var(--gold);stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--sp,0))}
.pasos ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.paso{position:relative;padding:34px clamp(18px,2.6vw,48px) 0 0}
.paso__punto{position:absolute;left:-4.5px;top:calc(-3.333cqw - 4.5px);width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--mute-2);transition:background .5s,border-color .5s,box-shadow .5s}
.paso.is-lit .paso__punto{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 6px rgba(var(--gold-rgb),.14)}
.paso h3{margin:0;font:500 clamp(20px,1.7vw,26px)/1.2 var(--sans);letter-spacing:-.01em}
.paso p{margin:12px 0 0;color:var(--mute)}
.lat{display:block;width:min(100%,220px);height:auto;margin-bottom:24px;overflow:visible}
.lat path,.lat circle.l{fill:none;stroke:rgba(var(--tx),.5);stroke-width:1}
.lat .d{fill:var(--gold)}
.onda{animation:onda 3.6s var(--ease) infinite;transform-box:fill-box;transform-origin:left center}
.onda:nth-of-type(2){animation-delay:.9s}.onda:nth-of-type(3){animation-delay:1.8s}.onda:nth-of-type(4){animation-delay:2.7s}
@keyframes onda{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.deriva{animation:deriva 9s linear infinite}
@keyframes deriva{0%{transform:translateX(0)}100%{transform:translateX(180px)}}
.latido{animation:latido 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
.pt-cierre{padding-bottom:clamp(110px,16vh,180px)}
.pt-cierre__txt{margin:0;max-width:18ch;font:400 clamp(36px,5.4vw,92px)/1.02 var(--titulo);letter-spacing:-.03em}
.pt-cierre__txt em{font-style:normal;color:var(--gold)}
.pt-ftr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:34px var(--pad) calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--mute-2)}
.pt-ftr .marca{font-size:12.5px;letter-spacing:.26em;--ls:.26em;color:var(--fg)}
/* aparecer al entrar en pantalla (solo en la portada) */
.entrada [data-reveal]{opacity:0;transform:translateY(22px)}
.entrada [data-reveal].is-in{opacity:1;transform:none;transition:opacity 1s var(--ease) var(--d,0s),transform 1.1s var(--ease) var(--d,0s)}
.pt-llega{opacity:0;transform:translateY(16px)}
.entrada.lista .pt-llega{opacity:1;transform:none;transition:opacity 1.2s var(--ease) var(--d,0s),transform 1.3s var(--ease) var(--d,0s)}
/* el puntero de luz de sigillvm, solo mientras está la portada */
.cursor{position:fixed;inset:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .4s}
.cursor.is-on{opacity:1}
.cursor i{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
.cursor .c-punto{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--gold);box-shadow:0 0 10px 2px rgba(255,196,110,.7)}
.cursor .c-aro{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(232,200,120,.7);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .35s}
.cursor .c-luz{width:440px;height:440px;margin:-220px 0 0 -220px;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,205,120,.16) 0%,rgba(240,165,80,.07) 28%,rgba(220,140,60,.03) 50%,rgba(220,140,60,0) 70%)}
.cursor.is-link .c-aro{width:62px;height:62px;margin:-31px 0 0 -31px;border-color:var(--gold);background:rgba(var(--gold-rgb),.1)}
.con-cursor .entrada,.con-cursor .entrada button{cursor:none}

@media (max-width:1100px){ .pt-cols{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px} }
@media (max-width:860px){
  .pt-cols--3,.pt-nombre{grid-template-columns:minmax(0,1fr)}
  .pasos__onda{display:none}
  .pasos ol{grid-template-columns:minmax(0,1fr);gap:40px;padding-left:0}
  .paso{padding:0}.paso__punto{left:-35px;top:7px}
}
@media (max-width:760px){
  .pt-nav{display:none}
  /* cabecera: la marca y el botón caben en una fila sin salirse de la pantalla */
  .pt-hdr{gap:10px}
  .pt-brand{width:150px}
  .pt-brand__tag{font-size:12px}
  .pt-hdr .btn{padding:8px 13px 7px;font-size:12.5px;white-space:nowrap}
  /* portada: una sola pantalla, con el sello arriba y debajo, pegados, titular, botones y nombre */
  .pt-hero{min-height:100vh;min-height:100svh}
  .pt-sello{left:72vw;top:33%;width:104vw;height:104vw}
  .pt-copia{justify-content:flex-end;padding:0 var(--pad) 4px}
  .pt-titular{max-width:none;font-size:clamp(28px,8.4vw,36px)}
  .pt-acciones{margin-top:22px}
  .pt-marca{margin:30px 0 0;padding-top:0;font-size:15.4vw}
  .pt-sec{padding-top:44px}
  .pt-cols{margin-top:30px}
  /* el grano, más fino y más suave que en la pantalla grande */
  .entrada .grano{background-image:url("./grano-m.png");background-size:128px 128px;opacity:.7}
  /* sin la capa que se mezcla en «overlay»: en muchos celulares esa mezcla no se aplica y la capa se ve como un velo gris */
  .entrada .grano--sobre{display:none}
}
@media (max-width:600px){ .pt-cols{grid-template-columns:minmax(0,1fr)} }

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .entrada [data-reveal],.pt-llega{opacity:1;transform:none}
}
.cab.quieta>*{animation:none}

/* ---------- celular: lo que debe verse igual que en la portada y el espacio de la pantalla ----------
   Va al final para que ninguna regla de arriba lo pise. */
@media (max-width:760px){
  /* cabecera: el logo y las píldoras en el mismo lugar y con el mismo tamaño que en la portada */
  header.top .nav-wrap{padding:22px var(--pad) 12px;gap:8px;min-height:69px;align-items:center}
  header.top .marca-app{gap:10px}
  header.top .nav-fin{display:flex;align-items:center;gap:8px;margin-left:auto}
  header.top .nav-fin .lx-chip,header.top #como-usar{height:35px;margin:0;padding:0 14px;font:500 13.5px/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
  header.top .nav-fin .lx-chip{gap:7px;border:1px solid var(--gold-55);background:rgba(var(--gold-rgb),.12)}
  header.top .nav-fin .lx-chip i{width:7px;height:7px}
  /* «En vivo» / «Desde su índice local»: bajo el nombre, en el mismo borde del texto */
  .rotulo-fuente{align-items:center;gap:14px}
  .rotulo-fuente>span{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-width:0;line-height:1.25}
  .rotulo-fuente .en-vivo{margin-left:0}
  .bz-riel{top:calc(69px + env(safe-area-inset-top,0px))}
  header.top .marca-app{position:relative;top:-1px}
  /* espacio: menos aire sobrante arriba y bloques que no ocupan media pantalla */
  .cab{padding-top:6px}
  .cab__saludo{margin:0 0 2px;font-size:13px}
  .cab__ojo{display:none}
  .cab h1,.cab[data-tab="buscar"] h1{font-size:30px;margin-top:4px}
  .wrap.en-buscar{padding-top:8px}
  .bq{gap:10px;margin-bottom:14px;grid-template-columns:minmax(0,1fr)}
  .bq>*{min-width:0}
  .bq-barra{gap:8px;align-items:center}
  .bq-sum{padding:0 2px;font-size:12.5px;line-height:1.45}
  .sugeridas .sug-nota{font-size:13px;line-height:1.5;margin-top:8px}
  .sugeridas .chips{flex-wrap:nowrap;overflow-x:auto;gap:7px;margin:8px 0 0;padding:0 0 2px;max-width:100%;scrollbar-width:none}
  .sugeridas .chips::-webkit-scrollbar{display:none}
