<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iuris Et De Iure</title>
<meta name="description" content="Buscador de jurisprudencia argentina, mendocina e internacional. Arma la consulta y te lleva a las bases oficiales.">
<link rel="icon" type="image/png" href="./logo-iu.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#18140f;
  --tinta:#f3efe5;
  --tinta2:#a89b86;
  --papel:#f3efe5;
  --papel2:rgba(33,26,16,.5);
  --ficha:rgba(30,23,16,.5);
  --lacre:#e9c877;
  --lacre2:#d1ab55;
  --dorado:#d9a62a;
  --acequia:#5fae90;
  --humo:#8a7f6a;
  --linea:#332918;
  --oro:#e9c877;
  --serif:"Bodoni Moda",Georgia,serif;
  --sans:"IBM Plex Sans",Arial,sans-serif;
  --mono:"IBM Plex Sans",Arial,sans-serif;
  --bokeh:
    radial-gradient(circle at 8% 24%,rgba(255,255,255,.5) 0 3px,transparent 4px),
    radial-gradient(circle at 18% 62%,rgba(255,255,255,.32) 0 5px,transparent 6px),
    radial-gradient(circle at 29% 12%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 41% 78%,rgba(255,255,255,.4) 0 3px,transparent 4px),
    radial-gradient(circle at 54% 34%,rgba(255,255,255,.22) 0 6px,transparent 7px),
    radial-gradient(circle at 63% 8%,rgba(255,255,255,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 71% 58%,rgba(255,255,255,.3) 0 4px,transparent 5px),
    radial-gradient(circle at 83% 22%,rgba(255,255,255,.45) 0 3px,transparent 4px),
    radial-gradient(circle at 91% 70%,rgba(255,255,255,.25) 0 5px,transparent 6px),
    radial-gradient(circle at 12% 88%,rgba(255,255,255,.3) 0 3px,transparent 4px),
    radial-gradient(circle at 48% 92%,rgba(255,255,255,.2) 0 4px,transparent 5px),
    radial-gradient(circle at 96% 40%,rgba(255,255,255,.3) 0 2px,transparent 3px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{scrollbar-width:thin;scrollbar-color:var(--lacre) #150f08}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:#150f08}
*::-webkit-scrollbar-thumb{background:var(--lacre);border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background:var(--dorado);box-shadow:0 0 10px 3px rgba(233,200,119,.6)}
body{
  background:
    radial-gradient(ellipse 55% 45% at 12% 10%, rgba(217,166,42,.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 15%, rgba(122,74,158,.16), transparent 60%),
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(95,174,144,.12), transparent 60%),
    linear-gradient(120deg,#0d0904,#130d06,#080503,#100a04);
  background-size:auto,auto,auto,300% 300%;
  animation:fondo-deriva 18s ease-in-out infinite;
  background-attachment:fixed,fixed,fixed,scroll;
  color:var(--tinta);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
@keyframes fondo-deriva{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
a{color:var(--lacre)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lacre2);outline-offset:2px}
.panel,.blk,.rama,.doc,.meta,.pasaje{transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.panel,.blk,.rama,.doc,.meta,.meta-top,.pasaje,.aviso,.barra-doc,
textarea,input[type=text],input[type=number],select{
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.panel:hover,.blk:hover,.rama:hover,.pasaje:hover{
  transform:translateY(-3px);border-color:rgba(233,200,119,.4);box-shadow:0 18px 34px -18px rgba(0,0,0,.6)
}

/* ---------- cabecera ---------- */
.top{
  position:relative;
  background:transparent;
  color:var(--papel);isolation:isolate;padding-bottom:40px
}
.top-in{
  max-width:1560px;margin:0 auto;padding:0 16px;display:flex;justify-content:center;
  gap:6px;align-items:baseline;flex-wrap:wrap;
  max-height:0;opacity:0;overflow:hidden;transform:translateY(-10px);
  transition:max-height .55s cubic-bezier(.4,0,.2,1),opacity .5s ease,
    padding .55s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);
  transition-delay:0s
}
.top:hover .top-in{
  max-height:220px;opacity:1;padding:34px 16px 20px;transform:translateY(0);
  transition-delay:1s
}
.marca{flex:0 1 auto;min-width:0;text-align:left}
.marca .titulo-fila{display:flex;align-items:baseline;justify-content:flex-start;gap:14px;flex-wrap:wrap}
.marca h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(44px,7.5vw,78px);
  margin:0;letter-spacing:.03em;word-spacing:.4em;color:var(--lacre)
}
.marca .sub{font-family:var(--sans);font-size:15px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:0;text-align:left}
.marca .sub .dorado{color:var(--dorado);font-weight:300}
.nav-wrap{
  max-width:calc(100% - 32px);width:fit-content;margin:10px auto 0;
  display:flex;align-items:center;gap:16px;padding:0 22px;
  border:1px solid rgba(217,166,42,.55);border-radius:999px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.nav-logo{
  width:84px;height:84px;flex:none;display:block;border-radius:50%;
  border:3px solid var(--dorado);object-fit:contain;padding:8px;background:var(--tinta)
}
.nav{display:flex;gap:14px;flex:1 1 auto;min-width:0;padding:10px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav button{
  position:relative;background:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;
  padding:11px 22px;cursor:pointer;white-space:nowrap;
  transition:color .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease;
  font-family:var(--sans);font-size:16px;font-weight:300;text-transform:uppercase;
  letter-spacing:.03em;color:rgba(255,255,255,.68)
}
.nav button:hover{color:#fff;border-color:rgba(255,255,255,.45);transform:translateY(-2px)}
.nav button[aria-selected="true"]{
  color:var(--lacre);font-weight:300;border-color:var(--lacre);
  box-shadow:0 0 8px rgba(217,166,42,.35),inset 0 0 6px rgba(217,166,42,.1)
}

/* ---------- cadena ---------- */
.fila-q{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fila-q input{flex:2 1 300px}
.cadena{flex:0 1 auto;min-width:0}
.cadena-in{
  padding:8px 18px;
  display:flex;gap:10px;align-items:center;
  border:1px solid var(--lacre);border-radius:999px;
  background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.cadena code{
  font-family:var(--mono);font-size:12.5px;color:var(--tinta2);
  flex:0 1 auto;max-width:min(50vw,560px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.cadena code b{color:var(--lacre);font-weight:600}
.cadena .mini{border-color:transparent;color:var(--lacre)}
.cadena .mini:hover{border-color:var(--dorado);color:var(--dorado)}
.mini{
  background:var(--ficha);border:1px solid var(--linea);border-radius:999px;
  padding:5px 12px;cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--tinta2);white-space:nowrap
}
.mini:hover{border-color:rgba(255,255,255,.4);color:var(--tinta);transition:border-color .25s ease}
a.mini{text-decoration:none;display:inline-block;color:var(--tinta2)}
a.mini:hover{color:var(--lacre)}

/* ---------- estructura ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 16px 70px;display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start}
.wrap.sin-rail{grid-template-columns:1fr}
.wrap.sin-rail .rail{display:none}
.rail{position:sticky;top:56px}
.rail h2{
  color:var(--lacre);font-family:var(--sans);font-size:16px;font-weight:300;
  text-transform:uppercase;letter-spacing:.03em;margin:0 0 9px
}
.rail-buscador{
  width:100%;padding:9px 14px;margin-bottom:10px;border:1px solid var(--linea);border-radius:999px;
  background:var(--ficha);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-family:var(--sans);font-size:13.5px;color:var(--tinta);outline:none
}
.rail-buscador:focus{border-color:var(--lacre);outline:none}
.blk h2{
  font-family:var(--sans);font-size:11px;letter-spacing:.04em;
  color:var(--humo);margin:0 0 9px;font-weight:600
}
.voces-tit{
  font-family:var(--serif);font-size:22px;
  color:var(--tinta);margin:0 0 8px;font-weight:500
}
.voces-tit .punto{color:var(--lacre)}
.voces-tit .rama-nom{color:var(--lacre);font-style:italic}
.rail-list{display:flex;flex-direction:column;gap:1px;max-height:62vh;overflow:auto}
.rail-list button{
  text-align:left;background:none;border:0;border-radius:6px;
  padding:6px 9px;cursor:pointer;font-size:13.5px;color:var(--tinta2);
  font-family:var(--sans);font-weight:300
}
.rail-list button:hover{background:var(--papel2)}
.rail-list button[aria-pressed="true"]{background:transparent;color:var(--lacre);font-weight:300;
  text-shadow:0 0 10px rgba(233,200,119,.55)}
.col{min-width:0}

/* ---------- formulario ---------- */
.panel{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:22px 24px;margin-bottom:20px}
.panel.vivo{border-color:var(--acequia)}
.panel.inactivo{border-color:var(--linea)}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-family:var(--sans);font-size:13px;color:var(--tinta2);margin-bottom:6px}
input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;
  background:var(--ficha);font-family:var(--sans);font-size:15px;color:var(--tinta)
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--lacre);transition:border-color .25s ease}
#q{font-family:var(--sans);font-size:16px;padding:13px 14px}
.fila{display:flex;gap:12px;flex-wrap:wrap}
.fila>*{flex:1 1 130px;min-width:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  background:var(--ficha);border:1px solid var(--linea);border-radius:999px;padding:6px 13px;cursor:pointer;
  font-size:13px;font-family:var(--sans);color:var(--tinta2)
}
.chip:hover{border-color:rgba(255,255,255,.4)}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.chip.amb[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--linea)}
.btn{
  background:var(--lacre);color:#241a0c;border:1px solid var(--lacre);border-radius:999px;
  padding:10px 20px;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:500;
  transition:transform .25s ease,box-shadow .25s ease
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 18px -6px rgba(233,200,119,.5)}
.btn.sec{background:transparent;color:var(--tinta);border-color:rgba(255,255,255,.24);transition:transform .25s ease,border-color .25s ease}
.btn.sec:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.5)}

/* ---------- fuentes ---------- */
.conteo{font-family:var(--sans);font-size:12px;color:var(--humo);margin:0 0 10px}
.grupo{margin-bottom:26px}
.grupo>h3{
  font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 3px;
  padding-bottom:8px;border-bottom:1px solid var(--linea)
}
.grupo>p.desc{margin:0 0 12px;font-size:13px;color:var(--humo)}
.fuente{border-bottom:1px solid var(--linea);padding:13px 0}
.f-top{display:flex;gap:11px;align-items:baseline}
.cod{
  font-family:var(--sans);font-size:10px;letter-spacing:.03em;color:#fff;
  padding:2px 7px;border-radius:999px;flex:0 0 auto;position:relative;top:-1px
}
.cod.mza{background:var(--lacre);color:#241a0c}.cod.nac{background:#3a3020}
.cod.prov{background:#2c2415}.cod.int{background:var(--acequia);color:#0e2018}.cod.doc{background:#3a3020}
.f-nom{font-family:var(--serif);font-size:17px;flex:0 1 auto}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--linea);min-width:14px;transform:translateY(-4px)}
.f-org{font-size:12px;color:var(--humo);font-family:var(--sans);flex:0 0 auto}
.f-nota{font-size:15px;color:var(--tinta2);margin:3px 0 7px}
.f-acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--sans);font-size:11px;color:var(--humo);border:1px solid var(--linea);padding:3px 9px;border-radius:999px}
.tag.paga{color:var(--lacre);border-color:rgba(233,200,119,.35);background:rgba(233,200,119,.1)}
.tag.libre{color:var(--acequia);border-color:rgba(95,174,144,.35);background:rgba(95,174,144,.1)}
.estrella{background:none;border:0;cursor:pointer;font-size:15px;color:var(--linea);padding:0 4px;line-height:1}
.estrella[aria-pressed="true"]{color:var(--dorado)}

/* ---------- ramas ---------- */
.rama{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:18px 20px;margin-bottom:12px;font-family:var(--sans)}
.rama h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 5px}
.rama p{margin:0 0 12px;font-size:15px;color:var(--tinta2)}
.voces{display:flex;gap:6px;flex-wrap:wrap}
.voz{
  background:var(--papel2);border:1px solid var(--linea);border-radius:999px;padding:4px 10px;cursor:pointer;
  font-size:12.5px;color:var(--tinta2);font-family:var(--sans)
}
.voz:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28);transition:background .25s ease}
.rotulo{
  display:inline-block;font-family:var(--sans);font-size:12px;color:var(--tinta2);
  background:var(--papel2);border-radius:999px;padding:5px 13px;margin:9px 0 8px
}

/* ---------- verificador de citas ---------- */
.veredicto{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:6px 14px;
  border:1px solid var(--linea);background:var(--papel2);color:var(--tinta2)
}
.veredicto .bolita{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.veredicto.si{color:var(--acequia);border-color:rgba(95,174,144,.45);background:rgba(95,174,144,.12)}
.veredicto.duda{color:var(--lacre);border-color:rgba(233,200,119,.4);background:rgba(233,200,119,.1)}
.veredicto.no{color:#e0a3a3;border-color:rgba(224,163,163,.35);background:rgba(224,163,163,.09)}
.campos-cita{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.campo-cita{
  background:var(--papel2);border:1px solid var(--linea);border-radius:8px;padding:5px 11px;
  font-family:var(--sans);font-size:12.5px;color:var(--tinta2)
}
.campo-cita b{color:var(--humo);font-weight:600;font-size:11px;margin-right:5px}
.campo-cita.falta{border-style:dashed;color:var(--humo);opacity:.7}
.candidato{border-top:1px solid var(--linea);padding:13px 0}
.candidato:first-of-type{border-top:0;padding-top:4px}
.candidato .porque{margin:6px 0 8px;padding-left:17px;font-size:12.5px;color:var(--tinta2)}
.candidato .porque li{margin-bottom:2px}

/* ---------- prosa ---------- */
.blk{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.blk h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 8px}
.blk p{margin:0 0 10px;font-size:15px}
.blk ol,.blk ul{margin:0 0 10px;padding-left:20px;font-size:14px}
.blk li{margin-bottom:6px}
.aviso{background:var(--ficha);color:var(--tinta2);border:1px solid var(--linea);border-radius:10px;padding:15px 18px;margin-bottom:18px;font-size:15px;transition:transform .35s ease,border-color .35s ease}
.aviso:hover{transform:translateY(-2px);border-color:rgba(233,200,119,.35)}
.aviso strong{color:var(--lacre)}
.out{
  font-family:var(--mono);font-size:13px;background:var(--papel2);border:1px solid var(--linea);
  border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;min-height:44px
}
.vacio{border:1px dashed var(--linea);border-radius:10px;padding:26px 20px;text-align:center;color:var(--humo);font-size:14px}

/* ---------- lector ---------- */
textarea{
  width:100%;min-height:260px;padding:12px;border:1px solid var(--linea);border-radius:8px;
  background:var(--ficha);font-family:var(--mono);font-size:14px;line-height:1.5;color:var(--tinta);resize:vertical
}
.barra-doc{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:rgba(36,26,12,.55);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;padding:9px 14px;margin-bottom:12px
}
.barra-doc .cnt{font-family:var(--sans);font-size:12.5px;flex:1 1 auto;min-width:120px}
.barra-doc .cnt b{color:var(--lacre)}
.barra-doc .mini{background:#332818;border-color:#4a3c22;color:#e8dfc9}
.barra-doc .mini:hover{background:#4a3c22;border-color:#6b5936;color:#fff}
.doc{
  background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:20px 22px;
  font-family:var(--serif);font-size:15.5px;line-height:1.72;white-space:pre-wrap;word-wrap:break-word;
  max-height:64vh;overflow:auto
}
mark{background:#f2dea0;color:#1a1408;padding:0 1px;border-radius:2px;box-decoration-break:clone}
mark.actual{background:var(--lacre);color:#241a0c}
.lector-grid{display:grid;grid-template-columns:262px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:12px}
.meta{
  background:var(--ficha);border:1px solid var(--linea);border-radius:10px;
  padding:16px 17px;max-height:64vh;overflow:auto
}
.meta-top{background:var(--papel2);border:1px solid var(--linea);border-radius:8px;padding:12px 15px;margin-bottom:14px}
.meta-car{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tinta2);margin:0 0 7px;padding-bottom:7px;border-bottom:1px solid var(--linea)}
.meta-fila{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.meta-fila .izq{flex:1 1 auto;font-size:13.5px;color:var(--tinta2)}
.meta-fila .izq b{font-family:var(--sans);font-size:11px;color:var(--humo);font-weight:600;margin-right:3px}
.meta-fila .izq .sep{color:var(--linea);margin:0 3px}
.meta-fila .der{font-family:var(--sans);font-size:11.5px;color:var(--humo);white-space:nowrap;flex:0 0 auto}
.meta-cuerpo{display:flex;flex-direction:column;gap:16px;margin-bottom:14px}
.meta-bloque h3{
  font-family:var(--sans);font-weight:600;font-size:12px;margin:0 0 8px;color:var(--tinta2)
}
.meta-bloque.cn h3{color:var(--lacre)}
.meta-cat{
  font-family:var(--sans);font-weight:600;font-size:11.5px;
  color:var(--tinta2);margin:0;padding-top:10px;
  border-top:1px solid var(--linea)
}
.meta-cat:first-child{padding-top:0;border-top:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.meta-tag{
  background:var(--papel2);border:1px solid var(--linea);border-radius:999px;
  padding:3px 11px;font-family:var(--sans);font-size:12px;color:var(--tinta2);white-space:nowrap
}
.meta-bloque.pendiente h3{color:var(--humo);font-weight:400;font-style:italic}
.meta-bloque.pendiente .meta-tag{background:transparent;border-style:dashed;color:var(--humo)}
.meta-acc{display:flex;gap:8px;flex-wrap:wrap}
.pasaje{background:var(--ficha);border:1px solid var(--dorado);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.pasaje .txt{font-family:var(--serif);font-size:15.5px;line-height:1.6;margin-bottom:8px}
.pasaje .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pasaje .pos{font-family:var(--sans);font-size:11px;color:var(--humo)}
.pie{max-width:1560px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--humo);line-height:1.6}
.pie hr{border:0;border-top:1px solid var(--linea);margin:0 0 14px}

/* ---------- avisos flotantes ---------- */
#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:none;
  background:#241a0c;color:var(--papel);padding:10px 18px;border-radius:999px;font-size:13px;
  border:1px solid var(--linea);box-shadow:0 8px 22px rgba(0,0,0,.4);max-width:90vw}
#panic{display:none;background:#7c1d2b;color:#fff;padding:10px 20px;font-size:13px}
#panic button{background:#fff;color:#7c1d2b;border:0;border-radius:999px;padding:4px 10px;margin-left:10px;cursor:pointer}
.entrada{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 60% 55% at 15% 15%, rgba(217,166,42,.28), transparent 60%),
    radial-gradient(ellipse 55% 50% at 88% 20%, rgba(122,74,158,.22), transparent 60%),
    radial-gradient(ellipse 65% 55% at 50% 100%, rgba(95,174,144,.16), transparent 60%),
    linear-gradient(120deg,#1c140a,#241a0c,#150f08,#221609);
  background-size:auto,auto,auto,300% 300%;
  animation:fondo-deriva 18s ease-in-out infinite;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:#fff;text-align:center;isolation:isolate;cursor:pointer;
  opacity:1;transition:opacity .6s ease-out;
}
.entrada.saliendo{opacity:0;pointer-events:none}
.entrada-contenido{padding:24px;display:flex;flex-direction:column;align-items:center;animation:aparece-entrada 1s ease-out both}
.entrada .titulo-fila{display:flex;align-items:baseline;justify-content:center;gap:16px;flex-wrap:wrap}
.entrada h1{margin:0;font-family:var(--serif);font-size:clamp(34px,7vw,74px);font-weight:400;letter-spacing:.02em;word-spacing:.4em;color:var(--lacre)}
.entrada .sub{
  margin-top:10px;font-family:var(--sans);font-size:clamp(13px,1.6vw,15px);letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,.75)
}
.entrada .sub .dorado{color:var(--dorado);font-weight:600}
.entrada .toque{
  margin-top:26px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,.6);animation:parpadeo-toque 1.8s ease-in-out infinite
}
@keyframes parpadeo-toque{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes aparece-entrada{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .top-in{gap:6px}
  .wrap{grid-template-columns:1fr;gap:16px}
  .rail{position:static;max-height:none}
  .rail-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .rail-list button{white-space:nowrap;padding:6px 12px}
  .f-top{flex-wrap:wrap}
  .leader{display:none}
  .lector-grid{grid-template-columns:1fr}
  .meta{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Servidor de extracción (opcional) ----
   Si está levantado, el Lector suma la opción de pegar un enlace y traer
   el fallo solo. Si no está, todo lo demás sigue funcionando igual: el
   archivo es autónomo y esa es la garantía que no se toca.

   Prueba los candidatos en orden: mismo origen (sirve cuando el backend
   sirve este archivo), localhost (desarrollo), y por último el backend
   ya desplegado (para cuando este HTML se publica solo, p. ej. en
   GitHub Pages, sin backend propio en el mismo origen). Reemplazá el
   placeholder de abajo por la URL real una vez que despliegues backend/. */
function detectarServidor(){
  var candidatos=[];
  if(location.protocol==="http:"||location.protocol==="https:") candidatos.push("/api");
  candidatos.push("http://localhost:3000/api");
  var desplegado="https://iuris-cvehbxasbkbwccas.brazilsouth-01.azurewebsites.net/api";
  if(desplegado.indexOf("TU-BACKEND")===-1) candidatos.push(desplegado); // si nadie reemplazo el placeholder, ni lo intenta: ahorra el timeout de red a un dominio que sabemos que no existe
  var i=0;
  (function probar(){
    if(i>=candidatos.length){ estado.api=false; if(estado.tab==="lector"||estado.tab==="buscar"||estado.tab==="verificar") render(); return; }
    var base=candidatos[i++];
    var corte=setTimeout(function(){ probar(); },2500);
    try{
      fetch(base+"/salud").then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        clearTimeout(corte);
        if(d&&d.ok){ estado.api=base; intentarRestaurarSesion(); if(estado.tab==="lector"||estado.tab==="buscar"||estado.tab==="verificar") render(); }
        else probar();
      })["catch"](function(){ clearTimeout(corte); probar(); });
    }catch(e){ clearTimeout(corte); probar(); }
  })();
}

/* ============================================================
   La cuenta guarda de verdad: fuentes marcadas e historial
   ============================================================
   Antes esto vivía solo en el localStorage de cada navegador, así que la
   cuenta no servía para nada. Ahora, con sesión iniciada, lo guardado viaja
   con el usuario: entrás desde otra computadora y está. Sin sesión sigue
   funcionando igual que siempre, contra el navegador. */

function cabeceraSesion(){
  return estado.token?{authorization:"Bearer "+estado.token}:{};
}

/* Trae de la cuenta lo guardado y lo pinta. Al entrar por primera vez desde
   un navegador que ya venía usándose sin cuenta, en vez de pisar lo local se
   fusiona: nadie pierde lo que había marcado antes de registrarse. */
function traerDatosDeCuenta(fusionar){
  if(!estado.token||!estado.api) return;
  var opciones=fusionar
    ?{method:"POST",headers:Object.assign({"Content-Type":"application/json"},cabeceraSesion()),
      body:JSON.stringify({fav:estado.fav,hist:estado.hist,pasajes:estado.pasajes})}
    :{headers:cabeceraSesion()};
  estado.sincronizando=true;
  fetch(estado.api+"/mis-datos"+(fusionar?"/fusionar":""),opciones)
    .then(function(r){ return r.json(); })
    .then(function(d){
      estado.sincronizando=false;
      if(!d||!d.ok) return;
      estado.fav=d.fav||{};
      estado.hist=d.hist||[];
      estado.pasajes=d.pasajes||[];
      estado.sincronizadoEn=d.actualizadoEn||null;
      // También queda en el navegador: si mañana entrás sin conexión, está.
      store.set("jedj:fav",estado.fav);
      store.set("jedj:pasajes",estado.pasajes);
      render();
    })["catch"](function(){ estado.sincronizando=false; render(); });
}

/* Sube los cambios. Va con demora porque marcar tres fuentes seguidas no
   tiene por qué ser tres viajes al servidor. */
var _relojGuardado=null;
function guardarEnCuenta(){
  if(!estado.token||!estado.api) return;
  clearTimeout(_relojGuardado);
  _relojGuardado=setTimeout(function(){
    fetch(estado.api+"/mis-datos",{
      method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"},cabeceraSesion()),
      body:JSON.stringify({fav:estado.fav,hist:estado.hist,pasajes:estado.pasajes})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.ok){ estado.sincronizadoEn=d.actualizadoEn||null; render(); }
      })["catch"](function(){});
  },800);
}

/* Si había una sesión guardada de una visita anterior, la recupera. Si el
   token ya no vale (se cerró sesión, cambió la contraseña, etc.), lo tira. */
function intentarRestaurarSesion(){
  store.get("jedj:token",function(tok){
    if(!tok||!estado.api) return;
    estado.token=tok;
    fetch(estado.api+"/auth/yo",{headers:{authorization:"Bearer "+tok}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.ok){ estado.usuario=d.usuario; traerDatosDeCuenta(false); }
        else { estado.token=null; store.set("jedj:token",null); }
        render();
      })["catch"](function(){});
  });
}

/* Registro y login pegan al mismo lugar, solo cambia la ruta. */
function enviarAuth(ruta){
  var email=(document.getElementById("auth-email")||{}).value||"";
  var password=(document.getElementById("auth-password")||{}).value||"";
  estado.authEmail=email;
  if(!email||!password){ estado.authError="Completá correo y contraseña."; render(); return; }
  estado.authCargando=true; estado.authError=null; render();
  fetch(estado.api+"/auth/"+ruta,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:password})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.authCargando=false;
      if(!d||!d.ok){ estado.authError=(d&&d.mensaje)||"El servidor no respondió."; render(); return; }
      estado.token=d.token; estado.usuario=d.usuario; estado.authError=null;
      store.set("jedj:token",d.token);
      traerDatosDeCuenta(true); // suma lo que ya había en este navegador
      render();
    })["catch"](function(){
      estado.authCargando=false;
      estado.authError="Se cortó la comunicación con el servidor.";
      render();
    });
}

/* almacenamiento opcional: si no existe, la web funciona igual */
var store={
  get:function(k,cb){
    try{
      if(window.storage&&typeof window.storage.get==="function"){
        window.storage.get(k).then(function(r){ try{cb(r&&r.value?JSON.parse(r.value):null);}catch(e){cb(null);} },function(){cb(null);});
        return;
      }
    }catch(e){}
    // Sin puente nativo (el caso normal en un navegador): localStorage de toda la vida.
    try{ var v=localStorage.getItem(k); cb(v?JSON.parse(v):null); }catch(e){ cb(null); }
  },
  set:function(k,v){
    try{
      if(window.storage&&typeof window.storage.set==="function"){
        var p=window.storage.set(k,JSON.stringify(v));
        if(p&&p.catch)p.catch(function(){});
        return;
      }
    }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

function flash(msg){

  f.textContent=msg;f.style.display="block";
  clearTimeout(flash._t);

}
function copiar(txt){
  if(!txt){flash("No hay nada para copiar todavía");return;}
  var ok=function(){flash("Copiado");};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
      navigator.clipboard.writeText(txt).then(ok,function(){legacy(txt,ok);});
      return;
    }
  }catch(e){}
  legacy(txt,ok);
}
function legacy(txt,ok){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt;ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.top="-1000px";
    document.body.appendChild(ta);ta.select();
    var done=document.execCommand("copy");
    document.body.removeChild(ta);
    if(done){ok();}else{flash("Copiá a mano: "+txt.slice(0,60));}
  }catch(e){flash("Copiá a mano: "+txt.slice(0,60));}
}
function palabras(s){
  return String(s||"").trim().split(/\s+/).filter(function(w){return w.length>0;});
}

/* Arma la cadena de búsqueda con operadores estándar */
function cadena(){
  var q=String(estado.q||"").trim(), out="";
  if(!q)return "";
  if(estado.modo==="exacta") out='"'+q.replace(/"/g,"")+'"';
  else if(estado.modo==="alguna") out=palabras(q).join(" OR ");
  else out=palabras(q).join(" ");
  var ex=palabras(estado.excluir);
  for(var i=0;i<ex.length;i++) out+=" -"+ex[i].replace(/"/g,"");
  return out;
}
function rangoFechas(){
  var d=estado.desde,h=estado.hasta,s="";
  if(/^\d{4}$/.test(d)) s+=" after:"+d+"-01-01";
  if(/^\d{4}$/.test(h)) s+=" before:"+h+"-12-31";
  return s;
}
function urlGoogleSitio(dom){

}

/* Fragmento de texto: hace que el propio navegador resalte la frase
   al abrir la fuente. Funciona en Chrome, Edge y Safari recientes. */
function fragTexto(u){
  if(!estado.resaltarFuente) return "";
  if(estado.modo!=="exacta") return "";
  var t=String(estado.q||"").trim().replace(/[#&]/g," ");
  if(t.length<4) return "";
  if(u.indexOf("#")!==-1) return "";
  if(/\.pdf($|\?)/i.test(u)) return "";
  return "#:~:text="+encodeURIComponent(t.slice(0,140));
}
function urlFuente(f){
  var c=cadena();
  var base=(f.tmpl&&c)?f.tmpl.replace("{q}",encodeURIComponent(c)):f.u;
  return base+fragTexto(base);
}

/* Pliega el texto (minúsculas, sin acentos) conservando el mapa
   de posiciones hacia el texto original. */
function plegar(t){
  var s="",map=[],i,j,c,n;
  for(i=0;i<t.length;i++){
    c=t.charAt(i);
    try{ n=c.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){ n=c; }
    n=n.toLowerCase();
    for(j=0;j<n.length;j++){ s+=n.charAt(j); map.push(i); }
  }
  map.push(t.length);
  return {s:s,map:map};
}
function terminos(){
  var q=String(estado.q||"").trim();
  if(!q) return [];
  if(estado.modo==="exacta") return [q];
  // Sin conectores: marcar cada "de" y cada "que" del fallo llenaba el
  // lector de resaltados que no señalan nada (ver palabrasResaltables).
  var utiles=palabrasResaltables(q);
  return utiles.length?utiles:palabras(q);
}
var LETRA=/[a-z0-9]/;
function coincidencias(texto){
  var ts=terminos();
  if(!texto||!ts.length) return [];
  var P=plegar(texto),bruto=[],k,pt,from,idx,fin,okA,okB;
  for(k=0;k<ts.length;k++){
    pt=plegar(ts[k]).s.trim();
    if(!pt) continue;
    from=0;
    while(bruto.length<6000){
      idx=P.s.indexOf(pt,from);
      if(idx<0) break;
      fin=idx+pt.length;
      okA=estado.parcial||idx===0||!LETRA.test(P.s.charAt(idx-1));
      okB=estado.parcial||fin>=P.s.length||!LETRA.test(P.s.charAt(fin));
      if(okA&&okB) bruto.push({a:P.map[idx],b:P.map[fin]});
      from=idx+1;
    }
  }
  bruto.sort(function(x,y){return x.a-y.a||x.b-y.b;});
  var out=[];
  for(k=0;k<bruto.length;k++){
    if(out.length&&bruto[k].a<=out[out.length-1].b){
      if(bruto[k].b>out[out.length-1].b) out[out.length-1].b=bruto[k].b;
    }else out.push({a:bruto[k].a,b:bruto[k].b});
  }
  return out;
}
var TOPE_MARCAS=1500;
function textoResaltado(texto,cs){
  var h="",pos=0,i,n=Math.min(cs.length,TOPE_MARCAS);
  for(i=0;i<n;i++){
    h+=esc(texto.slice(pos,cs[i].a));
    h+='<mark data-m="'+i+'"'+(i===estado.marca?' class="actual"':'')+'>'+esc(texto.slice(cs[i].a,cs[i].b))+'</mark>';
    pos=cs[i].b;
  }
  h+=esc(texto.slice(pos));
  return h;
}
/* Agrupa coincidencias cercanas y devuelve el pasaje con contexto */
function pasajesDe(texto,cs){
  var grupos=[],i;
  for(i=0;i<cs.length;i++){
    if(grupos.length&&cs[i].a-grupos[grupos.length-1].b<170) grupos[grupos.length-1].b=cs[i].b;
    else grupos.push({a:cs[i].a,b:cs[i].b});
    if(grupos.length>=120) break;
  }
  return grupos.map(function(g){
    var ini=Math.max(0,g.a-210),fin=Math.min(texto.length,g.b+210);
    var e1=texto.indexOf(" ",ini); if(ini>0&&e1>=0&&e1<g.a) ini=e1+1;
    var e2=texto.lastIndexOf(" ",fin); if(fin<texto.length&&e2>g.b) fin=e2;
    var frag=texto.slice(ini,fin).replace(/\s+/g," ").trim();
    var dentro=cs.filter(function(c){return c.a>=ini&&c.b<=fin;});
    var rel=texto.slice(ini,fin),h="",pos=0;
    dentro.forEach(function(c){
      h+=esc(rel.slice(pos,c.a-ini))+"<mark>"+esc(rel.slice(c.a-ini,c.b-ini))+"</mark>";
      pos=c.b-ini;
    });
    h+=esc(rel.slice(pos));
    return {ini:ini,html:(ini>0?"… ":"")+h.replace(/\s+/g," ")+(fin<texto.length?" …":""),
            txt:(ini>0?"… ":"")+frag+(fin<texto.length?" …":"")};
  });
}

/* Detección de datos de la sentencia. Es heurística: se ofrece
   como propuesta para confirmar, nunca como dato cerrado. */
var MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,
           septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};

/* Los tribunales fechan la sentencia en letras ("a los quince días del mes
   de julio del año dos mil veintiséis"), nunca en números: sin esto, la
   fecha propia del fallo no se detecta y el analizador termina agarrando
   la fecha de otro fallo citado más abajo en el texto. */
function sinTildes(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

var UNIDADES_0_9={cero:0,un:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9};
var ESPECIALES_10_29={
  diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,
  dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,
  veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,
  veintiocho:28,veintinueve:29
};
var DECENAS={treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};

/** "quince" -> 15, "treinta y uno" -> 31, "cuarenta y dos" -> 42. Nulo si no reconoce. */
function numeroPalabras(frag){
  var s=sinTildes(frag).replace(/\s+/g," ").trim();
  var junto=s.replace(/\s/g,"");
  if(ESPECIALES_10_29.hasOwnProperty(junto)) return ESPECIALES_10_29[junto];
  if(UNIDADES_0_9.hasOwnProperty(s)) return UNIDADES_0_9[s];
  if(DECENAS.hasOwnProperty(s)) return DECENAS[s];
  var partes=s.split(" y ");
  if(partes.length===2&&DECENAS.hasOwnProperty(partes[0])&&UNIDADES_0_9.hasOwnProperty(partes[1])){
    return DECENAS[partes[0]]+UNIDADES_0_9[partes[1]];
  }
  return null;
}
/** "dos mil veintiséis" -> 2026, "mil novecientos noventa y ocho" -> 1998. */
function anioPalabras(frag){
  var s=sinTildes(frag).replace(/\s+/g," ").trim();
  var m=s.match(/^(mil novecientos|dos mil)\s*(.*)$/);
  if(!m) return null;
  var base=m[1]==="dos mil"?2000:1900;
  if(!m[2]) return base;
  var resto=numeroPalabras(m[2]);
  return resto===null?null:base+resto;
}
/** Busca la fórmula clásica de apertura ("a los N días del mes de MES de AÑO")
    y devuelve la fecha ya armada, o null si no la encuentra. */
function fechaDeFormulaApertura(ventana){
  var re=/a\s+los?\s+([a-záéíóúñ]+)\s+d[ií]as?\s+(?:del?\s+mes\s+de\s+|de\s+)([a-záéíóúñ]+)\s+de(?:l)?\s+(?:año\s+)?([a-záéíóúñ\s]+?)(?:[,.;\n]|$)/i;
  var m=ventana.match(re);
  if(!m) return null;
  var dia=numeroPalabras(m[1]),mes=MESES[sinTildes(m[2])],anio=anioPalabras(m[3]);
  if(dia==null||!mes||anio==null) return null;
  return ("0"+dia).slice(-2)+"/"+("0"+mes).slice(-2)+"/"+anio;
}

function categoriaDeFuente(label,esProvincial){
  if(CATEGORIA_FUENTE.hasOwnProperty(label)) return CATEGORIA_FUENTE[label];
  if(/^(Decreto|Ordenanza|Resoluci[oó]n)\b/i.test(label)) return "local";
  if(/^Ley\s/.test(label)) return esProvincial?"provincial":"leyes";
  return "otras";
}

function soloDigitos(s){ return String(s).replace(/\./g,"").replace(/^0+(?=\d)/,""); }
function detectar(texto){
  var t=texto.slice(0,9000),d={},m;
  // La identidad propia del fallo (caratula, fecha, tomo/pagina) vive casi
  // siempre en el encabezado. Buscarla primero ahi evita el error mas comun:
  // agarrar el dato de OTRO fallo citado mas abajo, en vez del que se esta
  // analizando. Si no aparece cerca del encabezado, se busca en todo el
  // texto como respaldo (salvo el tomo/pagina, ver mas abajo por que no).
  var apertura=t.slice(0,900);

  m=apertura.match(/["“']?\s*([A-ZÁÉÍÓÚÑ][^"“”\n]{4,120}?\s+c\/\s+[^"“”\n]{2,120}?\s+(?:s\/|p\/)\s+[^"“”\n]{2,90}?)\s*["”']?(?:\n|\.|$)/i)
    ||t.match(/["“']?\s*([A-ZÁÉÍÓÚÑ][^"“”\n]{4,120}?\s+c\/\s+[^"“”\n]{2,120}?\s+(?:s\/|p\/)\s+[^"“”\n]{2,90}?)\s*["”']?(?:\n|\.|$)/i);
  if(m) d.car=m[1].replace(/\s+/g," ").trim();

  if(/corte\s+suprema\s+de\s+justicia\s+de\s+la\s+naci/i.test(t)){ d.trib="Corte Suprema de Justicia de la Nación"; d.tipo="csjn"; }
  else if(/suprema\s+corte\s+de\s+justicia.{0,40}mendoza|\bS\.?C\.?J\.?M\b/i.test(t)){ d.trib="Suprema Corte de Justicia de Mendoza"; d.tipo="scjm"; }
  else if(/corte\s+interamericana/i.test(t)){ d.trib="Corte Interamericana de Derechos Humanos"; d.tipo="cidh"; }
  else if(/tribunal\s+europeo|european\s+court\s+of\s+human\s+rights/i.test(t)){ d.trib="Tribunal Europeo de Derechos Humanos"; d.tipo="tedh"; }
  else{
    m=t.match(/((?:Excma\.?\s+)?(?:C[áa]mara|Juzgado|Tribunal)[^\n.;]{5,90})/i);
    if(m){ d.trib=m[1].replace(/\s+/g," ").trim(); d.tipo="cam"; }
  }

  // El "Fallos: tomo:pagina" es la forma en que la CSJN identifica sus
  // propios fallos - ningun otro tribunal publica en esa coleccion. Si el
  // documento no es de la CSJN, cualquier "Fallos: X:Y" que aparezca es casi
  // seguro una cita a un fallo distinto citado como precedente: mejor no
  // mostrar nada que mostrar el tomo de otra sentencia como si fuera esta.
  if(d.tipo==="csjn"||!d.tipo){
    m=apertura.match(/Fallos:?\s*(\d{2,3})\s*:\s*(\d{1,4})/i);
    if(m){ d.tomo=m[1]; d.pag=m[2]; }
  }

  m=t.match(/(?:expte\.?|expediente|causa)\s*(?:n[°ºo.]?\s*)?[:\s]\s*([A-Z0-9][\w\-\/\.]{3,28})/i);
  if(m) d.exp=m[1].replace(/[.,;]$/,"");

  var fechaFormula=fechaDeFormulaApertura(apertura);
  if(fechaFormula){
    d.fecha=fechaFormula;
  }else{
    m=apertura.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i)
      ||t.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
    if(m&&MESES[sinTildes(m[2])]){
      d.fecha=("0"+m[1]).slice(-2)+"/"+("0"+MESES[sinTildes(m[2])]).slice(-2)+"/"+m[3];
    }else{
      m=apertura.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/)
        ||t.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/);
      if(m) d.fecha=("0"+m[1]).slice(-2)+"/"+("0"+m[2]).slice(-2)+"/"+m[3];
    }
  }
  m=t.match(/Sala\s+([IVXLC]+|\d+|[ÚU]nica|Primera|Segunda|Tercera|Cuarta)\b/i);
  if(m) d.sala="Sala "+m[1];
  var CODIGOS=[
    [/c[oó]digo\s+civil\s+y\s+comercial(\s+de\s+la\s+naci[oó]n)?|\bccyc(?:n)?\b|\bcccn\b|\bc\.\s*c\.\s*y\s*c\.?(?:\s*n\.?)?\b/i,"CCyC (vigente)"],
    [/c[oó]digo\s+civil\b|\bc\.\s*c\.(?!\s*y)/i,"Código Civil (derogado)"],
    [/\bCC\b/,"Código Civil (derogado)"],

    [/c[oó]digo\s+procesal\s+civil\b|\bcpc\b|\bc\.\s*p\.\s*c\.(?!\s*c)/i,"CPC"],
    [/c[oó]digo\s+penal\b|\bcp\b/i,"Código Penal"],

    [/\bley\s+de\s+seguros\b|\bL\.?\s*S\.?\b(?!\d)/,"Ley de Seguros (LS)"],
    [/\bley\s+arancelaria\b|\bL\.?\s*A\.?\b(?!\d)/,"Ley Arancelaria (LA)"],
    [/convenci[oó]n\s+americana\s+sobre\s+derechos\s+humanos|pacto\s+de\s+san\s+jos[ée]\s+de\s+costa\s+rica|\bcadh\b/i,"CADH"],

    [/convenci[oó]n\s+sobre\s+los\s+derechos\s+del\s+ni[ñn]o|\bcdn\b/i,"Convención sobre los Derechos del Niño"],

    [/declaraci[oó]n\s+universal\s+de\s+derechos\s+humanos|\bdudh\b/i,"Declaración Universal de Derechos Humanos"],
    [/declaraci[oó]n\s+americana\s+de\s+los\s+derechos\s+y\s+deberes\s+del\s+hombre/i,"Declaración Americana de los Derechos y Deberes del Hombre"],
    [/protocolo\s+facultativo\s+del\s+pacto\s+internacional\s+de\s+derechos\s+civiles\s+y\s+pol[ií]ticos/i,"Protocolo Facultativo del PIDCP"],
    [/convenci[oó]n\s+(?:para\s+la\s+prevenci[oó]n\s+y\s+la?\s+sanci[oó]n\s+del\s+delito\s+de\s+genocidio|contra\s+el\s+genocidio)/i,"Convención para la Prevención y la Sanción del Delito de Genocidio"],
    [/convenci[oó]n\s+internacional\s+sobre\s+la\s+eliminaci[oó]n\s+de\s+todas\s+las\s+formas\s+de\s+discriminaci[oó]n\s+racial|\bcerd\b/i,"Convención sobre la Eliminación de Todas las Formas de Discriminación Racial"],
    [/convenci[oó]n\s+contra\s+la\s+tortura(\s+y\s+otros\s+tratos)?/i,"Convención contra la Tortura"],
    [/convenci[oó]n\s+interamericana\s+sobre\s+desaparici[oó]n\s+forzada\s+de\s+personas/i,"Convención Interamericana sobre Desaparición Forzada de Personas"],
    [/convenci[oó]n\s+sobre\s+la\s+imprescriptibilidad\s+de\s+los\s+cr[ií]menes\s+de\s+guerra\s+y\s+de\s+lesa\s+humanidad/i,"Convención sobre la Imprescriptibilidad de los Crímenes de Guerra y de Lesa Humanidad"]
  ];
  function formatLeyNum(s){
    var n=soloDigitos(s);
    return n.length>3?n.replace(/\B(?=(\d{3})+(?!\d))/g,"."):n;
  }
  function capitalizar(s){ return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
  var reLeyAdelante=/^(?:\s*(?:,|del|de\s+la)?\s*){0,3}\s*ley\s*(?:provincial\s+|nacional\s+|federal\s+)?(?:n[°ºo.]?\s*)?(\d[\d\.]{2,7})/i;
  var reLeyAtras=/ley\s*(?:provincial\s+|nacional\s+|federal\s+)?(?:n[°ºo.]?\s*)?(\d[\d\.]{2,7})\s*(?:,|del|de\s+la)?\s*(?:en\s+sus?\s*)?$/i;
  var reDecAdelante=/^(?:\s*(?:,|del|de\s+la)?\s*){0,3}\s*(decreto|ordenanza|resoluci[oó]n)\s*(?:reglamentario\s+)?(?:n[°ºo.]?\s*)?(\d[\d\.]{1,6}(?:\/\d{2,4})?)/i;

  function ultimoQueTermineCerca(regex,ventana,margen){

    while((m=re.exec(ventana))) ultimo=m;

      var mm=re.exec(ventana);
      if(mm&&mm.index<mejorPos){ mejorPos=mm.index; mejorLabel=CODIGOS[i][1]; }
    }
    return mejorLabel;
  }
  function codigoMasCercaAtras(ventana,margen){
    var mejorLabel=null,mejorDist=Infinity;
    for(var i=0;i<CODIGOS.length;i++){
      var re=new RegExp(CODIGOS[i][0].source,CODIGOS[i][0].flags.replace("g","")+"g"),m,ultimo=null;

    m=adelante.match(reDecAdelante);
    if(m){ fuenteEraProvincial=false; return capitalizar(m[1])+" "+m[2]; }
    var lbl=codigoMasCercaAdelante(adelante);
    if(lbl){ fuenteEraProvincial=false; return lbl; }
    m=ultimoQueTermineCerca(reLeyAtras,atras,0);
    if(m){ fuenteEraProvincial=/provincial/i.test(m[0]); return "Ley "+formatLeyNum(m[1]); }
    m=ultimoQueTermineCerca(reDecAtras,atras,0);
    if(m){ fuenteEraProvincial=false; return capitalizar(m[1])+" "+m[2]; }
    lbl=codigoMasCercaAtras(atras,25);
    if(lbl){ fuenteEraProvincial=false; return lbl; }

  }
  var NUM_ART="\\d{1,4}(?:\\.\\d{3})?";
  var grupos={},ordenGrupos=[],catDeGrupo={},fuenteEraProvincial=false,
    reArt=new RegExp("\\bart(?:\\.|s\\.?|[íi]culos?)?\\s*(?:n[°ºo]\\.?\\s*)?((?:"+NUM_ART+"(?:\\s*(?:bis|ter|qu[áa]ter))?(?:\\s*(?:,|y|e|a)\\s*)?)+)","gi"),
    reNumArt=new RegExp(NUM_ART+"(?:\\s*(?:bis|ter|qu[áa]ter))?","gi"),mArt;
  while((mArt=reArt.exec(texto))){
    var numsArt=mArt[1].match(reNumArt)||[];

      grupos[fuente]=[]; ordenGrupos.push(fuente);
      catDeGrupo[fuente]=categoriaDeFuente(fuente,fuenteEraProvincial);

    numsArt.forEach(function(n){
      var a="art. "+n.replace(/\s+/g," ").replace(/\.(\d{3})/,"$1").toLowerCase();

    grupos["Sin ley identificada"]=grupos["Sin ley identificada"].filter(function(a){
      for(var k in grupos){ if(k!=="Sin ley identificada"&&grupos[k].indexOf(a)!==-1) return false; }
      return true;
    });
    if(!grupos["Sin ley identificada"].length){
      ordenGrupos=ordenGrupos.filter(function(k){ return k!=="Sin ley identificada"; });
      delete grupos["Sin ley identificada"];
    }
  }
  /* Si el número coincide con una ley de LEYES_BASE, cambiamos el rótulo
     genérico "Ley N" por el nombre real y la categoría verificada — la
     tabla manda por sobre la adivinanza por proximidad. */
  function etiquetaBase(n){
    var b=LEYES_BASE[soloDigitos(n)];
    return b?"Ley "+formatLeyNum(n)+" — "+b.nombre+(b.vigente===false?" (derogada)":""):null;
  }
  var reLeyBase=/^Ley\s+([\d.]+)$/;
  var grupos2={},ordenGrupos2=[],catDeGrupo2={};
  ordenGrupos.forEach(function(k){
    var mm=k.match(reLeyBase),destino=k,catOverride=null;
    if(mm){
      var b=LEYES_BASE[soloDigitos(mm[1])];
      if(b){ destino=etiquetaBase(mm[1]); catOverride=b.cat; }
    }
    if(!grupos2[destino]){
      grupos2[destino]=[]; ordenGrupos2.push(destino);

     las que no tenían artículo se listaban aparte, como una etiqueta suelta
     al mismo nivel visual que un número de artículo — confuso, porque una
     ley entera y un artículo puntual no son lo mismo. Ahora entran al mismo
     agrupador que las demás: siempre título de ley + sus artículos (aunque
     la lista de artículos quede vacía), nunca una etiqueta sin más. */
  var leyes={},reLey=/\bley(?:es)?\s*(?:provincial(?:es)?\s+|nacional(?:es)?\s+|federal(?:es)?\s+)?(?:n[°ºo.]?\s*)?((?:\d[\d\.]{2,7}(?:\s*(?:,|y|e)\s*(?:n[°ºo.]?\s*)?)?)+)/gi,mLey;
  while((mLey=reLey.exec(texto))){
    var esProv=/provincial/i.test(mLey[0]);
    var numsLey=mLey[1].match(/\d[\d\.]{2,7}/g)||[];
    numsLey.forEach(function(n){
      var etiqueta=etiquetaBase(n)||("Ley "+formatLeyNum(n));
      if(!leyes.hasOwnProperty(etiqueta)){
        var b=LEYES_BASE[soloDigitos(n)];
        leyes[etiqueta]=b?b.cat:(esProv?"provincial":"leyes");

  Object.keys(leyes).forEach(function(k){
    if(grupos[k]) return; // ya tiene su propio grupo con artículos detectados
    grupos[k]=[]; ordenGrupos.push(k); catDeGrupo[k]=leyes[k];
  });
  d.artsPorFuente=ordenGrupos.map(function(k){ return [k,grupos[k],catDeGrupo[k]]; });
  d.arts=[].concat.apply([],ordenGrupos.map(function(k){ return grupos[k]; }));
  var cit={},cs2=texto.match(/Fallos:?\s*\d{2,3}\s*:\s*\d{1,4}/gi)||[];
  cs2.forEach(function(a){ cit[a.replace(/\s+/g," ")]=1; });
  d.citados=Object.keys(cit);
  return d;
}
/* Cuando el fallo llegó desde un buscador con robot propio (SCJM, CABA),
   ya sabemos la carátula, el tribunal, el expediente y la fecha de la
   fuente oficial: son mejores que cualquier adivinanza por regex sobre
   el texto crudo, así que pisan lo que detectar() haya encontrado. Los
   datos normativos (leyes citadas, artículos) siguen saliendo del texto

function datosDoc(texto){
  var d=detectar(texto);

    if(fc.fecha) d.fecha=fc.fecha;
    if(fc.exp) d.exp=fc.exp;
  }

}

var VACIAS={de:1,del:1,la:1,las:1,el:1,los:1,un:1,una:1,unos:1,unas:1,
  y:1,e:1,o:1,u:1,en:1,al:1,a:1,ante:1,con:1,sin:1,por:1,para:1,que:1,
  se:1,su:1,sus:1,lo:1,le:1,les:1,es:1,son:1,como:1,mas:1,sobre:1,

/* Las palabras de la consulta que vale la pena resaltar. */
function palabrasResaltables(q){
  return palabras(q).filter(function(w){
    var limpia=w.replace(/["'()]/g,"");
    if(limpia.length<3) return false;
    try{ limpia=limpia.normalize("NFD").replace(/[̀-ͯ]/g,""); }catch(e){}
    return !VACIAS[limpia.toLowerCase()];
  });
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

/* ---- Resultados en vivo de los buscadores con robot propio ---- */
function resaltarSimple(texto,q){
  var t=esc(texto||"");
  // Frase exacta: se marca la frase entera y nada más. Marcando palabra por
  // palabra, "archivo desidia" resaltaba "archivo" por un lado y "desidia"
  // por otro, como si hubieran coincidido separadas — que es justo lo que
  // ese modo NO busca. Si la frase no está, no se resalta nada.
  if(estado.modo==="exacta"){
    var frase=String(q||"").replace(/["'()]/g," ").replace(/\s+/g," ").trim();
    if(!frase) return t;
    var reF=new RegExp("("+escRe(esc(frase)).replace(/\\?\s+/g,"\\s+")+")","ig");
    return t.replace(reF,"<mark>$1</mark>");
  }
  palabrasResaltables(q).forEach(function(w){
    var re=new RegExp("("+escRe(esc(w.replace(/["'()]/g,"")))+")","ig");
    t=t.replace(re,"<mark>$1</mark>");
  });
  return t;
}
