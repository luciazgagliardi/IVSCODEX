/* La clasificación de las ramas, a la manera tradicional de las facultades de
   Derecho argentinas: derecho público, derecho privado (con el civil, el
   comercial y el internacional privado), derecho social (el trabajo y la
   seguridad social) y las ramas de los bienes colectivos y recursos
   naturales. Cambia solo cómo se ordenan y se nombran: los id y las voces
   de cada rama son los de siempre, porque los puentes del intérprete y las
   fuentes (campo r) apuntan a ellos. */
var GRUPOS_RAMAS=[
  {id:"pub",n:"Derecho público",d:"Regulación del Estado y sus relaciones con los particulares: marcos constitucionales, actividad administrativa, régimen tributario, potestad punitiva y normas procesales.",
   ramas:["const","adm","trib","pen","proc_pen","ejec","proc_civ","ddhh","elec"]},
  {id:"priv",n:"Derecho privado",d:"Regulación de las relaciones jurídicas entre particulares: atributos de la persona, régimen familiar, obligaciones, derechos reales, sucesiones y actividad empresarial.",
   subs:[{n:"Derecho civil",ramas:["civ","dan","rea","fam","nna","gen","suc"]},
         {n:"Derecho comercial y de la empresa",ramas:["com","cyq","seg","cons","pi"]},
         {n:"Derecho internacional privado",ramas:["dipr"]}]},
  {id:"soc",n:"Derecho social",d:"Regulación de las relaciones laborales, condiciones de trabajo y régimen de previsión y seguridad social.",ramas:["lab","sind","art","prev"]},
  {id:"esp",n:"Bienes colectivos y recursos naturales",d:"Regulación de los derechos de incidencia colectiva, protección ambiental, uso sustentable del suelo, régimen de aguas y explotación de recursos energéticos y mineros.",ramas:["amb","agua"]}
];
(function(){
  var NOMBRES={const:"Derecho constitucional y amparo",adm:"Derecho administrativo",trib:"Derecho tributario",pen:"Derecho penal",
    proc_pen:"Derecho procesal penal",ejec:"Ejecución penal",proc_civ:"Derecho procesal civil y comercial",
    ddhh:"Derecho internacional público y derechos humanos",elec:"Derecho electoral y político",
    civ:"Obligaciones y contratos",dan:"Daños y responsabilidad civil",rea:"Derechos reales",fam:"Derecho de familia",
    nna:"Niñez y adolescencia",gen:"Género y violencia",suc:"Derecho de las sucesiones",
    com:"Derecho comercial y societario",cyq:"Concursos y quiebras",seg:"Derecho de seguros",cons:"Derecho del consumidor",
    pi:"Propiedad intelectual y datos",dipr:"Derecho internacional privado",
    lab:"Derecho del trabajo: relaciones individuales",sind:"Derecho del trabajo: relaciones colectivas",
    art:"Riesgos del trabajo",prev:"Previsión y seguridad social",amb:"Derecho ambiental",agua:"Derecho de aguas y minería"};
  var orden=[];
  GRUPOS_RAMAS.forEach(function(g){
    var tanda=function(ids,sub){ ids.forEach(function(id){ var r=null; for(var i=0;i<RAMAS.length;i++) if(RAMAS[i].id===id) r=RAMAS[i]; if(r){ r.g=g.id; r.s=sub||""; if(NOMBRES[id]) r.n=NOMBRES[id]; orden.push(r); } }); };
    if(g.subs) g.subs.forEach(function(sg){ tanda(sg.ramas,sg.n); }); else tanda(g.ramas,"");
  });
  /* alguna rama nueva sin grupo: va al final, sin perderse */
  RAMAS.forEach(function(r){ if(orden.indexOf(r)<0){ r.g="esp"; r.s=""; orden.push(r); } });
  orden.forEach(function(r,i){ RAMAS[i]=r; });
})();


/* ============================================================
   5.bis Intérprete de consulta — lo que dice el abogado, traducido
         a los descriptores que los buscadores sí indexan
   ============================================================

   El problema que resuelve: los seis buscadores no entienden lenguaje
   natural y no lo van a entender. SAIJ es un Solr que busca por OR;
   Mendoza y CABA son formularios que hacen LIKE sobre campos indexados
   por VOCES (descriptores del fuero). Escribirles "me chocaron y la
   aseguradora no me quiere pagar el daño moral" devuelve ruido o cero,
   no porque falte inteligencia sino porque esa oración no se parece a
   nada de lo que tienen indexado.

   Así que esto traduce la consulta, no los fallos. Toma el texto libre
   y propone las voces del fuero que le corresponden.

   REGLA DURA, y es la que hace que esto sea confiable: toda voz que se
   sugiere TIENE QUE EXISTIR YA en RAMAS. Esa lista la escribió una
   abogada; es la autoridad terminológica y acá no se inventa ni una
   palabra jurídica nueva. Los PUENTES de abajo sólo mapean lo coloquial
   ("me echaron") a lo que ya está escrito ahí ("indemnización art. 245").
   Si alguien escribe mal una voz en el lado derecho, el puente queda
   muerto en silencio — por eso hay una prueba que verifica los 100 y
   pico contra RAMAS y falla si alguno no existe.

   Lo que NO hace: no decide por el usuario. Sugiere, muestra lo que
   sugiere, y el abogado toca lo que quiere. Reescribir la consulta a
   sus espaldas sería justo el tipo de magia opaca que no sirve para
   trabajar. */

var _VACIAS = {
  el:1, la:1, los:1, las:1, un:1, una:1, unos:1, unas:1, de:1, del:1, y:1, e:1,
  o:1, u:1, en:1, al:1, a:1, con:1, sin:1, por:1, para:1, que:1, se:1, su:1,
  sus:1, lo:1, le:1, les:1, es:1, son:1, como:1, mas:1, sobre:1, entre:1,
  desde:1, hasta:1, contra:1, ni:1, no:1, me:1, mi:1, te:1, yo:1, mas:1,
  quiero:1, busco:1, necesito:1, tengo:1, hay:1, fallo:1, fallos:1,
  jurisprudencia:1, caso:1, casos:1, cliente:1, tema:1,
};

/* Raíz de 6 letras — mismo criterio que backend/lib/relevancia.js, para que
   el frontend y el servidor no discrepen sobre qué es "la misma palabra". */
function _raiz(p) { return p.slice(0, 6); }

function _palabrasUtiles(texto) {
  return sinTildes(texto).split(/[^a-z0-9ñ]+/)
    .filter(function (p) { return (/^\d+$/.test(p) || p.length >= 3) && !_VACIAS[p]; });
}

/**
 * Traduce texto libre a voces del fuero.
 * Usa RAMAS y sinTildes(), ya definidos más arriba en este archivo.
 * @returns {{voces:Array<{voz:string,rama:string,via:string}>, ramas:string[]}}
 */
function interpretarConsulta(texto) {
  var t = " " + sinTildes(texto) + " ";
  if (!t.trim()) return { voces: [], ramas: [] };

  var vistas = {}, salida = [], ramasVistas = {};

  function dondeVive(voz) {
    for (var i = 0; i < RAMAS.length; i++) {
      if (RAMAS[i].v.indexOf(voz) !== -1) return RAMAS[i].id;
    }
    return null;
  }
  function sumar(voz, via) {
    if (!voz || vistas[voz]) return;
    var rama = dondeVive(voz);
    if (!rama) return;   // no existe en RAMAS: el puente está roto, se ignora
    vistas[voz] = 1;
    ramasVistas[rama] = 1;
    salida.push({ voz: voz, rama: rama, via: via });
  }

  /* 1. Puentes: lo coloquial. Se prueban las formas largas primero, para
        que "no paga el alquiler" gane sobre "alquiler" a secas. */
  var puentes = PUENTES.slice();
  for (var i = 0; i < puentes.length; i++) {
    var p = puentes[i];

    /* `junto`: todas estas raíces tienen que aparecer, en cualquier orden y
       con lo que sea en el medio. Es lo que salva los casos que una frase
       exacta pierde por una palabra intercalada — "está preso HACE DOS AÑOS
       sin condena" — o por flexión — "fallada" contra "fallado". */
    if (p.junto) {
      var todasJuntas = true;
      for (var k = 0; k < p.junto.length; k++) {
        if (t.indexOf(sinTildes(p.junto[k])) === -1) { todasJuntas = false; break; }
      }
      if (todasJuntas) {
        if (p.voz) sumar(p.voz, "puente");
        else if (p.rama) ramasVistas[p.rama] = 1;
        continue;
      }
    }
    if (!p.dice) continue;

    var formas = p.dice.slice().sort(function (a, b) { return b.length - a.length; });
    for (var j = 0; j < formas.length; j++) {
      var f = sinTildes(formas[j]);
      var pega = f.indexOf(" ") !== -1
        ? t.indexOf(f) !== -1                       // frase: subcadena
        : new RegExp("[^a-z0-9ñ]" + f + "[a-z]{0,4}[^a-z0-9ñ]").test(t); // palabra + flexión
      if (pega) {
        if (p.voz) sumar(p.voz, "puente");
        else if (p.rama) ramasVistas[p.rama] = 1;
        break;
      }
    }
  }

  /* 2. Coincidencia directa: el usuario ya escribió (parte de) una voz. */
  var raices = _palabrasUtiles(texto).map(_raiz);
  if (raices.length) {
    for (var r = 0; r < RAMAS.length; r++) {
      for (var v = 0; v < RAMAS[r].v.length; v++) {
        var voz = RAMAS[r].v[v];
        var suyas = _palabrasUtiles(voz).map(_raiz);
        if (!suyas.length) continue;
        var todas = suyas.every(function (x) { return raices.indexOf(x) !== -1; });
        if (todas) sumar(voz, "directa");
      }
    }
  }

  /* Las coincidencias directas valen más: el abogado ya usó el término
     exacto del fuero, no hay nada que interpretar. */
  salida.sort(function (a, b) {
    if (a.via !== b.via) return a.via === "directa" ? -1 : 1;
    return 0;
  });

  return { voces: salida.slice(0, 8), ramas: Object.keys(ramasVistas) };
}

/* ---- Servidor de extracción (opcional) ----
   Si está levantado, el Lector suma la opción de pegar un enlace y traer
   el fallo solo. Si no está, todo lo demás sigue funcionando igual: el
   archivo es autónomo y esa es la garantía que no se toca.

   Prueba los candidatos en orden: mismo origen (sirve cuando el backend
   sirve este archivo), localhost (desarrollo), y por último el backend
   ya desplegado (para cuando este HTML se publica solo, p. ej. en
   GitHub Pages, sin backend propio en el mismo origen). Reemplazá el
   placeholder de abajo por la URL real una vez que despliegues backend/. */
function detectarServidor(){
  var candidatos=[];
  if(location.protocol==="http:"||location.protocol==="https:") candidatos.push("/api");
  candidatos.push("http://localhost:3000/api");
  var desplegado="https://iuris-cvehbxasbkbwccas.brazilsouth-01.azurewebsites.net/api";
  if(desplegado.indexOf("TU-BACKEND")===-1) candidatos.push(desplegado); // si nadie reemplazo el placeholder, ni lo intenta: ahorra el timeout de red a un dominio que sabemos que no existe
  var i=0;
  (function probar(){
    if(i>=candidatos.length){ estado.api=false; if(estado.tab==="lector"||estado.tab==="buscar"||estado.tab==="verificar") render(); return; }
    var base=candidatos[i++];
    var corte=setTimeout(function(){ probar(); },2500);
    try{
      fetch(base+"/salud").then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        clearTimeout(corte);
        if(d&&d.ok){ estado.api=base; intentarRestaurarSesion(); if(estado.tab==="lector"||estado.tab==="buscar"||estado.tab==="verificar") render(); }
        else probar();
      })["catch"](function(){ clearTimeout(corte); probar(); });
    }catch(e){ clearTimeout(corte); probar(); }
  })();
}

/* ============================================================
   La cuenta guarda de verdad: fuentes marcadas e historial
   ============================================================
   Antes esto vivía solo en el localStorage de cada navegador, así que la
   cuenta no servía para nada. Ahora, con sesión iniciada, lo guardado viaja
   con el usuario: entrás desde otra computadora y está. Sin sesión sigue
   funcionando igual que siempre, contra el navegador. */

function cabeceraSesion(){
  return estado.token?{authorization:"Bearer "+estado.token}:{};
}

/* Trae de la cuenta lo guardado y lo pinta. Al entrar por primera vez desde
   un navegador que ya venía usándose sin cuenta, en vez de pisar lo local se
   fusiona: nadie pierde lo que había marcado antes de registrarse. */
function traerDatosDeCuenta(fusionar){
  if(!estado.token||!estado.api) return;
  var opciones=fusionar
    ?{method:"POST",headers:Object.assign({"Content-Type":"application/json"},cabeceraSesion()),
      body:JSON.stringify({fav:estado.fav,hist:estado.hist,pasajes:estado.pasajes,anillos:estado.anillos})}
    :{headers:cabeceraSesion()};
  estado.sincronizando=true;
  fetch(estado.api+"/mis-datos"+(fusionar?"/fusionar":""),opciones)
    .then(function(r){ return r.json(); })
    .then(function(d){
      estado.sincronizando=false;
      if(!d||!d.ok) return;
      estado.fav=d.fav||{};
      estado.hist=d.hist||[];
      estado.pasajes=d.pasajes||[];
      estado.anillos=d.anillos||[];
      estado.sincronizadoEn=d.actualizadoEn||null;
      // También queda en el navegador: si mañana entrás sin conexión, está.
      store.set("jedj:fav",estado.fav);
      store.set("jedj:pasajes",estado.pasajes);
      store.set("jedj:anillos",estado.anillos);
      render();
    })["catch"](function(){ estado.sincronizando=false; render(); });
}

/* Sube los cambios. Va con demora porque marcar tres fuentes seguidas no
   tiene por qué ser tres viajes al servidor. */
var _relojGuardado=null;
function guardarEnCuenta(){
  if(!estado.token||!estado.api) return;
  clearTimeout(_relojGuardado);
  _relojGuardado=setTimeout(function(){
    fetch(estado.api+"/mis-datos",{
      method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"},cabeceraSesion()),
      body:JSON.stringify({fav:estado.fav,hist:estado.hist,pasajes:estado.pasajes,anillos:estado.anillos})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.ok){ estado.sincronizadoEn=d.actualizadoEn||null; render(); }
      })["catch"](function(){});
  },800);
}

/* Si había una sesión guardada de una visita anterior, la recupera. Si el
   token ya no vale (se cerró sesión, cambió la contraseña, etc.), lo tira. */
function intentarRestaurarSesion(){
  store.get("jedj:token",function(tok){
    if(!tok||!estado.api) return;
    estado.token=tok;
    fetch(estado.api+"/auth/yo",{headers:{authorization:"Bearer "+tok}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d&&d.ok){ estado.usuario=d.usuario; traerDatosDeCuenta(false); }
        else { estado.token=null; store.set("jedj:token",null); }
        render();
      })["catch"](function(){});
  });
}

/* Registro y login pegan al mismo lugar, solo cambia la ruta. */
function enviarAuth(ruta){
  var email=(document.getElementById("auth-email")||{}).value||"";
  var password=(document.getElementById("auth-password")||{}).value||"";
  estado.authEmail=email;
  var envio={email:email,password:password};
  if(ruta==="registro"){
    var gv=function(id){ return ((document.getElementById(id)||{}).value||"").trim(); };
    estado.authNombre=gv("auth-nombre"); estado.authEsp=gv("auth-esp");
    var ca=document.getElementById("auth-act"); if(ca) estado.authAct=!!ca.checked;
    if(!estado.authNombre){ estado.authError="Escriba su nombre."; render(); return; }
    envio.nombre=estado.authNombre; envio.especialidad=estado.authEsp; envio.actualizaciones=estado.authAct;
  }
  if(!email||!password){ estado.authError="Complete el correo y la contraseña."; render(); return; }
  estado.authCargando=true; estado.authError=null; render();
  fetch(estado.api+"/auth/"+ruta,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(envio)
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.authCargando=false;
      if(!d||!d.ok){ estado.authError=(d&&d.mensaje)||"El servidor no respondió."; render(); return; }

/* Ir al pasaje dentro del texto ya dibujado y dejarlo seleccionado. Los
   espacios se comparan colapsados: el texto del fallo trae saltos de línea
   y espacios dobles que el fragmento citado no tiene. */
function lxIrA(s){
  var doc=document.getElementById("doc"); if(!doc||!s) return;
  var limpio=String(s).replace(/^…\s*/,"").replace(/\s*…$/,"").replace(/\s+/g," ").trim();
  var nodos=[],w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT),n,todo="";
  while((n=w.nextNode())){ nodos.push([n,todo.length]); todo+=n.nodeValue; }
  // versión con espacios colapsados y un mapa a la posición real
  var col="",mapa=[],enEsp=false;
  for(var k=0;k<todo.length;k++){
    var c=todo.charAt(k);
    if(/\s/.test(c)){ if(enEsp) continue; enEsp=true; col+=" "; mapa.push(k); }
    else{ enEsp=false; col+=c; mapa.push(k); }
  }
  var buscado=limpio.slice(0,60),i=col.indexOf(buscado);
  if(i<0){ buscado=limpio.slice(0,28); i=col.indexOf(buscado); }
  if(i<0){ var pl=lxPlano(col); buscado=lxPlano(limpio.slice(0,28)); i=pl.indexOf(buscado); }
  if(i<0){ flash("No pude ubicar ese pasaje en el texto"); return; }
  var ri=mapa[i],rf=mapa[Math.min(mapa.length-1,i+buscado.length-1)]+1;
  function ubicar(pos){ for(var k2=nodos.length-1;k2>=0;k2--) if(nodos[k2][1]<=pos) return [nodos[k2][0],pos-nodos[k2][1]]; return [nodos[0][0],0]; }
  var a=ubicar(ri),b=ubicar(Math.min(todo.length,rf));
  var r=document.createRange(); r.setStart(a[0],Math.min(a[1],a[0].nodeValue.length)); r.setEnd(b[0],Math.min(b[1],b[0].nodeValue.length));
  var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  var el=a[0].parentElement; if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}

function lxSenalar(k){
  var art=document.querySelector('#lx-resp .lx-r[data-k="'+(window.CSS&&CSS.escape?CSS.escape(k):k)+'"]');
  if(!art) return;
  Array.prototype.forEach.call(document.querySelectorAll("#lx-resp .lx-r.lx-r--ahora"),function(x){ x.classList.remove("lx-r--ahora"); });
  void art.offsetWidth;
  art.classList.add("lx-r--ahora");
  var quieto=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches,modo=quieto?"auto":"smooth";
  // Lo que tapa arriba: la cabecera fija y la barra del Lector, si están pegadas al borde.
  var tapa=0;
  Array.prototype.forEach.call(document.querySelectorAll(".top,.barra-doc"),function(el){
    var cs=getComputedStyle(el),r=el.getBoundingClientRect();
    if(cs.display==="none"||!r.height) return;
    // una barra «sticky» queda pegada arriba en cuanto se baja: cuenta su altura pegada
    if(cs.position==="sticky") tapa=Math.max(tapa,(parseFloat(cs.top)||0)+r.height);
    else if(cs.position==="fixed"&&r.top<window.innerHeight/3) tapa=Math.max(tapa,r.bottom);
  });
  // si el navegador no anima el desplazamiento (algunos celulares, pestañas
  // en segundo plano), al medio segundo se salta directo
  function irA(y){
    var desde=window.scrollY; y=Math.max(0,y);
    window.scrollTo({top:y,behavior:modo});
    if(modo==="smooth") setTimeout(function(){ if(Math.abs(window.scrollY-desde)<4&&Math.abs(window.scrollY-y)>40) window.scrollTo(0,y); },500);
  }
  var cont=art.closest(".lector-lado"),cc=cont&&getComputedStyle(cont);
  if(cont&&/(auto|scroll)/.test(cc.overflowY)&&cont.scrollHeight>cont.clientHeight+4){
    // la columna de Lexia tiene su propio desplazamiento (computadora)
    // primero la columna a la vista, justo debajo de lo que tapa; después, dentro de ella, la respuesta arriba
    // (dos desplazamientos suaves a la vez se cancelan: el de la columna va directo)
    var rc=cont.getBoundingClientRect();
    cont.scrollTop=cont.scrollTop+art.getBoundingClientRect().top-rc.top-6;
    if(rc.top<tapa||rc.top>tapa+40) irA(window.scrollY+rc.top-tapa-8);
  }else{
    irA(window.scrollY+art.getBoundingClientRect().top-tapa-12);
  }
  try{ art.focus({preventScroll:true}); }catch(e){ art.focus(); }
  clearTimeout(art._t); art._t=setTimeout(function(){ art.classList.remove("lx-r--ahora"); },4000);
}

/* Ramas y voces se muestran como título ("Obligaciones y Contratos"), a
   pedido. Se hace ACÁ, al dibujar, y nunca sobre RAMAS: los 115 puentes
   del intérprete apuntan a cada voz por su texto exacto, así que cambiarle

   backend/test/interprete.prueba.js). Por lo mismo, el valor que viaja en
   data-v sigue siendo el original — lo que cambia es sólo lo que se lee. */
var SIGUE_EN_MINUSCULA={y:1,e:1,o:1,u:1,de:1,del:1,la:1,las:1,el:1,los:1,
  en:1,a:1,al:1,por:1,para:1,con:1,sin:1,un:1,una:1,se:1,su:1,sus:1,que:1};
function comoTitulo(t){
  return String(t||"").split(" ").map(function(p,i){
    var bajo=p.toLowerCase();
    if(i>0&&SIGUE_EN_MINUSCULA[bajo]) return bajo;
    // slice(1) y no toLowerCase: así "CADH", "TRHA" o "IV" quedan enteras.
    return p.charAt(0).toUpperCase()+p.slice(1);
  }).join(" ");
}

}

   5. Barra de cadena
   ============================================================ */
/* ============================================================
   Estado en la URL — para poder compartir una búsqueda
   ============================================================
   Hasta ahora la dirección nunca cambiaba: daba igual lo que hubieras
   escrito, la URL seguía siendo la raíz. Eso significaba que no se podía
   mandar una búsqueda a un colega, ni guardarla en favoritos, ni volver a
   ella con el botón "atrás" del navegador.

   Van sólo los campos que definen QUÉ se busca (consulta, modo, excluir,
   años, rama, solapa). NO van los resultados: son de los sitios oficiales,
   cambian solos y meterlos en la URL sería congelar algo que no nos
   pertenece. Quien abre el link corre la búsqueda de nuevo y ve lo que hay
   hoy, que es lo correcto para jurisprudencia.

   Tampoco va nada de la cuenta ni del historial: una URL se pega en un mail
   o en un chat, y lo que viaje ahí deja de ser privado. */

var CLAVES_URL=[["q","q"],["modo","m"],["excluir","x"],["desde","d"],["hasta","h"],["rama","r"],["tab","t"]];

/** Vuelca el estado actual a la barra de direcciones, sin ensuciar el historial. */
function guardarEnURL(){
  try{
    var p=new URLSearchParams();
    CLAVES_URL.forEach(function(par){
      var v=estado[par[0]];
      if(v===undefined||v===null||v==="") return;
      if(par[0]==="tab"&&v==="buscar") return;   // la solapa por defecto no hace falta
      if(par[0]==="modo"&&v==="exacta") return;  // el modo por defecto tampoco
      p.set(par[1],String(v));
    });
    var qs=p.toString();
    // replaceState y no pushState: escribir en el campo de búsqueda no debe
    // dejar una entrada en el historial por cada tecla.
    history.replaceState(null,"",qs?("?"+qs):location.pathname);
  }catch(e){ /* si el navegador no deja tocar el historial, la app sigue igual */ }
}

/** Lee la URL al abrir y deja el estado listo antes del primer render. */
function leerDeURL(){
  try{
    var p=new URLSearchParams(location.search);
    if(!p.toString()) return;
    CLAVES_URL.forEach(function(par){
      if(!p.has(par[1])) return;
      var v=p.get(par[1]);
      if(par[0]==="tab"){ if(TABS.some(function(t){return t[0]===v;})) estado.tab=v; return; }
      if(par[0]==="modo"){ if(["exacta","todas","alguna"].indexOf(v)!==-1) estado.modo=v; return; }
      if(par[0]==="rama"){ if(RAMAS.some(function(x){return x.id===v;})) estado.rama=v; return; }
      if(par[0]==="desde"||par[0]==="hasta"){ if(/^\d{4}$/.test(v)) estado[par[0]]=v; return; }
      estado[par[0]]=String(v).slice(0,300);
    });
  }catch(e){ /* URL rara: se ignora y se abre como siempre */ }
}

/**

 * Reemplaza dos cosas que no servían. Una: el menú del sistema
 * (navigator.share), que en la Mac ofrece AirDrop, Mensajes, Notas —nada
 * de lo que se usa para pasarle un fallo a alguien—. Otra: el desplegable
 * de Buscar, que quedaba tapado por la tarjeta de la fuente de abajo,

 *

 * botón: los contenedores con overflow lo recortarían igual, y así sirve
 * también en los pasajes del Lector, que se pintan por su cuenta y no por
 * render().
 */
function cerrarMenuCompartir(){
  var v=document.getElementById("menu-compartir");
  if(v) v.remove();
}
function menuCompartir(boton,texto,url){
  var abierto=document.getElementById("menu-compartir");
  var mismo=abierto&&abierto._de===boton;
  cerrarMenuCompartir();
  if(mismo) return;   // volver a tocar el mismo botón lo cierra

  var m=document.createElement("div");
  m.id="menu-compartir"; m.className="compartir-menu flotante"; m._de=boton;
  m.innerHTML='<button type="button" data-comp="copiar">Copiar</button>'+
    '<button type="button" data-comp="whatsapp">Enviar por WhatsApp</button>'+
    '<button type="button" data-comp="mail">Enviar por correo</button>';
  document.body.appendChild(m);

  var r=boton.getBoundingClientRect(), alto=m.offsetHeight, ancho=m.offsetWidth;
  // Se abre para abajo salvo que no entre; ahí sube. Y no se pasa del
  // borde derecho de la ventana.
  var arriba=(r.bottom+alto+8>innerHeight)&&(r.top-alto-8>0);
  m.style.top=(arriba?r.top-alto-6:r.bottom+6)+"px";
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-ancho-8))+"px";

  m.addEventListener("click",function(ev){
    var q=ev.target.closest&&ev.target.closest("[data-comp]");
    if(!q) return;
    var que=q.getAttribute("data-comp"), todo=url?(texto+"\n"+url):String(texto);
    cerrarMenuCompartir();
    if(que==="whatsapp"){ window.open("https://wa.me/?text="+encodeURIComponent(todo),"_blank","noopener"); return; }
    if(que==="mail"){ location.href="mailto:?subject="+encodeURIComponent(String(texto).split("\n")[0].slice(0,120))+
      "&body="+encodeURIComponent(todo); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(todo).then(function(){ flash("Copiado — puede pegarlo donde lo necesite"); })
        ["catch"](function(){ flash("No se pudo copiar automáticamente"); });
    }else flash("No se pudo copiar automáticamente");
  });
}

   "prescripción adquisitiva" 135, son la MISMA institución, y las
   carátulas de la primera página no se repiten ni una vez. Lo mismo con
   "arbitrariedad de sentencia" (734) contra "sentencia arbitraria" (893):
   ninguno de los veinte primeros resultados de uno aparece en el otro.

   O sea: el abogado que escribe una de las dos formas trabaja con la mitad
   del material y no tiene cómo enterarse. No lo arregla ordenar mejor lo
   que vuelve — el fallo que falta nunca entró en la lista.

   rebautizó varias figuras (daño moral → consecuencias no patrimoniales,
   régimen de visitas → régimen de comunicación, tenencia → cuidado

   reforma y con otro después. Por eso los anillos llevan `desde`.

   mismo y no se tratan igual. Equivalente es el mismo rubro con otro
   nombre — un fallo que use cualquiera de ellos se cita igual. Relacionado

/* Todas las formas de un anillo, con qué relación entró cada una. */
function formasDe(anillo){
  var out=[{t:anillo.canonico,rel:"canonico"}];
  (anillo.equivalentes||[]).forEach(function(t){ out.push({t:t,rel:"equivalente"}); });
  (anillo.relacionados||[]).forEach(function(t){ out.push({t:t,rel:"relacionado"}); });
  return out;
}

/* ¿A qué anillo pertenece lo que se escribió? Se busca por el canónico y
   por los equivalentes, no por los relacionados: entrar por un vecino no
   convierte la consulta en el concepto de al lado. */
function anilloDe(termino){
  var t=sinTildes(termino).trim();
  if(!t) return null;
  // Los anillos propios se miran PRIMERO: si la dueña del proyecto escribió
  // uno para un término que también trae el catálogo de fábrica, manda el
  // suyo — es la que sabe de derecho.
  var todos=(estado.anillos||[]).concat(TESAURO);
  for(var i=0;i<todos.length;i++){
    var a=todos[i];
    var candidatos=[a.canonico].concat(a.equivalentes||[]);
    for(var j=0;j<candidatos.length;j++){
      if(sinTildes(candidatos[j])===t) return a;
    }
  }
  return null;
}

/* ¿Este anillo lo cargó la usuaria o vino de fábrica? Se muestra distinto:
   uno se puede borrar y el otro no. */
function esAnilloPropio(a){
  return (estado.anillos||[]).indexOf(a)!==-1;
}

/* Las otras formas de decir lo mismo, sin repetir la que ya está escrita. */
function expandir(termino){
  var a=anilloDe(termino);
  if(!a) return null;
  var puesto=sinTildes(termino).trim();
  return {
    anillo:a,
    variantes:formasDe(a).filter(function(v){ return sinTildes(v.t)!==puesto; })
  };
}

/* La cabecera de cada sección: palabra latina, grupo y título. El primer
   aviso de la solapa —el que explica para qué sirve— sube a la cabecera
   y hace de bajada: es el mismo texto de siempre, en el mismo orden, solo
   que sin caja. Las notas sueltas que lo acompañan suben con él.
   La animación de entrada corre solo al cambiar de solapa: render() se
   llama a cada tecla, y repetirla ahí haría parpadear el título. */
/* «Bienvenido, colega» sin sesión; con sesión, el nombre. Las cuentas solo
   guardan el correo, así que el nombre sale de lo que va antes de la arroba
   (sin números ni signos, con mayúscula inicial). */
function nombreDe(u){
  var dado=String(u&&u.nombre||"").trim().split(/\s+/)[0];
  if(dado) return dado;
  var e=String(u&&u.email||"").split("@")[0].replace(/[._\-+]+/g," ").replace(/[0-9]+/g,"").trim().split(/\s+/)[0]||"";
  return e?e.charAt(0).toUpperCase()+e.slice(1).toLowerCase():"";
}
function saludoHTML(){
  var n=estado.usuario?nombreDe(estado.usuario):"";
  return '<p class="cab__saludo">Bienvenido, <b>'+esc(n||"colega")+'</b>.</p>';
}

/* La tira de voces sugeridas, debajo de "Qué buscás".
   Deliberadamente NO reescribe la consulta sola: muestra lo que entendió y
   deja que el abogado toque. Que un buscador jurídico cambie la búsqueda a
   tus espaldas es justo lo que no se puede auditar después. */
/* Cuándo se muestran voces y cuándo se borran.
   Antes esto sólo pisaba la lista si la consulta nueva daba algo, así que
   escribir un caso que el diccionario no conoce dejaba en pantalla las
   voces del caso anterior: se escribía "mi ex se llevó a los chicos a
   España" y seguía ofreciendo "desaparición forzada". Es peor que no
   sugerir nada, porque parece que entendió.
   La única lista que sí se conserva es la de recién: al tocar una voz la
   consulta pasa a ser esa voz, y ahí las hermanas tienen que seguir a
   mano para poder cambiar de una a otra sin reescribir el caso. */
function recalcularSugeridas(){
  var q=sinTildes(estado.q).trim();
  if(estado.sugeridas.some(function(s){ return sinTildes(s.voz)===q; })) return;
  var antes=estado.sugeridas.length, antesR=estado.sugeridaRama;
  var leido=interpretarConsulta(estado.q);
  // Una voz idéntica a lo ya escrito no se ofrece: no agrega nada y
  // ensucia — es el caso de quien ya puso el descriptor exacto.
  estado.sugeridas=leido.voces.filter(function(s){ return sinTildes(s.voz)!==q; });
  // Hay consultas que se reconocen sólo hasta la rama: "divorcio" no cae
  // en ninguna voz puntual, pero sí en Familia. Ofrecer la rama es mejor
  // que no mostrar nada, y forzar un descriptor que no corresponde sería
  // peor que las dos cosas. Se ofrece sólo cuando no hubo voces: con
  // voces, la rama ya va implícita en ellas.
  estado.sugeridaRama=(!estado.sugeridas.length&&leido.ramas.length&&estado.rama!==leido.ramas[0])
    ?leido.ramas[0]:"";

  // Debajo del campo pueden aparecer tres cosas distintas: las voces del
  // intérprete, los equivalentes del tesauro y el ofrecimiento de proponer
  // un anillo nuevo. Repintar sólo cuando cambian las voces dejaba las otras
  // dos sin dibujarse nunca. La firma resume qué debería verse ahora, y el
  // repintado ocurre sólo si cambió — render() rehace el HTML y se lleva
  // puesto el cursor del campo, así que después se devuelve donde estaba.
  var anillo=expandir(String(estado.q||"").trim());
  var firma=(anillo?anillo.anillo.id:"")+"|"+(tiraVariantes()?"v"+variantesDe(String(estado.q||"").trim()).join("|"):"");
  var cambioAbajo=(firma!==estado.firmaTiras);
  estado.firmaTiras=firma;

  if(antes||estado.sugeridas.length||antesR||estado.sugeridaRama||cambioAbajo){
    var campo=document.getElementById("q");
    var donde=campo?campo.selectionStart:null;
    render();
    if(donde!==null){
      var nuevoCampo=document.getElementById("q");
      if(nuevoCampo){ nuevoCampo.focus(); try{ nuevoCampo.setSelectionRange(donde,donde); }catch(e){} }
    }
  }
}

function tiraSugerencias(){
  if(estado.tab!=="buscar") return "";
  // Si lo escrito ya cae en un anillo del tesauro, manda el tesauro: dice
  // lo mismo pero con la relación tipada (equivalente o cercano), y las
  // dos tiras juntas repetían el mismo chip dos veces.
  if(expandir(String(estado.q||"").trim())) return "";
  if(!estado.sugeridas.length&&estado.sugeridaRama){
    return '<div class="sugeridas">'+
      '<p class="sug-nota">No se encontró una voz puntual para la consulta escrita, '+
      'pero el tema cae en una rama. Abrirla muestra sus voces.</p>'+
      '<div class="chips"><button class="chip voz-sug" data-act="usar-rama" data-rama="'+esc(estado.sugeridaRama)+'">'+
      esc(comoTitulo(nombreRama(estado.sugeridaRama)))+'</button>'+
      '<button class="chip sug-cerrar" data-act="cerrar-sugeridas" title="Ocultar">✕</button></div></div>';
  }
  if(!estado.sugeridas.length) return "";
  var chips=estado.sugeridas.map(function(s){
    var puesta=sinTildes(estado.q).trim()===sinTildes(s.voz).trim();
    return '<button class="chip voz-sug" data-act="usar-voz" data-voz="'+esc(s.voz)+'"'+
           ' aria-pressed="'+(puesta?"true":"false")+'">'+esc(comoTitulo(s.voz))+'</button>';
  }).join("");
  return '<div class="sugeridas">'+
    '<p class="sug-nota"><b>Los buscadores del fuero indexan por voces</b>, no por lenguaje natural: '+
    'la frase entera casi siempre da cero. Para la consulta escrita, las voces son estas.</p>'+
    '<div class="chips">'+chips+
      '<button class="chip sug-cerrar" data-act="cerrar-sugeridas" title="Ocultar">✕</button>'+
    '</div></div>';
}

/* Las otras formas de escribir lo mismo, debajo de la consulta.
   Los equivalentes y los cercanos van en grupos separados y rotulados
   distinto — mezclarlos sería exactamente el error que el tesauro existe
   para evitar (ver la nota grande de TESAURO). */
/* Las otras formas de decir lo mismo (no las "cercanas"), según el tesauro. */
function equivalentesDe(q){
  var e=expandir(String(q||"").trim());
  if(!e||!e.variantes) return [];
  return e.variantes.filter(function(v){ return v.rel==="canonico"||v.rel==="equivalente"; })
    .map(function(v){ return v.t; }).slice(0,4);
}
/* La nota del tesauro («El CCyC de 2015 unificó el concepto…»): en la computadora va sola, en la pastilla de sugerencias. */
function notaAnillo(){
  if(estado.tab!=="buscar") return "";
  var e=expandir(String(estado.q||"").trim());
  return (e&&e.anillo&&e.anillo.nota)?'<p class="sug-nota" style="margin:0;font-style:italic">'+esc(e.anillo.nota)+'</p>':"";
}
function esCelular(){ return window.matchMedia&&matchMedia("(max-width:760px)").matches; }
function tiraEquivalentes(sinNota){
  if(estado.tab!=="buscar") return "";
  var e=expandir(String(estado.q||"").trim());
  if(!e||!e.variantes.length) return "";
  function chips(rel){
    return e.variantes.filter(function(v){return v.rel===rel;}).map(function(v){
      return '<button class="chip voz-sug" data-act="usar-equivalente" data-voz="'+esc(v.t)+'">'+
             esc(comoTitulo(v.t))+'</button>';
    }).join("");
  }
  var eq=chips("canonico")+chips("equivalente"), cer=chips("relacionado");
  if(!eq&&!cer) return "";
  return '<div class="sugeridas">'+
    (eq?'<p class="sug-nota"><b>Los tribunales emplean distintas expresiones para referirse al mismo concepto</b>, lo que altera los resultados; '+
        'limitar la búsqueda a un solo término excluye fallos relevantes.</p><div class="chips">'+eq+'</div>'+
        '<div class="chips" style="margin-top:8px"><button class="chip" data-act="tog-equivalentes" aria-pressed="'+(estado.conEquivalentes?"true":"false")+'">'+
        (estado.conEquivalentes?'Buscando también estas formas':'Buscar también estas formas')+'</button></div>':'')+
    (cer?'<p class="sug-nota" style="margin-top:10px"><b>Conceptos análogos.</b> Nociones jurídicas afines pero con presupuestos diferentes; '+
        'se requiere verificar sus requisitos sustanciales antes de proceder a su cita.</p><div class="chips">'+cer+'</div>':'')+
    (!sinNota&&e.anillo.nota?'<p class="sug-nota" style="margin:9px 0 0;font-style:italic">'+esc(e.anillo.nota)+'</p>':'')+
    '</div>';
}

/* Otras formas de escribir lo que se buscó, cuando no tiene anillo en el
   tesauro. Salen de las voces del propio catálogo que comparten raíz con
   alguna palabra: no hay asistente ni consulta al servidor, así que anda
   igual sin conexión. */
function variantesDe(q){
  var palabrasQ=q.split(/\s+/).filter(Boolean);
  if(!palabrasQ.length||palabrasQ.length>6) return [];
  var visto={}, salida=[];
  visto[sinTildes(q).trim()]=1;
  function poner(t){
    var k=sinTildes(t).trim();
    if(!k||visto[k]) return;
    visto[k]=1; salida.push(t);
  }
  // Voces del catálogo que comparten raíz con alguna palabra del texto
  var raices=_palabrasUtiles(q).filter(function(w){ return w.length>=5; }).map(_raiz);
  if(raices.length){
    RAMAS.forEach(function(r){
      (r.v||[]).forEach(function(voz){
        var pv=_palabrasUtiles(voz);
        if(pv.some(function(w){ return raices.indexOf(_raiz(w))!==-1; })) poner(voz);
      });
    });
  }
  return salida.slice(0,8);
}
function tiraVariantes(){
  if(estado.tab!=="buscar") return "";
  var q=String(estado.q||"").trim();
  if(q.length<3||q.length>120) return "";
  if(expandir(q)) return "";                    // ya tiene anillo: no hay nada que sumar
  var vs=variantesDe(q);
  var multi=palabras(q).length>1&&estado.modo!=="alguna";
  if(!vs.length&&!multi) return "";
  return '<div class="sugeridas"><p class="sug-nota"><b>Otras formas de escribirlo.</b> «'+esc(comoTitulo(q))+'» no figura en el tesauro; '+
    'los tribunales varían la redacción, y cada forma recupera fallos distintos.</p><div class="chips">'+
    vs.map(function(t){ return '<button class="chip voz-sug" data-act="usar-variante" data-voz="'+esc(t)+'">'+esc(comoTitulo(t))+'</button>'; }).join("")+
    (multi?'<button class="chip voz-sug" data-act="usar-variante" data-voz="'+esc(q)+'" data-modo="alguna">Con cualquiera de las palabras</button>':'')+
    '</div></div>';
}

/* Buscar, ordenado en columnas: arriba la consulta y los filtros; abajo una
   columna por base, cada una con su punto de color, su estado, su botón
   para buscar sólo ahí y sus resultados. */
var PROV_DE={mendoza:"Mendoza",mendozalegal:"Mendoza",caba:"Ciudad Autónoma de Buenos Aires",scba:"Buenos Aires",rionegro:"Río Negro",juristeca:"Ciudad Autónoma de Buenos Aires",santafe:"Santa Fe"};
function basesVisibles(){
  return FUENTES_INDICE.filter(function(f){

}

/* Buscar en todas las bases a la vez, dentro de la propia página: lanza la
   misma búsqueda en vivo de cada base (cada una con su propio pedido, así
   que no se pisan) y lleva la vista a los resultados. Sin servidor, cae a
   la búsqueda con Google sobre los sitios oficiales. */
/* ¿La consulta es el nombre de un fallo? (ver nombre-fallo.js). Un tema
   conocido del tesauro o de las ramas no lo es: «CSJN 2020 daño moral» se
   busca como tema. «Buscarlo como tema» lo fuerza para esa consulta. */
function esTemaConocido(t){
  var p=sinTildes(t).replace(/\s+/g," ").trim();
  if(!p) return false;
  if(anilloDe(p)) return true;
  return RAMAS.some(function(r){ return r.v.some(function(v){ var x=sinTildes(v); return x===p||(x.length>5&&p.indexOf(x)>=0); }); });
}
function nombreBuscado(q){
  q=String(q||"").trim();
  if(!q||estado.articulo||estado.comoTema===q||typeof IVSNombre==="undefined") return null;
  var n=IVSNombre.interpretar(q,{esTema:esTemaConocido});
  // sólo la cita («Fallos 306:1892»): vale cuando ya se sabe de qué fallo es
  if(n&&n.soloCita){
    var c=estado.citaResuelta;
    if(!c||c.q!==q||!c.nombre) return null;
    n=IVSNombre.conNombre(n,c.nombre); n.cita=c;
  }
  return n;
}
function citaSinNombre(q){
  var c=estado.citaResuelta;
  if(!c||c.q!==q||c.nombre||c.buscando||estado.comoTema===q) return null;
  var n=typeof IVSNombre!=="undefined"?IVSNombre.interpretar(q):null;
  return n&&n.soloCita?n.fallos:null;
}
/* ¿De qué fallo es «Fallos 306:1892»? Primero la tabla armada con las citas
   de otros fallos (datos/fallos-citas.json, scripts/armarCitasFallos.mjs);
   si no está, los sumarios de SAIJ que la citan, en vivo: el nombre que
   ponen junto a la cita («"Fiorentino" (Fallos: 306:1892)»). */
var TABLA_CITAS=null;
function resolverCita(cita){
  var tabla=TABLA_CITAS?Promise.resolve(TABLA_CITAS):fetch("./datos/fallos-citas.json?v=20261024d").then(function(r){ return r.ok?r.json():{}; })["catch"](function(){ return {}; }).then(function(t){ TABLA_CITAS=t; return t; });
  return tabla.then(function(t){
    if(t[cita]) return {nombre:t[cita][0],veces:t[cita][1],fuente:"tabla"};
    var nombres=[];
    function pagina(o){
      var p=new URLSearchParams({q:cita,o:String(o),p:"100",f:SAIJ_TIPOS.sumarios});
      return fetch(SAIJ_URL+"?"+p.toString(),{headers:{Accept:"application/json"}}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
        var xs=(d&&d.searchResults&&d.searchResults.documentResultList)||[];
        xs.forEach(function(x){ var r=saijARegistro(x); if(r&&r.sumario) nombres=nombres.concat(IVSNombre.nombresJuntoACita(r.sumario,cita)); });
        return xs.length;
      })["catch"](function(){ return 0; });
    }
    // hasta tres páginas, mientras no aparezcan al menos dos menciones con nombre
    function seguir(o){ return pagina(o).then(function(k){ return k>=100&&nombres.length<2&&o<200?seguir(o+100):null; }); }
    return seguir(0).then(function(){
      var c=IVSNombre.consenso(nombres);
      if(!c||(c.otros[0]&&c.otros[0].v*2>c.veces)) return null;
      return {nombre:c.nombre,veces:c.veces,fuente:"saij"};
    });
  });
}
function avisoNombre(){
  var q=String(estado.q||"").trim(),c=estado.citaResuelta;

  if(c&&c.q===q&&!c.nombre&&!c.buscando) return '<div class="nombre-av"><span class="nombre-av-r">Fallo por su cita</span><span class="nombre-av-t">«'+esc(q)+'»</span><span class="nombre-av-n">No encontré de qué fallo es esa cita en las citas de otros fallos. Abajo, los fallos que la mencionan: el nombre suele estar junto a la cita.</span></div>';
  var n=nombreBuscado(q); if(!n) return "";
  var que=["«"+n.texto+"»",n.nombreTribunal,n.anioAprox?null:(n.fecha||n.anio),n.fallos&&!n.cita?"Fallos "+n.fallos:null].filter(Boolean);
  if(n.cita) return '<div class="nombre-av"><span class="nombre-av-r">Fallo por su cita</span><span class="nombre-av-t">«'+esc(n.texto)+'» es «'+esc(n.cita.nombre)+'»</span>'+

    '. Se busca «'+esc(n.cita.nombre)+'» en la base de la Corte Suprema'+(n.anio?', y se confirma con el año del tomo (≈ '+n.anio+')':'')+'.</span>'+
    '<button type="button" class="mini" data-act="buscar-como-tema">Buscar la cita como texto</button></div>';
  return '<div class="nombre-av"><span class="nombre-av-r">Fallo por su nombre</span><span class="nombre-av-t">'+esc(que.join(" · "))+'</span>'+
    '<span class="nombre-av-n">Se busca por la carátula'+(n.bases?' en la base de '+esc(n.nombreTribunal):' en todas las bases')+' y se ordena por parecido con el nombre'+(n.anio?' y el año':'')+'.</span>'+
    '<button type="button" class="mini" data-act="buscar-como-tema">Buscarlo como tema</button></div>';
}
function buscarEnTodas(){
  if(!String(estado.q||"").trim()){
    flash("Escriba primero qué quiere averiguar");
    var qi=document.getElementById("q"); if(qi) qi.focus();
    return;
  }
  if(!estado.api){
    var g=document.querySelector('[data-act="barrido"]');
    flash("El buscador en vivo no está disponible ahora: se abre la búsqueda con Google");
    if(g) g.click();
    return;
  }
  estado.limFilas=40;
  // El nombre de un fallo («CSJN 1984 Fiorentino s/ tenencia…») se busca por su
  // carátula y, si nombra al tribunal, sólo en la base de ese tribunal
  // sólo una cita de Fallos: primero se averigua de qué fallo es
  var qq=String(estado.q||"").trim(),soloCita=(!estado.articulo&&estado.comoTema!==qq&&typeof IVSNombre!=="undefined")?IVSNombre.interpretar(qq,{esTema:esTemaConocido}):null;
  if(soloCita&&soloCita.soloCita&&!(estado.citaResuelta&&estado.citaResuelta.q===qq&&!estado.citaResuelta.buscando)){
    if(estado.citaResuelta&&estado.citaResuelta.q===qq) return;
    estado.citaResuelta={q:qq,buscando:true}; render();
    resolverCita(soloCita.fallos).then(function(r){
      if(String(estado.q||"").trim()!==qq) return;
      estado.citaResuelta={q:qq,nombre:r&&r.nombre,veces:r&&r.veces,fuente:r&&r.fuente};
      buscarEnTodas();
    });
    return;
  }
  var bases=basesVisibles(),nom=nombreBuscado(estado.q),sc=citaSinNombre(qq);
  // la cita sin nombre conocido: los fallos que la mencionan, con la cita exacta
  if(sc&&!nom) nom={bases:["csjn","saij","scba","mendoza","caba","mendozalegal"]};
  if(nom&&nom.bases){
    var solo=bases.filter(function(f){ return nom.bases.indexOf(f.slug)>=0; });
    if(solo.length){
      bases.forEach(function(f){ if(solo.indexOf(f)<0){ var im=estado.indices[f.slug]; im.busco=false; im.cargando=false; im.resultados=[]; im.total=0; im.error=null; im.pedido=(im.pedido||0)+1; } });
      bases=solo;
    }
  }
  bases.forEach(function(f){ buscarEnFuente(f.slug); });
  setTimeout(function(){
    var c=document.getElementById("bz");
    if(c&&c.scrollIntoView) c.scrollIntoView({behavior:"smooth",block:"start"});
  },350);
}
function avisoServidor(){

  // seis. El conteo sale de FUENTES_INDICE, que es donde se agregan.

}

/* Conectores que aparecen en cualquier texto jurídico. No se resaltan: en
   "archivo de desidia" marcar cada "de" del fallo ensucia todo y no dice
   nada. Misma lista que usa el servidor en lib/relevancia.js. */
var VACIAS={de:1,del:1,la:1,las:1,el:1,los:1,un:1,una:1,unos:1,unas:1,
  y:1,e:1,o:1,u:1,en:1,al:1,a:1,ante:1,con:1,sin:1,por:1,para:1,que:1,
  se:1,su:1,sus:1,lo:1,le:1,les:1,es:1,son:1,como:1,mas:1,sobre:1,
  entre:1,desde:1,hasta:1,segun:1,contra:1,ni:1,no:1};

/* Las palabras de la consulta que vale la pena resaltar. */
function palabrasResaltables(q){
  return palabras(q).filter(function(w){
    var limpia=w.replace(/["'()]/g,"");
    if(limpia.length<3) return false;
    try{ limpia=limpia.normalize("NFD").replace(/[̀-ͯ]/g,""); }catch(e){}
    return !VACIAS[limpia.toLowerCase()];
  });
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

/* ---- Resultados en vivo de los buscadores con robot propio ---- */
function resaltarSimple(texto,q){
  // sin acentos y por la raíz de cada palabra (ver pasajes.js); en frase exacta, la frase entera
  var t=String(texto||""),cs=IVSPasajes.coincidencias(t,String(q||""),{modo:estado.modo}),h="",pos=0;
  cs.forEach(function(c){ h+=esc(t.slice(pos,c.a))+"<mark>"+esc(t.slice(c.a,c.b))+"</mark>"; pos=c.b; });
  return h+esc(t.slice(pos));
}
/* El pasaje de un resultado: el tramo con más palabras de la búsqueda, no el texto entero. */
function pasajeResaltado(texto,q,largo){
  return IVSPasajes.html(String(texto||""),String(q||""),{modo:estado.modo,largo:largo||320},esc);
}

/* Cada fuente trae los campos que su buscador ofrece: Mendoza da voces y
   sumario, CABA da carátula y secretaría pero no sumario. La ficha se
   arma con lo que haya. */
/* La fecha del índice viene como "27/07/2026 - Sentencia": nos quedamos
   solo con la parte de fecha, que es la que entiende el formateador. */
/* Mensajes de ayuda según el código de error que devuelve /api/extraer,
   compartidos por todo lo que trae un documento al Lector. */
var AYUDAS_ERROR_LINK={
  DOMINIO_NO_PERMITIDO:"Agregue el dominio en server/config.js y reinicie el servidor.",
  PDF_ESCANEADO:"El documento es una imagen escaneada, sin texto seleccionable. Seleccione «Aplicar OCR» a continuación: el reconocimiento puede demorar, y se realiza sin salir de la página.",
  HTML_SIN_TEXTO:"Pasa cuando el fallo está dentro de un frame o se arma con JavaScript. Abra el enlace y pegue el texto a mano.",
  RESPUESTA_NO_OK:"Verifique que el enlace sea el del documento y no el del buscador.",
  TIEMPO_AGOTADO:"Los sitios judiciales se ponen lentos en horario de tribunales. Pruebe más tarde.",
  RED_PRIVADA:"El servidor no descarga de direcciones internas. Está bien que pase."
};

/* Trae un documento por enlace y lo deja listo en el Lector. La usan el
   campo "Traer el fallo", el botón "Traer texto completo" de cada resultado
   de índice, y "Abrir en el Lector" desde un pasaje guardado — un solo
   camino, para no repetir el manejo de error tres veces.
   opciones.fichaConocida: metadata ya confirmada por el buscador oficial,
     para no tener que adivinarla de nuevo con detectar() (ver datosDoc()).
   opciones.qRestaurar / opciones.modoRestaurar: si el pasaje se guardó con
     una búsqueda puesta, se restaura para que la cita vuelva a quedar
     resaltada como estaba. */
function traerDocEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargando=true; estado.errorLink=null; estado.tab="lector";
  if(opciones.qRestaurar!==undefined){ estado.q=opciones.qRestaurar; estado.marca=0; }
  if(opciones.modoRestaurar) estado.modo=opciones.modoRestaurar;
  render();
  fetch(estado.api+"/extraer",{
    method:"POST",headers:{"Content-Type":"application/json"},
    // con la carátula y la fecha, si la base no entrega el documento el servidor lo busca en SAIJ
    body:JSON.stringify(opciones.alternativa?{url:url,ficha:opciones.alternativa}:{url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if((!d||!d.ok)&&opciones.respaldo&&!(d&&d.codigo==="PDF_ESCANEADO")){ abrirRespaldoEnLector(url,opciones); return; }
      if(!d||!d.ok){
        // El servidor no pudo, pero el documento sigue estando a un clic:
        // se guarda el enlace para ofrecer abrirlo y subirlo a mano, que es
        // el camino que sí funciona cuando el sitio de origen no le contesta
        // al servidor (le pasa a los PDF del TSJ de CABA desde Azure). Si es
        // un escaneo (PDF_ESCANEADO) también se ofrece aplicar OCR acá
        // mismo — por eso se guardan código y opciones, para poder
        // reintentar sin perder la ficha ni la búsqueda que traía.
        estado.errorLink={mensaje:(d&&d.mensaje)||"El servidor no devolvió el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash((d.desdeCache?"Traído del caché · ":"")+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      if(opciones.respaldo){ abrirRespaldoEnLector(url,opciones); return; }
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Verifique que la terminal siga diciendo «Interfaz http://localhost:3000»."};
      render();
    });
}

function abrirRespaldoEnLector(url,opciones){
  var t=opciones.respaldo.texto;
  estado.cargando=false; estado.errorLink=null;
  estado.texto=t; estado.fuenteDe=url; estado.infoDoc={texto:t,tipo:"texto",caracteres:t.length,palabras:t.split(/\s+/).length,url:url}; estado.marca=0;
  estado.fichaConocida=opciones.fichaConocida||null;
  render(); window.scrollTo(0,0);
}

/**
 * El OCR es la respuesta a PDF_ESCANEADO: cuando el PDF no tiene capa de
 * texto (es la foto de una hoja de papel), el servidor puede reconocer las
 * letras a partir de la imagen en vez de leerlas del archivo. Es una
 * acción aparte y no algo automático porque tarda muchísimo más —varios
 * segundos por página, no milisegundos— así que hay que pedirlo a
 * propósito sabiendo eso.
 */
function traerOcrEnLector(url,opciones){
  opciones=opciones||{};
  if(!url||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:url})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el documento.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,url:url,opciones:opciones};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=d.urlFinal||url; estado.infoDoc=d; estado.marca=0;
      estado.fichaConocida=opciones.fichaConocida||null;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Pruebe de nuevo.",
                        codigo:"OCR_CORTADO",url:url,opciones:opciones};
      render();
    });
}

/**
 * Mismo OCR que traerOcrEnLector, pero para un archivo subido a mano en vez
 * de un enlace — sirve para lo que no se puede bajar solo (un sitio que le
 * niega la conexión al servidor publicado): se abre a mano en el navegador,
 * se guarda, y se sube. El archivo (un File, inmutable) ya está guardado en
 * estado.errorLink.archivo desde que falló la primera lectura, así que
 * reintentar con OCR no hace falta volver a elegirlo.
 */
function traerOcrDeArchivo(arch){
  if(!arch||!estado.api) return;
  estado.cargandoOcr=true; estado.errorLink=null; render();
  fetch(estado.api+"/ocr-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargandoOcr=false;
      if(!d||!d.ok){
        estado.errorLink={mensaje:(d&&d.mensaje)||"El OCR no pudo leer el archivo.",
                          ayuda:AYUDAS_ERROR_LINK[d&&d.codigo]||"",
                          codigo:d&&d.codigo,archivo:arch};
        render(); return;
      }
      estado.texto=d.texto; estado.fuenteDe=""; estado.infoDoc=d;
      estado.fichaConocida=null; estado.marca=0;
      render(); window.scrollTo(0,0);
      flash("OCR listo · "+d.paginasProcesadas+" de "+d.paginas+" página(s) · "+d.palabras.toLocaleString("es-AR")+
        " palabras — revisalo con cuidado, un OCR puede confundir letras parecidas");
    })["catch"](function(){
      estado.cargandoOcr=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor durante el OCR.",
                        ayuda:"El OCR tarda bastante; con una conexión lenta puede cortarse antes de terminar. Pruebe de nuevo.",
                        codigo:"OCR_CORTADO",archivo:arch};
      render();
    });
}

function fichaDesdeIndice(slug,r){
