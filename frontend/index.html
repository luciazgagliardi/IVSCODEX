    // Cada requisito se puede tildar a medida que se reúne: la ficha pasa a
    // ser la lista de control del trámite. Queda guardado en el navegador.
    var hechos=(estado.reqHecho&&estado.reqHecho[x.id])||{};
    var n=x.req.filter(function(r,i){ return hechos[i]; }).length;
    cuerpo+='<div class="rotulo" style="margin-top:12px">Qué exige la norma'+
        (n?' <span class="req-progreso">· '+n+' de '+x.req.length+' cumplidos</span>':'')+'</div>'+
      '<ol class="req-lista">'+x.req.map(function(r,i){
        return '<li><button type="button" class="req-item" data-act="req-tilde" data-req="'+esc(x.id)+'" data-i="'+i+'"'+
          ' aria-pressed="'+(hechos[i]?"true":"false")+'"><span class="req-caja" aria-hidden="true"></span>'+
          '<span class="req-txt">'+esc(r)+'</span></button></li>';
      }).join("")+'</ol>'+
      (n?'<button class="mini" data-act="req-reiniciar" data-req="'+esc(x.id)+'" style="margin-top:10px">Desmarcar todo</button>':'');
  }else if(x.aviso){
    cuerpo+='<p class="req-aviso">'+esc(x.aviso)+'</p>';
  }else{
    cuerpo+='<p class="req-aviso">Todavía sin la lista cargada — se van sumando de a una, verificando cada artículo contra el texto oficial. Mientras tanto, la búsqueda lleva a los fallos.</p>';
  }
  var fuente=x.norma
    ? '<div class="req-norma">'+esc(x.norma)+
      (x.url?' · <a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">ver el texto oficial</a>':'')+
      '</div>'
    : '';
  return '<div class="rama"><h3>'+esc(comoTitulo(x.n))+'</h3><p>'+esc(x.d)+'</p>'+

      '<button class="mini" data-act="tramite" data-v="requisitos '+esc(x.q)+'">Buscar fallos sobre esto</button>'+
    '</div></div>';
}

/**
 * Entiende una referencia escrita como la escribe un abogado.
 *
 * Nadie tipea "norma: código civil / artículo: 1741" en dos campos separados:
 * escribe "art 1741 CCyC", "artículo 70 del código civil y comercial",
 * "1741 CCCN" o "LCT 245". Esto saca de ahí el número y, si se nombró la
 * norma, también cuál es — así el desplegable se acomoda solo.
 *
 * Devuelve {art, clave} con clave en null si no se nombró ninguna norma
 * (entonces se respeta la que ya estaba elegida).
 */
function parsearReferencia(texto){
  var t=(" "+String(texto||"")+" ").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");   // sin tildes
  var clave=null;
  // Se prueba de la pista más específica a la más genérica: "civil y
  // comercial" antes que "civil" suelto, que también aparece en otras.
  if(/civil y comercial|ccyc|cccn|ccyn|c\.c\.c/.test(t)) clave="ccyc";
  else if(/constitucion|const\.|\bcn\b|carta magna/.test(t)) clave="cn";
  else if(/contrato de trabajo|\blct\b|20\.?744|ley de trabajo/.test(t)) clave="lct";
  else if(/concurso|quiebra|\blcq\b|24\.?522/.test(t)) clave="lcq";
  else if(/procedimiento administrativo|administrativ|\blpa\b|19\.?549/.test(t)) clave="lpa";
  else if(/amparo|16\.?986/.test(t)) clave="amparo";

  // El número del artículo: se ignoran los números que son parte del nombre
  // de la ley (20.744, 24.522...) para no confundirlos con el articulado.
  var limpio=t.replace(/\b\d{2}\.?\d{3}\b/g," ");
  var m=/\b(\d{1,4})\s*(bis|ter|quater)?\b/.exec(limpio);
  return { art: m?(m[1]+(m[2]?" "+m[2]:"")):"", clave: clave };
}

/**
 * Solapa Norma: el texto oficial de un artículo, más los fallos que lo citan.
 *
 * Cierra el círculo que le faltaba a la app. Todo lo demás mira
 * JURISPRUDENCIA —qué dijeron los tribunales—, pero un fallo se lee citando
 * artículos, y hasta ahora había que salir a otra pestaña a buscar el texto.
 * El texto no lo escribe esta web: lo trae de InfoLeg, que es el repositorio
 * del Ministerio de Justicia, en su versión "texto actualizado".
 */
/* Cómo se agrupan las seis fuentes al compararlas. Es la pregunta real que
   se hace un abogado —"¿qué dice Mendoza, qué dice Nación, qué dice CABA?"—
   y no coincide con el orden de la lista de buscadores: Mendoza son dos
   fuentes (el Poder Judicial y la revista) y Nación otras dos (la Corte y
   SAIJ). Dialnet va aparte porque no es jurisprudencia. */
var GRUPOS_COMPARAR=[
  ["Mendoza",  ["mendoza","mendozalegal"]],
  ["Nación",   ["csjn","saij"]],
  ["TSJ",      ["caba"]],
  ["Doctrina", ["dialnet"]]
];

/**
 * Corre la MISMA consulta en las seis fuentes a la vez.
 *
 * En paralelo y no una tras otra: son seis servidores distintos, así que la
 * espera de cortesía del backend (esperarTurno, por host) no se pisa entre
 * ellos. Secuencial tardaría unos cuarenta segundos —CABA sola tarda
 * catorce—; así tarda lo que la más lenta.
 *
 * Cada fuente se pinta apenas contesta, sin esperar a las demás: con una
 * lenta en el grupo, quedarse mirando una pantalla vacía sería peor.
 */
function compararFuentes(){
  var qi=estado.q.trim();
  if(!qi){ flash("Escriba algo en «¿Qué desea consultar?» primero"); return; }
  if(!estado.api){ flash("El comparador necesita el servidor de extracción"); return; }
  recordar(qi);
  estado.comparar={corriendo:true,hecho:false,q:qi,porFuente:{}};
  render();

  var pendientes=FUENTES_INDICE.length;
  FUENTES_INDICE.forEach(function(f){
    var cuerpo={q:qi,modo:estado.modo||"todas"};
    if(estado.excluir.trim()) cuerpo.excluir=estado.excluir.trim();
    if(/^\d{4}$/.test(estado.desde)) cuerpo.anioDesde=Number(estado.desde);
    if(/^\d{4}$/.test(estado.hasta)) cuerpo.anioHasta=Number(estado.hasta);
    var trib=estado.indices[f.slug]&&estado.indices[f.slug].tribunal;
    if(trib) cuerpo.tribunal=trib;

    fetch(estado.api+"/indice/"+f.slug+"/buscar",{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)
    }).then(function(r){ return r.json(); })
      .then(function(d){
        // Mismo respaldo que en el buscador normal: a SAIJ el servidor
        // publicado no llega (403), pero el navegador sí.
        if((f.slug==="saij"||f.slug==="csjn")&&(!d||!d.ok)) return buscarSaijNavegador(cuerpo,f.slug);
        return d;
      })
      .then(function(d){
        estado.comparar.porFuente[f.slug]=(d&&d.ok)
          ?{ok:true,total:d.total||0,totalFuente:(typeof d.totalFuente==="number"?d.totalFuente:null),
            parcial:!!d.totalParcial,local:!!d.desdeIndiceLocal,resultados:d.resultados||[]}
          :{ok:false,error:(d&&d.mensaje)||"no respondió"};
      })
      ["catch"](function(){
        estado.comparar.porFuente[f.slug]={ok:false,error:"se cortó la comunicación"};
      })
      .then(function(){
        if(--pendientes<=0){ estado.comparar.corriendo=false; estado.comparar.hecho=true; }
        render();
      });
  });
}

function tarjetaComparar(f){
  var r=estado.comparar.porFuente[f.slug];
  var cab='<h4><span class="cod '+f.clase+'" style="margin-right:7px">'+esc(f.cod)+'</span>'+esc(f.nombre)+'</h4>';
  var borde=' style="border-left-color:var(--f-'+f.slug+')"';

  if(!r) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">Consultando…</p></div>';
  if(!r.ok) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">No respondió: '+esc(r.error)+'</p></div>';
  if(!r.resultados.length) return '<div class="comp-card"'+borde+'>'+cab+'<p class="comp-vacio">Sin coincidencias.</p></div>';

  // NO se muestra el contador crudo del sitio, aunque lo tengamos.
  //
  // Poner "44.222" en la tarjeta de SAIJ al lado de "319" en la de Mendoza
  // era una comparación falsa: SAIJ cuenta los documentos que tienen ALGUNA
  // de las palabras y Mendoza los que tienen TODAS, así que esos dos números
  // no miden lo mismo y la pantalla invitaba justamente a compararlos. Un
  // aviso al pie no alcanzaba — el número grande es lo que se lee.
  //
  // Lo que se muestra es lo único que significa lo mismo en las seis: cuántos
  // resultados de verdad trajo esta consulta acá. Es un piso, no un censo, y
  // se dice así.
  // La barra: lo que trajo esta base contra la que más trajo, para leer la
  // comparación de un vistazo. Es material encontrado, no un ranking: los
  // contadores oficiales miden distinto (ver el aviso de la solapa).
  var tope=Math.max.apply(null,FUENTES_INDICE.map(function(x){
    var y=estado.comparar.porFuente[x.slug]; return y&&y.ok?y.resultados.length:0;
  }).concat([1]));
  var barra='<span class="comp-barra" aria-hidden="true"><i style="width:'+Math.round(r.resultados.length/tope*100)+'%"></i></span>';
  var cifra='<p class="comp-cifra"><b>'+r.resultados.length.toLocaleString("es-AR")+'</b> resultado'+
    (r.resultados.length===1?'':'s')+' encontrados'+
    (r.parcial?' (hay más para revisar)':'')+
    (r.local?' · de su índice local':'')+'</p>';

  var items=r.resultados.slice(0,3).map(function(x){
    var enlace=x.linkFicha||x.linkFallo;
    var titulo=esc((x.caratula||x.expediente||"(sin carátula)").slice(0,150));
    return '<div class="comp-item">'+
      (enlace?'<a href="'+esc(enlace)+'" target="_blank" rel="noopener noreferrer">'+titulo+'</a>':titulo)+
      (x.fecha?'<span class="comp-fecha">'+esc(x.fecha)+'</span>':'')+
      '</div>';
  }).join("");

  return '<div class="comp-card"'+borde+'>'+cab+cifra+barra+items+
    '<div class="f-acc" style="margin-top:10px">'+
      '<button class="mini" data-act="ir-a-fuente" data-fuente="'+esc(f.slug)+'">Ver todos en Buscar</button>'+
    '</div></div>';
}

/**
 * Solapa Comparar: la misma pregunta contestada por cada jurisdicción.
 *
 * Antes esto existía como "Buscar en todas a la vez", pero no buscaba en
 * ningún lado: armaba una consulta de Google con site: y abría otra pestaña.
 * Ahora corre de verdad contra los seis buscadores integrados y muestra las
 * respuestas juntas, que es la pregunta que un abogado se hace todo el
 * tiempo: si Mendoza resuelve distinto que la Corte, quiero verlo de un
 * vistazo, no abriendo seis solapas.
 */
function vistaComparar(){
  var c=estado.comparar;
  var html='<div class="aviso"><span class="av-tit">Esta función permite contrastar los criterios de resolución de la SCJM, el TSJ y la CSJN</span>'+
    'Cada bloque indica los documentos obtenidos para esta búsqueda específica, no el total de la base de datos. '+
    'Al usar criterios de medición heterogéneos, los contadores oficiales no son comparables entre sí. '+
    'Esta función es un localizador de material.</div>';

  html+='<div class="panel"><div class="campo"><span>¿Qué desea consultar?</span>'+
    '<input type="text" id="q" value="'+esc(estado.q)+'" autocomplete="off" placeholder="daño moral"></div>'+
    '<div class="acciones" style="margin:0;padding:0;border:0">'+
      '<button class="btn" data-act="comparar"'+(c.corriendo?" disabled":"")+'>'+
        (c.corriendo?"Consultando las seis…":"Comparar las seis fuentes")+'</button>'+
    '</div></div>';

  if(!c.corriendo&&!c.hecho) return html;

  html+='<p class="conteo">'+(c.corriendo?'Consultando… cada fuente aparece apenas contesta':'Resultados para «'+esc(c.q)+'»')+'</p>';

  GRUPOS_COMPARAR.forEach(function(g){
    var fs=FUENTES_INDICE.filter(function(f){ return g[1].indexOf(f.slug)!==-1; });
    if(!fs.length) return;
    html+='<div class="grupo"><h3>'+esc(g[0])+'</h3>'+
      '<div class="comp-grid">'+fs.map(tarjetaComparar).join("")+'</div></div>';
  });
  return html;
}

/**
 * El aviso de "no se pudo traer", en un solo lugar para poder mostrarlo
 * tanto si el Lector estaba vacío como si ya tenía un fallo abierto.
 *
 * Antes esto sólo se pintaba cuando el Lector estaba vacío: si ya había un
 * documento cargado y "Traer texto completo" fallaba para uno nuevo (algo
 * frecuente con los PDF del TSJ de CABA, que muchas veces no le contestan
 * al servidor publicado en Azure), el pedido fallaba en silencio y quedaba
 * en pantalla el fallo anterior, como si fuera el que se acababa de pedir.
 */
function avisoErrorLector(){
  if(!estado.errorLink&&!estado.cargandoOcr) return '';
  if(estado.cargandoOcr){
    return '<div class="aviso" style="margin:0 0 14px">'+
      '<strong>Aplicando OCR…</strong> puede tardar varios minutos —no son milisegundos como el resto de esta app—, '+
      'sobre todo si el servidor anda con poca CPU en este momento. No hace falta recargar ni volver a tocar el botón: '+
      'déjelo trabajando.'+
      (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Mientras tanto se sigue viendo el fallo anterior.</span>':'')+
      '</div>';
  }
  var esEscaneo=estado.errorLink.codigo==="PDF_ESCANEADO";
  // El escaneo puede venir de un enlace (queda la URL para pedirle el OCR
  // al servidor) o de un archivo subido a mano (no hay URL, pero el propio
  // archivo quedó guardado en memoria — ver el listener de "change" más
  // abajo — así que el OCR se le puede pedir igual sin volver a elegirlo).
  var puedeOcr=esEscaneo&&(estado.errorLink.url||estado.errorLink.archivo);
  return '<div class="aviso" style="margin:0 0 14px"><strong>No se pudo traer este documento.</strong> '+
    esc(estado.errorLink.mensaje)+
    (estado.errorLink.ayuda?'<br><span style="color:var(--humo);font-size:12.5px">'+esc(estado.errorLink.ayuda)+'</span>':'')+
    (estado.texto?'<br><span style="color:var(--humo);font-size:12.5px">Se sigue mostrando el fallo que ya estaba abierto, no el que acaba de pedirse.</span>':'')+
    ((estado.errorLink.url||puedeOcr)
      ?'<div class="f-acc" style="margin-top:10px">'+
         // El escaneo no tiene "el original y guardarlo" como primer paso:
         // ahí el enlace es al PDF sin texto, y lo que sirve es pedirle al
         // servidor que le aplique OCR, no abrirlo a mano.
         (puedeOcr
           ?'<button class="mini" data-act="aplicar-ocr"'+(estado.errorLink.url?' data-url="'+esc(estado.errorLink.url)+'"':'')+'>Aplicar OCR (tarda varios minutos)</button>'
           :'')+
         (estado.errorLink.url
           ?'<a class="mini" href="'+esc(estado.errorLink.url)+'" target="_blank" rel="noopener noreferrer">'+(esEscaneo?"Abrir el original":"1 · Abrir el original y guardarlo")+'</a>'
           :'')+
         (esEscaneo||!estado.errorLink.url?'':'<button class="mini" data-act="elegir-archivo">2 · Subirlo acá</button>')+
       '</div>'
      :'')+
    '</div>';
}

function conteoLector(cs){
  var el=document.getElementById("doc-cnt");
  if(!el) return;
  if(!cs.length){
    el.innerHTML=cadena()?'Sin coincidencias para <b>'+esc(cadena())+'</b>'
                         :'Escriba en «Qué buscar dentro del fallo» para resaltar';
    return;
  }
  var vis=Math.min(cs.length,TOPE_MARCAS);
  el.innerHTML='<b>'+cs.length+'</b> coincidencia'+(cs.length===1?"":"s")+
    (cs.length>TOPE_MARCAS?" (se marcan las primeras "+TOPE_MARCAS+")":"")+
    ' · '+(estado.marca+1)+' de '+vis;
}

/* Orden de lectura de la ficha del Lector: jerarquía legal de arriba hacia
   abajo (Constitución > tratados/leyes > fondo > forma), y adentro de cada
   norma, los artículos ordenados numéricamente en vez de por orden de
   aparición en el texto. */
function numDeCadena(s){
  var m=String(s).replace(/\./g,"").match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function ordenArt(a,b){
  var na=numDeCadena(a),nb=numDeCadena(b);
  return na!==nb?na-nb:a.localeCompare(b);
}
var RANGO_FUENTE={
  "CCyC (vigente)":10,"Código Civil (derogado)":11,"Código de Comercio (derogado)":12,"Código Penal":13,
  "LCT":14,"LDC":15,"Ley de Seguros (LS)":16,
  "CPCCN":30,"CPC":31,"Código Procesal Penal":32,"Ley Arancelaria (LA)":33
};
function rangoDeFuente(label){
  return RANGO_FUENTE.hasOwnProperty(label)?RANGO_FUENTE[label]:99;
}

function pintarLector(){
  if(estado.tab!=="lector"||!estado.texto) return;
  var texto=estado.texto,cs=coincidencias(texto),d=datosDoc(texto);
  if(estado.marca>=cs.length) estado.marca=0;
  conteoLector(cs);

  var meta=document.getElementById("doc-meta");
  if(meta){
    var top=[];
    if(d.trib) top.push(["Tribunal",d.trib+(d.sala?" · "+d.sala:"")]);
    if(d.fecha) top.push(["Fecha",d.fecha]);
    if(d.exp) top.push(["Expediente",d.exp]);
    if(d.tomo&&d.pag) top.push(["Colección","Fallos: "+d.tomo+":"+d.pag]);
    var infoDer=estado.infoDoc?esc(estado.infoDoc.tipo.toUpperCase()+
      (estado.infoDoc.paginas?" · "+estado.infoDoc.paginas+" pág.":"")+
      " · "+estado.infoDoc.caracteres.toLocaleString("es-AR")+" caracteres"+
      (estado.infoDoc.desdeCache?" · desde caché":"")):"";

    var htmlTop=(top.length||d.car||infoDer)?(
      '<div class="meta-top">'+
        (d.car?'<div class="meta-car">'+esc(d.car)+
          (estado.fichaConocida?' <span style="font-size:11px;font-weight:600;color:var(--acequia)">· verificado en el buscador oficial</span>':"")+
          '</div>':"")+
        (top.length||infoDer?'<div class="meta-fila">'+
          '<div class="izq">'+top.map(function(x){ return '<b>'+esc(x[0])+':</b> '+esc(x[1]); }).join(' <span class="sep">·</span> ')+'</div>'+
          (infoDer?'<div class="der">'+infoDer+'</div>':"")+
        '</div>':"")+
      '</div>'
    ):"";

    var porFuente=d.artsPorFuente||[];
    var pend=porFuente.filter(function(g){ return g[0]==="Sin ley identificada"; })[0];
    var porCat={cn:[],tratados:[],fondo:[],leyes:[],provincial:[],local:[]};
    porFuente.forEach(function(g){
      if(g[0]==="Sin ley identificada") return;
      var cat=porCat.hasOwnProperty(g[2])?g[2]:"leyes";
      porCat[cat].push(g);
    });
    porCat.leyes.sort(function(a,b){ return numDeCadena(a[0])-numDeCadena(b[0]); });
    porCat.fondo.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.provincial.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.tratados.sort(function(a,b){ return a[0].localeCompare(b[0]); });
    porCat.local.sort(function(a,b){ return a[0].localeCompare(b[0]); });

    function bloqueNorma(g,claseExtra){
      return '<div class="meta-bloque'+(claseExtra?" "+claseExtra:"")+'"><h3>'+esc(g[0])+'</h3>'+
        '<div class="meta-tags">'+g[1].slice().sort(ordenArt).map(function(a){
          return '<span class="meta-tag">'+esc(a)+'</span>';
        }).join("")+'</div></div>';
    }
    function bloqueTags(items){
      return '<div class="meta-bloque"><div class="meta-tags">'+
        items.map(function(x){ return '<span class="meta-tag">'+esc(x)+'</span>'; }).join("")+
      '</div></div>';
    }

    /* Jerarquía normativa decreciente: Constitución > tratados > códigos de
       fondo > leyes nacionales > leyes provinciales/procesales > normativa
       local. Cada norma aparece una sola vez, con todos sus artículos
       consolidados en el mismo contenedor. */
    var bloques="";
    porCat.cn.forEach(function(g){ bloques+=bloqueNorma(g,"cn"); });
    if(porCat.tratados.length){
      bloques+='<div class="meta-cat">Tratados internacionales</div>';
      porCat.tratados.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.fondo.length){

      porCat.leyes.forEach(function(g){ bloques+=bloqueNorma(g); });
    }

      porCat.provincial.forEach(function(g){ bloques+=bloqueNorma(g); });

    if(porCat.local.length){

      porCat.local.forEach(function(g){ bloques+=bloqueNorma(g); });

    if(d.citados&&d.citados.length){

    }
    if(pend) bloques+='<div class="meta-bloque pendiente"><h3>Artículos pendientes de clasificación</h3>'+
      '<div class="meta-tags">'+pend[1].slice().sort(ordenArt).map(function(a){
        return '<span class="meta-tag">'+esc(a)+'</span>';
      }).join("")+'</div></div>';

    meta.innerHTML=htmlTop+
      (bloques?'<div class="meta-cuerpo">'+bloques+'</div>'
        :(htmlTop?"":'<div class="meta-bloque"><h3>Sin datos detectados</h3><div class="txt">El encabezado no sigue un formato reconocible. Cargue los datos a mano en «Citar».</div></div>'))+
      '<div class="meta-acc">'+
      '<button class="mini" data-act="meta-a-cita">Pasar estos datos al formateador de citas</button>'+
      '<button class="mini" data-act="copiar-doc-cita">Copiar solo la cita</button>'+
      '</div>';
  }

  var doc=document.getElementById("doc");
  if(doc) doc.innerHTML=textoResaltado(texto,cs);
  pintarMinimapa();

  var tit=document.getElementById("doc-tit-pas");

      cont.innerHTML='<div class="vacio">'+(cadena()
        ?'Su búsqueda no aparece en este texto. Pruebe con «Palabra parcial: sí», con menos palabras o cambiando el modo a «Alguna palabra» en la solapa Buscar.'
        :'Escriba algo arriba y los pasajes aparecerán aquí.')+'</div>';

    }else{
      var ps=pasajesDe(texto,cs);
      if(tit) tit.textContent=ps.length+" pasaje"+(ps.length===1?"":"s")+" con contexto";
      cont.innerHTML=ps.map(function(p,i){
        return '<div class="pasaje"><div class="txt">'+p.html+'</div><div class="acc">'+
          '<button class="mini" data-act="pas-cita" data-i="'+i+'">Copiar con la cita</button>'+
          '<button class="mini" data-act="pas-copiar" data-i="'+i+'">Copiar el pasaje</button>'+
          '<button class="mini" data-act="pas-guardar" data-i="'+i+'">Guardar</button>'+
          '<button class="mini" data-act="pas-compartir" data-i="'+i+'">Compartir</button>'+
          '<span class="pos">carácter '+p.ini+'</span></div></div>';
      }).join("");
      cont._ps=ps;
    }
  }
  irAMarca(false);
}

/* El minimapa del Lector: una franja junto al fallo con una marca por cada
   coincidencia, a la altura en que aparece en el texto. De un vistazo se
   ve dónde se concentran —en los considerandos, en la parte resolutiva— y
   tocar una marca lleva hasta ella. Una ventana tenue muestra qué parte
   del fallo está a la vista. Complementa la grilla de pasajes: los pasajes
   dicen qué; el minimapa, dónde. */
function pintarMinimapa(){
  var doc=document.getElementById("doc"),mm=document.getElementById("minimapa");
  if(!doc||!mm) return;
  var ms=doc.querySelectorAll("mark"),alto=doc.scrollHeight||1,h="";
  for(var k=0;k<ms.length;k++){
    h+='<button type="button" class="mm-marca'+(k===estado.marca?' actual':'')+'" data-act="ir-marca" data-i="'+k+'"'+
       ' style="top:'+(ms[k].offsetTop/alto*100).toFixed(2)+'%" aria-label="Coincidencia '+(k+1)+' de '+ms.length+'"></button>';
  }
  mm.innerHTML='<span class="mm-ventana" id="mm-ventana"></span>'+h;
  mm.hidden=!ms.length;
  ventanaMinimapa();
  if(!doc._conMinimapa){ doc._conMinimapa=true; doc.addEventListener("scroll",ventanaMinimapa,{passive:true}); }
}
function ventanaMinimapa(){
  var doc=document.getElementById("doc"),v=document.getElementById("mm-ventana");
  if(!doc||!v) return;
  var alto=doc.scrollHeight||1;
  v.style.top=(doc.scrollTop/alto*100)+"%";
  v.style.height=Math.max(3,doc.clientHeight/alto*100)+"%";
}

function irAMarca(mover){
  try{
    var doc=document.getElementById("doc");
    if(!doc) return;
    var ms=doc.querySelectorAll("mark");
    if(!ms.length) return;
    var i=Math.max(0,Math.min(estado.marca,ms.length-1));
    for(var k=0;k<ms.length;k++) ms[k].className=(k===i?"actual":"");
    var mm=document.querySelectorAll("#minimapa .mm-marca");
    for(var m=0;m<mm.length;m++) mm[m].classList.toggle("actual",m===i);
    if(mover&&ms[i].scrollIntoView) ms[i].scrollIntoView({block:"center"});
  }catch(e){}
}

/* ============================================================
   Verificador de citas
   ============================================================
   Pegás una cita, el servidor la lee (backend/lib/citas.js) y la busca en
   los buscadores oficiales que sabe consultar (backend/lib/verificarCita.js).
   Todo lo que se ve acá sale de esa respuesta: esta página no concluye nada
   por su cuenta y, sobre todo, no convierte un "no lo encontré" en un "es
   falsa". El alcance de la búsqueda queda escrito en pantalla siempre, haya
   o no resultado, porque es la única forma de que el veredicto se lea con la
   reserva que corresponde. */

var VEREDICTOS={
  verificada:{clase:"si",rotulo:"Coincidencia encontrada"},
  no_encontrada:{clase:"no",rotulo:"No la encontramos"},
  no_verificable:{clase:"duda",rotulo:"No se pudo verificar"}
};

function verificarCitaPegada(){
  var ta=document.getElementById("cita-in");
  var txt=(ta?ta.value:estado.cita.texto||"").trim();
  estado.cita.texto=txt;
  if(!txt){ flash("Pegue la cita que desea verificar"); return; }
  if(!estado.api){ flash("Esta función necesita el servidor, y ahora no responde"); return; }
  if(estado.cita.cargando) return; // ya hay uno en camino, no duplicar el pedido

  estado.cita.cargando=true; estado.cita.error=null; estado.cita.salida=null; render();
  fetch(estado.api+"/verificar-cita",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({texto:txt})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cita.cargando=false;
      if(!d||!d.ok){
        estado.cita.error=(d&&d.mensaje)||"El servidor no pudo verificar la cita.";
        render(); return;
      }
      estado.cita.salida=d;
      estado.cita.cuando=new Date();
      render();
      var v=VEREDICTOS[d.veredicto];
      flash(v?v.rotulo:"Listo");
    })["catch"](function(){
      estado.cita.cargando=false;
      estado.cita.error="Se cortó la comunicación con el servidor.";
      render();
    });
}

/* La constancia de verificación: cuando la cita coincide con un registro
   oficial, queda asentado qué se consultó, qué se encontró, en qué bases
   y cuándo, con el sello de IVS CODEX. Se copia como texto para adjuntar
   al expediente o al borrador del escrito. Acredita la coincidencia a esa
   fecha; no reemplaza la lectura del fallo, y lo dice. */
function datosConstancia(){
  var d=estado.cita.salida,c=d&&(d.candidatos||[])[0];
  // Solo con confianza alta: un identificador exacto (expediente, tomo y
  // página) corroborado por la carátula o la fecha. Con menos que eso la
  // explicación pide abrir el documento y comparar, y una constancia diría
  // más de lo que se comprobó.
  if(!d||d.veredicto!=="verificada"||d.confianza!=="alta"||!c) return null;
  var cuando=estado.cita.cuando||new Date();
  return {
    cita:estado.cita.texto||"",
    caratula:c.caratula||"(sin carátula)",
    meta:[c.nombreFuente,c.tribunal,c.fecha,c.expediente?"Expte. "+c.expediente:""].filter(Boolean).join(" · "),
    link:c.link||"",
    bases:(d.fuentesConsultadas||[]).filter(function(f){return f.ok;}).map(function(f){return f.nombre;}).join(" · "),
    fecha:cuando.toLocaleDateString("es-AR")+" · "+cuando.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}),
    confianza:d.confianza||""
  };
}
function constanciaCita(){
  var k=datosConstancia();
  if(!k) return "";
  function fila(rot,val){ return val?'<div><dt>'+esc(rot)+'</dt><dd>'+esc(val)+'</dd></div>':''; }
  return '<div class="constancia">'+
    '<svg class="constancia__sello" viewBox="0 0 120 120" aria-hidden="true">'+
      '<defs><path id="cs-aro" d="M60 15a45 45 0 1 1 0 90a45 45 0 1 1 0-90"/></defs>'+
      '<circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="1"/>'+
      '<circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width=".8"/>'+
      '<text font-size="9.5" letter-spacing="2.4" fill="currentColor"><textPath href="#cs-aro" textLength="278" lengthAdjust="spacing">VERIFICADO · IVS CODEX · FIDES · </textPath></text>'+
      '<path d="M46 61l10 10 19-22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg>'+
    '<div class="constancia__txt"><p class="constancia__tit">Constancia de verificación</p>'+

      '<div class="acciones">'+

      '</div>'+

    '</div></div>';
}

function resultadoCita(){
  var d=estado.cita.salida;

  var v=VEREDICTOS[d.veredicto]||VEREDICTOS.no_verificable;
  var fuentes=(d.fuentesConsultadas||[]).map(function(f){

  }).join("<br>");

  return '<div class="panel vivo">'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">'+
      '<span class="veredicto '+v.clase+'"><span class="bolita"></span>'+esc(v.rotulo)+'</span>'+
      '<span class="tag">confianza '+esc(d.confianza||"")+'</span>'+

/* Los dibujos de cada sección: a línea fina, en el mismo trazo que el
   sello de la portada, con un solo punto dorado —el del logo— en el lugar
   que importa de cada uno. Se dibujan solos al entrar a la sección. */
function dibujoSeccion(tab){
  var k=0,h="",i,x,y,a;
  function l(d){ return '<path class="dl" style="--i:'+(k++)+'" pathLength="1" d="'+d+'"/>'; }
  function c(x,y,r){ return '<circle class="dl" style="--i:'+(k++)+'" pathLength="1" cx="'+x+'" cy="'+y+'" r="'+r+'"/>'; }
  function p(x,y,r){ return '<circle class="dd" cx="'+x+'" cy="'+y+'" r="'+(r||4)+'"/>'; }
  /* Todos los dibujos son simétricos respecto del eje vertical (x = 120): lo
     que hay de un lado, hay igual del otro. El único punto dorado, el del
     logo, va sobre el eje. */
  switch(tab){
    case "buscar":   // la consulta sale a las seis bases, en abanico
      for(i=0;i<6;i++){ a=(-62.5+i*25)*Math.PI/180; x=(120+100*Math.sin(a)).toFixed(1); y=(142-100*Math.cos(a)).toFixed(1);
        h+=c(x,y,7)+l("M120 142L"+(120+86*Math.sin(a)).toFixed(1)+" "+(142-86*Math.cos(a)).toFixed(1)); }
      h+=p(120,142,5); break;
    case "comparar": // cinco barras en pirámide
      h+=l("M30 146H210");
      [[48,34],[84,66],[120,100],[156,66],[192,34]].forEach(function(b){ h+=l("M"+b[0]+" 146V"+(146-b[1])); });
      h+=p(120,32,4.5); break;
    case "ramas":    // una voz: un círculo y tres arcos que salen de él
      h+=c(87,80,12)+l("M109.8 54.7A34 34 0 0 1 109.8 105.3")+l("M124.5 38.4A56 56 0 0 1 124.5 121.6")+l("M139.2 22A78 78 0 0 1 139.2 138")+p(87,80,4); break;
    case "requisitos": // la lista de control: tres filas, espejadas
      h+=l("M56 24H184V144H56Z");
      [52,84,116].forEach(function(yy){ h+=c(84,yy,8)+l("M104 "+yy+"H136")+c(156,yy,8); });
      h+=p(120,24,4.5); break;
    case "norma":    // el templo
      h+=l("M64 30H176")+l("M72 40H168")+l("M84 40V128")+l("M102 40V128")+l("M120 40V128")+l("M138 40V128")+l("M156 40V128")+l("M72 128H168")+l("M60 140H180");
      h+=p(120,18,4.5); break;
    case "lector":   // el libro abierto
      h+=l("M120 36Q86 26 40 32V132Q86 126 120 136")+l("M120 36Q154 26 200 32V132Q154 126 120 136")+l("M120 36V136");
      for(i=0;i<5;i++){ y=52+i*16; h+=l("M52 "+(y-2)+"Q84 "+(y-8)+" 110 "+(y-1))+l("M188 "+(y-2)+"Q156 "+(y-8)+" 130 "+(y-1)); }
      h+=p(120,20,4.5); break;
    case "citas":    // las comillas, abriendo y cerrando
      h+=l("M72 52L54 70L72 88")+l("M90 52L72 70L90 88")+l("M168 52L186 70L168 88")+l("M150 52L168 70L150 88");
      h+=l("M84 118H156")+l("M100 134H140");
      h+=p(120,70,5); break;
    case "verificar": // el sello con su tilde
      h+=c(120,84,58)+c(120,84,44)+l("M98 86L114 102L144 68");
      h+=p(120,22,4.5); break;
    case "fuentes":  // la señal: arcos concéntricos que salen de un punto
      [30,58,86].forEach(function(r){
        a=56*Math.PI/180;
        h+=l("M"+(120-r*Math.sin(a)).toFixed(1)+" "+(138-r*Math.cos(a)).toFixed(1)+"A"+r+" "+r+" 0 0 1 "+(120+r*Math.sin(a)).toFixed(1)+" "+(138-r*Math.cos(a)).toFixed(1));
      });
      h+=l("M120 138V152")+p(120,138,5.5); break;
    case "guardados": // fichas apiladas
      h+=l("M50 144V104H190V144Z")+l("M64 104V80H176V104")+l("M78 80V56H162V80")+l("M104 124H136")+l("M112 92H128");
      h+=p(120,68,4.5); break;
    case "cuenta":   // la cerradura
      h+=c(120,84,56)+c(120,72,13)+l("M112 84L106 118H134L128 84");
      h+=p(120,72,3.5); break;
    case "calculos": // el ábaco: tres hileras de tres cuentas, centradas
      h+=l("M44 34H196V138H44Z"); [58,86,114].forEach(function(y){ h+=l("M44 "+y+"H76")+l("M92 "+y+"H112")+l("M128 "+y+"H148")+l("M164 "+y+"H196")+c(84,y,8)+c(120,y,8)+c(156,y,8); }); h+=p(120,20,5); break;
    case "plazos":   // el calendario y el día que vence
      h+=l("M40 34H200V140H40Z")+l("M40 54H200")+l("M76 26V42")+l("M164 26V42");
      for(y=0;y<4;y++) for(x=0;x<7;x++){ if(!(x===3&&y===2)) h+='<circle class="dp" cx="'+(57+x*21)+'" cy="'+(72+y*18)+'" r="1.8"/>'; }
      h+=c(120,108,8)+p(120,108,3.5); break;
    case "herramientas": // páginas que se juntan en un solo cuerpo
      h+=l("M70 40H170V132H70Z")+l("M82 28H182V40")+l("M94 16H194V28")+l("M90 64H150")+l("M90 84H150")+l("M90 104H128");
      h+=p(170,40,4); break;
    case "glosario": // la V romana del logo
      h+=l("M62 34H92")+l("M148 34H178")+l("M77 34L120 134")+l("M120 134L163 34")+l("M40 146H200");
      h+=p(120,62,5.5); break;
    default: return "";
  }
  return '<svg class="cab__dibujo" viewBox="0 0 240 160" aria-hidden="true">'+h+'</svg>';
}

/* ============================================================
   7. Cálculos, plazos, calendario, glosario y exportación a Word
   ============================================================
   Todo lo que sigue corre en el navegador: no necesita el servidor de
   extracción. La única consulta externa son las series oficiales de
   índices (CER, UVA, IPC, RIPTE) de la API de Series de Tiempo de
   datos.gob.ar, que admite pedidos desde cualquier página.

   Cada cálculo muestra la norma que lo sostiene y la fórmula que usa. Los
   valores que cambian con el tiempo —tasas, UMA, JUS, porcentajes de las
   leyes impositivas— no se escriben acá: los carga quien calcula, porque
   los fija el tribunal o la norma vigente del caso, y un número guardado
   en el código quedaría viejo sin que nadie lo note. */

var CALC={
  activa:"intereses",
  intereses:{capital:"",tipo:"activa",tramos:[{desde:"",hasta:"",tna:""}]},
  actualizacion:{monto:"",indice:"cer",desde:"",hasta:"",cargando:false,error:"",res:null},

/* ---------- números y fechas ---------- */
/* Acepta lo que se escribe en la Argentina: "1.234.567,89", "1500,5",
   "1.500" (mil quinientos) y también "1234567.89". */
function num(v){
  var s=String(v==null?"":v).trim().replace(/[\s$]/g,"");
  if(!s) return NaN;
  if(s.indexOf(",")!==-1) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(/\./g,"");
  var n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function pesos(n){ return isFinite(n)?"$ "+n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"; }
function porc(n,dec){ return isFinite(n)?n.toLocaleString("es-AR",{maximumFractionDigits:dec==null?2:dec})+" %":"—"; }
/* Fechas en UTC: un plazo no puede correrse un día por el horario de verano
   ni por la zona horaria de la computadora. */
function fechaDe(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null; }
function isoDe(d){ return d.toISOString().slice(0,10); }
function masDias(d,n){ return new Date(d.getTime()+n*864e5); }
function diasEntre(a,b){ return Math.round((b-a)/864e5); }
function diasDelMes(a,m){ return new Date(Date.UTC(a,m+1,0)).getUTCDate(); }
function fechaLarga(d){ return d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}); }
function fechaCorta(d){ return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"UTC"}); }
function hoyUTC(){ var h=new Date(); return new Date(Date.UTC(h.getFullYear(),h.getMonth(),h.getDate())); }
/* Suma meses o años "de fecha a fecha" (art. 6 CCyC): si en el mes del
   vencimiento no existe el día equivalente, vence el último día del mes. */
function masMeses(d,meses){
  var a=d.getUTCFullYear(),m=d.getUTCMonth()+meses,dia=d.getUTCDate();
  var aa=a+Math.floor(m/12),mm=((m%12)+12)%12;
  return new Date(Date.UTC(aa,mm,Math.min(dia,diasDelMes(aa,mm))));
}

/* ---------- feriados nacionales (Ley 27.399) ---------- */
/* Domingo de Pascua por el algoritmo de Meeus/Jones/Butcher: de ahí salen
   Carnaval (lunes y martes, 48 y 47 días antes) y el Viernes Santo. */
function pascua(a){
  var b=a%19,c=Math.floor(a/100),d=a%100,e=Math.floor(c/4),f=c%4,g=Math.floor((c+8)/25),h=Math.floor((c-g+1)/3),
      i=(19*b+c-e-h+15)%30,k=Math.floor(d/4),l=d%4,m=(32+2*f+2*k-i-l)%7,n=Math.floor((b+11*i+22*m)/451),
      mes=Math.floor((i+m-7*n+114)/31),dia=((i+m-7*n+114)%31)+1;
  return new Date(Date.UTC(a,mes-1,dia));
}
/* Trasladables (art. 6, Ley 27.399): si caen martes o miércoles pasan al
   lunes anterior; si caen jueves o viernes, al lunes siguiente. */
function trasladar(d){
  var w=d.getUTCDay();
  if(w===2||w===3) return masDias(d,-(w-1));
  if(w===4||w===5) return masDias(d,8-w);
  return d;
}
var FERIADOS_CACHE={};
function feriados(anio,juris){
  var clave=anio+"|"+juris;
  if(FERIADOS_CACHE[clave]) return FERIADOS_CACHE[clave];
  var f={};
  function fijo(m,d,n){ f[isoDe(new Date(Date.UTC(anio,m-1,d)))]=n; }
  fijo(1,1,"Año Nuevo");
  fijo(3,24,"Día Nacional de la Memoria por la Verdad y la Justicia");
  fijo(4,2,"Día del Veterano y de los Caídos en la Guerra de Malvinas");
  fijo(5,1,"Día del Trabajador");
  fijo(5,25,"Día de la Revolución de Mayo");
  fijo(6,20,"Paso a la Inmortalidad del General Manuel Belgrano");
  fijo(7,9,"Día de la Independencia");
  fijo(12,8,"Inmaculada Concepción de María");
  fijo(12,25,"Navidad");
  var p=pascua(anio);
  f[isoDe(masDias(p,-48))]="Carnaval";
  f[isoDe(masDias(p,-47))]="Carnaval";
  f[isoDe(masDias(p,-2))]="Viernes Santo";
  [[6,17,"Paso a la Inmortalidad del General Martín Miguel de Güemes"],
   [8,17,"Paso a la Inmortalidad del General José de San Martín"],
   [10,12,"Día del Respeto a la Diversidad Cultural"],
   [11,20,"Día de la Soberanía Nacional"]].forEach(function(t){
    f[isoDe(trasladar(new Date(Date.UTC(anio,t[0]-1,t[1]))))]=t[2];
  });
  if(juris==="mendoza") fijo(7,25,"Santiago Apóstol, patrono de Mendoza (feriado provincial)");
  FERIADOS_CACHE[clave]=f;
  return f;
}
function inhabilExtra(iso){
  for(var i=0;i<CALC.inhabiles.length;i++){
    var x=CALC.inhabiles[i];
    if(iso>=x.desde&&iso<=(x.hasta||x.desde)) return x.motivo||"Día inhábil";
  }
  return "";
}
/* Por qué un día no es hábil judicial ("" si lo es). */
function motivoInhabil(d,juris){
  var w=d.getUTCDay();
  if(w===0||w===6) return "Fin de semana";
  return feriados(d.getUTCFullYear(),juris)[isoDe(d)]||inhabilExtra(isoDe(d));
}
function siguienteHabil(d,juris){ var x=masDias(d,1); while(motivoInhabil(x,juris)) x=masDias(x,1); return x; }

var SERIES={
  cer:{id:"94.2_CD_D_0_0_10",nombre:"CER",diaria:true,
       base:"Coeficiente de Estabilización de Referencia (art. 4 del Decreto 214/2002), que publica el Banco Central."},
  uva:{id:"94.2_UVAD_D_0_0_10",nombre:"UVA",diaria:true,
       base:"Unidad de Valor Adquisitivo (Comunicación «A» 5945 del Banco Central y modificatorias), que se ajusta por CER."},
  ipc:{id:"148.3_INIVELNAL_DICI_M_26",nombre:"IPC",diaria:false,
       base:"Índice de Precios al Consumidor nacional del INDEC, nivel general, base diciembre de 2016. Serie mensual."},
  ripte:{id:"158.1_REPTE_0_0_5",nombre:"RIPTE",diaria:false,
       base:"Remuneración Imponible Promedio de los Trabajadores Estables (Ley 26.773, arts. 8 y 17, inc. 6, en materia de riesgos del trabajo). Serie mensual."}
};
var API_SERIES="https://apis.datos.gob.ar/series/api/series/";
/* El valor de la serie en una fecha: el último dato publicado hasta ese día
   (en las mensuales, el del mes). Si la fecha es posterior al último dato
   disponible, devuelve ese último y lo avisa. */
function valorSerie(clave,fechaIso){
  var s=SERIES[clave],f=fechaDe(fechaIso);
  var desde=s.diaria?masDias(f,-45):masMeses(new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth(),1)),-3);
  var url=API_SERIES+"?ids="+s.id+"&start_date="+isoDe(desde)+"&end_date="+fechaIso+"&format=json&limit=1000";
  return fetch(url).then(function(r){ return r.json(); }).then(function(d){
    var filas=(d&&d.data||[]).filter(function(x){ return x[1]!=null; });
    // "tardío": el último dato publicado es anterior a la fecha pedida (en
    // las mensuales, de un mes anterior). Se usa igual, y se avisa.
    function tarde(f){ return s.diaria?f<fechaIso:f.slice(0,7)<fechaIso.slice(0,7); }
    if(filas.length){ var u=filas[filas.length-1]; return {fecha:u[0],valor:u[1],tardio:tarde(u[0])}; }
    return fetch(API_SERIES+"?ids="+s.id+"&last=1&format=json").then(function(r){ return r.json(); }).then(function(d2){
      var u=d2&&d2.data&&d2.data[0];
      if(!u) throw new Error("sin datos");
      return {fecha:u[0],valor:u[1],tardio:tarde(u[0])};
    });
  });
}

/* ================= INTERESES ================= */
function calcIntereses(){
  var c=CALC.intereses,cap=num(c.capital);
  if(!(cap>0)) return null;
  var filas=[],total=0,dias=0,ok=false;
  c.tramos.forEach(function(t,i){
    var a=fechaDe(t.desde),b=fechaDe(t.hasta),tna=num(t.tna);
    if(!a||!b||!(tna>=0)||b<=a) return;
    var d=diasEntre(a,b),interes=cap*tna/100*d/365;
    total+=interes;dias+=d;ok=true;
    filas.push(["Tramo "+(i+1)+" · "+fechaCorta(a)+" al "+fechaCorta(b),
      d+" días al "+porc(tna)+" anual · "+pesos(interes)]);
  });
  if(!ok) return null;
  var nombreTasa={activa:"tasa activa del Banco de la Nación",pasiva:"tasa pasiva promedio del Banco Central",otra:"tasa fijada por el tribunal"}[c.tipo];
  return {titulo:"Capital más intereses",total:pesos(cap+total),
    sub:"Intereses: "+pesos(total)+" ("+porc(total/cap*100)+" del capital, "+dias+" días)",
    filas:[["Capital",pesos(cap)]].concat(filas),
    avisos:["Interés simple sobre el capital, por días y sobre un año de 365, con la "+nombreTasa+" que se cargó para cada tramo."],
    base:"Art. 768 CCyC: a partir de su mora el deudor debe los intereses correspondientes; la tasa se determina por lo que acuerden las partes, por lo que dispongan las leyes especiales y, en subsidio, por las tasas que se fijen según las reglamentaciones del Banco Central. Art. 770 CCyC: no se deben intereses de los intereses, salvo las excepciones que prevé.",
    aLiquidacion:{capital:cap,intereses:total,desde:c.tramos[0].desde,hasta:c.tramos[c.tramos.length-1].hasta},
    texto:"Capital: "+pesos(cap)+"\n"+filas.map(function(f){return f[0]+": "+f[1];}).join("\n")+"\nIntereses: "+pesos(total)+"\nTotal: "+pesos(cap+total)};
}

/* ================= INDEMNIZACIÓN POR DESPIDO ================= */
function antiguedad(a,b){
  var anios=0; while(masMeses(a,12*(anios+1))<=b) anios++;
  var desdeAniv=masMeses(a,12*anios),meses=0; while(masMeses(desdeAniv,meses+1)<=b) meses++;
  return {anios:anios,meses:meses,masDeTres:masMeses(desdeAniv,3)<b};
}
function diasVacaciones(anios){ return anios<5?14:anios<10?21:anios<20?28:35; }
function calcDespido(){
  var c=CALC.despido,s=num(c.sueldo),a=fechaDe(c.ingreso),b=fechaDe(c.egreso);
  if(!(s>0)||!a||!b||b<=a) return null;
  var ant=antiguedad(a,b),computables=Math.max(1,ant.anios+(ant.masDeTres?1:0));
  var tope=num(c.tope),base=s,notaTope="";
  if(tope>0&&s>tope){
    base=Math.max(tope,s*.67);
    notaTope="La remuneración supera el tope del convenio: la base es "+pesos(base)+(base>tope?" (el 67 % de la remuneración, según la doctrina de la Corte en «Vizzoti», 2004)":" (el tope)")+".";
  }
  var dm=diasDelMes(b.getUTCFullYear(),b.getUTCMonth()),dia=b.getUTCDate();
  var rubros=[];
  function rubro(n,ley,v){ if(v>0) rubros.push([n,ley,v]); }
  rubro("Indemnización por antigüedad ("+computables+(computables===1?" año":" años")+")","art. 245 LCT",base*computables);
  var preaviso=0;
  if(c.sinPreaviso){
    // Art. 231: un mes si la antigüedad no excede de cinco años; dos meses
    // si es superior. Cinco años justos todavía es un mes.
    var masDeCinco=masMeses(a,60)<b;
    preaviso=c.prueba?s/2:(masDeCinco?2*s:s);
    rubro("Preaviso omitido ("+(c.prueba?"15 días, período de prueba":(masDeCinco?"2 meses":"1 mes"))+")","arts. 231 y 232 LCT",preaviso);
    if(c.sacRubros) rubro("SAC sobre el preaviso","art. 121 LCT",preaviso/12);
  }
  var integ=0;
  // Art. 233: no procede durante el período de prueba.
  if(c.sinPreaviso&&c.integracion&&!c.prueba&&dia<dm){
    integ=s/dm*(dm-dia);
    rubro("Integración del mes de despido ("+(dm-dia)+" días)","art. 233 LCT",integ);
    if(c.sacRubros) rubro("SAC sobre la integración","art. 121 LCT",integ/12);
  }
  rubro("Remuneración de los días trabajados del mes ("+dia+")","art. 103 LCT",s/dm*dia);
  var ini=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?0:6,1));
  if(ini<a) ini=a;
  var finSem=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?5:11,b.getUTCMonth()<6?30:31));
  var diasSem=diasEntre(new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth()<6?0:6,1)),finSem)+1;
  rubro("SAC proporcional del semestre","art. 123 LCT",s/2*(diasEntre(ini,b)+1)/diasSem);
  var iniAnio=new Date(Date.UTC(b.getUTCFullYear(),0,1)); if(iniAnio<a) iniAnio=a;
  var vacDias=diasVacaciones(antiguedad(a,new Date(Date.UTC(b.getUTCFullYear(),11,31))).anios)*(diasEntre(iniAnio,b)+1)/365;
  var vac=s/25*vacDias;
  rubro("Vacaciones no gozadas proporcionales ("+vacDias.toLocaleString("es-AR",{maximumFractionDigits:1})+" días)","arts. 150, 155 y 156 LCT",vac);
  if(c.sacRubros) rubro("SAC sobre las vacaciones","art. 121 LCT",vac/12);
  var total=rubros.reduce(function(x,r){return x+r[2];},0);
  var avisos=[];

var FORMULAS={
  vuoto:{nombre:"Vuoto",edad:65,tasa:6,cita:"«Vuoto, Dalmiro S. y otro c/ AEG Telefunken Argentina SAICI» (CNAT, Sala III, 1978)"},
  mendez:{nombre:"Méndez",edad:75,tasa:4,cita:"«Méndez, Alejandro Daniel c/ Mylba SA y otro» (CNAT, Sala III, 28/4/2008): edad límite de 75 años, tasa del 4 % y el ingreso multiplicado por 60/edad cuando la víctima tiene menos de 60 años"},
  propia:{nombre:"Personalizada",edad:null,tasa:null,cita:"Edad límite y tasa de descuento elegidas por quien calcula"}
};
function calcIncapacidad(){
  var c=CALC.incapacidad,ing=num(c.ingreso),p=num(c.porcentaje),e=num(c.edad),F=FORMULAS[c.formula];
  if(!(ing>0)||!(p>0)||!(e>0)) return null;
  var limite=F.edad||num(c.edadLimite),tasa=(F.tasa||num(c.tasa))/100;
  if(!(limite>0)||!(tasa>0)) return null;
  var n=limite-e;
  if(n<=0) return {titulo:"Capital por incapacidad",total:pesos(0),sub:"La edad supera la edad límite de la fórmula ("+limite+" años)."};
  var anual=ing*13,ajuste=(c.formula==="mendez"&&e<60)?60/e:1;
  var A=anual*ajuste*p/100,vn=Math.pow(1+tasa,-n),C=A*(1-vn)/tasa;
  return {titulo:"Capital por incapacidad · fórmula "+F.nombre,total:pesos(C),
    sub:"C = A × (1 − Vⁿ) / i, con Vⁿ = 1 / (1 + i)ⁿ",
    filas:[["Ingreso anual (13 sueldos)",pesos(anual)],
      ajuste!==1?["Ajuste por edad (60 / "+e+")",ajuste.toLocaleString("es-AR",{maximumFractionDigits:4})]:null,
      ["A · disminución anual ("+porc(p)+")",pesos(A)],
      ["n · años hasta los "+limite,String(n)],
      ["i · tasa de descuento",porc(tasa*100)]].filter(Boolean),
    avisos:["Fórmula aplicada: "+F.cita+"."],
    base:"Art. 1746 CCyC: la indemnización por lesiones o incapacidad física o psíquica debe evaluarse mediante la determinación de un capital tal que sus rentas cubran la disminución de la aptitud para realizar actividades productivas o económicamente valorables, y que se agote al término del plazo en que razonablemente pudo continuar realizándolas.",
    aLiquidacion:{capital:C},
    texto:"Fórmula "+F.nombre+": A="+pesos(A)+", n="+n+", i="+tasa+"\nCapital: "+pesos(C)};
}
function formIncapacidad(){
  var c=CALC.incapacidad;
  return '<div class="fila">'+campoC("Ingreso mensual","incapacidad.ingreso",c.ingreso,{ph:"900.000",num:true})+

}

/* Ley 27.423, art. 21: escala por tramos del monto del proceso expresado en
   UMA; el porcentaje se aplica sobre todo el monto, no por escalones. */
var ESCALA_27423=[[15,22,33],[45,20,26],[90,18,24],[150,17,22],[450,15,20],[750,13,17],[Infinity,12,15]];
function calcHonorarios(){
  var c=CALC.honorarios,m=num(c.monto);
  if(!(m>0)) return null;
  var filas=[],min,max,avisos=[],base;
  if(c.juris==="nacion"){
    var uma=num(c.uma);
    if(!(uma>0)) return {titulo:"Honorarios",total:"—",sub:"Cargue el valor vigente de la UMA para convertir el monto."};
    var enUma=m/uma,t=ESCALA_27423.filter(function(x){return enUma<=x[0];})[0];
    min=m*t[1]/100;max=m*t[2]/100;
    filas.push(["Monto del proceso",pesos(m)+" · "+enUma.toLocaleString("es-AR",{maximumFractionDigits:2})+" UMA"]);
    filas.push(["Tramo de la escala",(t[0]===Infinity?"más de 750 UMA":"hasta "+t[0]+" UMA")+" · del "+t[1]+" % al "+t[2]+" %"]);
    base="Ley 27.423 de honorarios profesionales (Nación), art. 21: escala sobre el monto del proceso expresado en UMA. Los mínimos por tipo de proceso del art. 58 no se calculan acá. Tasa de justicia: Ley 23.898, art. 2.";
  }else{
    // Ley 9131 de Mendoza, art. 2: escala por tramos del monto del proceso
    // expresado en JUS. Se aplica por tramos acumulativos: cada porcentaje
    // alcanza solo a la porción del monto que cae en su tramo.
    var jus=num(c.jus);
    if(!(jus>0)) return {titulo:"Honorarios",total:"—",sub:"Cargue el valor vigente del JUS: lo fija la Suprema Corte de Mendoza por acordada y la ley no lo contiene."};
    var enJus=m/jus,TR=[[0,20,20],[20,50,16],[50,Infinity,12]],bruto=0;
    TR.forEach(function(t){
      var porcion=Math.max(0,Math.min(enJus,t[1])-t[0]);
      if(porcion>0){
        var v=porcion*jus*t[2]/100; bruto+=v;
        filas.push(["Tramo "+(t[1]===Infinity?"más de "+t[0]:(t[0]?"más de "+t[0]+" a ":"hasta ")+t[1])+" JUS · "+t[2]+" %",
          porcion.toLocaleString("es-AR",{maximumFractionDigits:2})+" JUS · "+pesos(v)]);
      }
    });
    var mer=num(c.merito)||0,f=bruto;
    if(mer>0){ f=f*(1+Math.min(mer,30)/100); filas.push(["Aumento por mérito de la labor (art. 2, hasta 30 %)","+"+porc(Math.min(mer,30))]); }
    if(c.rol==="perdedor"){ f=f*.7; filas.push(["Abogado de la parte perdedora (art. 3)","70 % de lo que corresponde al de la ganadora"]); }
    if(c.proceso==="monitorio"){ f=f*.75; filas.push(["Proceso monitorio sin oposición (art. 7)","reducción del 25 %"]); }
    if(c.proceso==="sucesion"){ f=f*.7; filas.push(["Sucesión (art. 8)","reducción del 30 %"]); }
    if(c.procurador){ f=f*.5; filas.push(["Procurador, primera instancia (art. 31)","50 % del honorario del abogado"]); }
    min=f;max=f;
    filas.unshift(["Monto del proceso",pesos(m)+" · "+enJus.toLocaleString("es-AR",{maximumFractionDigits:2})+" JUS"]);
    base="Ley 9131 de Mendoza (aranceles de abogados y procuradores): art. 2 (escala: hasta 20 JUS, 20 %; más de 20 y hasta 50 JUS, 16 %; más de 50 JUS, 12 %; aumento de hasta 30 % por mérito), art. 3 (parte perdedora, 70 %), art. 7 (monitorio sin oposición, reducción del 25 %), art. 8 (sucesiones, reducción del 30 %) y art. 31 (procurador, 50 % en primera instancia y 30 % en las demás). El valor del JUS lo fija la Suprema Corte. Los mínimos por tipo de proceso (arts. 9 a 19), los honorarios de segunda instancia (art. 15) y los incidentes (art. 14) no se calculan acá.";
    avisos.push("La escala se aplica por tramos acumulativos; verifique ese criterio con la regulación del juzgado.");
  }
  if(min===max) filas.push(["Honorarios",pesos(min)+(c.iva?" + IVA "+pesos(min*.21):"")]);
  else{
    filas.push(["Honorarios mínimos",pesos(min)+(c.iva?" + IVA "+pesos(min*.21):"")]);
    filas.push(["Honorarios máximos",pesos(max)+(c.iva?" + IVA "+pesos(max*.21):"")]);
  }
  var tp=num(c.tasaPct);
  if(tp>0) filas.push(["Tasa de justicia ("+porc(tp)+")",pesos(m*tp/100)]);
  avisos.push("El monto definitivo lo regula el juez dentro de la escala, según la labor, el resultado y la complejidad.");
  return {titulo:"Honorarios según la escala",total:(min===max?pesos(min):pesos(min)+" a "+pesos(max)),sub:c.iva?"Más IVA (21 %) por ser responsable inscripto":"",
    filas:filas,avisos:avisos,base:base,aLiquidacion:{honorarios:max,iva:c.iva,tasa:tp>0?m*tp/100:0},
    texto:filas.map(function(f){return f[0]+": "+f[1];}).join("\n")};
}

function calcLiquidacion(){
  var c=CALC.liquidacion,cap=num(c.capital);
  if(!(cap>0)) return null;
  var it=num(c.intereses)||0,h=num(c.honorarios)||0,iva=c.iva?h*.21:0,t=num(c.tasa)||0,o=num(c.otros)||0;
  var d=fechaDe(c.desde),hh=fechaDe(c.hasta);
  var filas=[["Capital",pesos(cap)]];
  if(it) filas.push(["Intereses"+(d&&hh?" (del "+fechaCorta(d)+" al "+fechaCorta(hh)+")":""),pesos(it)]);
  filas.push(["Subtotal",pesos(cap+it)]);
  if(h) filas.push(["Honorarios",pesos(h)]);
  if(iva) filas.push(["IVA sobre honorarios (21 %)",pesos(iva)]);
  if(t) filas.push(["Tasa de justicia",pesos(t)]);
  if(o) filas.push(["Otros rubros",pesos(o)]);
  var total=cap+it+h+iva+t+o;
  var ancho=46;
  var texto="PLANILLA DE LIQUIDACIÓN\n\n"+filas.map(function(f){
    var a=f[0]+" ",b=" "+f[1];return a+new Array(Math.max(2,ancho-a.length-b.length)).join(".")+b;
  }).join("\n")+"\n"+"TOTAL "+new Array(Math.max(2,ancho-7-pesos(total).length)).join(".")+" "+pesos(total);
  return {titulo:"Planilla de liquidación",total:pesos(total),filas:filas,
    avisos:["Revise la planilla contra la sentencia: los rubros, las fechas de mora y la tasa los fija la resolución que se ejecuta."],
    texto:texto};
}

var JURIS=[["nacion","Nación"],["caba","Ciudad de Buenos Aires"],["mendoza","Mendoza"]];
function calcProcesales(){
  var c=CALC.procesales,n=parseInt(c.dias,10),d=fechaDe(c.notif);
  if(!d||!(n>0)) return null;
  var vence,saltados=[];
  if(c.tipo==="habiles"){
    var x=d,cont=0;
    while(cont<n){ x=masDias(x,1); var mot=motivoInhabil(x,c.juris); if(mot){ if(mot!=="Fin de semana") saltados.push([x,mot]); continue; } cont++; }
    vence=x;
  }else vence=masDias(d,n);
  var gracia=siguienteHabil(vence,c.juris);
  var filas=[["Notificación",fechaLarga(d)],
    ["Plazo",n+(c.tipo==="habiles"?" días hábiles judiciales":" días corridos")+" · desde el día siguiente"],
    ["Plazo de gracia","hasta las dos primeras horas del despacho del "+fechaLarga(gracia)]];
  saltados.forEach(function(s){ filas.push(["No se computa · "+fechaCorta(s[0]),esc(s[1])]); });
  var avisos=[];
  if(c.tipo==="corridos"&&motivoInhabil(vence,c.juris)) avisos.push("El vencimiento cae en un día inhábil: verifique si la norma del plazo lo traslada al día hábil siguiente.");
  avisos.push("Se descuentan los fines de semana, los feriados nacionales"+(c.juris==="mendoza"?" y provinciales":"")+" y los días inhábiles cargados en el calendario (ferias y asuetos). Los días no laborables con fines turísticos y las ferias se fijan cada año por decreto y por acordada: cárguelos si corresponden.");
  return {titulo:"Vencimiento del plazo",total:fechaLarga(vence),
    sub:"Con plazo de gracia: "+fechaLarga(gracia)+", dos primeras horas",
    filas:filas,avisos:avisos,
    base:"El plazo comienza a correr desde el día siguiente al de la notificación y se computan solo los días hábiles judiciales (art. 156 CPCCN y normas procesales locales equivalentes). El escrito puede presentarse válidamente dentro de las dos primeras horas del despacho del día hábil siguiente al del vencimiento (art. 124 CPCCN).",
    texto:"Notificación: "+fechaCorta(d)+"\nPlazo: "+n+(c.tipo==="habiles"?" días hábiles":" días corridos")+"\nVence: "+fechaLarga(vence)+"\nPlazo de gracia: dos primeras horas del "+fechaLarga(gracia)};
}

    '<fieldset class="grupo" style="border:0;padding:0;margin:0"><legend class="busq-rotulo">Cómo se cuenta</legend>'+

/**
 * Estira el listado de ramas de la izquierda (.rail-list, "Buscar rama...")
 * para que termine justo a la altura de lo que hay al lado, en vez de un
 * porcentaje fijo de la pantalla (62vh) que no tiene ninguna relación con
 * ese contenido: según la ventana, el listado quedaba cortado bastante antes
 * de la línea de abajo del panel, o se pasaba de largo — un desalineado que
 * se notaba apenas se miraba la barra de scroll dorada al lado del recuadro.
 *
 * Se mide en JS y no con CSS porque son dos cajas SIN relación de padres e
 * hijos (una está en #rail, la otra en #vista): CSS Grid puede igualar la
 * altura de las dos COLUMNAS enteras, pero no la de un elemento cualquiera
 * de una columna contra un elemento cualquiera de la otra.
 *
 * Solo dos solapas, no las cuatro que muestran este listado (ver sinRail
 * más arriba):
 *
 *   - Buscar: se mide contra #panel-buscar-form, el único panel de la
 *     solapa.
 *   - Guardados: se mide contra el último ".blk" de #vista (son siempre
 *     tres, en el mismo orden — pasajes, fuentes, historial —, así que "el
 *     último" es siempre "Búsquedas de esta sesión"). Mismo problema que en
 *     Buscar: con poco guardado, el listado de ramas se pasaba de largo por
 *     debajo de esas tres cajas.
 *   - Ramas y Fuentes quedan AFUERA a propósito, no por descuido: ahí no hay
 *     un panel acotado con el que alinearse, es una lista larga de verdad
 *     (28 ramas, 106 fuentes) que va a seguir siendo más alta que la
 *     pantalla sea cual sea su ancho. Estirar el listado para que "llegue
 *     hasta el final" ahí lo volvería una columna gigantesca y le sacaría
 *     la gracia a que quede fijo arriba mientras se recorre la lista larga:
 *     el 62vh en esas dos no es el mismo error, es lo que mantiene el
 *     filtro usable.
 *
 * Y solo tiene sentido en el layout de dos columnas: pasados los 860px de
 * ancho (media query de acá arriba) el listado de ramas se acuesta en una
 * fila horizontal arriba del contenido, sin "línea de abajo" con la que
 * alinearse.
 */
function ajustarAlturaRail(){
  var lista=document.getElementById("listaRamas");
  if(!lista) return;

  var objetivo=null;
  if(estado.tab==="buscar"){
    objetivo=document.getElementById("panel-buscar-form");
  }else if(estado.tab==="guardados"){
    var bloques=document.querySelectorAll("#vista > .blk");
    objetivo=bloques[bloques.length-1]||null;
  }

  if(!objetivo||window.innerWidth<=860){
    lista.style.maxHeight=""; // vuelve al 62vh fijo de la hoja de estilos
    return;
  }
  var alto=objetivo.getBoundingClientRect().bottom-lista.getBoundingClientRect().top;
  lista.style.maxHeight=Math.max(120,Math.round(alto))+"px";
}
// La ventana se puede ensanchar o angostar sin que nada más cambie de

/**
 * Evita que tocar el TEXTO de una etiqueta ("Excluir palabras", "Tipo de
 * cita", "De dónde lo sacaste (opcional, va en la cita)"...) le mande el
 * cursor al campo de al lado, como si se hubiera tocado el recuadro.
 *
 * Cada <label class="campo"> envuelve junto el texto descriptivo y su
 * input/select —así el lector de pantalla asocia uno con otro, y clickear
 * el input funciona como siempre—, pero eso es justo lo que hace que el
 * navegador reenvíe un click en CUALQUIER otra parte del label —el texto de
 * arriba, el espacio entre el texto y el campo— como si hubiera sido un
 * click directo en el input: aparece el cursor titilando ahí, sin haber
 * tocado el recuadro. Con una etiqueta larga como la de "De dónde lo
 * sacaste" ese "cualquier otra parte" es casi toda el área visible del
 * campo — de ahí que pasara con cualquier texto que se tocara.
 *
 * preventDefault() en el click, cuando lo que se tocó es el <span> del
 * texto (no el propio input/select), corta ESE reenvío puntual sin romper
 * la asociación: el campo se sigue enfocando al clickearlo directamente, y
 * un lector de pantalla lo sigue anunciando con su nombre.
 */
document.addEventListener("click",function(ev){
  var etiqueta=ev.target.closest&&ev.target.closest(".campo>span");
  if(etiqueta) ev.preventDefault();
});

document.addEventListener("click",function(ev){
  var t=ev.target;
  var b=t.closest?t.closest("[data-act],[data-tab],[data-rama]"):null;
  if(!b) return;

  if(b.hasAttribute("data-tab")){ estado.tab=b.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }

  var act=b.getAttribute("data-act");

  if(b.hasAttribute("data-rama")&&act!=="ir-rama"){
    estado.rama=b.getAttribute("data-rama")||""; render(); return;
  }
  if(act==="ir-rama"){ estado.rama=b.getAttribute("data-rama")||""; estado.tab="buscar"; render(); window.scrollTo(0,0); return; }

  if(act==="modo"){ estado.modo=b.getAttribute("data-modo"); render(); return; }
  if(act==="amb"){
    var k=b.getAttribute("data-amb");
    estado.ambitos[k]=!estado.ambitos[k];
    if(!Object.keys(estado.ambitos).some(function(x){return estado.ambitos[x];})){
      estado.ambitos[k]=true; flash("Deje al menos un ámbito activo");
    }
    render(); return;
  }
  if(act==="comparar"){ compararFuentes(); return; }
  if(act==="ir-a-fuente"){
    // Del comparador al buscador normal, con esa fuente ya buscada: es el
    // paso natural cuando una de las seis tiene lo que se estaba buscando.
    var slugIr=b.getAttribute("data-fuente");
    estado.tab="buscar"; render(); window.scrollTo(0,0);
    buscarEnFuente(slugIr);
    return;
  }
  if(act==="ver-articulo"){
    var sel=document.getElementById("norma-clave"), inp=document.getElementById("norma-art");
    if(sel) estado.norma.clave=sel.value;
    if(inp) estado.norma.art=inp.value.trim();
    // Se acepta escrito como se escribe de verdad ("art 1741 CCyC", "artículo
    // 70 del código civil y comercial", "LCT 245"): el parser saca el número
    // y, si se nombró la norma, la elige sola. Ver parsearReferencia.
    var ref=parsearReferencia(estado.norma.art);
    if(ref.clave) estado.norma.clave=ref.clave;
    if(!ref.art){ flash("No se encontró un número de artículo en lo escrito"); return; }
    estado.norma.num=ref.art;
    if(!estado.api){ flash("Para traer el texto oficial hace falta el servidor"); return; }
    estado.norma.cargando=true; estado.norma.error=null; estado.norma.salida=null; render();
    fetch(estado.api+"/legislacion/"+encodeURIComponent(estado.norma.clave)+"/"+encodeURIComponent(ref.art))
      .then(function(r){ return r.json(); })
      .then(function(d){
        estado.norma.cargando=false;
        if(d&&d.ok){ estado.norma.salida=d; }
        else{ estado.norma.error=(d&&d.mensaje)||"El servidor no devolvió el artículo."; }
        render();
      })["catch"](function(){
        estado.norma.cargando=false;
        estado.norma.error="Se cortó la comunicación con el servidor.";
        render();
      });
    return;
  }
  if(act==="fallos-del-articulo"){
    // No se arma una consulta acá: se guarda el NÚMERO y cada buscador recibe
    // la forma que él entiende ("art 1741" a Mendoza, "artículo 1741" a la
    // Corte). La diferencia medida es de 84 resultados contra 0 — ver
    // COMO_SE_CITA en backend/lib/fuentes.js.
    var d=estado.norma.salida; if(!d) return;
    estado.q="art. "+d.articulo+" "+d.sigla;
    estado.articulo=d.articulo; estado.articuloNorma=estado.norma.clave;
    estado.articuloTema=d.rubrica||"";
    estado.modo="todas"; estado.tab="buscar";
    render(); window.scrollTo(0,0);
    flash("Toque una fuente abajo: a cada una se le pregunta como ella entiende");
    return;
  }
  if(act==="compartir-fallo"){
    var fSlug=b.getAttribute("data-fuente"), rid=b.getAttribute("data-id");
    var im2=estado.indices[fSlug];
    var reg=(im2&&im2.resultados||[]).filter(function(x){return String(x.id)===rid;})[0];
    if(reg) abrirCompartir(b, textoDeFallo(reg,fSlug), reg.linkFicha||reg.linkFallo||location.href);
    return;
  }
  if(act==="compartir-pasaje"){
    var pp=estado.pasajes[Number(b.getAttribute("data-i"))];
    if(pp) abrirCompartir(b, '"'+String(pp.t).slice(0,600)+'"'+(pp.r?"\n\n(búsqueda: "+pp.r+")":""), pp.url||location.href);
    return;

  if(act==="compartir-lector"){

    abrirCompartir(b, cuerpoL, estado.fuenteDe||location.href);
    return;
  }
  if(act==="compartir"){ menuCompartir(b,textoCompartir(),location.href); return; }
  if(act==="copiar-link"){
    // La URL ya está al día: guardarEnURL() corre al final de cada render.
    var link=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){ flash("Link copiado — se abre con esta misma búsqueda"); })

  if(act==="tramite"){

  if(act==="anillo-guardar"){

    var can=String(na.canonico||"").trim();
    var eq=partir(na.equivalentes);
    if(!can||!eq.length){ flash("Faltan el término y al menos una forma equivalente"); return; }
    // La misma regla del tesauro, también acá: nada puede ser equivalente y
    // cercano a la vez. El servidor lo vuelve a verificar igual.
    var enEq={}; enEq[sinTildes(can)]=1; eq.forEach(function(t){ enEq[sinTildes(t)]=1; });
    var rel=partir(na.relacionados).filter(function(t){ return !enEq[sinTildes(t)]; });
    estado.anillos=[{canonico:can,equivalentes:eq,relacionados:rel,
      nota:String(na.nota||"").trim()||null,rama:null,desde:null,

      estado.anillos.filter(function(a){ return sinTildes(a.canonico)!==sinTildes(can); }));

  }
  if(act==="req-tilde"||act==="req-reiniciar"){
    var rid=b.getAttribute("data-req");
    estado.reqHecho=estado.reqHecho||{};
    if(act==="req-reiniciar") delete estado.reqHecho[rid];
    else{
      var hr=estado.reqHecho[rid]=estado.reqHecho[rid]||{},ri=b.getAttribute("data-i");
      if(hr[ri]) delete hr[ri]; else hr[ri]=true;
    }
    store.set("jedj:requisitos",estado.reqHecho);
    render(); return;
  }
  if(act==="verificar-cita"){ verificarCitaPegada(); return; }
  if(act==="copiar-constancia"){
    var kc=datosConstancia();
    if(kc) copiar(["Constancia de verificación — IVS CODEX",
      "Cita consultada: "+kc.cita,
      "Coincidencia: "+kc.caratula+(kc.meta?" — "+kc.meta:""),
      kc.link?"Documento oficial: "+kc.link:"",
      "Bases consultadas: "+kc.bases,
      "Fecha de consulta: "+kc.fecha,
      "Veredicto: coincidencia encontrada"+(kc.confianza?" (confianza "+kc.confianza+")":"")+".",
      "Acredita la coincidencia con un registro oficial a la fecha indicada; no sustituye la lectura de los considerandos."
    ].filter(Boolean).join("\n"));
    return;
  }
  if(act==="limpiar-cita"){
    estado.cita={texto:"",cargando:false,error:null,salida:null};
    render(); window.scrollTo(0,0); return;
  }
  if(act==="armar-cita"){ armarCita(); return; }
  if(act==="copiar-cita"){
    var o=document.getElementById("cita-out");
    copiar(o?o.textContent.trim():""); return;
  }

  /* ---- lector ---- */
  if(act==="traer-link"){
    var iu=document.getElementById("doc-url");
    var link=iu?iu.value.trim():"";
    if(!link){ flash("Pegue el enlace del fallo"); return; }
    traerDocEnLector(link);
    return;
  }
  if(act==="aplicar-ocr"){
    if(estado.cargandoOcr) return; // ya hay uno en camino, no duplicar el pedido
    var urlOcr=b.getAttribute("data-url");
    if(urlOcr) traerOcrEnLector(urlOcr,estado.errorLink&&estado.errorLink.opciones);
    else if(estado.errorLink&&estado.errorLink.archivo) traerOcrDeArchivo(estado.errorLink.archivo);
    return;
  }
  if(act==="descargar-y-lector"){
    var urlBajar=b.getAttribute("data-url");
    if(!urlBajar) return;
    // El mismo click que ya hacía el link viejo, hecho a mano: un <a> real,
    // agregado al documento y clickeado. El servidor de CABA manda
    // "Content-Disposition: attachment" (ver la nota en fichaIndice), así
    // que esto dispara la descarga sola — no hace falta el atributo
    // "download" ni que este sitio toque el archivo para nada.
    var enlace=document.createElement("a");
    enlace.href=urlBajar; enlace.target="_blank"; enlace.rel="noopener noreferrer";
    document.body.appendChild(enlace); enlace.click(); enlace.remove();

    // Un solo click de la persona, dos pasos para la app: primero la
    // descarga (arriba) y ahora saltar al Lector con el selector YA abierto.
    // El picker de archivo pedir un click propio no es un capricho de este
    // sitio: es el navegador protegiendo el disco de la persona, y ningún
    // sitio puede leer un archivo que se acaba de bajar sin que alguien lo
    // elija a mano. Esto acerca lo más posible: cuando se cierra el diálogo
    // "Guardar", el archivo casi siempre queda arriba de todo en Descargas.
    estado.tab="lector"; render();
    var inpDesc=document.getElementById("doc-archivo");
    if(inpDesc) inpDesc.click();
    flash("El fallo se está descargando — elíjalo en el selector para verlo aquí con su búsqueda marcada");
    return;
  }
  if(act==="elegir-archivo"){
    var inpArch=document.getElementById("doc-archivo");
    if(inpArch) inpArch.click();
    return;
  }
  if(act==="analizar"){
    var ta=document.getElementById("doc-in"),de=document.getElementById("doc-de");
    var txt=ta?ta.value:"";
    if(!txt||txt.trim().length<40){ flash("Pegue el texto del fallo primero"); return; }
    if(txt.length>2000000){ txt=txt.slice(0,2000000); flash("El fallo era enorme: se cargaron los primeros 2 millones de caracteres"); }
    estado.texto=txt; estado.fuenteDe=de?de.value.trim():""; estado.marca=0; estado.fichaConocida=null;
    render(); window.scrollTo(0,0); return;
  }
  if(act==="doc-otro"){ estado.texto=""; estado.fuenteDe=""; estado.marca=0; estado.infoDoc=null; estado.fichaConocida=null; estado.errorLink=null; render(); window.scrollTo(0,0); return; }
  if(act==="ir-marca"){
    estado.marca=parseInt(b.getAttribute("data-i"),10)||0;
    irAMarca(true); conteoLector(coincidencias(estado.texto));
    return;
  }
  if(act==="marca-sig"||act==="marca-ant"){
    var cs2=coincidencias(estado.texto),total=Math.min(cs2.length,TOPE_MARCAS);
    if(!total){ flash("No hay coincidencias para recorrer"); return; }
    estado.marca=(estado.marca+(act==="marca-sig"?1:-1)+total)%total;
    irAMarca(true); conteoLector(cs2);
    return;
  }
  if(act==="tog-parcial"){ estado.parcial=!estado.parcial; estado.marca=0; pintarLector();
    var bp=document.querySelector('[data-act="tog-parcial"]');
    if(bp){ bp.setAttribute("aria-pressed",estado.parcial?"true":"false");
            bp.textContent=estado.parcial?"Palabra parcial: sí":"Palabra parcial: no"; }
    return; }
  if(act==="meta-a-cita"){
    var dd=datosDoc(estado.texto||"");
    estado.tab="citas"; render();
    function pon(id,v){ var e=document.getElementById(id); if(e&&v) e.value=v; }
    pon("c-tipo",dd.tipo||"cam"); pon("c-car",dd.car); pon("c-trib",dd.sala||dd.trib);
    pon("c-fecha",dd.fecha); pon("c-tomo",dd.tomo); pon("c-pag",dd.pag); pon("c-exp",dd.exp);
    armarCita(); window.scrollTo(0,0); return;
  }
  if(act==="copiar-doc-cita"){ copiar(citaDelDoc()); return; }
  if(act==="pas-compartir"){
    var contC=document.getElementById("pasajes");
    var pc=(contC&&contC._ps?contC._ps:[])[parseInt(b.getAttribute("data-i"),10)];
    if(!pc){ flash("No se pudo recuperar ese pasaje"); return; }
    abrirCompartir(b,'«'+pc.txt+'»\n'+citaDelDoc(),estado.fuenteDe||location.href);
    return;
  }
  if(act==="pas-copiar"||act==="pas-cita"||act==="pas-guardar"){
    var cont=document.getElementById("pasajes");
    var ps=cont&&cont._ps?cont._ps:[];
    var p=ps[parseInt(b.getAttribute("data-i"),10)];
    if(!p){ flash("No se pudo recuperar ese pasaje"); return; }
    if(act==="pas-copiar"){ copiar(p.txt); return; }
    var bloque=citaDelDoc()+"\n«"+p.txt+"»\n(consultado el "+hoy()+(estado.fuenteDe?" en "+estado.fuenteDe:"")+")";
    if(act==="pas-cita"){ copiar(bloque); return; }
    // Guarda de dónde salió (para "Ver el original" y "Abrir en el Lector")
    // y con qué búsqueda estaba resaltado (para que, al reabrirlo, la cita
    // vuelva a marcarse igual). Un pasaje pegado a mano sin URL de origen
    // guarda url:"" — no hay adónde volver, y la vista lo dice.
    estado.pasajes=[{t:bloque,r:cadena(),url:estado.fuenteDe||"",q:estado.q,modo:estado.modo}]
      .concat(estado.pasajes).slice(0,60);
    store.set("jedj:pasajes",estado.pasajes);
    guardarEnCuenta();
    flash("Pasaje guardado · "+estado.pasajes.length+" en total");
    return;
  }
  if(act==="pasajes-copiar"){
    copiar(estado.pasajes.map(function(x){return x.t;}).join("\n\n———\n\n")); return;
  }
  if(act==="pasajes-borrar"){
    estado.pasajes=[]; store.set("jedj:pasajes",[]); guardarEnCuenta(); render(); return;
  }
  if(act==="pasaje-a-lector"){
    var pl=estado.pasajes[parseInt(b.getAttribute("data-i"),10)];
    if(!pl){ flash("No se pudo recuperar ese pasaje"); return; }
    if(!pl.url){ flash("Este pasaje se pegó a mano: no tiene un enlace de origen al que volver."); return; }
    traerDocEnLector(pl.url,{qRestaurar:pl.q,modoRestaurar:pl.modo});
    return;
  }
  if(act==="tog-frag"){ estado.resaltarFuente=!estado.resaltarFuente; render(); return; }
},false);

/* inputs */
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="q"){
    // Escribir a mano en el campo deja de ser "los fallos que citan el
    // artículo N" y pasa a ser una búsqueda común: lo que se ve es lo que se
    // busca, sin una traducción por fuente actuando por detrás.
    estado.q=ev.target.value; estado.articulo=""; estado.articuloNorma=""; estado.articuloTema=""; estado.marca=0; pintarCadena();
    if(estado.tab==="buscar") recalcularSugeridas();
    if(estado.tab==="lector"){
      if(estado.texto.length<150000){ pintarLector(); }
      else { clearTimeout(window._tl); window._tl=setTimeout(pintarLector,170); }
    }
  }
  else if(id.indexOf("an-")===0){
    var campo=id.slice(3);
    if(campo==="canonico"||campo==="equivalentes"||campo==="relacionados"||campo==="nota"){
      estado.nuevoAnillo[campo]=ev.target.value;  // sin repintar: le sacaría el foco
    }
  }
  else if(id==="buscarReq"){
    estado.buscarReq=ev.target.value; render();
    var cr=document.getElementById("buscarReq");
    if(cr){ cr.focus(); cr.setSelectionRange(cr.value.length,cr.value.length); }
  }
  else if(id==="buscarRama"){
    estado.buscarRama=ev.target.value;
    var lr=document.getElementById("listaRamas");
    if(lr) lr.innerHTML=listaRamasHTML();
  }
  else if(id==="auth-email"){estado.authEmail=ev.target.value;}
  // Se guarda sin repintar: un render() acá le sacaría el foco al textarea
  // en mitad de la frase. El repintado llega solo cuando se toca "Verificar".
  else if(id==="cita-in"){estado.cita.texto=ev.target.value;}
  else if(id==="excluir"){estado.excluir=ev.target.value;pintarCadena();}
  else if(id==="desde"){estado.desde=ev.target.value;pintarCadena();invalidarBusquedas();}
  else if(id==="hasta"){estado.hasta=ev.target.value;pintarCadena();invalidarBusquedas();}
},false);

/* Archivo elegido en el Lector: se manda tal cual al servidor, que decide
   como leerlo por la firma de los bytes (PDF o .doc), no por la extensión.
   El archivo no se guarda en ningún lado: se lee y vuelve como texto. */
document.addEventListener("change",function(ev){
  if(ev.target&&ev.target.id==="norma-clave"){ estado.norma.clave=ev.target.value; return; }
  if(!ev.target||ev.target.id!=="doc-archivo") return;
  var arch=ev.target.files&&ev.target.files[0];
  if(!arch) return;
  ev.target.value=""; // permite volver a elegir el mismo archivo
  if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }

  estado.cargando=true; estado.errorLink=null; render();
  fetch(estado.api+"/extraer-archivo",{
    method:"POST",
    headers:{"Content-Type":arch.type||"application/octet-stream",
             "X-Nombre-Archivo":arch.name.replace(/[^\x20-\x7E]/g,"")},
    body:arch
  }).then(function(r){ return r.json(); })
    .then(function(d){
      estado.cargando=false;
      if(!d||!d.ok){
        // Si es un escaneo, se guarda el propio archivo (un File es
        // inmutable, no hace falta releerlo) para poder ofrecer "Aplicar
        // OCR" sin pedir que lo vuelva a elegir — ver avisoErrorLector().
        estado.errorLink={mensaje:(d&&d.mensaje)||"No se pudo leer el archivo.",
          ayuda:(d&&d.codigo)==="PDF_ESCANEADO"
            ?"Es una foto del papel, sin texto adentro. Toque «Aplicar OCR» aquí abajo."
            :"Se leen PDF y .doc de Word. Si es otro formato, ábralo y pegue el texto a mano.",
          codigo:d&&d.codigo,archivo:(d&&d.codigo)==="PDF_ESCANEADO"?arch:null};
        render(); return;
      }
      estado.texto=d.texto;
      estado.fuenteDe=""; // no hay enlace: el origen es un archivo propio
      estado.infoDoc=d;
      estado.fichaConocida=null;
      estado.marca=0;
      render(); window.scrollTo(0,0);
      flash(arch.name+" · "+d.palabras.toLocaleString("es-AR")+" palabras");
    })["catch"](function(){
      estado.cargando=false;
      estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                        ayuda:"Si el archivo es muy grande puede haberse pasado del límite."};
      render();
    });
},false);

/* Enter: en Buscar lanza el barrido, en el Lector salta a la coincidencia siguiente */

function armarCita(){
  function val(id){var e=document.getElementById(id);return e?String(e.value).trim():"";}

/* ============================================================
   9. Arranque
   ============================================================ */
/* Los separadores "·" del texto, a la mitad de la altura de las palabras.
   Recorre los textos de la página y, cada vez que aparece algo nuevo (todo
   se redibuja con innerHTML), envuelve cada "·" en <span class="pm">. El
   texto no cambia: copiar o buscar sigue viendo el mismo carácter. */
(function(){
  var SALTAR={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1,NOSCRIPT:1};
  function envolver(raiz){
    if(!raiz||raiz.nodeType===8) return;
    if(raiz.nodeType===3){ partir(raiz); return; }
    if(raiz.nodeType!==1||SALTAR[raiz.tagName]||(raiz.classList&&raiz.classList.contains("pm"))) return;
    var w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(n.nodeValue.indexOf("\u00b7")===-1) return NodeFilter.FILTER_REJECT;
      var p=n.parentNode;
      return (p&&(SALTAR[p.tagName]||(p.classList&&p.classList.contains("pm"))))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
    }}),lista=[],n;
    while((n=w.nextNode())) lista.push(n);
    lista.forEach(partir);
  }
  function partir(n){
    var p=n.parentNode;
    if(!p||n.nodeValue.indexOf("\u00b7")===-1||SALTAR[p.tagName]||(p.classList&&p.classList.contains("pm"))) return;
    var trozos=n.nodeValue.split("\u00b7"),f=document.createDocumentFragment();
    trozos.forEach(function(t,i){
      if(i){ var s=document.createElement("span"); s.className="pm"; s.textContent="\u00b7"; f.appendChild(s); }
      if(t) f.appendChild(document.createTextNode(t));
    });
    p.replaceChild(f,n);
  }
  envolver(document.body);
  new MutationObserver(function(ms){
    ms.forEach(function(m){ for(var i=0;i<m.addedNodes.length;i++) envolver(m.addedNodes[i]); });
  }).observe(document.body,{childList:true,subtree:true});
})();
