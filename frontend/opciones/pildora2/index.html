<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barra de abajo · segunda tanda</title>
<style>
:root{--bg:#100e0b;--fg:#f1eee6;--mute:#9a9588;--gold:#d9a31b}
*{box-sizing:border-box}
body{margin:0;background:var(--x100e0b,#0b0a08);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:28px 16px 60px}
h1{font:500 22px/1.2 system-ui;margin:0 0 6px}p.s{color:var(--mute);margin:0 0 24px}
.fila{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.op{width:300px}.op h2{font:600 13px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.op p{color:var(--mute);font-size:13px;margin:0 0 12px}
.tel{position:relative;height:520px;border-radius:34px;border:1px solid var(--x1e1a14,#2a261e);overflow:hidden;
 background:radial-gradient(70% 40% at 25% 45%,rgba(var(--gold-rgb,217,163,27),.35),transparent 70%),radial-gradient(60% 40% at 85% 70%,rgba(70,140,150,.35),transparent 70%),radial-gradient(60% 30% at 40% 95%,rgba(150,70,60,.3),transparent 70%),var(--bg)}
.tel .txt{padding:26px 22px;color:#cfc9bb}.tel .txt b{display:block;font:600 34px/1.1 system-ui;color:var(--fg);margin-bottom:12px}
.tel .caja{margin:14px 22px;height:70px;border:1px dashed #4a4333;border-radius:18px;background:rgba(var(--fg-rgb,241,238,230),.03)}
nav{position:absolute;z-index:2}
nav button{appearance:none;border:0;background:none;color:#b9b4a6;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vid{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 55%,rgba(255,255,255,.1));
 -webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.1);backdrop-filter:blur(18px) saturate(1.9) brightness(1.1);
 border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -8px 16px rgba(255,255,255,.04),0 18px 40px rgba(0,0,0,.5)}
/* D · gigante, puntito debajo */
.D nav{left:10px;right:10px;bottom:14px;height:82px;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.D nav button{height:100%;display:flex;align-items:center;justify-content:center;border-radius:999px}
.D nav svg{width:29px;height:29px}
.D nav button::after{content:"";position:absolute;bottom:13px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:0;transform:scale(.3);transition:.35s}
.D nav .on{color:#fff}.D nav .on::after{opacity:1;transform:none}.D nav .on svg{filter:drop-shadow(0 0 8px rgba(var(--gold-rgb,217,163,27),.6))}
/* E · lente de vidrio que se desliza */
.E nav{left:12px;right:12px;bottom:14px;height:72px;border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr)}
.E nav button{z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 10.5px/1 system-ui;letter-spacing:.04em}
.E nav button.on{color:var(--gold)}
.E nav svg{width:24px;height:24px}
.E .lente{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.5);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.34,1.45,.5,1)}
/* F · dos piezas */
.F nav{left:12px;right:12px;bottom:14px;display:flex;gap:10px;align-items:center}
.F .corp{flex:1;height:62px;border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
.F .corp button,.F .ais{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 10px/1 system-ui;letter-spacing:.04em}
.F .corp .on{color:var(--gold)}.F .corp .on svg{filter:drop-shadow(0 0 7px rgba(var(--gold-rgb,217,163,27),.55))}
.F .ais{width:62px;height:62px;flex:none;border-radius:50%;color:var(--gold)}
.F .ais svg{width:26px;height:26px}
</style><script src="../tema.js"></script></head><body>
<h1>Barra de abajo · segunda tanda</h1><p class="s">Más vidrio, más alta, y composiciones distintas. Tocá los íconos.</p>
<div class="fila" id="f"></div>
<script>
const I={b:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',l:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 16h6"/>',c:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7h7M9 12h1M12 12h1M15 12h1M9 16h1M12 16h1M15 16h1"/>',p:'<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>',m:'<path d="M5 8h14M5 12h14M5 16h14"/>',x:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'};
const N={b:'Buscar',l:'Lector',c:'Cálculos',p:'Perfil',m:'Más',x:'Lexia'};
const bt=(k,on,lab)=>'<button data-k="'+k+'" class="'+(on?'on':'')+'"><svg viewBox="0 0 24 24">'+I[k]+'</svg>'+(lab?'<span>'+N[k]+'</span>':'')+'</button>';
const head=(k,t,d)=>'<h2>Opción '+k+'</h2><p><b style="color:var(--xf1eee6,#f1eee6)">'+t+'.</b> '+d+'</p>';
const tel=n=>'<div class="tel"><div class="txt"><b>Buscar.</b>Búsqueda irrestricta · Todas las bases, jurisdicciones y períodos.</div><div class="caja"></div><div class="caja" style="height:130px"></div>'+n+'</div>';
const f=document.getElementById('f');
const add=(k,h,n)=>{const o=document.createElement('div');o.className='op '+k;o.innerHTML=head(...h)+tel(n);f.appendChild(o)};
add('D',['D','Gigante y transparente','Una píldora alta, casi sin color, con mucho brillo en el borde. Sólo íconos grandes; la sección activa se marca con una lucecita dorada debajo.'],
 '<nav class="vid">'+['b','l','c','p','m'].map((k,i)=>bt(k,i==0)).join('')+'</nav>');
add('E',['E','El cristal que se desliza','Un lente de vidrio brillante se mueve de una sección a otra con un pequeño rebote, y el ícono que queda dentro se pinta de dorado.'],
 '<nav class="vid"><i class="lente"></i>'+['b','l','c','p','m'].map((k,i)=>bt(k,i==0,1)).join('')+'</nav>');
add('F',['F','Píldora y gota aparte','Cuatro secciones en una píldora, y Lexia en una gota de vidrio separada a la derecha, siempre a mano.'],
 '<nav><div class="corp vid">'+['b','l','c','p'].map((k,i)=>bt(k,i==0,1)).join('')+'</div><button class="ais vid">'+'<svg viewBox="0 0 24 24">'+I.x+'</svg><span>Lexia</span></button></nav>');
document.querySelectorAll('.D nav,.E nav,.F .corp').forEach(n=>n.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;
 const bs=[...n.querySelectorAll('button[data-k]')];bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');
 const l=n.querySelector('.lente');if(l)l.style.transform='translateX('+(bs.indexOf(b)*100)+'%)';}));
</script></body></html>
