<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IVS CODEX · Celular D · Patrón de plataforma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>/* Base para presentar flujos: varias pantallas de teléfono lado a lado. */
:root{
  --bg:#100e0b;--sup:#17140f;--sup2:#1e1a14;--fg:#f1eee6;--mute:rgba(var(--fg-rgb,241,238,230),.64);--dim:rgba(var(--fg-rgb,241,238,230),.4);
  --line:rgba(var(--fg-rgb,241,238,230),.1);--line2:rgba(var(--fg-rgb,241,238,230),.18);--gold:#d9a31b;--gold-s:rgba(var(--gold-rgb,217,163,27),.14);--gold2:rgba(var(--gold-rgb,217,163,27),.5);
  --c-mza:#d9a62a;--c-caba:#d5873f;--c-scba:#c06a2c;--c-csjn:#c95836;--c-saij:#b03b42;--c-idh:#5f7f9a;--ok:#7fb48a;
  --caps:"Cormorant SC",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--x100e0b,#0a0907);color:var(--fg);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.presenta{max-width:1260px;margin:0 auto;padding:32px 16px 60px}
.presenta>h1{margin:0 0 6px;font:500 24px/1.2 var(--sans)}
.presenta>p{margin:0 0 26px;max-width:72ch;color:var(--mute);font-size:14.5px}
.flujo{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.paso{display:flex;flex-direction:column;gap:10px;align-items:center}
.paso>figcaption{max-width:360px;font-size:13px;color:var(--mute);text-align:center}
.paso>figcaption b{display:block;color:var(--fg);font-weight:500;margin-bottom:2px}
.tel{position:relative;width:375px;height:780px;max-width:calc(100vw - 32px);border-radius:42px;overflow:hidden;background:var(--bg);border:1px solid var(--line2);transform:translateZ(0);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pant{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.pant::-webkit-scrollbar{display:none}
.estado-sis{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:500}
mark{background:var(--gold-s);color:var(--fg);border-radius:3px;padding:0 2px}
.marca{font:500 14px/1 var(--caps);letter-spacing:.28em}
.marca b{color:var(--gold);font-weight:500}
.marca i{display:inline-block;width:.2em;height:.2em;margin:0 .12em;border-radius:50%;background:var(--gold);vertical-align:.25em}
.sigla{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--caps);letter-spacing:.14em;color:var(--mute)}
.sigla::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--gold))}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:13.5px;white-space:nowrap}
.cap.on{background:var(--fg);border-color:var(--fg);color:var(--x14110a,#14110a)}
.cap .n{font-size:11.5px;opacity:.65}
.oro{background:var(--gold);border-color:var(--gold);color:var(--x14110a,#14110a);font-weight:500}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 26px;background:rgba(var(--bg-rgb,16,14,11),.96);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabbar button{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--dim);font-size:11px}
.tabbar button[aria-current]{color:var(--fg)}
.tabbar button[aria-current] svg{color:var(--gold)}
.ejemplo{margin-top:24px;text-align:center;font-size:12px;color:var(--dim)}
</style>
<style>
/* D · Patrón de plataforma. Decisiones de UI:
   - 4 pestañas fijas (Buscar, Lector, Guardados, Lexia). Lexia es un destino,
     no un botón flotante: nunca se superpone y siempre está en el mismo lugar.
   - Las demás secciones (Ramas, Cálculos, Plazos, Fuentes…) en el avatar de
     arriba, que es donde las plataformas ponen lo secundario.
   - Título grande en reposo; al haber resultados, cabecera compacta fija con el
     campo y un botón Filtros con contador (lo aplicado siempre se ve).
   - Filtros en hoja inferior con botón de confirmación que dice cuántos
     resultados va a dar: el usuario sabe el efecto antes de aplicar. */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 0}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;background:var(--sup)}
.titulo{margin:14px 20px 12px;font:600 34px/1.05 var(--sans);letter-spacing:-.025em}
.campo{display:flex;align-items:center;gap:10px;margin:0 20px;height:48px;padding:0 6px 0 14px;border-radius:14px;background:var(--sup2);color:var(--mute)}
.campo .txt{flex:1;color:var(--fg)}
.campo .ph{flex:1;color:var(--dim)}
.sec{margin:26px 20px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lista{margin:0 20px;border-radius:16px;background:var(--sup);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:0}
.item small{margin-left:auto;color:var(--dim);font-size:12.5px}
.chips{display:flex;gap:8px;margin:0 20px;flex-wrap:wrap}
/* resultados */
.cab-res{position:sticky;top:0;z-index:5;background:rgba(var(--bg-rgb,16,14,11),.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 0 10px;border-bottom:1px solid var(--line)}
.cab-res .fila{display:flex;gap:8px;align-items:center;margin:6px 16px 0}
.cab-res .campo{margin:0;flex:1;height:44px}
.btn-filtros{position:relative;height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:none;display:flex;align-items:center;gap:6px;font-size:14px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--x14110a,#14110a);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.carril{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px 0 0;padding:0 16px}
.carril::-webkit-scrollbar{display:none}
.resumen{display:flex;justify-content:space-between;margin:12px 20px 4px;font-size:12.5px;color:var(--dim)}
.card{margin:10px 16px;padding:14px 16px;border-radius:18px;background:var(--sup)}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px}
.card h3{margin:0 0 6px;font:600 15px/1.35 var(--sans)}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--mute)}
.card .acc{display:flex;gap:8px;margin-top:12px}
.tip{display:flex;gap:10px;align-items:flex-start;margin:10px 16px;padding:12px 14px;border-radius:16px;border:1px solid var(--gold2);font-size:13.5px;color:var(--mute)}
.tip b{color:var(--fg);font-weight:500}
.punto{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 0 4px var(--gold-s)}
/* hoja de filtros */
.velo{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:84%;border-radius:24px 24px 0 0;background:var(--x1a1712,#1b1712);display:flex;flex-direction:column}
.hoja .asa{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 4px}
.hoja .cab{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 10px}
.hoja .cab b{font-size:17px;font-weight:600}
.hoja .cab button{border:0;background:none;color:var(--gold);font-size:14px;min-height:44px}
.hoja .cuerpo{overflow-y:auto;padding:0 20px 16px}
.hoja h4{margin:16px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:var(--sup2)}
.seg span{min-height:36px;display:grid;place-items:center;border-radius:9px;font-size:13px;color:var(--mute)}
.seg span.on{background:#3a3226;color:var(--fg)}
.check{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid var(--line);font-size:15px}
.check .cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px}
.check .cb.on{background:var(--gold);border-color:var(--gold);color:var(--x14110a,#14110a)}
.check small{margin-left:auto;color:var(--dim)}
.rango{display:flex;gap:10px}
.rango div{flex:1;height:44px;border-radius:12px;background:var(--sup2);display:flex;align-items:center;padding:0 14px;color:var(--mute)}
.hoja .pie{padding:12px 20px 30px;border-top:1px solid var(--line)}
.hoja .pie .cap{width:100%;min-height:50px;font-size:15.5px}
</style>
<script src="../tema.js"></script></head>
<body>
<div class="presenta">
  <h1>D · Patrón de plataforma</h1>
  <p>Cuatro pestañas fijas y Lexia como una de ellas, así que nunca tapa nada. Lo secundario va en el avatar. Cuando hay resultados, la cabecera se compacta y los filtros muestran cuántos hay aplicados. La hoja de filtros dice cuántos resultados va a dar antes de aplicarla.</p>
  <div class="flujo">

    <figure class="paso"><div class="tel"><div class="pant">
      <div class="estado-sis"><span>9:41</span><span>●●●</span></div>
      <div class="top"><span class="marca">I<b>V</b>S<i></i>CODE<b>X</b></span><span class="avatar">LG</span></div>
      <div class="titulo">Buscar</div>
      <div class="campo"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="ph">Tema, carátula o artículo</span></div>
      <div class="sec">Recientes</div>
      <div class="lista">
        <div class="item"><svg class="ic" viewBox="0 0 24 24" style="color:var(--dim)"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>daño extrapatrimonial<small>hoy</small></div>
        <div class="item"><svg class="ic" viewBox="0 0 24 24" style="color:var(--dim)"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>plazo razonable<small>ayer</small></div>
        <div class="item"><svg class="ic" viewBox="0 0 24 24" style="color:var(--dim)"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>art. 1741 CCyC<small>lun</small></div>
      </div>
      <div class="sec">Por rama</div>
      <div class="chips"><span class="cap">Daños</span><span class="cap">Familia</span><span class="cap">Laboral</span><span class="cap">Contratos</span><span class="cap">Administrativo</span></div>
      <p class="ejemplo">Datos de ejemplo</p>
      <div style="height:110px"></div>
    </div>
    <nav class="tabbar"><button aria-current="page"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Buscar</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M10 12h5M10 16h5"/></svg>Lector</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg>Guardados</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M5 6h14v10H9l-4 3z"/></svg>Lexia</button></nav>
    </div><figcaption><b>1 · En reposo</b>Título grande, campo arriba, recientes y atajos por rama. Lexia es la cuarta pestaña.</figcaption></figure>

    <figure class="paso"><div class="tel"><div class="pant">
      <div class="cab-res">
        <div class="estado-sis"><span>9:41</span><span>●●●</span></div>
        <div class="fila"><div class="campo"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="txt">daño extrapatrimonial</span></div><button class="btn-filtros">Filtros <span class="badge">2</span></button></div>
        <div class="carril"><span class="cap on">Todas <span class="n">263</span></span><span class="cap">SCBA <span class="n">237</span></span><span class="cap">SAIJ <span class="n">16</span></span><span class="cap">Corte IDH <span class="n">11</span></span><span class="cap">TSJ <span class="n">6</span></span></div>
      </div>
      <div class="resumen"><span>263 resultados · 6 bases</span><span>Más recientes ▾</span></div>
      <div class="card"><div class="meta"><span class="sigla" style="--c:var(--c-scba)">SCBA</span><span>16 jul 2026</span></div><h3>Tomás c/ Chevrolet SA de ahorro para fines determinados</h3><p>… ha de considerarse <mark>daño extrapatrimonial</mark> o moral a la lesión a derechos que afectan la tranquilidad …</p><div class="acc"><button class="cap">Leer</button><button class="cap">Citar</button><button class="cap">Guardar</button></div></div>
      <div class="tip"><span class="punto"></span><span><b>Lexia:</b> la Corte IDH lo llama «daño inmaterial». Ya lo incluí; los resultados dicen con qué forma se encontraron.</span></div>
      <div class="card"><div class="meta"><span class="sigla" style="--c:var(--c-caba)">TSJ</span><span>12 nov 2025</span></div><h3>Sancor Coop. de Seguros Ltda. y otros s/ queja</h3><p>… los rubros «incapacidad física sobreviniente» y «<mark>daño extrapatrimonial</mark>» …</p><div class="acc"><button class="cap">Leer</button><button class="cap">Citar</button><button class="cap">Guardar</button></div></div>
      <div style="height:110px"></div>
    </div>
    <nav class="tabbar"><button aria-current="page"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Buscar</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M10 12h5M10 16h5"/></svg>Lector</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg>Guardados</button><button><svg class="ic" viewBox="0 0 24 24"><path d="M5 6h14v10H9l-4 3z"/></svg>Lexia</button></nav>
    </div><figcaption><b>2 · Con resultados</b>Cabecera compacta fija, Filtros con contador, bases con su cantidad. Lexia aparece como nota dentro de la lista cuando tiene algo útil que decir.</figcaption></figure>

    <figure class="paso"><div class="tel"><div class="pant">
      <div class="cab-res"><div class="estado-sis"><span>9:41</span><span>●●●</span></div><div class="fila"><div class="campo"><span class="txt">daño extrapatrimonial</span></div><button class="btn-filtros">Filtros <span class="badge">2</span></button></div></div>
      <div class="card" style="opacity:.5"><h3>Tomás c/ Chevrolet SA …</h3></div>
    </div>
    <div class="velo"></div>
    <section class="hoja"><div class="asa"></div>
      <div class="cab"><button>Restablecer</button><b>Filtros</b><button>Listo</button></div>
      <div class="cuerpo">
        <h4>Cómo combinar las palabras</h4><div class="seg"><span>Frase exacta</span><span class="on">Todas</span><span>Alguna</span></div>
        <h4>Bases</h4>
        <div class="check"><span class="cb on">✓</span>SCBA · Buenos Aires<small>237</small></div>
        <div class="check"><span class="cb on">✓</span>SAIJ · todo el país<small>16</small></div>
        <div class="check"><span class="cb on">✓</span>Corte IDH<small>11</small></div>
        <div class="check"><span class="cb"></span>TSJ · CABA<small>6</small></div>
        <h4>Años</h4><div class="rango"><div>Desde 2015</div><div>Hasta 2026</div></div>
      </div>
      <div class="pie"><button class="cap oro">Ver 241 resultados</button></div>
    </section>
    </div><figcaption><b>3 · Hoja de filtros</b>Control segmentado para el modo, bases con casillas y cantidades, y un botón que anticipa cuántos resultados quedan.</figcaption></figure>

  </div>
</div>
</body>
