<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barra de abajo · tres píldoras</title>
<style>
:root{--bg:#100e0b;--fg:#f1eee6;--mute:#8d887c;--gold:#d9a31b}
*{box-sizing:border-box}
body{margin:0;background:var(--x100e0b,#0b0a08);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:32px 20px 60px}
h1{font:500 22px/1.2 system-ui;margin:0 0 6px}p.s{color:var(--mute);margin:0 0 28px}
.fila{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.op{width:300px}
.op h2{font:600 13px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.op p{color:var(--mute);font-size:13px;margin:0 0 14px;min-height:54px}
.tel{position:relative;height:560px;border-radius:34px;border:1px solid var(--x1e1a14,#2a261e);overflow:hidden;
  background:radial-gradient(120% 60% at 20% 20%,#2a2214 0,transparent 60%),radial-gradient(90% 50% at 90% 80%,#1d2a2b 0,transparent 60%),var(--bg)}
.tel .txt{padding:26px 22px;color:#cfc9bb}.tel .txt b{display:block;font:600 34px/1.1 system-ui;color:var(--fg);margin-bottom:12px}
.tel .caja{margin:14px 22px;height:70px;border:1px dashed #3a3427;border-radius:18px}
.tel .caja.g{height:130px}
nav{position:absolute;left:12px;right:12px;bottom:14px;display:grid;z-index:2}
nav button{appearance:none;border:0;background:none;color:var(--mute);cursor:pointer;font:400 11px/1.1 system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--gold)}
/* A · píldora completa */
.A nav{grid-template-columns:repeat(5,1fr);padding:7px 8px;border-radius:999px;
  background:linear-gradient(180deg,rgba(var(--fg-rgb,241,238,230),.14),rgba(var(--fg-rgb,241,238,230),.05));
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(var(--fg-rgb,241,238,230),.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 14px 38px rgba(0,0,0,.55)}
.A nav button{padding:8px 2px 6px;border-radius:999px}
.A nav .on{background:rgba(var(--fg-rgb,241,238,230),.1);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb,217,163,27),.28)}
/* B · sólo iconos, el activo se despliega */
.B nav{grid-auto-flow:column;grid-auto-columns:auto;justify-content:space-between;align-items:center;padding:7px;border-radius:999px;
  background:rgba(22,19,14,.38);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  border:1px solid rgba(var(--fg-rgb,241,238,230),.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px rgba(0,0,0,.6)}
.B nav button{flex-direction:row;gap:8px;height:48px;min-width:48px;padding:0 13px;border-radius:999px;justify-content:center;font-size:13px;font-weight:500;transition:.35s}
.B nav button span{display:none}
.B nav .on{background:linear-gradient(180deg,rgba(var(--fg-rgb,241,238,230),.2),rgba(var(--fg-rgb,241,238,230),.08));box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb,217,163,27),.45),inset 0 1px 0 rgba(255,255,255,.25);padding:0 18px}
.B nav .on span{display:inline}
/* C · Buscar al centro, gota dorada */
.C nav{grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;padding:8px 10px;border-radius:999px;
  background:linear-gradient(180deg,rgba(var(--fg-rgb,241,238,230),.18),rgba(var(--fg-rgb,241,238,230),.06));
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(var(--fg-rgb,241,238,230),.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 38px rgba(0,0,0,.55)}
.C nav button{padding:6px 0}
.C nav .cen{position:relative;top:-14px;width:66px;height:66px;margin:0 auto;border-radius:50%;justify-content:center;gap:0;
  background:radial-gradient(circle at 35% 25%,#f0c75a,#d9a31b 55%,#a77a0c);color:var(--x14110a,#1a1405);
  box-shadow:0 0 0 5px rgba(var(--bg-rgb,16,14,11),.55),0 10px 26px rgba(var(--gold-rgb,217,163,27),.35),inset 0 1px 0 rgba(255,255,255,.5)}
.C nav .cen svg{width:28px;height:28px;stroke-width:1.9}.C nav .cen span{display:none}
.C nav .on:not(.cen){color:var(--gold)}
</style><script src="../tema.js"></script></head><body>
<h1>Barra de abajo · tres píldoras vidriosas</h1><p class="s">Tocá los íconos para probarlas.</p>
<div class="fila" id="f"></div>
<script>
const I={b:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',l:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 16h6"/>',c:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7h7M9 12h1M12 12h1M15 12h1M9 16h1M12 16h1M15 16h1"/>',p:'<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>',m:'<path d="M5 8h14M5 12h14M5 16h14"/>'};
const N=[['b','Buscar'],['l','Lector'],['c','Cálculos'],['p','Perfil'],['m','Más']];
const D=[['A','Píldora completa','Íconos con su nombre, vidrio claro y la sección activa en una cápsula interna dorada. Es la que ya está puesta.'],
['B','Sólo íconos, el activo se despliega','Una píldora más angosta y transparente: los íconos van solos y el de la sección activa se abre en cápsula con su nombre.'],
['C','Buscar al centro','Buscar, lo que más se usa, es una gota dorada que sale del borde de la píldora; Lector y Cálculos a un lado, Perfil y Más al otro.']];
const f=document.getElementById('f');
D.forEach(([k,t,d])=>{
 const o=document.createElement('div');o.className='op '+k;
 let order=k=='C'?['l','c','b','p','m']:['b','l','c','p','m'];
 o.innerHTML='<h2>Opción '+k+'</h2><p><b style="color:var(--xf1eee6,#f1eee6)">'+t+'.</b> '+d+'</p><div class="tel"><div class="txt"><b>Buscar.</b>Búsqueda irrestricta · Todas las bases, jurisdicciones y períodos.</div><div class="caja"></div><div class="caja g"></div><nav>'+
 order.map(x=>{const n=N.find(y=>y[0]==x);return '<button class="'+(x=='b'?'on ':'')+(k=='C'&&x=='b'?'cen':'')+'" data-k="'+x+'"><svg viewBox="0 0 24 24">'+I[x]+'</svg><span>'+n[1]+'</span></button>'}).join('')+'</nav></div>';
 f.appendChild(o);
 if(k!='C'&&k!='B')return;
});
document.querySelectorAll('nav').forEach(n=>n.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 n.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));
/* A y C muestran etiqueta siempre; en B sólo el activo */
document.querySelectorAll('.A nav span,.C nav span').forEach(s=>s.style.display=s.closest('.cen')?'none':'block');
</script></body></html>
