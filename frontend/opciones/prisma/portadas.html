<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e0b">
<title>IVS CODEX · Diez portadas con prisma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../atmosfera/base.css">
<style>
.nv{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px var(--pad);background:linear-gradient(rgba(var(--bg-rgb),.92),rgba(var(--bg-rgb),0))}
.nv .tt{font-size:13px;color:var(--mute)}
.nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;min-width:36px;text-align:center;padding:8px 12px;border-radius:999px;font-size:13px;color:var(--mute);background:rgba(var(--fg-rgb),.08);transition:background .3s,color .3s}
.nav a:hover{background:rgba(var(--fg-rgb),.18);color:var(--fg)}
.st{position:relative;height:clamp(580px,100svh,880px);margin:0 0 10px;overflow:hidden;background:var(--bg);isolation:isolate}
.luces{position:absolute;inset:0;z-index:0;pointer-events:none}
.luces i{position:absolute;border-radius:50%;filter:blur(80px)}
.luces i:nth-child(1){left:-12vw;bottom:-22vw;width:54vw;height:54vw;background:radial-gradient(circle,rgba(var(--gold-rgb),.55),rgba(var(--ember),.24) 52%,transparent 72%)}
.luces i:nth-child(2){right:-10vw;top:-12vw;width:48vw;height:48vw;background:radial-gradient(circle,rgba(var(--ember),.45),rgba(var(--vino),.26) 55%,transparent 74%)}
.luces i:nth-child(3){left:36vw;bottom:-16vw;width:36vw;height:36vw;background:radial-gradient(circle,rgba(var(--vino),.42),transparent 70%)}
.lz{position:absolute;inset:0;z-index:1}
.lz>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rot{position:absolute;z-index:9;right:var(--pad);bottom:18px;padding:8px 16px;border-radius:999px;font-size:13px}
.rot b{font-weight:600}
.hd{position:absolute;z-index:8;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:20px var(--pad)}
.hd nav{margin:0 auto;display:flex;gap:24px;padding:11px 26px;border-radius:999px;font-size:14px;color:var(--mute)}
.hd .btn{padding:11px 20px;font-size:14px}
.h1{margin:0;font:400 var(--fs)/.98 var(--sans);letter-spacing:-.05em;text-wrap:balance}
.h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--mute);font-size:clamp(14px,1.25vw,18px);line-height:1.5}
.bus{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 22px;border-radius:999px;font-size:15px;color:var(--mute);width:min(480px,100%)}
.bus span{flex:1}
.bus .btn{padding:12px 24px}
.pie{position:absolute;z-index:6;left:0;right:0;bottom:20px;text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.pie i{display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(rgba(var(--gold-rgb),.9),transparent)}

/* cristal */
.cristal{position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(155deg,rgba(255,240,215,.26),rgba(255,255,255,.03) 45%,rgba(255,200,120,.14));-webkit-backdrop-filter:blur(7px) saturate(1.5) brightness(1.12);backdrop-filter:blur(7px) saturate(1.5) brightness(1.12)}
.cristal::after{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 36%,rgba(255,246,226,.5) 47%,transparent 58%);background-size:260% 100%;animation:destello 8s ease-in-out infinite}
.cristal svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes destello{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
.halo{position:absolute;border-radius:50%;pointer-events:none;filter:blur(10px);mix-blend-mode:screen}
@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes gira{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes brilla{0%,100%{opacity:.5}50%{opacity:1}}
.e3{position:absolute;width:0;height:0;perspective:1300px}
.tilt{position:absolute;left:0;top:0;transform-style:preserve-3d;transform:rotateX(-13deg)}
.p3{position:absolute;left:0;top:0;transform-style:preserve-3d;animation:gira 40s linear infinite}
.cara{position:absolute;background:linear-gradient(100deg,rgba(255,232,190,.34),rgba(255,255,255,.05) 52%,rgba(var(--gold-rgb),.3));border-left:1.5px solid rgba(255,240,210,.5);animation:brilla 13.4s ease-in-out infinite}
.tapa{position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(160deg,rgba(255,244,220,.6),rgba(var(--gold-rgb),.3))}

/* fichas */
.fi{position:absolute;z-index:5;border-radius:26px;padding:16px 18px;animation:flota 7s ease-in-out infinite alternate}
.fi .fl{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:12px;color:var(--mute)}
.fi h3{margin:0 0 6px;font:500 15px/1.25 var(--sans);letter-spacing:-.02em}
.fi p{margin:0;font-size:13px;line-height:1.45;color:var(--mute)}
.fi mark{background:rgba(var(--gold-rgb),.3);color:var(--fg);padding:0 4px;border-radius:5px}

/* lente */
.len-t{position:absolute;white-space:pre;font:500 var(--f)/.98 var(--sans);letter-spacing:-.06em}
.lente{position:absolute;left:0;top:0;overflow:hidden;clip-path:polygon(50% 0,100% 100%,0 100%);background:rgba(var(--bg-rgb),.78)}
.lente .len-t{mix-blend-mode:screen}
.len-b{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(var(--gold-rgb),.55))}
.dis{position:absolute;white-space:pre;font:500 var(--f)/.98 var(--sans);letter-spacing:-.06em;mix-blend-mode:screen}

/* portal */
.pt-in{position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);overflow:hidden}
.pt-txt{position:absolute;left:50%;transform:translateX(-50%);text-align:center;width:74%}
.base{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:11.5px;letter-spacing:.05em;white-space:nowrap}
@media (max-width:900px){.hd nav{display:none}.hd .btn{margin-left:auto}}
@media (max-width:760px){.nav{max-width:52vw}.nv .tt{display:none}}
</style>
