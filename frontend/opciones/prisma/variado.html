<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e0b">
<title>IVS CODEX · Diez prismas distintos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../atmosfera/base.css">
<style>
.cab{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:16px var(--pad);background:linear-gradient(rgba(var(--bg-rgb),.9),rgba(var(--bg-rgb),0))}
.nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;min-width:36px;text-align:center;padding:8px 12px;border-radius:999px;font-size:13px;color:var(--mute);background:rgba(var(--fg-rgb),.08);transition:background .3s,color .3s}
.nav a:hover{background:rgba(var(--fg-rgb),.18);color:var(--fg)}
.intro{padding:clamp(18px,4vh,48px) var(--pad) 30px;max-width:1000px}
.intro h1{margin:0 0 14px;font:400 clamp(34px,5vw,72px)/.98 var(--sans);letter-spacing:-.05em;text-wrap:balance}
.intro p{margin:0;max-width:64ch;color:var(--mute);font-size:clamp(15px,1.3vw,18px)}
.st{position:relative;height:clamp(480px,84svh,820px);margin:0 0 14px;overflow:hidden;background:var(--bg);isolation:isolate}
.luces{position:absolute;inset:0;z-index:0;pointer-events:none}
.luces i{position:absolute;border-radius:50%;filter:blur(80px)}
.luces i:nth-child(1){left:-12vw;bottom:-22vw;width:54vw;height:54vw;background:radial-gradient(circle,rgba(var(--gold-rgb),.55),rgba(var(--ember),.24) 52%,transparent 72%)}
.luces i:nth-child(2){right:-10vw;top:-12vw;width:48vw;height:48vw;background:radial-gradient(circle,rgba(var(--ember),.45),rgba(var(--vino),.26) 55%,transparent 74%)}
.luces i:nth-child(3){left:36vw;bottom:-16vw;width:36vw;height:36vw;background:radial-gradient(circle,rgba(var(--vino),.42),transparent 70%)}
.st canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.lz{position:absolute;inset:0;z-index:1}
.lz>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rot{position:absolute;z-index:6;left:var(--pad);top:18px;padding:9px 18px;border-radius:999px;font-size:13.5px}
.rot b{font-weight:600}
.des{position:absolute;z-index:6;left:var(--pad);bottom:20px;max-width:min(500px,calc(100% - 2*var(--pad)));padding:12px 18px;border-radius:22px;font-size:13.5px;color:var(--mute);line-height:1.45}

/* portal */
.pt-in{position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);overflow:hidden}
.pt-txt{position:absolute;left:50%;transform:translateX(-50%);text-align:center;width:72%}
.pt-txt h2{margin:0;font:500 var(--f)/1.02 var(--sans);letter-spacing:-.05em}
.pt-txt h2 em{font-style:normal;color:rgba(var(--fg-rgb),.55)}
.pt-bus{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:calc(var(--f)*.5) auto 0;width:88%;padding:5px 5px 5px calc(var(--f)*.55);border-radius:999px;font-size:calc(var(--f)*.4);color:var(--mute);white-space:nowrap}
.pt-bus b{font-weight:500;padding:calc(var(--f)*.28) calc(var(--f)*.6);border-radius:999px;background:var(--fg);color:var(--bg)}
.halo{position:absolute;border-radius:50%;pointer-events:none;filter:blur(8px)}

/* embudo */
.emb{position:absolute;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:7px}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-size:12px;letter-spacing:.06em;color:var(--fg);animation:enciende 6.4s ease-in-out infinite}
.bar .dot{width:8px;height:8px}
@keyframes enciende{0%,70%,100%{filter:brightness(.75);box-shadow:0 0 0 rgba(0,0,0,0)}8%,22%{filter:brightness(1.6);box-shadow:0 0 26px 2px var(--c)}}
.rayo{position:absolute;left:50%;transform:translateX(-50%);width:3px;border-radius:3px;background:linear-gradient(0deg,rgba(255,236,190,1),rgba(var(--gold-rgb),.7) 40%,rgba(var(--gold-rgb),0));animation:rayo 6.4s ease-in-out infinite}
@keyframes rayo{0%,60%,100%{opacity:.55}72%,84%{opacity:1}}

/* lente */
.len-t{position:absolute;white-space:pre;font:500 var(--f)/.98 var(--sans);letter-spacing:-.06em}
.lente{position:absolute;left:0;top:0;overflow:hidden;clip-path:polygon(50% 0,100% 100%,0 100%);background:rgba(var(--bg-rgb),.78)}
.lente .len-t{mix-blend-mode:screen}
.len-b{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(var(--gold-rgb),.55))}

/* columna */
.nodo{position:absolute;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;font-size:14px;white-space:nowrap}
.nodo small{color:var(--mute);font-size:12.5px}
@keyframes viaja{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes deriva{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@media (max-width:760px){.nav{max-width:58vw}.des{font-size:12.5px;padding:10px 14px}.nodo small{display:none}}
</style>

<body>
<div class="grano" aria-hidden="true"></div>
<header class="cab">
  <span class="marca2"><b>IVS</b><i class="m-pt"></i><span>CODEX</span></span>

</header>
<div class="intro">
  <h1>Diez prismas que no se parecen entre sí.</h1>
  <p>Los anteriores eran todos la misma escena. Estos cambian la composición: el prisma vertical, radial, de fondo entero, hecho paisaje, como marco, como lente que sigue al puntero. Cambie de paleta abajo a la izquierda.</p>
</div>
<main id="escenas"></main>

<script>
(function(){

    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(g.P.x,g.P.y,g.s*2.2,0,7); ctx.fill();
    ctx.globalCompositeOperation="source-over";
    ctx.beginPath(); ctx.moveTo(g.T.x,g.T.y); ctx.lineTo(g.R.x,g.R.y); ctx.lineTo(g.L.x,g.L.y); ctx.closePath(); ctx.strokeStyle="rgba(255,244,222,.78)"; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(g.P.x,g.P.y,3.2,0,7); ctx.fillStyle="rgba(255,236,190,1)"; ctx.fill();
  }
  function D(css,p,cls){ var e=document.createElement("div"); if(cls) e.className=cls; e.style.cssText="position:absolute;"+(css||""); if(p) p.appendChild(e); return e; }

  var V=[];

  /* 1 · Cascada: vertical, la luz cae desde arriba */
  V.push({n:"1 · Cascada",d:"Vertical. Ocho cortinas de luz caen desde arriba hacia un prisma que se apoya abajo; sale un único haz dorado que se abre en un charco de luz.",
    geo:function(W,H){ return geom(W,H,.5,.6,W<700?.16:.12); },
    draw:function(ctx,W,H,t,g){

        var xs=W<700?W*(.08+i*.119):W*(.2+i*.086), izq=i<4, E=lerp(g.T,izq?g.L:g.R,.3+(i%4)*.1);
        var f=function(u){ return bez({x:xs,y:0},{x:xs+(Math.sin(t*.4+i)*W*.012),y:E.y*.45},{x:E.x,y:E.y-H*.2},E,u); };
        hilo(ctx,f,50,c,1.2,.8,[0,0,0,E.y],.09); bola(ctx,f((t*.11+i*.15)%1),c,2.3,.95);
      });
      var B={x:g.P.x,y:g.L.y}, gr=ctx.createLinearGradient(0,B.y,0,H); gr.addColorStop(0,"rgba(255,226,150,.28)"); gr.addColorStop(1,"rgba(240,170,60,0)");
      ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(B.x-4,B.y); ctx.lineTo(B.x-W*.1,H); ctx.lineTo(B.x+W*.1,H); ctx.lineTo(B.x+4,B.y); ctx.closePath(); ctx.fill();

  /* 2 · Portal: el prisma es el marco */

      inn.style.background="radial-gradient(70% 62% at 50% 86%,rgba(255,206,120,.55),rgba(233,135,46,.3) 40%,transparent 72%),radial-gradient(40% 30% at 50% 8%,rgba(240,190,64,.45),transparent 70%),linear-gradient(rgba(var(--bg-rgb),.5),rgba(var(--bg-rgb),.15))";
      var tx=D("top:56%;--f:"+f+"px","", "pt-txt"); inn.appendChild(tx);
      tx.innerHTML='<h2>Una consulta.<br><em>Todas las bases.</em></h2><div class="pt-bus vid"><span>daño moral</span><b>Buscar</b></div>';
      var svg=S("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H},el),d=S("defs",{},svg),g=S("linearGradient",{id:"pg",gradientUnits:"userSpaceOnUse",x1:L.x,y1:0,x2:R.x,y2:0},d);
      [[0,"rgba(240,190,64,1)"],[.5,"rgba(233,135,46,1)"],[1,"rgba(160,36,60,1)"]].forEach(function(s){ S("stop",{offset:s[0],"stop-color":s[1]},g); });
      var fl=S("filter",{id:"pb",filterUnits:"userSpaceOnUse",x:0,y:0,width:W,height:H},d); S("feGaussianBlur",{stdDeviation:9},fl);
      var pts=T.x+","+T.y+" "+R.x+","+R.y+" "+L.x+","+L.y;
      S("polygon",{points:pts,fill:"none",stroke:"url(#pg)","stroke-width":10,filter:"url(#pb)",opacity:.55,"stroke-linejoin":"round"},svg);
      S("polygon",{points:pts,fill:"none",stroke:"url(#pg)","stroke-width":1.6,"stroke-linejoin":"round"},svg);
      [T,L,R].forEach(function(p){ D("left:"+(p.x-60)+"px;top:"+(p.y-60)+"px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,226,150,.65),transparent 70%)",el,"halo"); });
    }});

  /* 3 · Cristales: el prisma hecho mosaico de fondo */
  V.push({n:"3 · Cristales",d:"El prisma estallado en cientos de facetas que cubren toda la pantalla. Una ola de luz las enciende; de vez en cuando una destella con el color de una base.",
    geo:function(W,H){ return geom(W,H,.5,.5,.13); },
    draw:function(ctx,W,H,t,g){
      var a=Math.max(54,W/15),h=a*.866,rows=Math.ceil(H/h)+2,cols=Math.ceil(W/a)+3;

          var w=Math.sin(cx*.0042+cy*.0032-t*.7+n*6),al=.028+.05*n+Math.max(0,w)*.17*(.5+n);
          var fl=Math.sin(t*.45+n*60)>.993; if(fl){ col=COL[Math.floor(n*8)%8]; al+=.32; }
          ctx.beginPath(); ctx.moveTo(tri[0].x,tri[0].y); ctx.lineTo(tri[1].x,tri[1].y); ctx.lineTo(tri[2].x,tri[2].y); ctx.closePath(); ctx.fillStyle=rgb(col,al); ctx.fill();
          ctx.strokeStyle="rgba(255,240,210,.045)"; ctx.lineWidth=.7; ctx.stroke();

  /* 4 · Rosa: radial, como una rosa de los vientos */

    geo:function(W,H){ return geom(W,H,.5,.5,.09); },

        var lr=R*1.3; ctx.fillText(BASES[i][0],g.P.x+ca*lr,g.P.y+sa*lr+(Math.abs(ca)<.3?(sa>0?8:-8):0));

  /* 5 · Ondas: el prisma como fuente de ecos */

    geo:function(W,H){ return geom(W,H,.5,.58,.07); },

  /* 6 · Embudo: pirámide de las ocho bases */
  V.push({n:"6 · Embudo",d:"Vertical y didáctica. Las ocho bases forman una pirámide de cápsulas de vidrio; la luz las enciende de abajo hacia arriba y sale un rayo por la punta.",
    build:function(el,W,H){

      D("left:"+(W/2-70)+"px;top:"+(top-26)+"px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,226,150,.7),transparent 70%)",el,"halo");
    }});

  /* 7 · Lente: el prisma como cursor que descompone el texto */
  V.push({n:"7 · Lente",d:"Interactivo. Un prisma de cristal sigue al puntero (o pasea solo) y, al pasar sobre el texto, lo descompone en tres colores cálidos, como una dispersión.",
