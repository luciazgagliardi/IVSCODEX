<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="shared6.css"><title>IVS CODEX · La balanza</title>
<style>
/* 4 · LA BALANZA — los tres principios se vuelven pesas. Al bajar, caen una a una sobre el platillo de la fuente y la balanza,
   que empezaba inclinada hacia «una cita sin respaldo», se nivela. Después, lo que ofrece la página, en una lista de fichas. */
.pista4{position:relative;height:520vh}
.esc4{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:clamp(10px,4vw,60px);padding:84px var(--pad) 20px}
.txt4 .n{font:300 clamp(60px,9vw,130px)/1 var(--caps);color:var(--gold);letter-spacing:.02em}
.txt4 h2{margin:6px 0 12px;font:500 clamp(26px,3.6vw,52px)/1.02 var(--sans);letter-spacing:-.04em;min-height:2.1em}
.txt4 p{margin:0;max-width:40ch;color:var(--mute);min-height:6em}
.prog4{display:flex;gap:8px;margin-top:22px}.prog4 i{width:34px;height:2px;background:var(--line);transition:background .4s}.prog4 i.on{background:var(--gold)}
svg.bal{width:100%;height:auto;max-height:78svh;overflow:visible}
.bal .fino{fill:none;stroke:rgba(241,238,230,.7);stroke-width:2;stroke-linecap:round}
.bal .platillo{fill:rgba(241,238,230,.04);stroke:rgba(241,238,230,.7);stroke-width:2}
.bal .hilo{stroke:rgba(241,238,230,.4);stroke-width:1.2}
.bal .pesa{transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .6s}
.bal .pesa circle{fill:#15120d;stroke:var(--gold);stroke-width:2}
.bal .pesa text{font:500 15px "Cormorant SC",serif;letter-spacing:.2em;fill:var(--gold);text-anchor:middle}
.bal .cita rect{fill:#efe9d9}.bal .cita text{font:400 14px "Instrument Sans",sans-serif;fill:#1a1712}
.bal .cita .t2{font-size:12px;fill:#6a6150}
.bal .cuerpo{transition:transform 1s cubic-bezier(.3,1.3,.5,1);transform-origin:500px 300px}
.bal #izq,.bal #der{transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.bal .brillo{opacity:0;transition:opacity 1s}
.bal.nivel .brillo{opacity:1}
.fich{padding:clamp(60px,9vw,120px) var(--pad) 0}
.fich ul{list-style:none;margin:clamp(24px,4vw,50px) 0 0;padding:0;border-top:1px solid var(--line)}
.fich li{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1.3fr);gap:6px clamp(14px,3vw,44px);align-items:center;padding:clamp(16px,2vw,26px) 0;border-bottom:1px solid var(--line);transition:padding .4s var(--ease)}
.fich li:hover{padding-left:12px}
.fich .l{font:500 11.5px/1 var(--caps);letter-spacing:.2em;color:var(--c)}
.fich h3{margin:0;font:500 clamp(20px,2.2vw,30px)/1.1 var(--sans);letter-spacing:-.03em}
.fich p{margin:0;color:var(--mute);font-size:14.5px}
@media (max-width:820px){.esc4{grid-template-columns:1fr;align-content:center;gap:0}.txt4 p{min-height:0}.txt4 h2{min-height:0}.txt4 .n{font-size:54px}svg.bal{max-height:42svh}.fich li{grid-template-columns:1fr}}
</style></head><body><script src="../v4/shared.js"></script><script src="shared6.js"></script>
<script>
var m=IVS6.montar(),P=IVS6.PRINC;
var pista=document.createElement("section");pista.className="pista4";pista.id="pista4";
pista.innerHTML='<div class="esc4"><div class="txt4"><span class="n" id="n4">00</span><h2 id="t4"></h2><p id="d4"></p><div class="prog4" id="pg4"><i></i><i></i><i></i><i></i></div></div>'+
'<svg class="bal" id="bal" viewBox="0 0 1000 760" role="img" aria-label="Una balanza que se nivela al sumar los tres principios">'+
 '<defs><radialGradient id="br" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".5"/><stop offset="1" stop-color="#d9a31b" stop-opacity="0"/></radialGradient></defs>'+
 '<ellipse class="brillo" cx="500" cy="300" rx="420" ry="300" fill="url(#br)"/>'+
 '<path class="fino" d="M500 300V690M410 700H590M440 690H560"/>'+
 '<g class="cuerpo" id="cuerpo"><path class="fino" d="M130 300H870"/><circle cx="500" cy="300" r="13" fill="#100e0b" stroke="#d9a31b" stroke-width="2.5"/>'+
  '<g id="izq"><line class="hilo" x1="130" y1="300" x2="70" y2="470"/><line class="hilo" x1="130" y1="300" x2="190" y2="470"/><path class="platillo" d="M50 470H210Q205 515 130 520Q55 515 50 470Z"/>'+
   '<g class="cita" transform="translate(56 376)"><rect width="148" height="90" rx="3"/><text x="12" y="28">«Según un fallo</text><text x="12" y="48">que no recuerdo…»</text><text class="t2" x="12" y="74">sin fuente</text></g></g>'+
  '<g id="der"><line class="hilo" x1="870" y1="300" x2="810" y2="470"/><line class="hilo" x1="870" y1="300" x2="930" y2="470"/><path class="platillo" d="M790 470H950Q945 515 870 520Q795 515 790 470Z"/>'+
   '<g id="pesas"></g></g></g></svg></div>';
m.appendChild(pista);
var pesas=document.getElementById("pesas"),POS0=[[845,438],[905,438],[875,388]];
P.forEach(function(q,i){var g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","pesa");g.dataset.i=i;g.style.opacity=0;g.style.transform="translate("+POS0[i][0]+"px,-140px)";g.innerHTML='<circle r="'+(30+i*3)+'"/><text y="5">'+q[0]+'</text>';pesas.appendChild(g);});
var T=[["00","Una cita sin respaldo.","Un fallo recordado de memoria pesa mucho al citarlo y nada al comprobarlo: la balanza se inclina hacia donde no hay fuente."],
["01","FONS · la fuente.",P[0][2]],["02","ORDO · el orden.",P[1][2]],["03","FIDES · la fe.",P[2][2]]];
var cuerpo=document.getElementById("cuerpo"),bal=document.getElementById("bal"),ps=pesas.children,act=-1,ang=[-9,-6.2,-3,0];
var POS=[[845,438],[905,438],[875,388]];
function f(){var r=pista.getBoundingClientRect(),tot=r.height-innerHeight,p=IVS4.clamp(-r.top/tot,0,1),k=Math.min(3,Math.floor(p*4.0001));
 var a=ang[k];
 cuerpo.style.transform="rotate("+a+"deg)";
 var iz=document.getElementById("izq"),de=document.getElementById("der");
 iz.style.transformOrigin="130px 300px";de.style.transformOrigin="870px 300px";iz.style.transform="rotate("+(-a)+"deg)";de.style.transform="rotate("+(-a)+"deg)";
 if(k!==act){act=k;document.getElementById("n4").textContent=T[k][0];document.getElementById("t4").textContent=T[k][1];document.getElementById("d4").textContent=T[k][2];
  [].forEach.call(document.getElementById("pg4").children,function(d,j){d.className=j<=k?"on":"";});
  [].forEach.call(ps,function(g,j){var on=j<k;g.style.opacity=on?1:0;g.style.transform="translate("+POS[j][0]+"px,"+(on?POS[j][1]:-140)+"px)";});
  bal.classList.toggle("nivel",k===3);}}
var pend=false;addEventListener("scroll",function(){if(!pend){pend=true;requestAnimationFrame(function(){pend=false;f();});}},{passive:true});addEventListener("resize",f);f();
var fi=document.createElement("section");fi.className="fich";fi.innerHTML='<p class="eyebrow">QVID OFFERT</p><h2 class="h2">Y con esa balanza, <em>seis cosas.</em></h2><ul>'+IVS4.OFERTAS.map(function(o){return '<li style="--c:var('+o.c+')"><span class="l">'+o.lat+'</span><h3>'+o.t+'</h3><p>'+o.d+'</p></li>';}).join("")+'</ul>';m.appendChild(fi);
IVS6.cierre(m);
</script></body></html>
