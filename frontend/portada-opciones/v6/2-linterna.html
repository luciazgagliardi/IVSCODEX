<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="shared6.css"><title>IVS CODEX · La linterna</title>
<style>
/* 2 · LA LINTERNA — una sala a oscuras con seis cuadros en la pared. Solo se ve lo que ilumina la luz, que sigue al cursor
   (al dedo en el celular; si nadie la mueve, recorre la sala sola). */
.sala{position:relative;padding:clamp(60px,9vw,110px) var(--pad) clamp(70px,10vw,130px);overflow:hidden;--mx:50%;--my:40%}
.sala-cab{position:relative;z-index:3;display:grid;gap:12px;margin-bottom:clamp(28px,4vw,54px)}
.cuadros{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,34px)}
.cuadro{--c:var(--gold);position:relative;padding:clamp(18px,2.2vw,30px);border:1px solid rgba(217,163,27,.28);aspect-ratio:4/4.5;display:flex;flex-direction:column;background:rgba(241,238,230,.015)}
.cuadro::before{content:"";position:absolute;inset:7px;border:1px solid rgba(241,238,230,.07);pointer-events:none}
.cuadro .lat{font:500 11.5px/1 var(--caps);letter-spacing:.26em;color:var(--c)}
.cuadro .dib{margin:clamp(10px,1.6vw,22px) auto;width:62%}
.cuadro .dib .dl{stroke-dashoffset:0}.cuadro .dib .dd{opacity:1}
.cuadro h3{margin:auto 0 6px;font:500 clamp(20px,2vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.cuadro p{margin:0;font-size:clamp(12.5px,1.05vw,14.5px);color:var(--mute);line-height:1.5}
/* la oscuridad: cubre la sala y deja un círculo de luz */
.sala::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle clamp(150px,19vw,290px) at var(--mx) var(--my),rgba(16,14,11,0) 0,rgba(16,14,11,.55) 55%,rgba(16,14,11,.955) 100%)}
.sala .luz{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle clamp(120px,15vw,230px) at var(--mx) var(--my),rgba(255,226,150,.16),rgba(217,163,27,.05) 55%,transparent 100%)}
.sala .manija{position:absolute;left:var(--mx);top:var(--my);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 30px 8px rgba(217,163,27,.5);z-index:5;pointer-events:none}
.pista-l{position:relative;z-index:3;margin-top:clamp(26px,4vw,50px);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
@media (max-width:900px){.cuadros{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cuadros{grid-template-columns:1fr}.cuadro{aspect-ratio:auto;min-height:230px}.cuadro .dib{width:42%}.sala::after{background:radial-gradient(circle 190px at var(--mx) var(--my),rgba(16,14,11,0) 0,rgba(16,14,11,.5) 55%,rgba(16,14,11,.9) 100%)}}
.prinl{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,3vw,40px);padding:clamp(40px,6vw,80px) var(--pad) 0}
.prinl div{padding-top:14px;border-top:1px solid var(--line)}
.prinl b{font:500 12px/1 var(--caps);letter-spacing:.22em;color:var(--gold)}
.prinl h3{margin:10px 0 6px;font:500 clamp(20px,2vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.prinl p{margin:0;color:var(--mute);font-size:14.5px}
@media (max-width:760px){.prinl{grid-template-columns:1fr}}
</style></head><body><script src="../v4/shared.js"></script><script src="shared6.js"></script>
<script>
var m=IVS6.montar();
var s=document.createElement("section");s.className="sala";s.id="sala";
s.innerHTML='<div class="sala-cab"><p class="eyebrow">LVX</p><h2 class="h2">Seis cuadros, <em>a oscuras.</em></h2><p class="lead6">Pase la luz por la sala para ver qué ofrece cada uno.</p></div><div class="cuadros" id="cuadros"></div><p class="pista-l">Mueva el cursor · o deslice el dedo</p><div class="luz"></div><i class="manija"></i>';
m.appendChild(s);
document.getElementById("cuadros").innerHTML=IVS4.OFERTAS.map(function(f){return '<article class="cuadro" style="--c:var('+f.c+')"><span class="lat">'+f.lat+'</span>'+IVS4.dibujo(f.k)+'<h3>'+f.t+'</h3><p>'+f.d+'</p></article>';}).join("");
var pr=document.createElement("section");pr.className="prinl";pr.innerHTML=IVS6.PRINC.map(function(p){return '<div><b>'+p[0]+'</b><h3>'+p[1]+'.</h3><p>'+p[2]+'</p></div>';}).join("");m.appendChild(pr);
IVS6.cierre(m);
/* la luz: sigue al puntero; sin movimiento del usuario, recorre la sala sola */
(function(){var el=document.getElementById("sala"),usr=0,t0=performance.now(),quieto=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function pon(x,y){el.style.setProperty("--mx",x+"px");el.style.setProperty("--my",y+"px");}
 function rel(e){var r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top];}
 el.addEventListener("pointermove",function(e){usr=performance.now();var q=rel(e);pon(q[0],q[1]);});
 el.addEventListener("touchmove",function(e){usr=performance.now();var q=rel(e);pon(q[0],q[1]);},{passive:true});
 function tic(now){if(!quieto&&now-usr>2600){var r=el.getBoundingClientRect(),vis=r.top<innerHeight&&r.bottom>0;if(vis){var t=(now-t0)/1000;pon(r.width*(.5+.4*Math.sin(t*.45)),Math.min(r.height,innerHeight)*(.45+.12*Math.sin(t*.8))+Math.max(0,-r.top)+r.height*.12*Math.cos(t*.3));}}requestAnimationFrame(tic);}
 pon(el.clientWidth*.5,el.clientHeight*.35);if(!quieto)requestAnimationFrame(tic);})();
</script></body></html>
