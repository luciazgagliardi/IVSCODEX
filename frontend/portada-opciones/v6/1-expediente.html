<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="shared6.css"><title>IVS CODEX · El expediente</title>
<style>
/* 1 · EL EXPEDIENTE — lo que ofrece la página se presenta como fojas de un expediente: cada una se apila sobre la anterior
   al bajar, foliada («Fs. 1…»), con su dibujo a tinta. La última foja lleva el sello. */
.exp{padding:clamp(60px,9vw,120px) var(--pad) 0;overflow-x:clip}
.exp-cab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:clamp(30px,5vw,60px)}
.exp-cab p{margin:0;max-width:34ch;color:var(--mute);font-size:14.5px}
.pila{position:relative;padding-bottom:clamp(30px,6vw,80px)}
.foja{--c:var(--gold);position:sticky;top:calc(84px + var(--i) * 16px);height:min(62svh,500px);margin:0 0 min(18svh,150px);padding:clamp(22px,3vw,40px);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(16px,4vw,56px);align-items:center;background:#efe9d9;color:#1a1712;border-radius:4px;
  box-shadow:0 30px 60px -28px rgba(0,0,0,.85),0 0 0 1px rgba(26,23,18,.18),inset 0 0 60px rgba(120,95,40,.16);transform:rotate(var(--r,0deg));transform-origin:50% 100%;transition:transform .5s var(--ease)}
.foja::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 50%,#100e0b 0 3px,transparent 3.5px) 0 0/14px 34px repeat-y;opacity:.55}
.foja .fs{position:absolute;right:clamp(18px,2.4vw,34px);top:clamp(14px,2vw,26px);font:500 12px/1 var(--caps);letter-spacing:.2em;color:#8a6200;border:1px solid #8a6200;border-radius:999px;padding:7px 12px 6px}
.foja .lat{font:500 12px/1 var(--caps);letter-spacing:.26em;color:var(--c);filter:brightness(.72) saturate(1.2)}
.foja h3{margin:12px 0 10px;font:500 clamp(26px,3.6vw,50px)/1 var(--sans);letter-spacing:-.04em}
.foja p{margin:0;max-width:40ch;font-size:clamp(13.5px,1.25vw,16px);line-height:1.55;color:#4a4435}
.foja .dib .dl{stroke:#1a1712;stroke-width:1.5;stroke-dashoffset:0}
.foja .dib .dd{fill:#8a6200;opacity:1}
.foja .dib{max-height:34svh}
.foja.ult{background:#15120d;color:var(--fg);box-shadow:0 30px 60px -28px rgba(0,0,0,.9),0 0 0 1px rgba(217,163,27,.5)}
.foja.ult p{color:var(--mute)}
.foja.ult .fs{color:var(--gold);border-color:var(--gold)}
.prin{display:grid;gap:12px}
.prin div{padding-top:10px;border-top:1px solid rgba(241,238,230,.18)}
.prin b{display:block;font:500 12px/1.2 var(--caps);letter-spacing:.2em;color:var(--gold)}
.prin span{display:block;margin-top:4px;font-size:13.5px;color:var(--mute)}
.lacre{position:absolute;right:clamp(16px,3vw,40px);bottom:clamp(14px,2.4vw,30px);width:clamp(76px,10vw,120px);aspect-ratio:1;animation:selloIn 1.1s var(--ease) both paused}
.foja.ult.on .lacre{animation-play-state:running}
@keyframes selloIn{from{transform:scale(2.4) rotate(-30deg);opacity:0}60%{opacity:1}to{transform:rotate(-8deg)}}
@media (max-width:760px){.foja{grid-template-columns:1fr;height:auto;min-height:60svh;align-content:center;top:calc(74px + var(--i) * 12px)}.foja .dib{max-height:22svh;width:60%}.lacre{display:none}}
</style></head><body><script src="../v4/shared.js"></script><script src="shared6.js"></script>
<script>
var m=IVS6.montar();
var s=document.createElement("section");s.className="exp";
s.innerHTML='<div class="exp-cab"><div><p class="eyebrow">EXPEDIENTE N.º 1</p><h2 class="h2">Todo lo que ofrece, <em>foliado.</em></h2></div><p>Siete fojas, una por cosa que ofrece la página. Bajando, cada una cubre a la anterior.</p></div><div class="pila" id="pila"></div>';
m.appendChild(s);
var pila=document.getElementById("pila"),rot=[-1.2,.9,-.6,1.1,-.9,.7];
pila.innerHTML=IVS4.OFERTAS.map(function(f,i){return '<article class="foja" style="--i:'+i+';--c:var('+f.c+');--r:'+rot[i]+'deg"><div><span class="lat">'+f.lat+'</span><h3>'+f.t+'</h3><p>'+f.d+'</p></div><div>'+IVS4.dibujo(f.k)+'</div><span class="fs">Fs. '+(i+1)+'</span></article>';}).join("")+
 '<article class="foja ult" id="ult" style="--i:6;--r:-.4deg"><div><span class="lat">FIDES · PRINCIPIOS</span><h3>Tres condiciones que ningún resultado puede dejar de cumplir.</h3></div><div class="prin">'+IVS6.PRINC.map(function(p){return '<div><b>'+p[0]+' · '+p[1]+'</b><span>'+p[2]+'</span></div>';}).join("")+'</div><span class="fs">Fs. 7</span>'+
 '<svg class="lacre" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="aro" d="M60 14a46 46 0 1 1 0 92a46 46 0 1 1 0-92"/></defs><circle cx="60" cy="60" r="57" fill="none" stroke="#d9a31b" stroke-width="1.5"/><circle cx="60" cy="60" r="35" fill="none" stroke="#d9a31b" stroke-width="1"/><text font-family="Cormorant SC,serif" font-size="9.5" letter-spacing="2.4" fill="#d9a31b"><textPath href="#aro">VERIFICADO · IVS CODEX · FIDES · </textPath></text><circle cx="60" cy="60" r="5" fill="#d9a31b"/></svg></article>';
IVS6.cierre(m);
var ult=document.getElementById("ult");new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting)ult.classList.add("on");});},{threshold:.55}).observe(ult);
</script></body></html>
