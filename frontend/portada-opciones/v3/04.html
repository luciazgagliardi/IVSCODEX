<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IVS CODEX · Portada 4 · Trenza</title>
<meta name="theme-color" content="#100e0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="c.css">
<style>

.hero .top{position:absolute;left:var(--pad);top:clamp(80px,13vh,130px);max-width:min(640px,88vw);z-index:3}
.hero .t{font-size:clamp(28px,3.6vw,56px)}
.hero .bot{position:absolute;left:var(--pad);bottom:clamp(22px,6vh,60px);z-index:3}

</style></head>
<body>
<div class="grano" aria-hidden="true"></div>
<header class="cab"><span class="marca">I<span class="v">V</span>S<span class="d"></span>CODE<span class="v">X</span></span><nav><a href="#">Consulta</a><a href="#">Fuentes</a><a href="#">Verificación</a><a href="#">Cuenta</a></nav><a class="btn" href="#">Iniciar la consulta</a></header>
<section class="hero" id="hero">
  <canvas class="fx" id="cv" aria-hidden="true"></canvas>
  <div class="top"><h1 class="t">Buscador integrado de repositorios judiciales oficiales y <em>doctrina.</em></h1></div>
  <div class="acc bot"><a class="btn" href="#">Iniciar la consulta</a><a class="btn sec" href="#">Ver el catálogo de fuentes</a></div>
</section>
<script>
/* 4 · TRENZA — seis hebras, una por base, se trenzan a la izquierda; a medida que avanzan se aprietan y se
   funden en una sola hebra dorada que termina en el punto del logo. */
(function(){
  var hero=document.getElementById("hero"),cv=document.getElementById("cv"),ctx=cv.getContext("2d"),W=1,H=1,D=Math.min(devicePixelRatio||1,2),quieto=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var cs=getComputedStyle(document.documentElement);
  var C=["--c-mza","--c-mzl","--c-caba","--c-csjn","--c-saij","--c-dial"].map(function(k){var h=cs.getPropertyValue(k).trim();return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];});
  var ORO=[240,190,60],my=0,last=0,t=0;
  function medir(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*D;cv.height=H*D;}
  addEventListener("resize",medir);medir();
  hero.addEventListener("pointermove",function(e){my=(e.clientY/H-.5);});
  function sm(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
  function mix(a,b,k){return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];}
  function frame(now){
    var dt=Math.min((now-last)/1000,.05);last=now;if(!quieto)t+=dt;
    ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);
    var m=W<700,cy=H*(m?.62:.6),xm=W*(m?.5:.56),xe=W*(m?.9:.86),A0=Math.min(H*.2,m?96:170)*(1+my*.25),k=m?.018:.0105;
    var seg=[],st=m?7:5;
    for(var i=0;i<6;i++){
      var ph=i*Math.PI/3,px=null,py=null;
      for(var x=0;x<=xm;x+=st){
        var env=1-sm(x/xm),a=x*k-t*.9+ph,y=cy+env*A0*Math.sin(a)+env*A0*.15*Math.sin(a*2.3+i),z=Math.cos(a);
        if(px!==null)seg.push({x0:px,y0:py,x1:x,y1:y,z:z,i:i,u:x/xm,e:env});
        px=x;py=y;
      }
    }
    seg.sort(function(a,b){return a.z-b.z;});
    ctx.lineCap="round";
    seg.forEach(function(s){
      var f=(s.z+1)/2,c=mix(C[s.i],ORO,Math.pow(s.u,1.6)),w=1+2.6*f*(.35+.65*s.e)+(1-s.e)*1.2;
      ctx.strokeStyle="rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+(.22+.7*f).toFixed(3)+")";ctx.lineWidth=w;
      ctx.beginPath();ctx.moveTo(s.x0,s.y0);ctx.lineTo(s.x1,s.y1);ctx.stroke();
    });
    // hebra única, dorada
    var g=ctx.createLinearGradient(xm,0,xe,0);g.addColorStop(0,"rgba(255,222,130,.95)");g.addColorStop(1,"rgba(217,163,27,.95)");
    ctx.beginPath();var ey=cy;
    for(var x2=xm;x2<=xe;x2+=st){var d=(x2-xm)/(xe-xm),y2=cy+Math.sin(x2*k*.7-t*.7)*A0*.07*(1-d)*(1+0);ctx.lineTo(x2,y2);ey=y2;}
    ctx.strokeStyle=g;ctx.lineWidth=3.2;ctx.stroke();
    ctx.globalCompositeOperation="lighter";ctx.strokeStyle="rgba(217,163,27,.12)";ctx.lineWidth=14;ctx.stroke();
    var pg=ctx.createRadialGradient(xe,ey,0,xe,ey,46);pg.addColorStop(0,"rgba(255,226,140,.55)");pg.addColorStop(1,"rgba(217,163,27,0)");
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(xe,ey,46,0,7);ctx.fill();ctx.globalCompositeOperation="source-over";
    var dg=ctx.createLinearGradient(xe,ey-9,xe,ey+9);dg.addColorStop(0,"#f0c75a");dg.addColorStop(.5,"#d9a31b");dg.addColorStop(1,"#a77a0c");
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(xe,ey,9,0,7);ctx.fill();
    // rótulos de las hebras, al inicio
    ctx.font="500 11px 'Cormorant SC',serif";ctx.textBaseline="middle";ctx.textAlign="left";
    if(W>=700)["MZA","MZA LEGAL","TSJ","CSJN","SAIJ","DIALNET"].forEach(function(n,i){
      var y=cy+A0*Math.sin(i*Math.PI/3-t*.9)+A0*.15*Math.sin(i*Math.PI/3*2.3+i);
      ctx.fillStyle="rgba("+C[i][0]+","+C[i][1]+","+C[i][2]+",.9)";ctx.fillText(n,W<700?10:24,y-12);
    });
    if(!quieto)requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(n){last=n;frame(n);});
})();
</script>
</body></html>
