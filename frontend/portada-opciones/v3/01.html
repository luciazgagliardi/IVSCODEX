<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IVS CODEX · Portada 1 · Prisma</title>
<meta name="theme-color" content="#100e0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="c.css">
<style>

.hero .top{position:absolute;left:50%;top:clamp(78px,12vh,120px);transform:translateX(-50%);width:min(92vw,880px);text-align:center;z-index:3}
.hero .bot{position:absolute;left:50%;bottom:clamp(22px,6vh,60px);transform:translateX(-50%);z-index:3;justify-content:center}
@media (max-width:640px){.hero .top{top:84px}}

</style></head>
<body>
<div class="grano" aria-hidden="true"></div>
<header class="cab"><span class="marca">I<span class="v">V</span>S<span class="d"></span>CODE<span class="v">X</span></span><nav><a href="#">Consulta</a><a href="#">Fuentes</a><a href="#">Verificación</a><a href="#">Cuenta</a></nav><a class="btn" href="#">Iniciar la consulta</a></header>
<section class="hero" id="hero">
  <canvas class="fx" id="cv" aria-hidden="true"></canvas>
  <div class="top"><h1 class="t">Buscador integrado de repositorios judiciales oficiales y <em>doctrina.</em></h1></div>
  <div class="acc bot"><a class="btn" href="#">Iniciar la consulta</a><a class="btn sec" href="#">Ver el catálogo de fuentes</a></div>
</section>
<script>
/* 1 · PRISMA — seis haces de color (una base cada uno) entran por la izquierda, atraviesan un prisma y
   salen como un solo haz dorado. Pulsos de luz recorren cada haz. El punto de convergencia sigue al cursor. */
(function(){
  var hero=document.getElementById("hero"),cv=document.getElementById("cv"),ctx=cv.getContext("2d"),W=1,H=1,D=Math.min(devicePixelRatio||1,2);
  var cs=getComputedStyle(document.documentElement),quieto=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var B=[["MZA","--c-mza"],["MZA LEGAL","--c-mzl"],["TSJ","--c-caba"],["CSJN","--c-csjn"],["SAIJ","--c-saij"],["DIALNET","--c-dial"]].map(function(b){
    var h=cs.getPropertyValue(b[1]).trim();return {n:b[0],c:[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],next:0};});
  var P={x:0,y:0,ty:0},Y=[],puls=[],my=0,tm=0;
  function medir(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*D;cv.height=H*D;geo();}
  function geo(){var m=W<700,top=H*(m?.40:.37),bot=H*(m?.68:.70);Y=B.map(function(_,i){return top+i*(bot-top)/5;});P.x=W*(m?.6:.55);P.base=(top+bot)/2;}
  addEventListener("resize",medir);medir();
  hero.addEventListener("pointermove",function(e){var r=hero.getBoundingClientRect();my=((e.clientY-r.top)/H-.5)*H*.14;});
  function bez(i,t){var A=[0,Y[i]],C=[P.x*.55,Y[i]],u=1-t;return [u*u*A[0]+2*u*t*C[0]+t*t*P.x,u*u*A[1]+2*u*t*C[1]+t*t*P.y];}
  function rgba(c,a){return "rgba("+c[0]+","+c[1]+","+c[2]+","+a.toFixed(3)+")";}
  var ORO=[217,163,27],CLARO=[255,226,150],last=0;
  function dibujar(now){
    var dt=Math.min((now-last)/1000,.05);last=now;tm+=dt;
    P.ty=P.base+my;P.y+=(P.ty-P.y)*Math.min(1,dt*3);
    ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";ctx.lineCap="round";
    B.forEach(function(b,i){
      var g=ctx.createLinearGradient(0,0,P.x,0);g.addColorStop(0,rgba(b.c,.0));g.addColorStop(.25,rgba(b.c,.5));g.addColorStop(1,rgba(b.c,.85));
      ctx.beginPath();ctx.moveTo(0,Y[i]);ctx.quadraticCurveTo(P.x*.55,Y[i],P.x,P.y);
      ctx.strokeStyle=g;ctx.lineWidth=1.3;ctx.stroke();
      ctx.strokeStyle=rgba(b.c,.07);ctx.lineWidth=9;ctx.stroke();
      if(!quieto){b.next-=dt;if(b.next<=0){b.next=1.1+Math.random()*1.5;puls.push({i:i,t:0,v:.2+Math.random()*.1,out:false,u:0});}}
    });
    var go=ctx.createLinearGradient(P.x,0,W,0);go.addColorStop(0,rgba(CLARO,.95));go.addColorStop(.35,rgba(ORO,.7));go.addColorStop(1,rgba(ORO,.0));
    ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(W,P.y);ctx.strokeStyle=go;ctx.lineWidth=2.4;ctx.stroke();
    ctx.strokeStyle=rgba(ORO,.09);ctx.lineWidth=20;ctx.stroke();
    // pulsos
    puls=puls.filter(function(p){
      if(!p.out){p.t+=p.v*dt;if(p.t>=1){p.out=true;p.u=0;}}else{p.u+=.34*dt;if(p.u>=1)return false;}
      var c=p.out?ORO:B[p.i].c;
      for(var k=0;k<9;k++){
        var xy,al=(1-k/9)*(p.out?.9:.8);
        if(!p.out){var tt=p.t-k*.014;if(tt<0)break;xy=bez(p.i,tt);}else{var uu=p.u-k*.012;if(uu<0)break;xy=[P.x+uu*(W-P.x),P.y];}
        ctx.beginPath();ctx.arc(xy[0],xy[1],k===0?2.4:1.6,0,7);ctx.fillStyle=rgba(p.out?CLARO:c,al);ctx.fill();
        if(k===0){ctx.beginPath();ctx.arc(xy[0],xy[1],8,0,7);ctx.fillStyle=rgba(c,.14);ctx.fill();}
      }
      return true;
    });
    ctx.globalCompositeOperation="source-over";
    // el prisma
    var s=Math.min(W,H)*.1;ctx.beginPath();ctx.moveTo(P.x,P.y-s);ctx.lineTo(P.x-s*.87,P.y+s*.5);ctx.lineTo(P.x+s*.87,P.y+s*.5);ctx.closePath();
    ctx.fillStyle="rgba(241,238,230,.035)";ctx.fill();ctx.strokeStyle="rgba(241,238,230,.6)";ctx.lineWidth=1;ctx.stroke();
    var gl=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,s*1.3);gl.addColorStop(0,"rgba(255,226,150,.5)");gl.addColorStop(1,"rgba(217,163,27,0)");
    ctx.globalCompositeOperation="lighter";ctx.fillStyle=gl;ctx.beginPath();ctx.arc(P.x,P.y,s*1.3,0,7);ctx.fill();ctx.globalCompositeOperation="source-over";
    // rótulos
    ctx.font="500 11.5px 'Cormorant SC',serif";ctx.textBaseline="middle";
    B.forEach(function(b,i){ctx.fillStyle=rgba(b.c,.95);ctx.textAlign="left";ctx.fillText(b.n.split("").join(String.fromCharCode(8202)),W<700?14:32,Y[i]-12);});
    ctx.textAlign="right";ctx.fillStyle="rgba(217,163,27,.9)";ctx.fillText("UNA CONSULTA",W-(W<700?14:32),P.y-16);
    if(!quieto)requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(function(t){last=t;dibujar(t);});
})();
</script>
</body></html>
