<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="../v6/shared6.css"><title>IVS CODEX · El fichero</title>
<style>
/* 3 · EL FICHERO — el catálogo de una biblioteca: un cajón de fichas en perspectiva. Al bajar, el cajón recorre las fichas una a una
   (cada una con su signatura en latín), y las que ya se leyeron caen hacia adelante. */
.pista3{position:relative;height:640vh}
.esc3{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center;perspective:1500px;perspective-origin:50% 30%}
.cajon{position:relative;width:min(760px,90vw);height:min(66svh,520px);transform-style:preserve-3d;transform:translateY(4svh) rotateX(8deg)}
.ficha{position:absolute;left:0;right:0;bottom:0;height:86%;transform-origin:50% 100%;background:#efe9d9;color:#1a1712;border-radius:6px 6px 2px 2px;box-shadow:0 -6px 18px -8px rgba(0,0,0,.5),inset 0 0 40px rgba(120,95,40,.16);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(12px,3vw,40px);align-items:center;padding:clamp(22px,3.6vw,44px);padding-top:clamp(40px,6vw,64px);will-change:transform}
.ficha::before{content:"";position:absolute;left:0;right:0;top:clamp(26px,3.6vw,38px);height:1px;background:rgba(190,60,60,.5)}
.ficha .pes{position:absolute;left:clamp(22px,3.6vw,44px);top:-26px;height:26px;padding:6px 16px 0;border-radius:8px 8px 0 0;background:#e3d9bc;font:500 11.5px/20px var(--caps);letter-spacing:.2em;color:#8a6200}
.ficha .sig{font:500 11px/1 var(--caps);letter-spacing:.24em;color:#8a6200}
.ficha h3{margin:10px 0 8px;font:500 clamp(24px,3.4vw,46px)/1 var(--sans);letter-spacing:-.04em}
.ficha p{margin:0;max-width:38ch;font-size:clamp(13px,1.3vw,16px);line-height:1.55;color:#4a4435}
.ficha .dib .dl{stroke:#1a1712;stroke-width:1.5;stroke-dashoffset:0}.ficha .dib .dd{fill:#8a6200;opacity:1}.ficha .dib{max-height:30svh}
.ficha .prn{display:grid;gap:8px}.ficha .prn div{padding-top:8px;border-top:1px solid rgba(26,23,18,.25)}.ficha .prn b{display:block;font:500 11px/1.2 var(--caps);letter-spacing:.18em;color:#8a6200}.ficha .prn span{font-size:12.5px;color:#4a4435}
.frente{position:absolute;left:-3%;right:-3%;bottom:-6%;height:21%;z-index:5;background:linear-gradient(#2a2118,#1a140d);border:1px solid #3c2f1d;border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.8)}
.frente .etq{padding:8px 26px;background:#efe9d9;color:#1a1712;border:2px solid #c8952a;border-radius:3px;font:500 12px/1 var(--caps);letter-spacing:.3em}
.frente::before,.frente::after{content:"";position:absolute;top:50%;width:46px;height:12px;margin-top:-6px;border-radius:999px;background:linear-gradient(#f1d27a,#c8952a 55%,#6b4a14)}
.frente::before{left:12%}.frente::after{right:12%}
.cnt3{position:absolute;right:var(--pad);top:clamp(86px,14vh,130px);font:300 clamp(40px,6vw,80px)/1 var(--caps);color:var(--gold);z-index:6}
.tit3{position:absolute;left:var(--pad);top:clamp(86px,14vh,130px);z-index:6;max-width:20ch}
@media (max-width:760px){.ficha{grid-template-columns:1fr;align-content:center;padding-top:44px;height:92%}.ficha .dib{display:none}.cajon{height:60svh}.tit3{top:76px}.cnt3{top:74px}}
</style></head><body><script src="../v4/shared.js"></script><script src="../v6/shared6.js"></script>
<script>
var m=IVS6.montar(),O=IVS4.OFERTAS;
var pista=document.createElement("section");pista.className="pista3";pista.id="pista3";
var SIG=["QVA 1.1","LEC 1.2","MAT 1.3","CAL 1.4","PRO 1.5","INS 1.6"];
pista.innerHTML='<div class="esc3"><div class="tit3"><p class="eyebrow">CATALOGVS</p><h2 class="h2">Una ficha <em>por cosa.</em></h2></div><div class="cnt3" id="cnt3">01</div><div class="cajon" id="cajon"></div></div>';
m.appendChild(pista);
var cajon=document.getElementById("cajon");
var fichas=O.map(function(f,i){return '<article class="ficha"><span class="pes">'+f.lat+'</span><div><span class="sig">SIGNATVRA · '+SIG[i]+'</span><h3>'+f.t+'</h3><p>'+f.d+'</p></div><div>'+IVS4.dibujo(f.k)+'</div></article>';});
fichas.push('<article class="ficha"><span class="pes">FIDES</span><div><span class="sig">SIGNATVRA · FID 2.0</span><h3>Tres condiciones que ningún resultado puede dejar de cumplir.</h3></div><div class="prn">'+IVS6.PRINC.map(function(q){return '<div><b>'+q[0]+' · '+q[1]+'</b><span>'+q[2]+'</span></div>';}).join("")+'</div></article>');
cajon.innerHTML=fichas.join("")+'<div class="frente"><span class="etq">IVS CODEX · A–Z</span></div>';
var els=[].slice.call(cajon.querySelectorAll(".ficha")),N=els.length;
function f(){var r=pista.getBoundingClientRect(),tot=r.height-innerHeight,p=IVS4.clamp(-r.top/tot,0,1),pos=p*(N-1),sm;
 /* cada ficha se queda quieta un rato y pasa de golpe a la siguiente */
 var k=Math.floor(pos),u=pos-k;pos=k+(u<.4?0:u>.8?1:IVS4.sm((u-.4)/.4));pos=Math.min(N-1,pos);
 els.forEach(function(e,i){var d=i-pos,t;
  if(d<=-1.001){t="translate3d(0,-6%,"+(180)+"px) rotateX(-84deg)";e.style.opacity=0;e.style.pointerEvents="none";}
  else if(d<0){t="translate3d(0,"+(d*-6)+"%,"+(-d*180)+"px) rotateX("+(d*84)+"deg)";e.style.opacity=(1+d).toFixed(2);}
  else{t="translate3d(0,"+(-Math.min(d,5)*5.5)+"%,"+(-Math.min(d,5)*70)+"px) rotateX(0deg)";e.style.opacity=Math.max(0,1-Math.max(0,d-3.2)*.6).toFixed(2);}
  e.style.transform=t;e.style.zIndex=String(100-i);e.style.filter="brightness("+(1-Math.min(d>0?d:0,5)*.1).toFixed(2)+")";});
 document.getElementById("cnt3").textContent="0"+(Math.min(N,Math.round(pos)+1))+"/0"+N;}
var pend=false;addEventListener("scroll",function(){if(!pend){pend=true;requestAnimationFrame(function(){pend=false;f();});}},{passive:true});addEventListener("resize",f);f();
IVS6.cierre(m);
</script></body></html>
