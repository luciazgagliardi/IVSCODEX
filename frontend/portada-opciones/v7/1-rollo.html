<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Instrument+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="../v6/shared6.css"><title>IVS CODEX · El rollo</title>
<style>
/* 1 · EL ROLLO (VOLVMEN) — un rollo de papiro se desenrolla con el scroll. Cuando termina de abrirse, el texto sube por dentro, como quien lo lee.
   Dentro: lo que ofrece la página, los tres principios y el sello. */
.pista1{position:relative;height:620vh}
.esc1{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.vol{position:relative;width:min(780px,92vw);--h:0px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.vara{position:relative;z-index:3;height:30px;margin:0 -16px;border-radius:999px;background:linear-gradient(#6b4a14 0,#c8952a 22%,#f1d27a 44%,#c8952a 66%,#5d3f0e 100%);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4)}
.vara::before,.vara::after{content:"";position:absolute;top:-4px;width:20px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c8952a 60%,#6b4a14)}
.vara::before{left:-12px}.vara::after{right:-12px}
.papel{position:relative;height:var(--h);overflow:hidden;background:linear-gradient(90deg,rgba(90,60,10,.28),transparent 7%,transparent 93%,rgba(90,60,10,.28)),repeating-linear-gradient(0deg,rgba(120,90,40,.05) 0 2px,transparent 2px 5px),#e8dfc6;color:#1a1712;
  -webkit-mask-image:linear-gradient(transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(transparent,#000 4%,#000 96%,transparent)}
.texto{position:absolute;left:0;right:0;top:0;padding:clamp(28px,5vh,50px) clamp(24px,6vw,60px) 80px;will-change:transform}
.texto h2{margin:0 0 6px;font:500 12px/1 var(--caps);letter-spacing:.3em;color:#8a6200}
.texto h1,.texto h3.g{margin:0 0 clamp(18px,3vh,30px);font:500 clamp(24px,3.6vw,42px)/1.02 var(--sans);letter-spacing:-.04em}
.ofer{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px 20px;align-items:center;padding:clamp(14px,2.4vh,22px) 0;border-top:1px solid rgba(26,23,18,.25)}
.ofer .lat{font:500 11px/1 var(--caps);letter-spacing:.24em;color:#8a6200}
.ofer h3{margin:4px 0 4px;font:500 clamp(20px,2.4vw,30px)/1.05 var(--sans);letter-spacing:-.035em}
.ofer p{margin:0;font-size:clamp(13px,1.25vw,15.5px);line-height:1.5;color:#4a4435}
.ofer .dib .dl{stroke:#1a1712;stroke-width:1.6;stroke-dashoffset:0}.ofer .dib .dd{fill:#8a6200;opacity:1}
.fines{padding-top:20px;border-top:1px solid rgba(26,23,18,.25)}
.fines div{padding:10px 0;border-bottom:1px solid rgba(26,23,18,.15)}
.fines b{display:block;font:500 11px/1.2 var(--caps);letter-spacing:.2em;color:#8a6200}
.fines span{font-size:14px;color:#4a4435}
.firma{margin:26px auto 0;width:92px;display:block}
.guia1{position:absolute;right:var(--pad);bottom:clamp(20px,4vh,40px);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
@media (max-width:640px){.ofer{grid-template-columns:minmax(0,1fr) 64px}}
</style></head><body><script src="../v4/shared.js"></script><script src="../v6/shared6.js"></script>
<script>
var m=IVS6.montar(),O=IVS4.OFERTAS;
var pista=document.createElement("section");pista.className="pista1";pista.id="pista1";
var princ=IVS6.PRINC.map(function(q){return '<div><b>'+q[0]+' · '+q[1]+'</b><span>'+q[2]+'</span></div>';}).join("");
pista.innerHTML='<div class="esc1"><div class="vol" id="vol"><div class="vara"></div><div class="papel" id="papel"><div class="texto" id="texto"><h2>VOLVMEN · IVS CODEX</h2><h1>Lo que ofrece, <span style="color:#8a6200">escrito en un rollo.</span></h1>'+
 O.map(function(f){return '<div class="ofer"><div><span class="lat">'+f.lat+'</span><h3>'+f.t+'</h3><p>'+f.d+'</p></div><div>'+IVS4.dibujo(f.k)+'</div></div>';}).join("")+
 '<h3 class="g" style="margin-top:34px">Tres condiciones que ningún resultado puede dejar de cumplir.</h3><div class="fines">'+princ+'</div>'+
 '<svg class="firma" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="ar" d="M60 14a46 46 0 1 1 0 92a46 46 0 1 1 0-92"/></defs><circle cx="60" cy="60" r="57" fill="none" stroke="#8a6200" stroke-width="1.5"/><circle cx="60" cy="60" r="35" fill="none" stroke="#8a6200"/><text font-family="Cormorant SC,serif" font-size="9.5" letter-spacing="2.4" fill="#8a6200"><textPath href="#ar">VERIFICADO · IVS CODEX · FIDES · </textPath></text><circle cx="60" cy="60" r="5" fill="#8a6200"/></svg></div></div><div class="vara"></div></div><span class="guia1">Desplace · el rollo se abre</span></div>';
m.appendChild(pista);
var vol=document.getElementById("vol"),papel=document.getElementById("papel"),texto=document.getElementById("texto");
function f(){var r=pista.getBoundingClientRect(),tot=r.height-innerHeight,p=IVS4.clamp(-r.top/tot,0,1),H=Math.min(innerHeight*.78,760);
 var a=IVS4.sm(IVS4.clamp(p/.22,0,1));vol.style.setProperty("--h",(H*a).toFixed(1)+"px");
 var q=IVS4.clamp((p-.22)/.78,0,1),max=Math.max(0,texto.offsetHeight-H);texto.style.transform="translateY("+(-max*q).toFixed(1)+"px)";}
var pend=false;addEventListener("scroll",function(){if(!pend){pend=true;requestAnimationFrame(function(){pend=false;f();});}},{passive:true});addEventListener("resize",f);f();
IVS6.cierre(m);
</script></body></html>
