<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="../p.css"><link rel="stylesheet" href="../v4/shared.css"><link rel="stylesheet" href="../v6/shared6.css"><title>IVS CODEX · La sentencia</title>
<style>
/* 3 · LA SENTENCIA — el resto de la portada se escribe como una sentencia: VISTOS, CONSIDERANDO, SE RESUELVE.
   El texto es enorme y se va «leyendo» palabra por palabra con el scroll; en el margen, cada considerando lleva su dibujo y su rótulo.
   Termina con la parte resolutiva (los botones) y la firma. */
.w{opacity:.17;transition:opacity .35s}.w.on{opacity:1}
.sent{padding:clamp(70px,10vw,140px) var(--pad) 0}
.enc{display:flex;justify-content:space-between;gap:18px;font:500 12px/1.3 var(--caps);letter-spacing:.26em;color:var(--gold);padding-bottom:14px;border-bottom:1px solid var(--line)}
.vistos{margin:clamp(30px,5vw,70px) 0 0;max-width:19em;font:300 clamp(38px,6.6vw,104px)/1.02 "Cormorant",serif;letter-spacing:-.025em;text-wrap:balance}
.vistos b,.cons p b,.res p b{font-weight:inherit;color:var(--gold)}
.lbl{display:block;margin:0 0 clamp(14px,2vw,26px);font:500 12px/1 var(--caps);letter-spacing:.3em;color:var(--gold)}
.cons{display:grid;grid-template-columns:minmax(150px,2fr) minmax(0,10fr);gap:clamp(16px,4vw,60px);padding:clamp(40px,7vw,100px) 0;border-bottom:1px solid var(--line)}
.cons:first-of-type{margin-top:clamp(50px,8vw,110px);border-top:1px solid var(--line)}
.cons .mar{position:sticky;top:96px;align-self:start}
.cons .mar .num{font:300 clamp(50px,6.4vw,100px)/1 var(--caps);color:var(--c);letter-spacing:.02em}
.cons .mar small{display:block;margin:4px 0 16px;font:500 11.5px/1.3 var(--caps);letter-spacing:.26em;color:var(--c)}
.cons .mar .dib{width:min(120px,100%)}.cons .mar .dib .dl{stroke-dashoffset:0}.cons .mar .dib .dd{opacity:1}
.cons p{margin:0;max-width:21em;font:300 clamp(28px,4.1vw,64px)/1.1 "Cormorant",serif;letter-spacing:-.02em;text-wrap:pretty}
.cons p i{font-style:italic;color:var(--mute)}
.ate{margin:clamp(60px,9vw,130px) 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,44px)}
.ate div{padding-top:16px;border-top:1px solid var(--line)}
.ate b{font:500 12px/1 var(--caps);letter-spacing:.26em;color:var(--gold)}.ate h3{margin:10px 0 6px;font:300 clamp(30px,3.6vw,54px)/1 "Cormorant",serif;letter-spacing:-.02em}.ate p{margin:0;color:var(--mute);font-size:15px}
.res{position:relative;margin-top:clamp(70px,11vw,160px);padding:clamp(50px,8vw,110px) var(--pad) clamp(50px,8vw,100px);border-top:1px solid var(--gold);background:linear-gradient(rgba(217,163,27,.06),transparent 60%)}
.res h2{margin:0;font:500 clamp(54px,13vw,230px)/.88 var(--sans);letter-spacing:-.06em}
.res h2 span{color:var(--gold)}
.res p{margin:clamp(18px,3vw,40px) 0 clamp(22px,3vw,40px);max-width:26em;font:300 clamp(26px,3.6vw,54px)/1.1 "Cormorant",serif;letter-spacing:-.02em}
.firma{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,44px);align-items:center;margin-top:clamp(40px,6vw,80px);padding-top:22px;border-top:1px solid var(--line)}
.firma svg{width:clamp(84px,10vw,130px);animation:estampa 1s var(--ease) both paused}.firma svg.on{animation-play-state:running}
@keyframes estampa{from{transform:scale(2.4) rotate(-26deg);opacity:0}55%{opacity:1}to{transform:rotate(-9deg)}}
.firma div{font:italic 300 clamp(18px,2vw,26px)/1.3 "Cormorant",serif;color:var(--mute)}
.firma div b{display:block;font:500 11.5px/1 var(--caps);letter-spacing:.28em;font-style:normal;color:var(--gold);margin-bottom:8px}
.fino{padding:clamp(40px,6vw,80px) var(--pad) 40px}.fino p{max-width:72ch;margin:0 0 24px;color:var(--mute);font-size:14px}.fino .marcaf{font-size:clamp(46px,12vw,200px);line-height:.86;color:rgba(241,238,230,.8)}
@media (max-width:820px){.cons{grid-template-columns:1fr;gap:8px}.cons .mar{position:static;display:flex;gap:16px;align-items:center}.cons .mar .dib{display:none}.cons .mar small{margin:0}.ate{grid-template-columns:1fr}}
</style></head><body><script src="../v4/shared.js"></script><script src="shared8.js"></script>
<script>
var m=IVS8.montar(),O=IVS4.OFERTAS;
var C=["Que la consulta se arma <b>una sola vez</b>, con los operadores de cada buscador oficial, y se envía a las <b>seis bases a la vez</b>.",
"Que el fallo debe leerse con su <b>búsqueda destacada</b>, sus pasajes recortados y la cita preparada para copiar.",
"Que los buscadores judiciales indexan por <b>descriptores técnicos</b> y no por lenguaje natural, por lo que las voces se ordenan por rama del derecho.",
"Que los <b>intereses, índices, despido, incapacidad, honorarios y plazos</b> se calculan en el mismo lugar, con el calendario judicial a la vista.",
"Que toda cita debe <b>contrastarse con los repositorios oficiales</b> antes de presentarse, <i>pues lo que no se puede comprobar no se cita</i>.",
"Que los PDF se <b>unen, dividen, foliar y reducen</b> dentro del navegador, sin que los archivos salgan de la computadora."].map(function(t){return t.replace("foliar","foliar");});
var RO=["I","II","III","IV","V","VI"];
var s=document.createElement("section");s.className="sent";
s.innerHTML='<div class="enc"><span>Autos: «IVS CODEX s/ búsqueda integrada de jurisprudencia»</span><span>Fojas I–VII</span></div>'+
'<p class="vistos scrub"><b>VISTOS</b> los autos: una consulta, seis repositorios judiciales oficiales y doctrina, y el deber de no citar lo que no se pudo comprobar.</p>'+
'<span class="lbl" style="margin-top:clamp(50px,8vw,110px)">Y CONSIDERANDO:</span>'+
O.map(function(f,i){return '<div class="cons" style="--c:var('+f.c+')"><div class="mar"><span class="num">'+RO[i]+'</span><small>'+f.lat+'</small>'+IVS4.dibujo(f.k)+'</div><p class="scrub">'+C[i]+'</p></div>';}).join("")+
'<div class="ate"><span class="lbl" style="grid-column:1/-1;margin:0">ATENTO A ELLO, la plataforma se rige por tres principios:</span>'+IVS8.PRINC.map(function(q){return '<div><b>'+q[0]+'</b><h3>'+q[1]+'.</h3><p>'+q[2]+'</p></div>';}).join("")+'</div>';
m.appendChild(s);
var r=document.createElement("section");r.className="res";
r.innerHTML='<h2>SE <span>RESUELVE:</span></h2><p class="scrub">Habilitar la consulta, <b>verificar siempre en la fuente</b> antes de citar y poner la plataforma a disposición de quien la necesite.</p><div class="acciones"><a class="btn" href="#">Iniciar la consulta</a><a class="btn sec" href="#">Verificar una cita</a></div>'+
'<div class="firma"><svg id="fm" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="af" d="M60 14a46 46 0 1 1 0 92a46 46 0 1 1 0-92"/></defs><circle cx="60" cy="60" r="57" fill="none" stroke="#d9a31b" stroke-width="1.6"/><circle cx="60" cy="60" r="35" fill="none" stroke="#d9a31b"/><text font-family="Cormorant SC,serif" font-size="9.5" letter-spacing="2.4" fill="#d9a31b"><textPath href="#af">VERIFICADO · IVS CODEX · FIDES · </textPath></text><circle cx="60" cy="60" r="5" fill="#d9a31b"/></svg><div><b>REGÍSTRESE, NOTIFÍQUESE Y ARCHÍVESE.</b>IVS EST ARS BONI ET AEQVI</div></div>';
m.appendChild(r);
var pf=document.createElement("footer");pf.className="fino";pf.innerHTML='<p>'+IVS8.ADV+'</p><div class="marcaf marca-g" aria-label="IVS CODEX">I<span class="v">V</span>S<span class="d"></span>CODE<span class="v">X</span></div>';m.appendChild(pf);
IVS8.scrub(document.querySelectorAll(".scrub"));
new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting)document.getElementById("fm").classList.add("on");});},{threshold:.6}).observe(document.getElementById("fm"));
</script></body></html>
