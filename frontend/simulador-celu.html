<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVS CODEX · simulador de celular</title>
<style>
:root{--bg:#1b1a18;--fg:#f1eee6;--gold:#d9a31b;--line:rgba(241,238,230,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 0,#2a2824,#141311);color:var(--fg);font:400 14px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif;overflow:hidden}
/* el celular: se achica solo para entrar en la ventana */
.escena{width:calc(var(--w) * var(--s));height:calc(var(--h) * var(--s));flex:none}
.celu{position:relative;width:var(--w);height:var(--h);transform:scale(var(--s));transform-origin:0 0;
  padding:14px;border-radius:64px;background:linear-gradient(145deg,#3a3835,#0d0c0b 55%,#2c2a27);
  box-shadow:0 0 0 2px #4a4742,0 0 0 5px #0a0908,0 40px 90px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,255,255,.06)}
/* botones laterales */
.celu::before,.celu::after{content:"";position:absolute;width:4px;border-radius:3px;background:#3a3835}
.celu::before{left:-7px;top:150px;height:56px;box-shadow:0 78px 0 #3a3835,0 -52px 0 -0px transparent}
.celu::after{right:-7px;top:200px;height:92px}
.pantalla{position:relative;width:100%;height:100%;overflow:hidden;border-radius:50px;background:#100e0b;display:flex;flex-direction:column}
.estado{position:relative;z-index:3;flex:none;height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;background:#100e0b;color:#f1eee6;font:600 15px/1 -apple-system,"Instrument Sans",sans-serif}
.isla{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000}
.estado .der{display:flex;align-items:center;gap:6px}
.bat{position:relative;width:25px;height:12px;border:1px solid rgba(241,238,230,.5);border-radius:4px}
.bat::before{content:"";position:absolute;inset:1.5px;right:5px;border-radius:2px;background:#f1eee6}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:rgba(241,238,230,.5)}
iframe{flex:1 1 auto;width:100%;border:0;background:#100e0b;display:block}
.inicio{flex:none;height:22px;display:flex;align-items:center;justify-content:center;background:#100e0b}
.inicio i{display:block;width:134px;height:5px;border-radius:3px;background:rgba(241,238,230,.85)}
.barra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.barra button{appearance:none;padding:8px 16px 7px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;transition:border-color .25s,color .25s}
.barra button:hover{border-color:var(--gold);color:var(--gold)}
.barra button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#14110a}
</style>
</head>
<body>
<div class="barra" role="group" aria-label="Opciones del simulador">
  <button type="button" data-w="390" data-h="844" aria-pressed="true">iPhone 390 × 844</button>
  <button type="button" data-w="360" data-h="780" aria-pressed="false">Android 360 × 780</button>
  <button type="button" data-w="320" data-h="640" aria-pressed="false">Chico 320 × 640</button>
  <button type="button" id="recargar">Recargar</button>
</div>
<div class="escena" id="escena">
  <div class="celu" id="celu">
    <div class="pantalla">
      <div class="estado"><span id="hora">9:41</span><span class="isla"></span>
        <span class="der">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#f1eee6" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#f1eee6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 7a6.4 6.4 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1.2" fill="#f1eee6" stroke="none"/></svg>
          <span class="bat"></span>
        </span>
      </div>
      <iframe id="marco" src="./index.html" title="IVS CODEX en el celular"></iframe>
      <div class="inicio"><i></i></div>
    </div>
  </div>
</div>
<script>
(function(){
  var celu=document.getElementById("celu"),esc=document.getElementById("escena"),marco=document.getElementById("marco"),W=390,H=844;
  function ajustar(){
    var cw=W+28,ch=H+28;                       /* la pantalla + el borde del aparato */
    var s=Math.min(1,(innerHeight-70)/ch,(innerWidth-40)/cw);
    celu.style.setProperty("--w",cw+"px");celu.style.setProperty("--h",ch+"px");celu.style.setProperty("--s",s.toFixed(4));
    esc.style.setProperty("--w",cw+"px");esc.style.setProperty("--h",ch+"px");esc.style.setProperty("--s",s.toFixed(4));
  }
  [].forEach.call(document.querySelectorAll("[data-w]"),function(b){
    b.addEventListener("click",function(){
      W=+b.getAttribute("data-w");H=+b.getAttribute("data-h");
      [].forEach.call(document.querySelectorAll("[data-w]"),function(x){x.setAttribute("aria-pressed",String(x===b));});
      ajustar();marco.src=marco.src;
    });
  });
  document.getElementById("recargar").addEventListener("click",function(){marco.src=marco.src;});
  function hora(){var d=new Date();document.getElementById("hora").textContent=d.getHours()+":"+("0"+d.getMinutes()).slice(-2);}
  hora();setInterval(hora,20000);
  addEventListener("resize",ajustar);ajustar();
})();
</script>
</body>
</html>
