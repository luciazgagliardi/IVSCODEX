<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iuris Et De Iure</title>
<meta name="description" content="Buscador de jurisprudencia argentina, mendocina e internacional. Arma la consulta y te lleva a las bases oficiales.">
<link rel="icon" type="image/png" href="./emblemaaa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#18140f;
  --tinta:#211c15;
  --tinta2:#69604f;
  --papel:#f3efe5;
  --papel2:#eae3d2;
  --ficha:#ffffff;
  --lacre:#a3781f;
  --lacre2:#87611a;
  --dorado:#d9a62a;
  --acequia:#4f8b76;
  --humo:#948a75;
  --linea:#e2dac4;
  --oro:#a3781f;
  --serif:"Bodoni Moda",Georgia,serif;
  --sans:"IBM Plex Sans",Arial,sans-serif;
  --mono:"IBM Plex Sans",Arial,sans-serif;
  --bokeh:
    radial-gradient(circle at 8% 24%,rgba(255,255,255,.5) 0 3px,transparent 4px),
    radial-gradient(circle at 18% 62%,rgba(255,255,255,.32) 0 5px,transparent 6px),
    radial-gradient(circle at 29% 12%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 41% 78%,rgba(255,255,255,.4) 0 3px,transparent 4px),
    radial-gradient(circle at 54% 34%,rgba(255,255,255,.22) 0 6px,transparent 7px),
    radial-gradient(circle at 63% 8%,rgba(255,255,255,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 71% 58%,rgba(255,255,255,.3) 0 4px,transparent 5px),
    radial-gradient(circle at 83% 22%,rgba(255,255,255,.45) 0 3px,transparent 4px),
    radial-gradient(circle at 91% 70%,rgba(255,255,255,.25) 0 5px,transparent 6px),
    radial-gradient(circle at 12% 88%,rgba(255,255,255,.3) 0 3px,transparent 4px),
    radial-gradient(circle at 48% 92%,rgba(255,255,255,.2) 0 4px,transparent 5px),
    radial-gradient(circle at 96% 40%,rgba(255,255,255,.3) 0 2px,transparent 3px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
a{color:var(--lacre)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lacre2);outline-offset:2px}

/* ---------- cabecera ---------- */
.top{
  position:relative;
  background:linear-gradient(155deg,#221c13 0%,var(--negro) 55%,#0c0a07 100%);
  color:var(--papel);isolation:isolate;padding-bottom:40px;overflow:hidden
}
.top-in{max-width:1560px;margin:0 auto;padding:26px 16px 18px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.marca{flex:1 1 300px;min-width:0}
.marca .titulo-fila{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.marca h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.6vw,44px);
  margin:0;letter-spacing:.03em;color:#fff
}
.marca .lat{font-family:var(--serif);font-style:italic;color:rgba(255,255,255,.78);font-size:14px;margin:0}
.marca .sub{font-family:var(--sans);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:6px}
.marca .sub .dorado{color:var(--dorado);font-weight:600}
.nav{max-width:1560px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav button{
  background:none;border:0;border-radius:999px;
  padding:11px 22px;cursor:pointer;white-space:nowrap;
  font-family:var(--sans);font-size:16px;color:rgba(255,255,255,.8)
}
.nav button:hover{color:#fff;background:rgba(255,255,255,.12)}
.nav button[aria-selected="true"]{color:var(--negro);background:#fff;font-weight:600}

/* ---------- cadena ---------- */
.cadena{position:sticky;top:0;z-index:40;background:var(--papel2)}
.cadena-in{max-width:1560px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center}
.cadena code{
  font-family:var(--mono);font-size:12.5px;color:var(--tinta2);
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.cadena code b{color:var(--lacre);font-weight:600}
.mini{
  background:var(--ficha);border:1px solid var(--linea);border-radius:999px;
  padding:5px 12px;cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--tinta2);white-space:nowrap
}
.mini:hover{border-color:var(--negro);color:var(--negro)}
a.mini{text-decoration:none;display:inline-block;color:var(--tinta2)}
a.mini:hover{color:var(--negro)}

/* ---------- estructura ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 16px 70px;display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start}
.wrap.sin-rail{grid-template-columns:1fr}
.wrap.sin-rail .rail{display:none}
.rail{position:sticky;top:56px}
.rail h2,.blk h2{
  font-family:var(--sans);font-size:11px;letter-spacing:.04em;
  color:var(--humo);margin:0 0 9px;font-weight:600
}
.rail h2{color:var(--lacre);font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.03em}
.voces-tit{
  font-family:var(--serif);font-size:22px;
  color:var(--tinta);margin:0 0 8px;font-weight:500
}
.voces-tit .punto{color:var(--lacre)}
.voces-tit .rama-nom{color:var(--lacre);font-style:italic}
.rail-list{display:flex;flex-direction:column;gap:1px;max-height:62vh;overflow:auto}
.rail-list button{
  text-align:left;background:none;border:0;border-radius:6px;
  padding:6px 9px;cursor:pointer;font-size:13.5px;color:var(--tinta2);
  font-family:var(--sans)
}
.rail-list button:hover{background:var(--papel2)}
.rail-list button[aria-pressed="true"]{background:var(--negro);color:var(--papel);font-weight:500}
.col{min-width:0}

/* ---------- formulario ---------- */
.panel{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:22px 24px;margin-bottom:20px}
.panel.vivo{border-color:var(--acequia)}
.panel.inactivo{border-color:var(--linea)}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-family:var(--sans);font-size:13px;color:var(--tinta2);margin-bottom:6px}
input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;
  background:var(--ficha);font-family:var(--sans);font-size:15px;color:var(--tinta)
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--negro)}
#q{font-family:var(--sans);font-size:16px;padding:13px 14px}
.fila{display:flex;gap:12px;flex-wrap:wrap}
.fila>*{flex:1 1 130px;min-width:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  background:var(--ficha);border:1px solid var(--linea);border-radius:999px;padding:6px 13px;cursor:pointer;
  font-size:13px;font-family:var(--sans);color:var(--tinta2)
}
.chip:hover{border-color:var(--negro)}
.chip[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:var(--papel)}
.chip.amb[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:var(--papel)}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--linea)}
.btn{
  background:var(--negro);color:var(--papel);border:1px solid var(--negro);border-radius:999px;
  padding:10px 20px;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:500
}
.btn:hover{background:#332b1f}
.btn.sec{background:transparent;color:var(--negro);border-color:var(--negro)}
.btn.sec:hover{background:var(--negro);color:var(--papel)}

/* ---------- fuentes ---------- */
.conteo{font-family:var(--sans);font-size:12px;color:var(--humo);margin:0 0 10px}
.grupo{margin-bottom:26px}
.grupo>h3{
  font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 3px;
  padding-bottom:8px;border-bottom:1px solid var(--linea)
}
.grupo>p.desc{margin:0 0 12px;font-size:13px;color:var(--humo)}
.fuente{border-bottom:1px solid var(--linea);padding:13px 0}
.f-top{display:flex;gap:11px;align-items:baseline}
.cod{
  font-family:var(--sans);font-size:10px;letter-spacing:.03em;color:#fff;
  padding:2px 7px;border-radius:999px;flex:0 0 auto;position:relative;top:-1px
}
.cod.mza{background:var(--negro)}.cod.nac{background:var(--tinta2)}
.cod.prov{background:var(--humo)}.cod.int{background:var(--acequia)}.cod.doc{background:var(--dorado);color:var(--negro)}
.f-nom{font-family:var(--serif);font-size:17px;flex:0 1 auto}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--linea);min-width:14px;transform:translateY(-4px)}
.f-org{font-size:12px;color:var(--humo);font-family:var(--sans);flex:0 0 auto}
.f-nota{font-size:15px;color:var(--tinta2);margin:3px 0 7px}
.f-acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--sans);font-size:11px;color:var(--humo);border:1px solid var(--linea);padding:3px 9px;border-radius:999px}
.tag.paga{color:var(--oro);border-color:#e4d19f;background:#fbf3de}
.tag.libre{color:var(--acequia);border-color:#c3d9cd;background:#f0f6f2}
.estrella{background:none;border:0;cursor:pointer;font-size:15px;color:var(--linea);padding:0 4px;line-height:1}
.estrella[aria-pressed="true"]{color:var(--dorado)}

/* ---------- ramas ---------- */
.rama{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:18px 20px;margin-bottom:12px;font-family:var(--sans)}
.rama h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 5px}
.rama p{margin:0 0 12px;font-size:15px;color:var(--tinta2)}
.voces{display:flex;gap:6px;flex-wrap:wrap}
.voz{
  background:var(--papel2);border:1px solid var(--linea);border-radius:999px;padding:4px 10px;cursor:pointer;
  font-size:12.5px;color:var(--tinta2);font-family:var(--sans)
}
.voz:hover{background:var(--negro);color:var(--papel);border-color:var(--negro)}
.rotulo{
  display:inline-block;font-family:var(--sans);font-size:12px;color:var(--tinta2);
  background:var(--papel2);border-radius:999px;padding:5px 13px;margin:9px 0 8px
}

/* ---------- prosa ---------- */
.blk{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.blk h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 8px}
.blk p{margin:0 0 10px;font-size:15px}
.blk ol,.blk ul{margin:0 0 10px;padding-left:20px;font-size:14px}
.blk li{margin-bottom:6px}
.aviso{background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--tinta2);border:1px solid rgba(33,28,21,.1);border-radius:10px;padding:15px 18px;margin-bottom:18px;font-size:15px}
.aviso strong{color:var(--lacre)}
.out{
  font-family:var(--mono);font-size:13px;background:var(--papel2);border:1px solid var(--linea);
  border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;min-height:44px
}
.vacio{border:1px dashed var(--linea);border-radius:10px;padding:26px 20px;text-align:center;color:var(--humo);font-size:14px}

/* ---------- lector ---------- */
textarea{
  width:100%;min-height:260px;padding:12px;border:1px solid var(--linea);border-radius:8px;
  background:var(--ficha);font-family:var(--mono);font-size:14px;line-height:1.5;color:var(--tinta);resize:vertical
}
.barra-doc{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--negro);color:var(--papel);border-radius:10px;padding:9px 14px;margin-bottom:12px
}
.barra-doc .cnt{font-family:var(--sans);font-size:12.5px;flex:1 1 auto;min-width:120px}
.barra-doc .cnt b{color:var(--dorado)}
.barra-doc .mini{background:#2c2618;border-color:#463c28;color:#e8e2d3}
.barra-doc .mini:hover{background:#463c28;border-color:#6b5c3c;color:#fff}
.doc{
  background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:20px 22px;
  font-family:var(--serif);font-size:15.5px;line-height:1.72;white-space:pre-wrap;word-wrap:break-word;
  max-height:64vh;overflow:auto
}
mark{background:#f2dea0;color:var(--negro);padding:0 1px;border-radius:2px;box-decoration-break:clone}
mark.actual{background:var(--negro);color:var(--papel)}
.lector-grid{display:grid;grid-template-columns:262px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:12px}
.meta{
  background:var(--ficha);border:1px solid var(--linea);border-radius:10px;
  padding:16px 17px;max-height:64vh;overflow:auto
}
.meta-top{background:var(--papel2);border:1px solid var(--linea);border-radius:8px;padding:12px 15px;margin-bottom:14px}
.meta-car{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tinta2);margin:0 0 7px;padding-bottom:7px;border-bottom:1px solid var(--linea)}
.meta-fila{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.meta-fila .izq{flex:1 1 auto;font-size:13.5px;color:var(--tinta2)}
.meta-fila .izq b{font-family:var(--sans);font-size:11px;color:var(--humo);font-weight:600;margin-right:3px}
.meta-fila .izq .sep{color:var(--linea);margin:0 3px}
.meta-fila .der{font-family:var(--sans);font-size:11.5px;color:var(--humo);white-space:nowrap;flex:0 0 auto}
.meta-cuerpo{display:flex;flex-direction:column;gap:16px;margin-bottom:14px}
.meta-bloque h3{
  font-family:var(--sans);font-weight:600;font-size:12px;margin:0 0 8px;color:var(--tinta2)
}
.meta-bloque.cn h3{color:var(--lacre)}
.meta-cat{
  font-family:var(--sans);font-weight:600;font-size:11.5px;
  color:var(--tinta2);margin:0;padding-top:10px;
  border-top:1px solid var(--linea)
}
.meta-cat:first-child{padding-top:0;border-top:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.meta-tag{
  background:var(--papel2);border:1px solid var(--linea);border-radius:999px;
  padding:3px 11px;font-family:var(--sans);font-size:12px;color:var(--tinta2);white-space:nowrap
}
.meta-bloque.pendiente h3{color:var(--humo);font-weight:400;font-style:italic}
.meta-bloque.pendiente .meta-tag{background:transparent;border-style:dashed;color:var(--humo)}
.meta-acc{display:flex;gap:8px;flex-wrap:wrap}
.pasaje{background:var(--ficha);border:1px solid var(--dorado);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.pasaje .txt{font-family:var(--serif);font-size:15.5px;line-height:1.6;margin-bottom:8px}
.pasaje .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pasaje .pos{font-family:var(--sans);font-size:11px;color:var(--humo)}
.pie{max-width:1560px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--humo);line-height:1.6}
.pie hr{border:0;border-top:1px solid var(--linea);margin:0 0 14px}

/* ---------- avisos flotantes ---------- */
#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:none;
  background:var(--negro);color:var(--papel);padding:10px 18px;border-radius:999px;font-size:13px;
  box-shadow:0 8px 22px rgba(24,20,15,.28);max-width:90vw}
#panic{display:none;background:#7c1d2b;color:#fff;padding:10px 20px;font-size:13px}
#panic button{background:#fff;color:#7c1d2b;border:0;border-radius:999px;padding:4px 10px;margin-left:10px;cursor:pointer}
.entrada{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,#221c13 0%,var(--negro) 55%,#0c0a07 100%);
  color:#fff;text-align:center;isolation:isolate;cursor:pointer;
  opacity:1;transition:opacity .6s ease-out;
}
.entrada.saliendo{opacity:0;pointer-events:none}
.entrada-contenido{padding:24px;display:flex;flex-direction:column;align-items:center;animation:aparece-entrada 1s ease-out both}
.entrada .titulo-fila{display:flex;align-items:baseline;justify-content:center;gap:16px;flex-wrap:wrap}
.entrada h1{margin:0;font-family:var(--serif);font-size:clamp(34px,7vw,74px);font-weight:400;letter-spacing:.02em;color:#fff}
.entrada p{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.8vw,28px);color:rgba(255,255,255,.82)}
.entrada .sub{
  margin-top:10px;font-family:var(--sans);font-size:clamp(13px,1.6vw,15px);letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,.75)
}
.entrada .sub .dorado{color:var(--dorado);font-weight:600}
.entrada .toque{
  margin-top:26px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,.6);animation:parpadeo-toque 1.8s ease-in-out infinite
}
@keyframes parpadeo-toque{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes aparece-entrada{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .top-in{gap:6px}
  .wrap{grid-template-columns:1fr;gap:16px}
  .rail{position:static}
  .rail-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .rail-list button{white-space:nowrap;padding:6px 12px}
  .f-top{flex-wrap:wrap}
  .leader{display:none}
  .lector-grid{grid-template-columns:1fr}
  .meta{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="panic" role="alert"></div>
<div class="entrada" id="entrada" role="button" tabindex="0" aria-label="Entrada de Iuris et de iure. Tocar para continuar">
  <div class="entrada-contenido">
    <div class="titulo-fila">
      <h1>IURIS ET DE IURE</h1>
      <p>edición especial para mamá &lt;3</p>
    </div>
    <div class="sub"><span class="dorado">Lectio et iurisprudentia</span></div>
    <div class="toque">Tocá para continuar</div>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <div class="marca">
      <div class="titulo-fila">
        <h1>IURIS ET DE IURE</h1>
        <div class="lat">edición especial para mamá &lt;3</div>
      </div>
      <div class="sub"><span class="dorado">Lectio et iurisprudentia</span></div>
    </div>
  </div>
  <nav class="nav" id="nav" role="tablist" aria-label="Secciones"></nav>
</header>

<div class="cadena">
  <div class="cadena-in">
    <code id="cadena" aria-live="polite">Escribí lo que buscás para armar la consulta</code>
    <button class="mini" data-act="copiar-cadena">Copiar</button>
    <button class="mini" data-act="limpiar">Limpiar</button>
  </div>
</div>

<main class="wrap" id="wrap">
  <aside class="rail" id="rail"></aside>
  <div class="col" id="vista"></div>
</main>

<footer class="pie">
  <hr>
  <p id="pie-txt"></p>
</footer>

<div id="flash" role="status" aria-live="polite"></div>

<script>
"use strict";
(function(){

/* ============================================================
   0. Blindaje: ningún error deja la página en blanco.
   ============================================================ */
function panic(msg){
  try{
    var p=document.getElementById("panic");
    p.style.display="block";
    p.textContent="Algo falló al dibujar la pantalla ("+msg+"). El resto sigue funcionando.";
    var b=document.createElement("button");
    b.textContent="Reiniciar";
    b.onclick=function(){ estado=nuevoEstado(); p.style.display="none"; render(); };
    p.appendChild(b);
  }catch(e){}
}
window.onerror=function(m){ panic(String(m).slice(0,90)); return true; };

/* ============================================================
   0.1. Pantalla de entrada — se cierra recién cuando la tocan
   ============================================================ */
(function(){
  try{
    var entrada=document.getElementById("entrada");
    if(!entrada) return;
    function cerrar(){
      entrada.classList.add("saliendo");
      entrada.addEventListener("transitionend",function(){ entrada.style.display="none"; },{once:true});
    }
    entrada.addEventListener("click",cerrar);
    entrada.addEventListener("keydown",function(e){

function detectarServidor(){

  (function probar(){
    if(i>=candidatos.length){ estado.api=false; if(estado.tab==="lector"||estado.tab==="buscar") render(); return; }

function copiar(txt){

/* Pliega el texto (minúsculas, sin acentos) conservando el mapa
   de posiciones hacia el texto original. */
function plegar(t){
  var s="",map=[],i,j,c,n;
  for(i=0;i<t.length;i++){
    c=t.charAt(i);
    try{ n=c.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){ n=c; }
    n=n.toLowerCase();
    for(j=0;j<n.length;j++){ s+=n.charAt(j); map.push(i); }
  }
  map.push(t.length);
  return {s:s,map:map};
}
function terminos(){
  var q=String(estado.q||"").trim();

  if(estado.modo==="exacta") return [q];

var LETRA=/[a-z0-9]/;
function coincidencias(texto){
  var ts=terminos();
  if(!texto||!ts.length) return [];
  var P=plegar(texto),bruto=[],k,pt,from,idx,fin,okA,okB;
  for(k=0;k<ts.length;k++){
    pt=plegar(ts[k]).s.trim();
    if(!pt) continue;
    from=0;
    while(bruto.length<6000){
      idx=P.s.indexOf(pt,from);
      if(idx<0) break;
      fin=idx+pt.length;
      okA=estado.parcial||idx===0||!LETRA.test(P.s.charAt(idx-1));
      okB=estado.parcial||fin>=P.s.length||!LETRA.test(P.s.charAt(fin));
      if(okA&&okB) bruto.push({a:P.map[idx],b:P.map[fin]});
      from=idx+1;
    }
  }
  bruto.sort(function(x,y){return x.a-y.a||x.b-y.b;});
  var out=[];
  for(k=0;k<bruto.length;k++){
    if(out.length&&bruto[k].a<=out[out.length-1].b){
      if(bruto[k].b>out[out.length-1].b) out[out.length-1].b=bruto[k].b;
    }else out.push({a:bruto[k].a,b:bruto[k].b});
  }
  return out;
}

}
/* Agrupa coincidencias cercanas y devuelve el pasaje con contexto */
function pasajesDe(texto,cs){
  var grupos=[],i;
  for(i=0;i<cs.length;i++){
    if(grupos.length&&cs[i].a-grupos[grupos.length-1].b<170) grupos[grupos.length-1].b=cs[i].b;
    else grupos.push({a:cs[i].a,b:cs[i].b});
    if(grupos.length>=120) break;
  }
  return grupos.map(function(g){
    var ini=Math.max(0,g.a-210),fin=Math.min(texto.length,g.b+210);
    var e1=texto.indexOf(" ",ini); if(ini>0&&e1>=0&&e1<g.a) ini=e1+1;
    var e2=texto.lastIndexOf(" ",fin); if(fin<texto.length&&e2>g.b) fin=e2;
    var frag=texto.slice(ini,fin).replace(/\s+/g," ").trim();
    var dentro=cs.filter(function(c){return c.a>=ini&&c.b<=fin;});
    var rel=texto.slice(ini,fin),h="",pos=0;
    dentro.forEach(function(c){
      h+=esc(rel.slice(pos,c.a-ini))+"<mark>"+esc(rel.slice(c.a-ini,c.b-ini))+"</mark>";
      pos=c.b-ini;
    });
    h+=esc(rel.slice(pos));
    return {ini:ini,html:(ini>0?"… ":"")+h.replace(/\s+/g," ")+(fin<texto.length?" …":""),
            txt:(ini>0?"… ":"")+frag+(fin<texto.length?" …":"")};
  });

   como propuesta para confirmar, nunca como dato cerrado. */
var MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,
           septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};

/* Los tribunales fechan la sentencia en letras ("a los quince días del mes
   de julio del año dos mil veintiséis"), nunca en números: sin esto, la
   fecha propia del fallo no se detecta y el analizador termina agarrando
   la fecha de otro fallo citado más abajo en el texto. */
function sinTildes(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

var UNIDADES_0_9={cero:0,un:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9};
var ESPECIALES_10_29={
  diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,
  dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,
  veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,
  veintiocho:28,veintinueve:29
};
var DECENAS={treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};

/** "quince" -> 15, "treinta y uno" -> 31, "cuarenta y dos" -> 42. Nulo si no reconoce. */
function numeroPalabras(frag){
  var s=sinTildes(frag).replace(/\s+/g," ").trim();
  var junto=s.replace(/\s/g,"");
  if(ESPECIALES_10_29.hasOwnProperty(junto)) return ESPECIALES_10_29[junto];
  if(UNIDADES_0_9.hasOwnProperty(s)) return UNIDADES_0_9[s];
  if(DECENAS.hasOwnProperty(s)) return DECENAS[s];
  var partes=s.split(" y ");
  if(partes.length===2&&DECENAS.hasOwnProperty(partes[0])&&UNIDADES_0_9.hasOwnProperty(partes[1])){
    return DECENAS[partes[0]]+UNIDADES_0_9[partes[1]];
  }
  return null;
}
/** "dos mil veintiséis" -> 2026, "mil novecientos noventa y ocho" -> 1998. */
function anioPalabras(frag){
  var s=sinTildes(frag).replace(/\s+/g," ").trim();
  var m=s.match(/^(mil novecientos|dos mil)\s*(.*)$/);
  if(!m) return null;
  var base=m[1]==="dos mil"?2000:1900;
  if(!m[2]) return base;
  var resto=numeroPalabras(m[2]);
  return resto===null?null:base+resto;
}
/** Busca la fórmula clásica de apertura ("a los N días del mes de MES de AÑO")
    y devuelve la fecha ya armada, o null si no la encuentra. */
function fechaDeFormulaApertura(ventana){
  var re=/a\s+los?\s+([a-záéíóúñ]+)\s+d[ií]as?\s+(?:del?\s+mes\s+de\s+|de\s+)([a-záéíóúñ]+)\s+de(?:l)?\s+(?:año\s+)?([a-záéíóúñ\s]+?)(?:[,.;\n]|$)/i;
  var m=ventana.match(re);
  if(!m) return null;
  var dia=numeroPalabras(m[1]),mes=MESES[sinTildes(m[2])],anio=anioPalabras(m[3]);
  if(dia==null||!mes||anio==null) return null;
  return ("0"+dia).slice(-2)+"/"+("0"+mes).slice(-2)+"/"+anio;
}

function pintarCadena(){
  var el=document.getElementById("cadena");
  var c=cadena();
  if(!c){ el.textContent="Escribí lo que buscás para armar la consulta"; return; }
  var partes=[esc(c)];
  if(estado.rama) partes.push(esc(nombreRama(estado.rama)));
  if(estado.desde||estado.hasta) partes.push(esc((estado.desde||"…")+"–"+(estado.hasta||"…")));
  var ambs=Object.keys(estado.ambitos).filter(function(k){return estado.ambitos[k];})
            .map(function(k){return k.toUpperCase();});
  if(ambs.length) partes.push(ambs.join("+"));

/* ---- Resultados en vivo de los buscadores con robot propio ---- */
function resaltarSimple(texto,q){
  var t=esc(texto||"");
  palabras(q).forEach(function(w){
    if(w.length<2) return;
    var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    t=t.replace(re,"<mark>$1</mark>");
  });
  return t;
}

/* Cada fuente trae los campos que su buscador ofrece: Mendoza da voces y
   sumario, CABA da carátula y secretaría pero no sumario. La ficha se
   arma con lo que haya. */
/* La fecha del índice viene como "27/07/2026 - Sentencia": nos quedamos
   solo con la parte de fecha, que es la que entiende el formateador. */
function fichaDesdeIndice(slug,r){
  var fecha=r.fecha?(r.fecha.match(/\d{1,2}\/\d{1,2}\/\d{4}/)||[])[0]:"";
  return {tipo:slug==="mendoza"?"scjm":"cam",car:r.caratula,trib:r.tribunal,
          fecha:fecha||r.fecha,exp:r.expediente};
}
function fichaIndice(f,r){

  var meta=[r.tribunal,r.secretaria,r.fecha,r.magistrados,r.expediente?"Expte. "+r.expediente:""]
    .filter(Boolean).map(esc).join(" · ");

    '<div class="f-top"><span class="cod '+f.clase+'">'+esc(f.cod)+'</span>'+
      '<span class="f-nom">'+esc(r.caratula||r.expediente||"(sin carátula)")+'</span></div>'+
    (r.sumario?'<p class="f-nota">'+resaltarSimple(r.sumario,q)+'</p>':'')+
    (meta?'<p style="font-size:12px;color:var(--humo);margin:0 0 8px">'+meta+'</p>':'')+
    (r.voces&&r.voces.length?'<div class="voces">'+r.voces.slice(0,6).map(function(v){
      return '<span class="voz" style="cursor:default">'+esc(v)+'</span>';}).join("")+'</div>':"")+
    '<div class="f-acc" style="margin-top:8px">'+
      (r.linkFicha?'<a class="mini" href="'+esc(r.linkFicha)+'" target="_blank" rel="noopener noreferrer">Ver ficha completa</a>':"")+
      (r.linkFallo?'<button class="mini" data-act="traer-indice-fallo" data-fuente="'+esc(f.slug)+'" data-url="'+esc(r.linkFallo)+'">Traer texto completo</button>':"")+

function conteoLector(cs){
  var el=document.getElementById("doc-cnt");
  if(!el) return;
  if(!cs.length){
    el.innerHTML=cadena()?'Sin coincidencias para <b>'+esc(cadena())+'</b>'
                         :'Escribí abajo para resaltar dentro del fallo';
    return;
  }
  var vis=Math.min(cs.length,TOPE_MARCAS);
  el.innerHTML='<b>'+cs.length+'</b> coincidencia'+(cs.length===1?"":"s")+
    (cs.length>TOPE_MARCAS?" (se marcan las primeras "+TOPE_MARCAS+")":"")+
    ' · '+(estado.marca+1)+' de '+vis;
}

/* Orden de lectura de la ficha del Lector: jerarquía legal de arriba hacia
   abajo (Constitución > tratados/leyes > fondo > forma), y adentro de cada
   norma, los artículos ordenados numéricamente en vez de por orden de
   aparición en el texto. */
function numDeCadena(s){
  var m=String(s).replace(/\./g,"").match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function ordenArt(a,b){
  var na=numDeCadena(a),nb=numDeCadena(b);
  return na!==nb?na-nb:a.localeCompare(b);
}
function ordenLey(a,b){ return numDeCadena(a)-numDeCadena(b); }
var RANGO_FUENTE={
  "CCyC (vigente)":10,"Código Civil (derogado)":11,"Código de Comercio (derogado)":12,"Código Penal":13,
  "LCT":14,"LDC":15,"Ley de Seguros (LS)":16,
  "CPCCN":30,"CPC":31,"Código Procesal Penal":32,"Ley Arancelaria (LA)":33
};
function rangoDeFuente(label){
  return RANGO_FUENTE.hasOwnProperty(label)?RANGO_FUENTE[label]:99;
}

function pintarLector(){
  if(estado.tab!=="lector"||!estado.texto) return;
  var texto=estado.texto,cs=coincidencias(texto),d=datosDoc(texto);
  if(estado.marca>=cs.length) estado.marca=0;
  conteoLector(cs);

  var meta=document.getElementById("doc-meta");
  if(meta){
    var top=[];
    if(d.trib) top.push(["Tribunal",d.trib+(d.sala?" · "+d.sala:"")]);
    if(d.fecha) top.push(["Fecha",d.fecha]);
    if(d.exp) top.push(["Expediente",d.exp]);
    if(d.tomo&&d.pag) top.push(["Colección","Fallos: "+d.tomo+":"+d.pag]);
    var infoDer=estado.infoDoc?esc(estado.infoDoc.tipo.toUpperCase()+
      (estado.infoDoc.paginas?" · "+estado.infoDoc.paginas+" pág.":"")+
      " · "+estado.infoDoc.caracteres.toLocaleString("es-AR")+" caracteres"+
      (estado.infoDoc.desdeCache?" · desde caché":"")):"";

    var htmlTop=(top.length||d.car||infoDer)?(
      '<div class="meta-top">'+
        (d.car?'<div class="meta-car">'+esc(d.car)+
          (estado.fichaConocida?' <span style="font-size:11px;font-weight:600;color:var(--acequia)">· verificado en el buscador oficial</span>':"")+
          '</div>':"")+
        (top.length||infoDer?'<div class="meta-fila">'+
          '<div class="izq">'+top.map(function(x){ return '<b>'+esc(x[0])+':</b> '+esc(x[1]); }).join(' <span class="sep">·</span> ')+'</div>'+
          (infoDer?'<div class="der">'+infoDer+'</div>':"")+
        '</div>':"")+
      '</div>'
    ):"";

    var porFuente=d.artsPorFuente||[];
    var pend=porFuente.filter(function(g){ return g[0]==="Sin ley identificada"; })[0];
    var porCat={cn:[],tratados:[],fondo:[],leyes:[],provincial:[],local:[]};
    porFuente.forEach(function(g){
      if(g[0]==="Sin ley identificada") return;
      var cat=porCat.hasOwnProperty(g[2])?g[2]:"leyes";
      porCat[cat].push(g);
    });
    porCat.leyes.sort(function(a,b){ return numDeCadena(a[0])-numDeCadena(b[0]); });
    porCat.fondo.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.provincial.sort(function(a,b){ return rangoDeFuente(a[0])-rangoDeFuente(b[0]); });
    porCat.tratados.sort(function(a,b){ return a[0].localeCompare(b[0]); });
    porCat.local.sort(function(a,b){ return a[0].localeCompare(b[0]); });

    function bloqueNorma(g,claseExtra){
      return '<div class="meta-bloque'+(claseExtra?" "+claseExtra:"")+'"><h3>'+esc(g[0])+'</h3>'+
        '<div class="meta-tags">'+g[1].slice().sort(ordenArt).map(function(a){
          return '<span class="meta-tag">'+esc(a)+'</span>';
        }).join("")+'</div></div>';
    }
    function bloqueTags(items){
      return '<div class="meta-bloque"><div class="meta-tags">'+
        items.map(function(x){ return '<span class="meta-tag">'+esc(x)+'</span>'; }).join("")+
      '</div></div>';
    }

    /* Jerarquía normativa decreciente: Constitución > tratados > códigos de
       fondo > leyes nacionales > leyes provinciales/procesales > normativa
       local. Cada norma aparece una sola vez, con todos sus artículos
       consolidados en el mismo contenedor. */
    var bloques="";
    porCat.cn.forEach(function(g){ bloques+=bloqueNorma(g,"cn"); });
    if(porCat.tratados.length){
      bloques+='<div class="meta-cat">Tratados internacionales</div>';
      porCat.tratados.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.fondo.length){
      bloques+='<div class="meta-cat">Códigos de fondo</div>';
      porCat.fondo.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.leyes.length||(d.leyes&&d.leyes.length)){
      bloques+='<div class="meta-cat">Leyes nacionales</div>';
      porCat.leyes.forEach(function(g){ bloques+=bloqueNorma(g); });
      if(d.leyes&&d.leyes.length) bloques+=bloqueTags(d.leyes.slice().sort(ordenLey));
    }
    if(porCat.provincial.length){
      bloques+='<div class="meta-cat">Leyes provinciales y códigos procesales</div>';
      porCat.provincial.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(porCat.local.length){
      bloques+='<div class="meta-cat">Normativa local y decretos</div>';
      porCat.local.forEach(function(g){ bloques+=bloqueNorma(g); });
    }
    if(d.citados&&d.citados.length){
      bloques+='<div class="meta-cat">Jurisprudencia citada</div>'+bloqueTags(d.citados);
    }
    if(pend) bloques+='<div class="meta-bloque pendiente"><h3>Artículos pendientes de clasificación</h3>'+
      '<div class="meta-tags">'+pend[1].slice().sort(ordenArt).map(function(a){
        return '<span class="meta-tag">'+esc(a)+'</span>';
      }).join("")+'</div></div>';

    meta.innerHTML=htmlTop+
      (bloques?'<div class="meta-cuerpo">'+bloques+'</div>'
        :(htmlTop?"":'<div class="meta-bloque"><h3>Sin datos detectados</h3><div class="txt">El encabezado no sigue un formato reconocible. Cargá los datos a mano en «Cómo citar».</div></div>'))+
      '<div class="meta-acc">'+
      '<button class="mini" data-act="meta-a-cita">Pasar estos datos al formateador de citas</button>'+
      '<button class="mini" data-act="copiar-doc-cita">Copiar solo la cita</button>'+
      '</div>';
  }

  var doc=document.getElementById("doc");
  if(doc) doc.innerHTML=textoResaltado(texto,cs);

  var tit=document.getElementById("doc-tit-pas");
  var cont=document.getElementById("pasajes");
  if(cont){
    if(!cs.length){
      if(tit) tit.textContent="Pasajes";
      cont.innerHTML='<div class="vacio">'+(cadena()
        ?'Tu búsqueda no aparece en este texto. Probá con «Palabra parcial: sí», con menos palabras o cambiando el modo a «Alguna palabra» en la solapa Buscar.'
        :'Escribí algo arriba y los pasajes aparecen acá.')+'</div>';
      cont._ps=[];
    }else{
      var ps=pasajesDe(texto,cs);
      if(tit) tit.textContent=ps.length+" pasaje"+(ps.length===1?"":"s")+" con contexto";
      cont.innerHTML=ps.map(function(p,i){
        return '<div class="pasaje"><div class="txt">'+p.html+'</div><div class="acc">'+
          '<button class="mini" data-act="pas-cita" data-i="'+i+'">Copiar con la cita</button>'+
          '<button class="mini" data-act="pas-copiar" data-i="'+i+'">Copiar el pasaje</button>'+
          '<button class="mini" data-act="pas-guardar" data-i="'+i+'">Guardar</button>'+
          '<span class="pos">carácter '+p.ini+'</span></div></div>';
      }).join("");
      cont._ps=ps;
    }
  }
  irAMarca(false);
}

function irAMarca(mover){
  try{
    var doc=document.getElementById("doc");
    if(!doc) return;
    var ms=doc.querySelectorAll("mark");
    if(!ms.length) return;
    var i=Math.max(0,Math.min(estado.marca,ms.length-1));
    for(var k=0;k<ms.length;k++) ms[k].className=(k===i?"actual":"");
    if(mover&&ms[i].scrollIntoView) ms[i].scrollIntoView({block:"center"});
  }catch(e){}
}

function formatoCita(tipo,c){
  var C=c.car?'"'+c.car+'"':'"[carátula]"';
  if(tipo==="csjn") return "CSJN, "+C+(c.fecha?", sent. del "+c.fecha:"")+(c.tomo&&c.pag?", Fallos: "+c.tomo+":"+c.pag:"")+".";
  if(tipo==="scjm") return "SCJM"+(c.trib?", "+c.trib:"")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
  if(tipo==="cidh") return "Corte IDH, Caso "+(c.car||"[caso]")+(c.fecha?". Sentencia de "+c.fecha:"")+(c.tomo?". Serie "+c.tomo:"")+(c.pag?" n.º "+c.pag:"")+".";
  if(tipo==="tedh") return "TEDH, "+C+(c.pag?", n.º "+c.pag:"")+(c.fecha?", sentencia de "+c.fecha:"")+".";
  return (c.trib||"[tribunal]")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
}

}

document.addEventListener("click",function(ev){
  var t=ev.target;
  var b=t.closest?t.closest("[data-act],[data-tab],[data-rama]"):null;
  if(!b) return;

  if(b.hasAttribute("data-tab")){ estado.tab=b.getAttribute("data-tab"); render(); return; }

  var act=b.getAttribute("data-act");

  if(b.hasAttribute("data-rama")&&act!=="ir-rama"){
    estado.rama=b.getAttribute("data-rama")||""; render(); return;
  }
  if(act==="ir-rama"){ estado.rama=b.getAttribute("data-rama")||""; estado.tab="buscar"; render(); window.scrollTo(0,0); return; }

  if(act==="modo"){ estado.modo=b.getAttribute("data-modo"); render(); return; }
  if(act==="amb"){
    var k=b.getAttribute("data-amb");
    estado.ambitos[k]=!estado.ambitos[k];
    if(!Object.keys(estado.ambitos).some(function(x){return estado.ambitos[x];})){
      estado.ambitos[k]=true; flash("Dejá al menos un ámbito activo");
    }
    render(); return;
  }
  if(act==="voz"||act==="rehacer"){
    estado.q=b.getAttribute("data-v")||""; estado.modo="exacta"; estado.tab="buscar";
    render(); window.scrollTo(0,0);
    var i=document.getElementById("q"); if(i) i.focus();
    return;
  }
  if(act==="fav"){
    var id=b.getAttribute("data-id");
    estado.fav[id]=!estado.fav[id];
    store.set("jedj:fav",estado.fav);
    render(); return;
  }
  if(act==="google"){
    var c=cadena();
    if(!c){ flash("Escribí algo en «Qué buscás» primero"); return; }
    recordar(c);
    window.open(urlGoogleSitio(b.getAttribute("data-dom")),"_blank","noopener");
    return;
  }
  if(act==="buscar-indice"){
    var slug=b.getAttribute("data-fuente");
    var fCfg=FUENTES_INDICE.filter(function(x){return x.slug===slug;})[0];
    var qi=estado.q.trim();
    if(!fCfg) return;
    if(!qi){ flash("Escribí algo en «Qué buscás» primero"); return; }
    if(!estado.api){ flash("El servidor de extracción no está disponible ahora"); return; }
    recordar(qi);
    var imBusco=estado.indices[slug];
    // Si esta fuente es lenta (CABA puede tardar 30s) y se dispara otra
    // búsqueda antes de que vuelva la anterior, la respuesta vieja no debe
    // pisar a la nueva. Un token por pedido: solo aplica si nadie más
    // arrancó una búsqueda de esta misma fuente después.
    var pedido=(imBusco.pedido||0)+1; imBusco.pedido=pedido;
    imBusco.cargando=true; imBusco.error=null; render();
    fetch(estado.api+"/indice/"+slug+"/buscar",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:qi})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(imBusco.pedido!==pedido) return; // ya hay un pedido mas nuevo en vuelo
        imBusco.cargando=false; imBusco.busco=true;
        if(!d||!d.ok){
          imBusco.error=(d&&d.mensaje)||"El servidor no devolvió resultados.";
          render(); return;
        }
        imBusco.resultados=d.resultados||[];
        imBusco.total=d.total||0;
        imBusco.guardados=d.guardadosEnIndice||0;
        imBusco.local=!!d.desdeIndiceLocal;
        imBusco.avisoFalla=d.avisoFalla||"";
        render();
        flash(imBusco.local
          ?"El sitio oficial no respondió: mostrando "+d.resultados.length+" resultado(s) ya guardados"
          :(d.total?d.total.toLocaleString("es-AR")+" coincidencias en "+fCfg.nombre:"Sin coincidencias en "+fCfg.nombre));
      })["catch"](function(){
        if(imBusco.pedido!==pedido) return;
        imBusco.cargando=false; imBusco.busco=true;
        imBusco.error="Se cortó la comunicación con el servidor.";
        render();
      });
    return;
  }
  if(act==="traer-indice-fallo"){
    var linkIdx=b.getAttribute("data-url");
    var slugIdx=b.getAttribute("data-fuente");
    if(!linkIdx||!estado.api) return;
    // La ficha ya vino con carátula, tribunal, expediente y fecha directo
    // del buscador oficial: la guardamos para no tener que adivinarla de
    // nuevo con detectar() sobre el texto crudo (ver datosDoc()).
    var imIdx=estado.indices[slugIdx];
    var fichaIdx=(imIdx&&imIdx.resultados||[]).filter(function(x){return x.linkFallo===linkIdx;})[0];
    estado.cargando=true; estado.errorLink=null; estado.tab="lector"; render();
    fetch(estado.api+"/extraer",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:linkIdx})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        estado.cargando=false;
        if(!d||!d.ok){
          estado.errorLink={mensaje:(d&&d.mensaje)||"El servidor no devolvió el documento.",ayuda:""};
          render(); return;
        }
        estado.texto=d.texto; estado.fuenteDe=d.urlFinal||linkIdx; estado.infoDoc=d; estado.marca=0;
        estado.fichaConocida=fichaIdx?fichaDesdeIndice(slugIdx,fichaIdx):null;
        render(); window.scrollTo(0,0);
        flash((d.desdeCache?"Traído del caché · ":"")+d.palabras.toLocaleString("es-AR")+" palabras");
      })["catch"](function(){
        estado.cargando=false;
        estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",ayuda:""};
        render();
      });
    return;
  }
  if(act==="barrido"){
    var q=cadena();
    if(!q){ flash("Escribí algo en «Qué buscás» primero"); return; }
    var doms=[],vistos={};
    fuentesFiltradas().forEach(function(f){
      if(!vistos[f.dom]&&doms.length<12){vistos[f.dom]=1;doms.push(f.dom);}
    });
    if(!doms.length){ flash("No hay fuentes seleccionadas"); return; }
    recordar(q);
    var expr="("+doms.map(function(d){return "site:"+d;}).join(" OR ")+") "+q+rangoFechas();
    window.open("https://www.google.com/search?q="+encodeURIComponent(expr),"_blank","noopener");
    flash("Buscando en "+doms.length+" sitios a la vez");
    return;
  }
  if(act==="copiar-cadena"){ copiar(cadena()); return; }
  if(act==="limpiar"){
    estado.q="";estado.excluir="";estado.desde="";estado.hasta="";estado.rama="";estado.modo="exacta";
    render(); return;
  }
  if(act==="armar-cita"){ armarCita(); return; }
  if(act==="copiar-cita"){
    var o=document.getElementById("cita-out");
    copiar(o?o.textContent.trim():""); return;
  }

  /* ---- lector ---- */
  if(act==="traer-link"){
    var iu=document.getElementById("doc-url");
    var link=iu?iu.value.trim():"";
    if(!link){ flash("Pegá el enlace del fallo"); return; }
    estado.cargando=true; estado.errorLink=null; render();
    var AYUDAS={
      DOMINIO_NO_PERMITIDO:"Agregá el dominio en server/config.js y reiniciá el servidor.",
      PDF_ESCANEADO:"Ese PDF es una foto del papel. Pasalo por un OCR, o abrilo y copiá el texto con la opción 2.",
      HTML_SIN_TEXTO:"Pasa cuando el fallo está dentro de un frame o se arma con JavaScript. Usá la opción 2: abrí el enlace y pegá el texto.",
      RESPUESTA_NO_OK:"Fijate que el enlace sea el del documento y no el del buscador.",
      TIEMPO_AGOTADO:"Los sitios judiciales se ponen lentos en horario de tribunales. Probá más tarde.",
      RED_PRIVADA:"El servidor no descarga de direcciones internas. Está bien que pase."
    };
    fetch(estado.api+"/extraer",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:link})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        estado.cargando=false;
        if(!d||!d.ok){
          estado.errorLink={mensaje:(d&&d.mensaje)||"El servidor no devolvió el documento.",
                            ayuda:AYUDAS[d&&d.codigo]||""};
          render(); return;
        }
        estado.texto=d.texto;
        estado.fuenteDe=d.urlFinal||link;
        estado.infoDoc=d;
        estado.fichaConocida=null;
        estado.marca=0;
        render(); window.scrollTo(0,0);
        flash((d.desdeCache?"Traído del caché · ":"")+d.palabras.toLocaleString("es-AR")+" palabras");
      })["catch"](function(){
        estado.cargando=false;
        estado.errorLink={mensaje:"Se cortó la comunicación con el servidor.",
                          ayuda:"Fijate que la terminal siga diciendo «Interfaz http://localhost:3000»."};
        render();
      });
    return;
  }
  if(act==="analizar"){
    var ta=document.getElementById("doc-in"),de=document.getElementById("doc-de");
    var txt=ta?ta.value:"";
    if(!txt||txt.trim().length<40){ flash("Pegá el texto del fallo primero"); return; }
    if(txt.length>2000000){ txt=txt.slice(0,2000000); flash("El fallo era enorme: se cargaron los primeros 2 millones de caracteres"); }
    estado.texto=txt; estado.fuenteDe=de?de.value.trim():""; estado.marca=0; estado.fichaConocida=null;
    render(); window.scrollTo(0,0); return;
  }
  if(act==="doc-otro"){ estado.texto=""; estado.fuenteDe=""; estado.marca=0; estado.infoDoc=null; estado.fichaConocida=null; estado.errorLink=null; render(); window.scrollTo(0,0); return; }
  if(act==="marca-sig"||act==="marca-ant"){
    var cs2=coincidencias(estado.texto),total=Math.min(cs2.length,TOPE_MARCAS);
    if(!total){ flash("No hay coincidencias para recorrer"); return; }
    estado.marca=(estado.marca+(act==="marca-sig"?1:-1)+total)%total;
    irAMarca(true); conteoLector(cs2);
    return;
  }
  if(act==="tog-parcial"){ estado.parcial=!estado.parcial; estado.marca=0; pintarLector();
    var bp=document.querySelector('[data-act="tog-parcial"]');
    if(bp){ bp.setAttribute("aria-pressed",estado.parcial?"true":"false");
            bp.textContent=estado.parcial?"Palabra parcial: sí":"Palabra parcial: no"; }
    return; }
  if(act==="meta-a-cita"){
    var dd=datosDoc(estado.texto||"");
    estado.tab="citas"; render();
    function pon(id,v){ var e=document.getElementById(id); if(e&&v) e.value=v; }
    pon("c-tipo",dd.tipo||"cam"); pon("c-car",dd.car); pon("c-trib",dd.sala||dd.trib);
    pon("c-fecha",dd.fecha); pon("c-tomo",dd.tomo); pon("c-pag",dd.pag); pon("c-exp",dd.exp);
    armarCita(); window.scrollTo(0,0); return;
  }
  if(act==="copiar-doc-cita"){ copiar(citaDelDoc()); return; }
  if(act==="pas-copiar"||act==="pas-cita"||act==="pas-guardar"){
    var cont=document.getElementById("pasajes");
    var ps=cont&&cont._ps?cont._ps:[];
    var p=ps[parseInt(b.getAttribute("data-i"),10)];
    if(!p){ flash("No pude recuperar ese pasaje"); return; }
    if(act==="pas-copiar"){ copiar(p.txt); return; }
    var bloque=citaDelDoc()+"\n«"+p.txt+"»\n(consultado el "+hoy()+(estado.fuenteDe?" en "+estado.fuenteDe:"")+")";
    if(act==="pas-cita"){ copiar(bloque); return; }
    estado.pasajes=[{t:bloque,r:cadena()}].concat(estado.pasajes).slice(0,60);
    flash("Pasaje guardado · "+estado.pasajes.length+" en total");
    return;
  }
  if(act==="pasajes-copiar"){
    copiar(estado.pasajes.map(function(x){return x.t;}).join("\n\n———\n\n")); return;
  }
  if(act==="pasajes-borrar"){ estado.pasajes=[]; render(); return; }
  if(act==="tog-frag"){ estado.resaltarFuente=!estado.resaltarFuente; render(); return; }
},false);

},false);

/* Enter: en Buscar lanza el barrido, en el Lector salta a la coincidencia siguiente */
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="q"){
    ev.preventDefault();
    var sel=estado.tab==="lector"?'[data-act="marca-sig"]':'[data-act="barrido"]';
    var btn=document.querySelector(sel);
    if(btn) btn.click();
  }
  if(ev.key==="/"&&ev.target&&["INPUT","TEXTAREA","SELECT"].indexOf(ev.target.tagName)===-1){
    var i=document.getElementById("q");
    if(i){ev.preventDefault();i.focus();i.select();}
  }
},false);

function recordar(q){
  if(!q) return;
  estado.hist=[q].concat(estado.hist.filter(function(x){return x!==q;})).slice(0,20);
}

function armarCita(){
  function val(id){var e=document.getElementById(id);return e?String(e.value).trim():"";}
  var tipo=val("c-tipo")||"csjn";
  var s=formatoCita(tipo,{car:val("c-car"),trib:val("c-trib"),fecha:val("c-fecha"),
                          tomo:val("c-tomo"),pag:val("c-pag"),exp:val("c-exp")});
  var o=document.getElementById("cita-out");
  if(o) o.textContent=s;
  flash("Cita armada — verificá los datos en la fuente");
}

/* ============================================================
   9. Arranque
   ============================================================ */
render();
detectarServidor();
store.get("jedj:fav",function(v){
  if(!v||typeof v!=="object") return;
  estado.fav=v;
  var activo=document.activeElement;
  if(activo&&["INPUT","SELECT","TEXTAREA"].indexOf(activo.tagName)!==-1) return;
  render();
});

})();
</script>
