<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juris et de jure — Buscador de jurisprudencia · Mendoza · Argentina · Internacional</title>
<meta name="description" content="Buscador de jurisprudencia argentina, mendocina e internacional. Arma la consulta y te lleva a las bases oficiales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#0a1019;
  --tinta:#eae6d8;
  --tinta2:#b6c0c9;
  --papel:#0f1c2b;
  --papel2:#0c1b2e;
  --ficha:#15263c;
  --lacre:#b23a47;
  --lacre2:#d1525f;
  --acequia:#4f8b76;
  --humo:#8fa0ab;
  --linea:#233648;
  --oro:#cfa733;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","Hoefler Text",Georgia,serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
*::-webkit-scrollbar{width:18px;height:18px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{
  min-height:390px;min-width:390px;border-radius:0;background-repeat:no-repeat;
  background-position:center;background-size:16px auto;
  background-image:url("./scroll-sparkle.png")
}
.rail-list::-webkit-scrollbar-thumb{
  min-height:170px;min-width:170px;border-radius:0;background-repeat:no-repeat;
  background-position:center;background-size:16px auto;
  background-image:url("./scroll-sparkle-rama.png")
}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
a{color:var(--lacre)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lacre2);outline-offset:2px}

/* ---------- cabecera ---------- */
.top{background:var(--negro);color:#eceee8;border-bottom:3px solid var(--lacre)}
.top-in{max-width:1180px;margin:0 auto;padding:20px 20px 14px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.sello{
  width:52px;height:52px;border-radius:50%;flex:0 0 52px;
  background:var(--lacre);border:1px solid #571420;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#f3e3e5;text-align:center;line-height:1.15
}
.marca{flex:1 1 300px;min-width:0}
.marca h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.4vw,40px);
  margin:0;letter-spacing:.055em;font-variant:small-caps;color:#f4f2ec
}
.marca .lat{font-family:var(--serif);font-style:italic;color:#a8b0ae;font-size:13.5px;margin-top:1px}
.marca .sub{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8f9a99;margin-top:7px}
.nav{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav button{
  background:none;border:0;border-bottom:3px solid transparent;
  padding:9px 13px 8px;cursor:pointer;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#98a3a2
}
.nav button:hover{color:#eceee8}
.nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--lacre2)}

/* ---------- cadena ---------- */
.cadena{position:sticky;top:0;z-index:40;background:var(--papel2)}
.cadena-in{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;gap:10px;align-items:center}
.cadena code{
  font-family:var(--mono);font-size:12.5px;color:var(--tinta2);
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.cadena code b{color:var(--lacre);font-weight:600}
.mini{
  background:var(--ficha);border:1px solid var(--linea);border-radius:2px;
  padding:4px 9px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);white-space:nowrap
}
.mini:hover{background:var(--ficha);border-color:var(--humo)}
a.mini{text-decoration:none;display:inline-block;color:var(--tinta2)}
a.mini:hover{color:var(--lacre)}

/* ---------- estructura ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px;display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start}
.rail{position:sticky;top:56px}
.rail h2,.blk h2{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--humo);margin:0 0 9px;font-weight:600
}
.rail-list{display:flex;flex-direction:column;gap:1px;max-height:62vh;overflow:auto}
.rail-list button{
  text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:4px 8px;cursor:pointer;font-size:13px;color:var(--tinta2);border-radius:0 2px 2px 0
}
.rail-list button:hover{background:var(--papel2)}
.rail-list button[aria-pressed="true"]{border-left-color:var(--lacre);background:var(--ficha);font-weight:600;color:var(--lacre)}
.col{min-width:0}

/* ---------- formulario ---------- */
.panel{background:var(--ficha);border:1px solid var(--linea);border-radius:3px;padding:16px 18px;margin-bottom:20px}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--humo);margin-bottom:5px}
input[type=text],input[type=number],select{
  width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:2px;
  background:var(--ficha);font-family:var(--sans);font-size:15px;color:var(--tinta)
}
#q{font-family:var(--serif);font-size:19px;padding:12px}
.fila{display:flex;gap:12px;flex-wrap:wrap}
.fila>*{flex:1 1 130px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:var(--ficha);border:1px solid var(--linea);border-radius:2px;padding:5px 11px;cursor:pointer;
  font-size:12.5px;color:var(--tinta2)
}
.chip:hover{border-color:var(--humo)}
.chip[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:#f2f2ee}
.chip.amb[aria-pressed="true"]{background:var(--lacre);border-color:var(--lacre)}
.acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--linea)}
.btn{
  background:var(--lacre);color:#fdf6f6;border:1px solid var(--lacre);border-radius:2px;
  padding:9px 16px;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase
}
.btn:hover{background:var(--lacre2)}
.btn.sec{background:var(--ficha);color:var(--tinta2);border-color:var(--linea)}
.btn.sec:hover{background:var(--papel2);border-color:var(--humo)}

/* ---------- fuentes ---------- */
.conteo{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--humo);margin:0 0 10px}
.grupo{margin-bottom:26px}
.grupo>h3{
  font-family:var(--serif);font-size:20px;font-weight:400;margin:0 0 3px;
  padding-bottom:5px;border-bottom:1px solid var(--linea)
}
.grupo>p.desc{margin:0 0 12px;font-size:13px;color:var(--humo)}
.fuente{border-bottom:1px dotted var(--linea);padding:11px 0}
.f-top{display:flex;gap:11px;align-items:baseline}
.cod{
  font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:#fff;
  padding:2px 5px;border-radius:2px;flex:0 0 auto;position:relative;top:-1px
}
.cod.mza{background:var(--lacre)}.cod.nac{background:var(--tinta2)}
.cod.prov{background:var(--humo)}.cod.int{background:var(--acequia)}.cod.doc{background:var(--oro)}
.f-nom{font-family:var(--serif);font-size:17px;flex:0 1 auto}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--linea);min-width:14px;transform:translateY(-4px)}
.f-org{font-size:12px;color:var(--humo);font-family:var(--mono);flex:0 0 auto}
.f-nota{font-size:13.5px;color:var(--tinta2);margin:3px 0 7px}
.f-acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--humo);border:1px solid var(--linea);padding:2px 6px;border-radius:2px}
.tag.paga{color:var(--oro);border-color:#d8c58e;background:#fdf8ec}
.tag.libre{color:var(--acequia);border-color:#b6ccc2;background:#f0f6f2}
.estrella{background:none;border:0;cursor:pointer;font-size:15px;color:var(--linea);padding:0 4px;line-height:1}
.estrella[aria-pressed="true"]{color:var(--oro)}

/* ---------- ramas ---------- */
.rama{background:var(--ficha);border:1px solid var(--linea);border-left:3px solid var(--lacre);border-radius:2px;padding:14px 16px;margin-bottom:12px;font-family:"Montserrat",sans-serif}
.rama h3{font-family:inherit;font-size:19px;font-weight:400;margin:0 0 3px}
.rama p{margin:0 0 9px;font-size:13.5px;color:var(--tinta2)}
.voces{display:flex;gap:5px;flex-wrap:wrap}
.voz{
  background:var(--ficha);border:1px solid var(--linea);border-radius:2px;padding:3px 8px;cursor:pointer;
  font-size:12px;color:var(--tinta2);font-family:inherit
}
.voz:hover{background:var(--negro);color:#fff;border-color:var(--negro)}
.rotulo{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--humo);margin:9px 0 4px}

/* ---------- prosa ---------- */
.blk{background:var(--ficha);border:1px solid var(--linea);border-radius:3px;padding:18px 20px;margin-bottom:16px}
.blk h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 8px}
.blk p{margin:0 0 10px;font-size:14px}
.blk ol,.blk ul{margin:0 0 10px;padding-left:20px;font-size:14px}
.blk li{margin-bottom:6px}
.aviso{background:var(--ficha);color:var(--tinta2);border:1px solid var(--linea);border-left:3px solid var(--lacre);border-radius:2px;padding:13px 16px;margin-bottom:18px;font-size:13.5px}
.aviso strong{font-family:var(--serif);font-size:15px;color:var(--lacre2)}
.out{
  font-family:var(--mono);font-size:13px;background:var(--ficha);border:1px solid var(--linea);
  border-radius:2px;padding:11px;white-space:pre-wrap;word-break:break-word;min-height:44px
}
.vacio{border:1px dashed var(--linea);border-radius:3px;padding:26px 20px;text-align:center;color:var(--humo);font-size:14px}

/* ---------- lector ---------- */
textarea{
  width:100%;min-height:260px;padding:12px;border:1px solid var(--linea);border-radius:2px;
  background:var(--ficha);font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--tinta);resize:vertical
}
.barra-doc{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--negro);color:#eceee8;border-radius:2px;padding:8px 12px;margin-bottom:12px
}
.barra-doc .cnt{font-family:var(--mono);font-size:12px;letter-spacing:.04em;flex:1 1 auto;min-width:120px}
.barra-doc .cnt b{color:#f0c9ce}
.barra-doc .mini{background:#26313a;border-color:#3a4750;color:#dfe3e0}
.barra-doc .mini:hover{background:#33404a;border-color:#5d6870;color:#fff}
.doc{
  background:var(--ficha);border:1px solid var(--linea);border-radius:2px;padding:18px 20px;
  font-family:var(--serif);font-size:15.5px;line-height:1.72;white-space:pre-wrap;word-wrap:break-word;
  max-height:64vh;overflow:auto
}
mark{background:#f7dfa8;color:var(--negro);padding:0 1px;border-radius:2px;box-decoration-break:clone}
mark.actual{background:var(--lacre);color:#fff}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.meta-i{
  background:var(--ficha);border:1px solid var(--linea);border-left:2px solid var(--acequia);
  border-radius:2px;padding:5px 10px;font-size:12.5px;max-width:100%
}
.meta-i b{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--humo);display:block;font-weight:600}
.pasaje{background:var(--ficha);border:1px solid var(--linea);border-left:3px solid var(--oro);border-radius:2px;padding:11px 13px;margin-bottom:9px}
.pasaje .txt{font-family:var(--serif);font-size:14.5px;line-height:1.6;margin-bottom:8px}
.pasaje .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pasaje .pos{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--humo)}
.pie{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--humo);line-height:1.6}
.pie hr{border:0;border-top:1px solid var(--linea);margin:0 0 14px}

/* ---------- avisos flotantes ---------- */
#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:none;
  background:var(--negro);color:#f2f2ee;padding:9px 16px;border-radius:2px;font-size:13px;
  box-shadow:0 6px 18px rgba(20,27,33,.28);max-width:90vw}
#panic{display:none;background:#7c1d2b;color:#fff;padding:10px 20px;font-size:13px}
#panic button{background:#fff;color:#7c1d2b;border:0;border-radius:2px;padding:4px 10px;margin-left:10px;cursor:pointer}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:16px}
  .rail{position:static}
  .rail-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .rail-list button{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:5px 9px}
  .rail-list button[aria-pressed="true"]{border-left:0;border-bottom-color:var(--lacre)}
  .f-top{flex-wrap:wrap}
  .leader{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="panic" role="alert"></div>

<header class="top">
  <div class="top-in">
    <div class="sello" aria-hidden="true">IVRIS<br>ET DE<br>IVRE</div>
    <div class="marca">
      <h1>Juris et de jure</h1>
      <div class="lat">praesumptio iuris et de iure — lo que no admite prueba en contrario</div>
      <div class="sub">Jurisprudencia · Mendoza · Argentina · Internacional</div>
    </div>
  </div>
  <nav class="nav" id="nav" role="tablist" aria-label="Secciones"></nav>
</header>

<div class="cadena">
  <div class="cadena-in">
    <code id="cadena" aria-live="polite">Escribí lo que buscás para armar la consulta</code>
    <button class="mini" data-act="copiar-cadena">Copiar</button>
    <button class="mini" data-act="limpiar">Limpiar</button>
  </div>
</div>

<main class="wrap">
  <aside class="rail" id="rail"></aside>
  <div class="col" id="vista"></div>
</main>

<footer class="pie">
  <hr>
  <p id="pie-txt"></p>
</footer>

<div id="flash" role="status" aria-live="polite"></div>

<script>
"use strict";
(function(){

/* ============================================================
   0. Blindaje: ningún error deja la página en blanco.
   ============================================================ */
function panic(msg){
  try{
    var p=document.getElementById("panic");
    p.style.display="block";
    p.textContent="Algo falló al dibujar la pantalla ("+msg+"). El resto sigue funcionando.";
    var b=document.createElement("button");
    b.textContent="Reiniciar";
    b.onclick=function(){ estado=nuevoEstado(); p.style.display="none"; render(); };
    p.appendChild(b);
  }catch(e){}
}
window.onerror=function(m){ panic(String(m).slice(0,90)); return true; };

/* ============================================================
   1. RAMAS DEL DERECHO — vocabulario de búsqueda ("voces")
   ============================================================ */
var RAMAS=[
 {id:"civ",n:"Obligaciones y contratos",d:"Cumplimiento, incumplimiento, resolución, mora, intereses, locación, compraventa, mandato.",
  v:["incumplimiento contractual","pacto comisorio","teoría de la imprevisión","mora automática","intereses moratorios","tasa activa","resolución contractual","seña","boleto de compraventa","locación de inmueble","desalojo falta de pago","obligación de valor","novación","cesión de créditos","buena fe contractual"]},
 {id:"dan",n:"Daños y responsabilidad civil",d:"Responsabilidad contractual y extracontractual, accidentes, mala praxis, cuantificación.",
  v:["daño moral","consecuencias no patrimoniales","incapacidad sobreviniente","fórmula Acciarri","pérdida de chance","daño punitivo","riesgo de la cosa","accidente de tránsito","mala praxis médica","relación de causalidad","eximentes de responsabilidad","culpa de la víctima","valor vida","gastos de tratamiento futuro","legitimación activa daño moral"]},
 {id:"rea",n:"Derechos reales",d:"Dominio, condominio, propiedad horizontal, conjuntos inmobiliarios, usucapión, medianería.",
  v:["prescripción adquisitiva","usucapión veinteañal","acción reivindicatoria","interdicto de recobrar","propiedad horizontal","expensas comunes","servidumbre de paso","medianería","posesión y tenencia","desalojo por intrusión","boleto y oponibilidad","conjunto inmobiliario","tiempo compartido"]},
 {id:"fam",n:"Familia",d:"Divorcio, compensación económica, alimentos, cuidado personal, comunicación, filiación, uniones convivenciales.",
  v:["compensación económica","cuidado personal compartido","régimen de comunicación","cuota alimentaria","alimentos provisorios","atribución del hogar","liquidación de la comunidad","unión convivencial","filiación por TRHA","adopción plena","impedimento de contacto","violencia familiar medidas","interés superior del niño","autonomía progresiva"]},
 {id:"suc",n:"Sucesiones",d:"Declaratoria, partición, colación, legítima, testamentos, sucesión del conviviente.",
  v:["declaratoria de herederos","colación","legítima hereditaria","acción de reducción","partición de herencia","testamento ológrafo","indignidad","cesión de derechos hereditarios","administrador de la sucesión","sucesión ab intestato"]},
 {id:"cons",n:"Derecho del consumidor",d:"Relación de consumo, deber de información, trato digno, daño punitivo, sobreendeudamiento.",
  v:["relación de consumo","daño punitivo","trato digno","deber de información","cláusulas abusivas","publicidad engañosa","medicina prepaga cobertura","servicio de telefonía","plan de ahorro previo","tarjeta de crédito","sobreendeudamiento del consumidor","garantía legal","in dubio pro consumidor"]},
 {id:"com",n:"Comercial y societario",d:"Sociedades, títulos de crédito, contratos bancarios, fideicomiso, conflictos societarios.",
  v:["inoponibilidad de la personalidad jurídica","acción social de responsabilidad","impugnación de asamblea","exclusión de socio","sociedad de la sección IV","pagaré de consumo","ejecución de cheque","fideicomiso de garantía","contrato de franquicia","cuenta corriente bancaria","abuso de mayoría"]},
 {id:"cyq",n:"Concursos y quiebras",d:"Concurso preventivo, verificación, pronto pago, extensión de quiebra, acuerdo preventivo.",
  v:["verificación de créditos","pronto pago laboral","período de sospecha","acción revocatoria concursal","cramdown","salvataje","extensión de quiebra","privilegio concursal","incidente de revisión","acuerdo preventivo extrajudicial","fuero de atracción"]},
 {id:"seg",n:"Seguros",d:"Cobertura, franquicia, exclusiones, citación en garantía, seguro de vida y automotor.",
  v:["citación en garantía","franquicia transporte público","exclusión de cobertura","declaración del riesgo","reticencia","seguro de vida colectivo","pronunciamiento del asegurador","carga del asegurado","oponibilidad de la franquicia","seguro de responsabilidad civil"]},
 {id:"lab",n:"Laboral individual",d:"Despido, indemnizaciones, registración, jornada, solidaridad, categorías, intereses.",
  v:["despido indirecto","injuria laboral","indemnización art. 245","relación de dependencia","trabajo no registrado","multa registral","solidaridad art. 30","intereses tasa activa laboral","jornada extraordinaria","empleo público de hecho","despido discriminatorio","principio de irrenunciabilidad","monotributista dependencia encubierta"]},
 {id:"sind",n:"Colectivo del trabajo",d:"Libertad sindical, tutela sindical, convenios colectivos, huelga, encuadramiento.",
  v:["tutela sindical","exclusión de tutela","práctica desleal","encuadramiento sindical","convenio colectivo aplicable","derecho de huelga","delegado de personal","paritarias","ultraactividad del convenio"]},
 {id:"art",n:"Riesgos del trabajo",d:"Accidentes y enfermedades laborales, comisiones médicas, incapacidad, prestaciones.",
  v:["accidente in itinere","enfermedad profesional","comisión médica","incapacidad laboral permanente","ley 27.348 constitucionalidad","acción civil contra ART","baremo","prestaciones dinerarias","actualización RIPTE","reagravación"]},
 {id:"prev",n:"Previsional y seguridad social",d:"Jubilaciones, movilidad, reajuste de haberes, pensiones, obras sociales.",

var store={
  get:function(k,cb){
    try{
      if(window.storage&&typeof window.storage.get==="function"){
        window.storage.get(k).then(function(r){ try{cb(r&&r.value?JSON.parse(r.value):null);}catch(e){cb(null);} },function(){cb(null);});
        return;
      }
    }catch(e){}
    cb(null);
  },

      }
    }catch(e){}
  }
};

   4. Utilidades
   ============================================================ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function flash(msg){
  var f=document.getElementById("flash");
  f.textContent=msg;f.style.display="block";
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){f.style.display="none";},2600);
}
function copiar(txt){
  if(!txt){flash("No hay nada para copiar todavía");return;}
  var ok=function(){flash("Copiado");};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
      navigator.clipboard.writeText(txt).then(ok,function(){legacy(txt,ok);});
      return;
    }
  }catch(e){}
  legacy(txt,ok);
}
function legacy(txt,ok){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt;ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.top="-1000px";
    document.body.appendChild(ta);ta.select();
    var done=document.execCommand("copy");
    document.body.removeChild(ta);
    if(done){ok();}else{flash("Copiá a mano: "+txt.slice(0,60));}
  }catch(e){flash("Copiá a mano: "+txt.slice(0,60));}
}
function palabras(s){
  return String(s||"").trim().split(/\s+/).filter(function(w){return w.length>0;});
}

/* Arma la cadena de búsqueda con operadores estándar */
function cadena(){
  var q=String(estado.q||"").trim(), out="";
  if(!q)return "";
  if(estado.modo==="exacta") out='"'+q.replace(/"/g,"")+'"';
  else if(estado.modo==="alguna") out=palabras(q).join(" OR ");
  else out=palabras(q).join(" ");
  var ex=palabras(estado.excluir);
  for(var i=0;i<ex.length;i++) out+=" -"+ex[i].replace(/"/g,"");
  return out;
}
function rangoFechas(){
  var d=estado.desde,h=estado.hasta,s="";
  if(/^\d{4}$/.test(d)) s+=" after:"+d+"-01-01";
  if(/^\d{4}$/.test(h)) s+=" before:"+h+"-12-31";
  return s;
}
function urlGoogleSitio(dom){
  return "https://www.google.com/search?q="+encodeURIComponent("site:"+dom+" "+cadena()+rangoFechas());
}

/* Fragmento de texto: hace que el propio navegador resalte la frase
   al abrir la fuente. Funciona en Chrome, Edge y Safari recientes. */
function fragTexto(u){
  if(!estado.resaltarFuente) return "";
  if(estado.modo!=="exacta") return "";
  var t=String(estado.q||"").trim().replace(/[#&]/g," ");
  if(t.length<4) return "";
  if(u.indexOf("#")!==-1) return "";
  if(/\.pdf($|\?)/i.test(u)) return "";
  return "#:~:text="+encodeURIComponent(t.slice(0,140));
}
function urlFuente(f){
  var c=cadena();
  var base=(f.tmpl&&c)?f.tmpl.replace("{q}",encodeURIComponent(c)):f.u;
  return base+fragTexto(base);
}

/* Pliega el texto (minúsculas, sin acentos) conservando el mapa
   de posiciones hacia el texto original. */
function plegar(t){
  var s="",map=[],i,j,c,n;
  for(i=0;i<t.length;i++){
    c=t.charAt(i);
    try{ n=c.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){ n=c; }
    n=n.toLowerCase();
    for(j=0;j<n.length;j++){ s+=n.charAt(j); map.push(i); }
  }
  map.push(t.length);
  return {s:s,map:map};
}
function terminos(){
  var q=String(estado.q||"").trim();
  if(!q) return [];
  if(estado.modo==="exacta") return [q];
  return palabras(q);
}
var LETRA=/[a-z0-9]/;
function coincidencias(texto){
  var ts=terminos();
  if(!texto||!ts.length) return [];
  var P=plegar(texto),bruto=[],k,pt,from,idx,fin,okA,okB;
  for(k=0;k<ts.length;k++){
    pt=plegar(ts[k]).s.trim();
    if(!pt) continue;
    from=0;
    while(bruto.length<6000){
      idx=P.s.indexOf(pt,from);
      if(idx<0) break;
      fin=idx+pt.length;
      okA=estado.parcial||idx===0||!LETRA.test(P.s.charAt(idx-1));
      okB=estado.parcial||fin>=P.s.length||!LETRA.test(P.s.charAt(fin));
      if(okA&&okB) bruto.push({a:P.map[idx],b:P.map[fin]});
      from=idx+1;
    }
  }
  bruto.sort(function(x,y){return x.a-y.a||x.b-y.b;});
  var out=[];
  for(k=0;k<bruto.length;k++){
    if(out.length&&bruto[k].a<=out[out.length-1].b){
      if(bruto[k].b>out[out.length-1].b) out[out.length-1].b=bruto[k].b;
    }else out.push({a:bruto[k].a,b:bruto[k].b});
  }
  return out;
}
var TOPE_MARCAS=1500;
function textoResaltado(texto,cs){

}
/* Agrupa coincidencias cercanas y devuelve el pasaje con contexto */
function pasajesDe(texto,cs){
  var grupos=[],i;
  for(i=0;i<cs.length;i++){
    if(grupos.length&&cs[i].a-grupos[grupos.length-1].b<170) grupos[grupos.length-1].b=cs[i].b;
    else grupos.push({a:cs[i].a,b:cs[i].b});
    if(grupos.length>=120) break;
  }
  return grupos.map(function(g){
    var ini=Math.max(0,g.a-210),fin=Math.min(texto.length,g.b+210);
    var e1=texto.indexOf(" ",ini); if(ini>0&&e1>=0&&e1<g.a) ini=e1+1;
    var e2=texto.lastIndexOf(" ",fin); if(fin<texto.length&&e2>g.b) fin=e2;
    var frag=texto.slice(ini,fin).replace(/\s+/g," ").trim();
    var dentro=cs.filter(function(c){return c.a>=ini&&c.b<=fin;});
    var rel=texto.slice(ini,fin),h="",pos=0;
    dentro.forEach(function(c){
      h+=esc(rel.slice(pos,c.a-ini))+"<mark>"+esc(rel.slice(c.a-ini,c.b-ini))+"</mark>";
      pos=c.b-ini;
    });
    h+=esc(rel.slice(pos));
    return {ini:ini,html:(ini>0?"… ":"")+h.replace(/\s+/g," ")+(fin<texto.length?" …":""),
            txt:(ini>0?"… ":"")+frag+(fin<texto.length?" …":"")};
  });
}

/* Detección de datos de la sentencia. Es heurística: se ofrece
   como propuesta para confirmar, nunca como dato cerrado. */
var MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,
           septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
function detectar(texto){
  var t=texto.slice(0,9000),d={},m;
  m=t.match(/["“']?\s*([A-ZÁÉÍÓÚÑ][^"“”\n]{4,120}?\s+c\/\s+[^"“”\n]{2,120}?\s+(?:s\/|p\/)\s+[^"“”\n]{2,90}?)\s*["”']?(?:\n|\.|$)/);
  if(m) d.car=m[1].replace(/\s+/g," ").trim();
  m=t.match(/Fallos:?\s*(\d{2,3})\s*:\s*(\d{1,4})/i);
  if(m){ d.tomo=m[1]; d.pag=m[2]; }
  m=t.match(/(?:expte\.?|expediente|causa)\s*(?:n[°ºo.]?\s*)?[:\s]\s*([A-Z0-9][\w\-\/\.]{3,28})/i);
  if(m) d.exp=m[1].replace(/[.,;]$/,"");
  m=t.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
  if(m&&MESES[m[2].toLowerCase().normalize?m[2].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""):m[2].toLowerCase()]){
    var mes=MESES[m[2].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")];
    d.fecha=("0"+m[1]).slice(-2)+"/"+("0"+mes).slice(-2)+"/"+m[3];
  }else{
    m=t.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/);
    if(m) d.fecha=("0"+m[1]).slice(-2)+"/"+("0"+m[2]).slice(-2)+"/"+m[3];
  }
  if(/corte\s+suprema\s+de\s+justicia\s+de\s+la\s+naci/i.test(t)){ d.trib="Corte Suprema de Justicia de la Nación"; d.tipo="csjn"; }
  else if(/suprema\s+corte\s+de\s+justicia.{0,40}mendoza|\bS\.?C\.?J\.?M\b/i.test(t)){ d.trib="Suprema Corte de Justicia de Mendoza"; d.tipo="scjm"; }
  else if(/corte\s+interamericana/i.test(t)){ d.trib="Corte Interamericana de Derechos Humanos"; d.tipo="cidh"; }
  else if(/tribunal\s+europeo|european\s+court\s+of\s+human\s+rights/i.test(t)){ d.trib="Tribunal Europeo de Derechos Humanos"; d.tipo="tedh"; }
  else{
    m=t.match(/((?:Excma\.?\s+)?(?:C[áa]mara|Juzgado|Tribunal)[^\n.;]{5,90})/i);
    if(m){ d.trib=m[1].replace(/\s+/g," ").trim(); d.tipo="cam"; }
  }
  m=t.match(/Sala\s+([IVXLC]+|\d+|[ÚU]nica|Primera|Segunda|Tercera|Cuarta)\b/i);
  if(m) d.sala="Sala "+m[1];
  var norm={},arts=texto.match(/\bart(?:s)?\.?\s*\d{1,4}(?:\s*(?:bis|ter|qu[áa]ter))?/gi)||[];
  arts.forEach(function(a){ norm[a.replace(/\s+/g," ").toLowerCase()]=1; });
  d.arts=Object.keys(norm).slice(0,14);
  var leyes={},ls=texto.match(/\bley(?:es)?\s*(?:n[°ºo.]?\s*)?[\d][\d\.]{2,7}/gi)||[];
  ls.forEach(function(a){ leyes[a.replace(/\s+/g," ").toLowerCase()]=1; });
  d.leyes=Object.keys(leyes).slice(0,14);
  var cit={},cs2=texto.match(/Fallos:?\s*\d{2,3}\s*:\s*\d{1,4}/gi)||[];
  cs2.forEach(function(a){ cit[a.replace(/\s+/g," ")]=1; });
  d.citados=Object.keys(cit).slice(0,20);
  return d;
}

function irAMarca(mover){
  try{
    var doc=document.getElementById("doc");
    if(!doc) return;
    var ms=doc.querySelectorAll("mark");
    if(!ms.length) return;
    var i=Math.max(0,Math.min(estado.marca,ms.length-1));
    for(var k=0;k<ms.length;k++) ms[k].className=(k===i?"actual":"");
    if(mover&&ms[i].scrollIntoView) ms[i].scrollIntoView({block:"center"});
  }catch(e){}
}

function formatoCita(tipo,c){
  var C=c.car?'"'+c.car+'"':'"[carátula]"';
  if(tipo==="csjn") return "CSJN, "+C+(c.fecha?", sent. del "+c.fecha:"")+(c.tomo&&c.pag?", Fallos: "+c.tomo+":"+c.pag:"")+".";
  if(tipo==="scjm") return "SCJM"+(c.trib?", "+c.trib:"")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
  if(tipo==="cidh") return "Corte IDH, Caso "+(c.car||"[caso]")+(c.fecha?". Sentencia de "+c.fecha:"")+(c.tomo?". Serie "+c.tomo:"")+(c.pag?" n.º "+c.pag:"")+".";
  if(tipo==="tedh") return "TEDH, "+C+(c.pag?", n.º "+c.pag:"")+(c.fecha?", sentencia de "+c.fecha:"")+".";
  return (c.trib||"[tribunal]")+", "+C+(c.exp?", expte. n.º "+c.exp:"")+(c.fecha?", sent. del "+c.fecha:"")+".";
}
function citaDelDoc(){
  var d=detectar(estado.texto||"");
  var c={car:d.car,trib:d.tipo==="scjm"?(d.sala||""):(d.trib||""),fecha:d.fecha,tomo:d.tomo,pag:d.pag,exp:d.exp};
  return formatoCita(d.tipo||"cam",c);
}

function vistaGuardados(){
  var ids=Object.keys(estado.fav).filter(function(k){return estado.fav[k];});
  var favs=F.filter(function(f){return ids.indexOf(f.id)!==-1;});
  var h='<div class="blk"><h3>Pasajes guardados</h3>';
  if(!estado.pasajes.length){
    h+='<div class="vacio">Los pasajes que guardes en el Lector se acumulan acá, con la cita y la fecha de consulta puestas.</div>';
  }else{
    h+='<div class="acciones" style="margin:0 0 12px;padding:0;border:0">'+
       '<button class="btn" data-act="pasajes-copiar">Copiar los '+estado.pasajes.length+'</button>'+
       '<button class="btn sec" data-act="pasajes-borrar">Vaciar</button></div>'+
       estado.pasajes.map(function(p){
         return '<div class="pasaje"><div class="txt" style="white-space:pre-wrap">'+esc(p.t)+'</div>'+
                '<div class="acc"><span class="pos">búsqueda: '+esc(p.r||"—")+'</span></div></div>';
       }).join("");
  }
  h+='</div>';
  h+='<div class="blk"><h3>Fuentes guardadas</h3>'+
    (favs.length?listaPorAmbito(favs)
     :'<div class="vacio">Todavía no guardaste ninguna fuente. Tocá la estrella en cualquier ficha para tenerla a mano.</div>')+'</div>';
  h+='<div class="blk"><h3>Búsquedas de esta sesión</h3>';
  if(!estado.hist.length){
    h+='<div class="vacio">Acá van quedando las consultas que lances, para repetirlas sin volver a tipearlas.</div>';
  }else{
    h+='<div class="chips">'+estado.hist.slice(0,20).map(function(q){
      return '<button class="voz" data-act="rehacer" data-v="'+esc(q)+'">'+esc(q)+'</button>';}).join("")+'</div>';
  }
  h+='</div>';
  return h;
}

/* ============================================================
   7. Render
   ============================================================ */
function render(){
  try{
    pintarNav();
    pintarRail();
    var v=document.getElementById("vista");
    var f={buscar:vistaBuscar,lector:vistaLector,ramas:vistaRamas,fuentes:vistaFuentes,
           citas:vistaCitas,verificar:vistaVerificar,guardados:vistaGuardados}[estado.tab]||vistaBuscar;
    v.innerHTML=f();
    if(estado.tab==="lector") pintarLector();
    pintarCadena();
    document.getElementById("pie-txt").innerHTML=
      "<strong>Juris et de jure</strong> — catálogo de "+F.length+" bases oficiales y "+RAMAS.length+
      " ramas del derecho. Funciona sin conexión: los enlaces se abren en el sitio del organismo. "+
      "No almacena fallos ni genera contenido jurídico. Verificá siempre en la fuente antes de citar.";
  }catch(e){ panic(e&&e.message?e.message:"error de render"); }
}

/* ============================================================
   8. Eventos (delegación única)
   ============================================================ */
document.addEventListener("click",function(ev){
  var t=ev.target;
  var b=t.closest?t.closest("[data-act],[data-tab],[data-rama]"):null;
  if(!b) return;

  if(b.hasAttribute("data-tab")){ estado.tab=b.getAttribute("data-tab"); render(); return; }

  var act=b.getAttribute("data-act");

  if(b.hasAttribute("data-rama")&&act!=="ir-rama"){
    estado.rama=b.getAttribute("data-rama")||""; render(); return;
  }
  if(act==="ir-rama"){ estado.rama=b.getAttribute("data-rama")||""; estado.tab="buscar"; render(); window.scrollTo(0,0); return; }

  if(act==="modo"){ estado.modo=b.getAttribute("data-modo"); render(); return; }
  if(act==="amb"){
    var k=b.getAttribute("data-amb");
    estado.ambitos[k]=!estado.ambitos[k];
    if(!Object.keys(estado.ambitos).some(function(x){return estado.ambitos[x];})){
      estado.ambitos[k]=true; flash("Dejá al menos un ámbito activo");
    }
    render(); return;
  }
  if(act==="voz"||act==="rehacer"){
    estado.q=b.getAttribute("data-v")||""; estado.modo="exacta"; estado.tab="buscar";
    render(); window.scrollTo(0,0);
    var i=document.getElementById("q"); if(i) i.focus();
    return;
  }
  if(act==="fav"){
    var id=b.getAttribute("data-id");
    estado.fav[id]=!estado.fav[id];
    store.set("jedj:fav",estado.fav);
    render(); return;
  }
  if(act==="google"){
    var c=cadena();
    if(!c){ flash("Escribí algo en «Qué buscás» primero"); return; }
    recordar(c);
    window.open(urlGoogleSitio(b.getAttribute("data-dom")),"_blank","noopener");
    return;
  }
  if(act==="barrido"){
    var q=cadena();
    if(!q){ flash("Escribí algo en «Qué buscás» primero"); return; }
    var doms=[],vistos={};
    fuentesFiltradas().forEach(function(f){
      if(!vistos[f.dom]&&doms.length<12){vistos[f.dom]=1;doms.push(f.dom);}
    });
    if(!doms.length){ flash("No hay fuentes seleccionadas"); return; }
    recordar(q);
    var expr="("+doms.map(function(d){return "site:"+d;}).join(" OR ")+") "+q+rangoFechas();
    window.open("https://www.google.com/search?q="+encodeURIComponent(expr),"_blank","noopener");
    flash("Buscando en "+doms.length+" sitios a la vez");
    return;
  }
  if(act==="copiar-cadena"){ copiar(cadena()); return; }
  if(act==="limpiar"){
    estado.q="";estado.excluir="";estado.desde="";estado.hasta="";estado.rama="";estado.modo="exacta";
    render(); return;
  }
  if(act==="armar-cita"){ armarCita(); return; }
  if(act==="copiar-cita"){
    var o=document.getElementById("cita-out");
    copiar(o?o.textContent.trim():""); return;
  }

  /* ---- lector ---- */
  if(act==="analizar"){
    var ta=document.getElementById("doc-in"),de=document.getElementById("doc-de");
    var txt=ta?ta.value:"";
    if(!txt||txt.trim().length<40){ flash("Pegá el texto del fallo primero"); return; }
    if(txt.length>2000000){ txt=txt.slice(0,2000000); flash("El fallo era enorme: se cargaron los primeros 2 millones de caracteres"); }
    estado.texto=txt; estado.fuenteDe=de?de.value.trim():""; estado.marca=0;
    render(); window.scrollTo(0,0); return;
  }
  if(act==="doc-otro"){ estado.texto=""; estado.fuenteDe=""; estado.marca=0; render(); window.scrollTo(0,0); return; }
  if(act==="marca-sig"||act==="marca-ant"){
    var cs2=coincidencias(estado.texto),total=Math.min(cs2.length,TOPE_MARCAS);
    if(!total){ flash("No hay coincidencias para recorrer"); return; }
    estado.marca=(estado.marca+(act==="marca-sig"?1:-1)+total)%total;
    irAMarca(true); conteoLector(cs2);
    return;
  }
  if(act==="tog-parcial"){ estado.parcial=!estado.parcial; estado.marca=0; pintarLector();
    var bp=document.querySelector('[data-act="tog-parcial"]');
    if(bp){ bp.setAttribute("aria-pressed",estado.parcial?"true":"false");
            bp.textContent=estado.parcial?"Palabra parcial: sí":"Palabra parcial: no"; }
    return; }
  if(act==="meta-a-cita"){
    var dd=detectar(estado.texto||"");
    estado.tab="citas"; render();
    function pon(id,v){ var e=document.getElementById(id); if(e&&v) e.value=v; }
    pon("c-tipo",dd.tipo||"cam"); pon("c-car",dd.car); pon("c-trib",dd.sala||dd.trib);
    pon("c-fecha",dd.fecha); pon("c-tomo",dd.tomo); pon("c-pag",dd.pag); pon("c-exp",dd.exp);
    armarCita(); window.scrollTo(0,0); return;
  }
  if(act==="copiar-doc-cita"){ copiar(citaDelDoc()); return; }
  if(act==="pas-copiar"||act==="pas-cita"||act==="pas-guardar"){
    var cont=document.getElementById("pasajes");
    var ps=cont&&cont._ps?cont._ps:[];
    var p=ps[parseInt(b.getAttribute("data-i"),10)];
    if(!p){ flash("No pude recuperar ese pasaje"); return; }
    if(act==="pas-copiar"){ copiar(p.txt); return; }
    var bloque=citaDelDoc()+"\n«"+p.txt+"»\n(consultado el "+hoy()+(estado.fuenteDe?" en "+estado.fuenteDe:"")+")";
    if(act==="pas-cita"){ copiar(bloque); return; }
    estado.pasajes=[{t:bloque,r:cadena()}].concat(estado.pasajes).slice(0,60);
    flash("Pasaje guardado · "+estado.pasajes.length+" en total");
    return;
  }
  if(act==="pasajes-copiar"){
    copiar(estado.pasajes.map(function(x){return x.t;}).join("\n\n———\n\n")); return;
  }
  if(act==="pasajes-borrar"){ estado.pasajes=[]; render(); return; }
  if(act==="tog-frag"){ estado.resaltarFuente=!estado.resaltarFuente; render(); return; }
},false);

/* inputs */
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="q"){
    estado.q=ev.target.value; estado.marca=0; pintarCadena();
    if(estado.tab==="lector"){
      if(estado.texto.length<150000){ pintarLector(); }
      else { clearTimeout(window._tl); window._tl=setTimeout(pintarLector,170); }
    }
  }
  else if(id==="excluir"){estado.excluir=ev.target.value;pintarCadena();}
  else if(id==="desde"){estado.desde=ev.target.value;pintarCadena();}
  else if(id==="hasta"){estado.hasta=ev.target.value;pintarCadena();}
},false);

/* Enter: en Buscar lanza el barrido, en el Lector salta a la coincidencia siguiente */
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="q"){
    ev.preventDefault();
    var sel=estado.tab==="lector"?'[data-act="marca-sig"]':'[data-act="barrido"]';
    var btn=document.querySelector(sel);
    if(btn) btn.click();
  }
  if(ev.key==="/"&&ev.target&&["INPUT","TEXTAREA","SELECT"].indexOf(ev.target.tagName)===-1){
    var i=document.getElementById("q");
    if(i){ev.preventDefault();i.focus();i.select();}
  }
},false);

function recordar(q){
  if(!q) return;
  estado.hist=[q].concat(estado.hist.filter(function(x){return x!==q;})).slice(0,20);
}

function armarCita(){
  function val(id){var e=document.getElementById(id);return e?String(e.value).trim():"";}
  var tipo=val("c-tipo")||"csjn";
  var s=formatoCita(tipo,{car:val("c-car"),trib:val("c-trib"),fecha:val("c-fecha"),
                          tomo:val("c-tomo"),pag:val("c-pag"),exp:val("c-exp")});
  var o=document.getElementById("cita-out");
  if(o) o.textContent=s;
  flash("Cita armada — verificá los datos en la fuente");
}

/* ============================================================
   9. Arranque
   ============================================================ */
render();
store.get("jedj:fav",function(v){
  if(!v||typeof v!=="object") return;
  estado.fav=v;
  var activo=document.activeElement;
  if(activo&&["INPUT","SELECT","TEXTAREA"].indexOf(activo.tagName)!==-1) return;
  render();
});

})();
</script>
