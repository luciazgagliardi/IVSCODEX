name: Pruebas completas del backend

on:
  push:
    branches: [main, development/ivscodex-2.0-live-engine]
    paths:
      - "backend/**"
      - "frontend/index.html"
      - "frontend/pasajes.js"
      - ".github/workflows/pruebas-completas.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/index.html"
      - "frontend/pasajes.js"
      - ".github/workflows/pruebas-completas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-completas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: npm test (suite completa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles
        working-directory: backend
        run: npm ci

      - name: Ejecutar todas las pruebas
        working-directory: backend
        run: npm test
