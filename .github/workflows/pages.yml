name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de todos los scripts del frontend
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if "src" not in attrs else None
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.items.append("".join(self.current))
                      self.current = None

          pages = [Path("frontend/index.html"), Path("frontend/portada/index.html")]
          with tempfile.TemporaryDirectory() as tmp:
              count = 0
              for page in pages:
                  parser = Scripts()
                  parser.feed(page.read_text(encoding="utf-8"))
                  for i, source in enumerate(parser.items, 1):
                      if not source.strip():
                          continue
                      target = Path(tmp) / f"{page.parent.name}-{page.stem}-{i}.js"
                      target.write_text(source, encoding="utf-8")
                      subprocess.run(["node", "--check", str(target)], check=True)
                      count += 1

              files = [
                  "frontend/analisis-fallo.js", "frontend/calculos.js",
                  "frontend/nombre-fallo.js", "frontend/pasajes.js",
                  "frontend/lexia-picante.js", "frontend/herramientas.js",
                  "frontend/lector-voz.js", "frontend/portada/shared.js",
                  "frontend/portada/shared6.js", "frontend/portada/calculos.js",
              ]
              for name in files:
                  subprocess.run(["node", "--check", name], check=True)
              print(f"Sintaxis correcta: {count} scripts inline y {len(files)} archivos JavaScript.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      # GitHub Pages puede tardar unos segundos en indexar el artefacto recién subido.
      # Esperar evita que deploy-pages consulte el artefacto antes de que sea visible.
      - name: Esperar indexación del artefacto
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 10000
