name: Reparación temporal de lockfile npm
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reparar-lock-temporal.yml'
      - 'backend/package-lock.json'
permissions:
  contents: write
jobs:
  reparar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actualizar únicamente el lockfile con parches compatibles
        working-directory: backend
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verificar instalación reproducible y CVE altas
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Guardar solamente las correcciones verificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar dependencias transitivas vulnerables con npm audit fix'
            git push origin HEAD:${{ github.head_ref }}
          fi
