name: Regresión tesauro Mendoza
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/lib/acervoConsulta.js'
      - 'backend/routes/indice.js'
      - 'backend/test/acervoPaginas.prueba.js'
      - '.github/workflows/regresion-tesauro-mendoza.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Validar FTS, variantes y paginación
        working-directory: backend
        run: node --test test/acervoPaginas.prueba.js test/mendozaOficial.prueba.js test/mendozaBusquedaDefecto.prueba.js
