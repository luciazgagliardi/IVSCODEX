name: Diagnosticar rutas oficiales historicas de Mendoza
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/probarPortalesMendoza.mjs'
      - '.github/workflows/sondar-portales-mendoza.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sondear formularios públicos oficiales sin autenticación
        working-directory: backend
        run: |
          node --check scripts/probarPortalesMendoza.mjs
          node scripts/probarPortalesMendoza.mjs
