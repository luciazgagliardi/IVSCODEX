name: Medir primeros resultados del buscador

on:
  workflow_dispatch: {}
  # La medición va al final para no competir con la consulta de 37 rutas.
  workflow_run:
    workflows: ['Diagnosticar consultas oficiales en vivo']
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: medir-latencia-acervo
  cancel-in-progress: true

jobs:
  medir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Medir las primeras fichas en Mendoza, SAIJ, CABA y Corte
        run: node ops/medir-latencia-acervo.mjs
