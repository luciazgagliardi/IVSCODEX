name: Publicar backend en Azure App Service

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/pasajes.js", ".github/workflows/azure-backend.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: azure-backend
  # No interrumpir la subida pesada de SQLite: cancelarla deja Azure con un
  # OneDeploy activo, y el siguiente despliegue recibe HTTP 409 Conflict.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El acervo (backend/lib/acervo.js): las tandas viven en la rama «acervo», que se
      # reemplaza entera en cada versión; viajan con el servidor y se importan al arrancar.
      - name: Traer las tandas del acervo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: acervo
          path: backend/acervo-datos
      - name: Sin la carpeta .git de las tandas
        run: rm -rf backend/acervo-datos/.git && ls -la backend/acervo-datos || true
      # el mismo módulo de pasajes que la página (frontend/pasajes.js): el servidor lo usa para recortar
      - name: Copiar el módulo de pasajes
        run: cp frontend/pasajes.js backend/lib/pasajes.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Desplegar en Azure App Service
        id: primer_intento
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: IURIS
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
      - name: Esperar al final de un OneDeploy anterior
        if: steps.primer_intento.outcome == 'failure'
        run: sleep 75
      - name: Reintentar publicación si Azure respondió conflicto
        if: steps.primer_intento.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: IURIS
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
