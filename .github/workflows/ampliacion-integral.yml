name: Ampliación integral del acervo jurisprudencial
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ampliacion-integral.yml'
      - 'backend/scripts/ampliarFuentes.mjs'
      - 'backend/scripts/ampliarCorteidh.mjs'
      - 'backend/lib/indiceProvincialSaij.js'
      - 'backend/lib/acervoConsulta.js'
      - 'backend/test/provinciasSaij.prueba.js'
      - 'backend/scripts/cosecharCatamarca.mjs'
      - 'backend/lib/indiceProvincialSaij.js'
      - 'backend/scripts/cosecharSaij.mjs'
      - 'backend/test/provinciasSaij.prueba.js'
      - 'backend/lib/indiceCatamarca.js'
      - 'backend/lib/indiceChubut.js'
      - 'backend/lib/indiceTfn.js'
      - 'backend/lib/indiceSantaCruz.js'
      - 'backend/lib/indiceHudoc.js'
      - 'backend/lib/indiceHybridJurisprudencia.js'
      - 'backend/lib/avanceTerminos.js'
      - 'backend/test/avanceTerminos.prueba.js'
      - 'backend/test/fuentesNuevas.prueba.js'
      - 'backend/test/catamarca.prueba.js'
      - 'backend/scripts/ampliarCorteidh.mjs'
      - 'backend/scripts/armarAcervo.mjs'
      - 'backend/lib/avanceCosecha.js'
      - 'backend/test/ampliacionAcervo.prueba.js'
      - 'backend/test/jujuy.prueba.js'
      - 'backend/test/indiceCabaHost.prueba.js'
      - 'backend/lib/fuentesInfo.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ampliacion-integral.yml'
      - 'backend/scripts/ampliarFuentes.mjs'
      - 'backend/lib/indiceProvincialSaij.js'
      - 'backend/lib/acervoConsulta.js'
      - 'backend/test/provinciasSaij.prueba.js'
      - 'backend/scripts/cosecharCatamarca.mjs'
      - 'backend/lib/indiceCatamarca.js'
      - 'backend/lib/indiceChubut.js'
      - 'backend/lib/indiceTfn.js'
      - 'backend/lib/indiceSantaCruz.js'
      - 'backend/lib/indiceHudoc.js'
      - 'backend/lib/indiceHybridJurisprudencia.js'
      - 'backend/lib/avanceCosecha.js'
      - 'backend/lib/avanceTerminos.js'
      - 'backend/scripts/armarAcervo.mjs'
      - 'backend/test/avanceTerminos.prueba.js'
      - 'backend/test/fuentesNuevas.prueba.js'
      - 'backend/test/ampliacionAcervo.prueba.js'
      - 'backend/test/jujuy.prueba.js'
      - 'backend/test/indiceCabaHost.prueba.js'
      - 'backend/lib/fuentes.js'
      - 'backend/lib/fuentesInfo.js'
  workflow_dispatch: {}
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: write
  actions: write

# Compartir cerrojo con la publicación mendocina: dos escritores no pueden
# partir de manifiestos distintos y pisar la rama acervo.
concurrency:
  group: publicar-acervo-mendoza
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias para las pruebas de la nueva fuente
        working-directory: backend
        run: npm ci
      - name: Comprobar sintaxis, deduplicación y cobertura
        working-directory: backend
        run: |
          node --check scripts/ampliarFuentes.mjs
          node --check scripts/cosecharCatamarca.mjs
          node --check scripts/cosecharSaij.mjs
          node --test test/provinciasSaij.prueba.js
          node --test test/catamarca.prueba.js
          node --check scripts/ampliarCorteidh.mjs
          node --check scripts/armarAcervo.mjs
          node --test test/ampliacionAcervo.prueba.js
          node --test test/avanceTerminos.prueba.js test/fuentesNuevas.prueba.js
          node --test test/jujuy.prueba.js test/indiceCabaHost.prueba.js
          node --check ../ops/diagnosticar-en-vivo.mjs

  fuentes:
    if: github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fuente: [mendoza, caba, scba, juristeca, santafe, rionegro, dialnet, mendozalegal, catamarca, jujuy, chubut, tfn, santacruz, hudoc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-base
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias y extraer el avance anterior
        working-directory: backend
        env:
          FUENTE: ${{ matrix.fuente }}
        run: |
          npm ci
          mkdir -p acervo-crudo/respaldo
          if test -f "acervo-base/_fuentes/${FUENTE}.json.gz"; then
            cp "acervo-base/_fuentes/${FUENTE}.json.gz" "acervo-crudo/respaldo/${FUENTE}.json.gz"
          elif test -f "respaldo/${FUENTE}.json.gz"; then
            cp "respaldo/${FUENTE}.json.gz" "acervo-crudo/respaldo/${FUENTE}.json.gz"
          fi
          if test -f "acervo-base/_avance/${FUENTE}.json"; then
            cp "acervo-base/_avance/${FUENTE}.json" "acervo-crudo/respaldo/avance-${FUENTE}.json"
          fi
      - name: Cosechar con paginación y conservación de originales
        working-directory: backend
        env:
          FUENTE: ${{ matrix.fuente }}
          MAX_PAGINAS: '600'
          MAX_TERMINOS: '240'
          PAGINAS_POR_TAREA: '8'
          MAX_PDFS: '150'
          PAUSA_MS: '2000'
        run: |
          if test "$FUENTE" = catamarca; then
            MAX_DETALLES=300 node scripts/cosecharCatamarca.mjs
          else
            node scripts/ampliarFuentes.mjs "$FUENTE"
          fi
      - name: Retener los datos y el informe verificable de esta fuente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-${{ matrix.fuente }}
          retention-days: 14
          if-no-files-found: warn
          path: backend/acervo-crudo/respaldo/

  saij:
    if: github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-base
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recuperar avance nacional y provincial
        run: |
          mkdir -p backend/acervo-crudo
          for archivo in backend/acervo-base/_avance/progreso-saij.json backend/acervo-base/_avance/progreso-saij-mendoza.json; do
            if test -f "$archivo"; then
              cp "$archivo" "backend/acervo-crudo/${archivo##*/}"
            fi
          done
      - name: Incorporar meses recientes de SAIJ, CSJN y Mendoza vía SAIJ
        working-directory: backend
        env:
          RECIENTES: '2'
          TIPOS: sumarios,fallos
          PAUSA_MS: '1400'
          ESPERA_CORTE_MS: '30000'
        run: |
          set +e
          PROVINCIA='' node scripts/cosecharSaij.mjs
          NACIONAL=$?
          PROVINCIA=Mendoza node scripts/cosecharSaij.mjs
          MENDOZA=$?
          echo "Estado cosecha nacional: $NACIONAL; Mendoza: $MENDOZA"
          if test "$NACIONAL" -ne 0 || test "$MENDOZA" -ne 0; then
            echo "::warning::SAIJ respondió parcialmente; sólo se integran tandas disponibles, preservando el acervo anterior"
            exit 1
          fi
      - name: Guardar tandas SAIJ y avance, aunque la fuente haya cortado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-saij
          retention-days: 14
          if-no-files-found: warn
          path: backend/acervo-crudo/

  saij_provincial:
    # Barridos parejos de las 24 facetas provinciales de SAIJ con cursores
    # separados. Todos los documentos conservan el UUID original y se
    # deduplican en un único corpus SAIJ, sin clonar registros por jurisdicción.
    if: github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { slug: buenosaires, provincia: Buenos Aires }
          - { slug: caba_saij, provincia: Ciudad Autónoma de Buenos Aires }
          - { slug: catamarca_saij, provincia: Catamarca }
          - { slug: chaco, provincia: Chaco }
          - { slug: chubut, provincia: Chubut }
          - { slug: cordoba, provincia: Córdoba }
          - { slug: corrientes, provincia: Corrientes }
          - { slug: entrerrios, provincia: Entre Ríos }
          - { slug: formosa, provincia: Formosa }
          - { slug: jujuy_saij, provincia: Jujuy }
          - { slug: lapampa, provincia: La Pampa }
          - { slug: larioja, provincia: La Rioja }
          - { slug: mendoza_saij, provincia: Mendoza }
          - { slug: misiones, provincia: Misiones }
          - { slug: neuquen, provincia: Neuquén }
          - { slug: rionegro_saij, provincia: Río Negro }
          - { slug: salta, provincia: Salta }
          - { slug: sanjuan, provincia: San Juan }
          - { slug: sanluis, provincia: San Luis }
          - { slug: santacruz, provincia: Santa Cruz }
          - { slug: santafe_saij, provincia: Santa Fe }
          - { slug: santiagodelestero, provincia: Santiago del Estero }
          - { slug: tierradelfuego, provincia: Tierra del Fuego }
          - { slug: tucuman, provincia: Tucumán }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-base
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recuperar avance provincial anterior
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p backend/acervo-crudo
          archivo="backend/acervo-base/_avance/progreso-saij-${SLUG}.json"
          if test -f "$archivo"; then cp "$archivo" backend/acervo-crudo/; fi
      - name: Incorporar sumarios y fichas provinciales recientes e históricas
        working-directory: backend
        env:
          PROVINCIA: ${{ matrix.provincia }}
          TIPOS: sumarios,fallos
          DESDE: '2000'
          HASTA: '2026'
          PAUSA_MS: '1750'
          ESPERA_CORTE_MS: '30000'
        run: |
          node scripts/cosecharSaij.mjs
      - name: Guardar avance parcial y documentos con enlaces SAIJ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-saij-${{ matrix.slug }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/acervo-crudo/saij-*
            backend/acervo-crudo/progreso-saij-*.json

  corteidh:
    # El catálogo oficial devuelve el conjunto de documentos y sus enlaces;
    # los PDFs se extraen por tandas con un límite propio y cursores de fallidos.
    if: github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-base
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias y recuperar documentos y fallidos
        working-directory: backend
        run: |
          npm ci
          mkdir -p acervo-crudo/respaldo
          if test -f acervo-base/_fuentes/corteidh.json.gz; then
            cp acervo-base/_fuentes/corteidh.json.gz acervo-crudo/respaldo/corteidh.json.gz
          fi
          if test -f acervo-base/_avance/avance-corteidh.json; then
            cp acervo-base/_avance/avance-corteidh.json acervo-crudo/respaldo/avance-corteidh.json
          fi
      - name: Actualizar catálogo oficial y extraer PDFs públicos
        working-directory: backend
        env:
          DIR_COSECHA: acervo-crudo/respaldo
          MAX_PDFS: '150'
          PAUSA_MS: '2000'
        run: node scripts/ampliarCorteidh.mjs
      - name: Retener catálogo, textos y avance aunque algún PDF falle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuente-corteidh
          retention-days: 14
          if-no-files-found: warn
          path: backend/acervo-crudo/respaldo/

  publicar:
    # Al fallar una fuente no perder los lotes válidos de las demás fuentes.
    # Solo el fracaso de las pruebas impide publicar.
    if: ${{ always() && github.event_name != 'pull_request' && needs.pruebas.result == 'success' }}
    needs: [pruebas, fuentes, saij, saij_provincial, corteidh]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-base
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recuperar lotes de todas las fuentes y jurisdicciones
        uses: actions/download-artifact@v4
        with:
          pattern: fuente-*
          path: backend/acervo-crudo/_lotes
      - name: Unificar cosechas sin mezclar fuentes
        run: |
          mkdir -p backend/acervo-crudo/respaldo
          for d in backend/acervo-crudo/_lotes/fuente-*; do
            test -d "$d" || continue
            if [[ "${d##*/}" == fuente-saij* ]]; then
              cp -a "$d"/. backend/acervo-crudo/
            else
              cp -a "$d"/. backend/acervo-crudo/respaldo/
            fi
          done
          rm -rf backend/acervo-crudo/_lotes
      - name: Construir FTS sobre la versión anterior, nunca desde cero
        working-directory: backend
        env:
          DIR_ACERVO_BASE: acervo-base
        run: node scripts/armarAcervo.mjs
      - name: Verificar que ninguna fuente retroceda
        working-directory: backend
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('acervo-base/manifiesto.json'));
          const b=JSON.parse(fs.readFileSync('acervo-datos/manifiesto.json'));
          for(const [s,n] of Object.entries(a.conteos))
            if((b.conteos[s]||0)<n) throw Error('Pérdida de registros: '+s);
          if(!b.conteos.saij || !b.conteos.csjn) throw Error('No se conservó SAIJ/CSJN');
          console.log(JSON.stringify({anterior:a.conteos,ampliado:b.conteos}));"
      - name: Publicar tandas y conservar respaldos y cursores reanudables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C backend/acervo-base config user.name 'github-actions[bot]'
          git -C backend/acervo-base config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find backend/acervo-base -maxdepth 1 -type f -name '*.jsonl.gz' -delete
          cp backend/acervo-datos/* backend/acervo-base/
          mkdir -p backend/acervo-base/_fuentes backend/acervo-base/_avance
          for archivo in backend/acervo-crudo/respaldo/*.json.gz; do
            test -f "$archivo" || continue
            cp "$archivo" backend/acervo-base/_fuentes/
          done
          for archivo in backend/acervo-crudo/respaldo/avance-*.json; do
            test -f "$archivo" || continue
            nombre="${archivo##*/}"; fuente="${nombre#avance-}"
            cp "$archivo" "backend/acervo-base/_avance/$fuente"
          done
          for archivo in backend/acervo-crudo/progreso-saij*.json; do
            test -f "$archivo" || continue
            cp "$archivo" backend/acervo-base/_avance/
          done
          git -C backend/acervo-base add -A
          if ! git -C backend/acervo-base diff --cached --quiet; then
            git -C backend/acervo-base commit -m "Acervo integral: cosechas oficiales con avance reanudable"
            git -C backend/acervo-base push origin HEAD:acervo
          fi
      - name: Registrar nueva versión desde un worktree limpio
        run: bash ops/publicar-version-acervo.sh
      - name: Solicitar despliegue Azure
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run azure-backend.yml --ref main
