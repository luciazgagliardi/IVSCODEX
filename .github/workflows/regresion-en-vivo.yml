name: Regresión del contador y búsqueda oficial

on:
  push:
    branches: [main]
    paths:
      - 'backend/lib/acervo.js'
      - 'backend/routes/indice.js'
      - 'backend/test/acervoPaginas.prueba.js'
      - 'backend/test/busquedaEnVivo.prueba.js'
      - 'backend/test/mendozaBusquedaDefecto.prueba.js'
      - 'frontend/index.html'
      - '.github/workflows/regresion-en-vivo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regresion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Comparación real de IDs y regresión del buscador
        working-directory: backend
        run: node --test test/acervoPaginas.prueba.js test/busquedaEnVivo.prueba.js test/mendozaBusquedaDefecto.prueba.js
      - name: Validación de la interfaz
        run: node --test frontend/test/cursor-buscador.test.mjs frontend/test/fuentes-vidrio.test.mjs
