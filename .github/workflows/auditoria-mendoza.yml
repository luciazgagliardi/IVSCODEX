name: Auditoría acervo Mendoza

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/lib/acervoConsulta.js'
      - 'backend/scripts/cosecharBases.mjs'
      - 'backend/scripts/auditarMendoza.mjs'
      - 'backend/scripts/sondearMendoza.mjs'
      - 'backend/scripts/cosecharSaij.mjs'
      - 'backend/scripts/actualizarAcervo.mjs'
      - 'backend/test/cosechaSaijMendoza.prueba.js'
      - 'backend/scripts/sondearSaijMendoza.mjs'
      - 'backend/test/acervoPaginas.prueba.js'
      - '.github/workflows/auditoria-mendoza.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: acervo
          path: backend/acervo-datos
          sparse-checkout: |
            manifiesto.json
            mendoza-001.jsonl.gz
            saij-001.jsonl.gz
            saij-002.jsonl.gz
            saij-003.jsonl.gz
            saij-004.jsonl.gz
            saij-005.jsonl.gz
            saij-006.jsonl.gz
            saij-007.jsonl.gz
            saij-008.jsonl.gz
            saij-009.jsonl.gz
            saij-010.jsonl.gz
            saij-011.jsonl.gz
            saij-012.jsonl.gz
            saij-013.jsonl.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Probar filtrado y paginación
        working-directory: backend
        run: node --test test/acervoPaginas.prueba.js test/cosechaSaijMendoza.prueba.js
      - name: Auditar datos publicados
        working-directory: backend
        run: node scripts/auditarMendoza.mjs | tee auditoria-mendoza.json
      - name: Sondear buscador oficial de Mendoza
        if: github.event_name == 'workflow_dispatch'
        working-directory: backend
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/sondearMendoza.mjs | tee sondeo-mendoza.json
      - uses: actions/upload-artifact@v4
        with:
          name: sondeo-mendoza
          path: backend/sondeo-mendoza.json
      - name: Sondear SAIJ Mendoza
        continue-on-error: true
        working-directory: backend
        run: node scripts/sondearSaijMendoza.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-mendoza
          path: backend/auditoria-mendoza.json
