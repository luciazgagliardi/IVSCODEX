name: Diagnosticar consultas oficiales en vivo

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/diagnosticar-en-vivo.mjs'
      - '.github/workflows/diagnosticar-en-vivo.yml'
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Publicar backend en Azure App Service']
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: diagnosticar-en-vivo
  cancel-in-progress: true

jobs:
  validar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxis del diagnóstico
        run: node --check ops/diagnosticar-en-vivo.mjs

  consultar:
    # Nunca probar el backend por el evento push: ese evento corre en paralelo
    # con el despliegue y puede medir la versión anterior. Esperar Azure o ejecutar manualmente.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar las 37 rutas automáticas y el acervo local después de publicar Azure
        run: node ops/diagnosticar-en-vivo.mjs
