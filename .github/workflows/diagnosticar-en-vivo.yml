name: Diagnosticar consultas oficiales en vivo

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/diagnosticar-en-vivo.mjs'
      - '.github/workflows/diagnosticar-en-vivo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnosticar-en-vivo
  cancel-in-progress: true

jobs:
  validar:
    # La validación es segura en cualquier evento: solo ejecuta node --check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxis del diagnóstico
        run: node --check ops/diagnosticar-en-vivo.mjs

  consultar:
    # La ejecución automática vive en smoke-acervo-azure.yml; aquí queda la
    # opción manual para repetir el diagnóstico cuando haga falta.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar las 41 fuentes: 40 rutas remotas y el acervo local de Catamarca después de publicar Azure
        run: node ops/diagnosticar-en-vivo.mjs
