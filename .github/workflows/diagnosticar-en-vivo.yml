name: Diagnosticar consultas oficiales en vivo

# El diagnóstico de red NO corre automáticamente en ramas de desarrollo.
# La validación de sintaxis por push/PR está en validar-diagnostico-2.0.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnosticar-en-vivo-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validar:
    # Validación manual; la comprobación automática se hace en el workflow separado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxis del diagnóstico
        run: node --check ops/diagnosticar-en-vivo.mjs

  consultar:
    # La ejecución automática vive en smoke-acervo-azure.yml; aquí queda la
    # opción manual para repetir el diagnóstico cuando haga falta.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar las 41 fuentes: 40 rutas remotas y el acervo local de Catamarca después de publicar Azure
        run: node ops/diagnosticar-en-vivo.mjs
