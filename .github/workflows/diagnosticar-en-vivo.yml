name: Diagnosticar consultas oficiales en vivo

on:
  push:
    branches: [main]
    paths:
      - 'ops/diagnosticar-en-vivo.mjs'
      - '.github/workflows/diagnosticar-en-vivo.yml'
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Publicar backend en Azure App Service']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: diagnosticar-en-vivo
  cancel-in-progress: true

jobs:
  consultar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar las 19 fuentes automáticas y el acervo local desde Azure
        run: node ops/diagnosticar-en-vivo.mjs
